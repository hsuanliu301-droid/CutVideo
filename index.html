<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CutVideo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chiron+Hei+HK:wght@400;700&family=Chiron+Sung+HK:wght@400;700&family=Iansui&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;700;900&family=Noto+Serif+TC:wght@400;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/npm/open-huninn-font@1.1.0/font.css');
    @import url('https://cdn.jsdelivr.net/npm/cubic-11@1.0.1/fonts/web/cubic-11.css');
    @import url('https://cdn.jsdelivr.net/npm/smiley-sans@2.0.1/dist/smiley-sans.css');

    @font-face { font-family: 'Taipei Sans TC'; src: url('https://cdn.jsdelivr.net/gh/max32002/taipeisanstc@master/webfont/TaipeiSansTCBeta-Regular.woff2') format('woff2'); font-display: swap; }
    @font-face { font-family: 'ChenYuluoyan'; src: url('https://cdn.jsdelivr.net/gh/Chenyu-otf/chenyuluoyan_thin@main/ChenYuluoyan-Thin-Monospaced.woff2') format('woff2'); font-display: swap; }
    @font-face { font-family: 'GenSenRounded'; src: url('https://cdn.jsdelivr.net/gh/ButTaiwan/gensen-font@master/webfont/GenSenRounded-M.woff2') format('woff2'); font-display: swap; }
    @font-face { font-family: 'TASA Explorer'; src: url('https://cdn.jsdelivr.net/gh/ButTaiwan/tasa-explorer@main/webfont/TASAExplorer-Medium.woff2') format('woff2'); font-display: swap; }

    :root {
      --bg-dark: #0e0f13; --bg-panel: #171920; --bg-card: #21242e;
      --accent: #ff3b7f; --accent-soft: rgba(255, 59, 127, 0.2);
      --danger: #ef4444; --danger-soft: rgba(239, 68, 68, 0.18);
      --gold: #ffcc33; --cyan: #2ce6c3; --purple: #a855f7; --blue: #38bdf8;
      --text-main: #f3f4f6; --text-muted: #9ca3af; --border: #2b2f3b;
      --stage-height: 230px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    body { margin: 0; background: var(--bg-dark); color: var(--text-main); font-family: 'Noto Sans TC', sans-serif; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    #videoDecodePool { position: fixed; bottom: 0; right: 0; width: 2px; height: 2px; opacity: 0.001; pointer-events: none; overflow: hidden; z-index: -1; }

    .topbar { height: 44px; padding: 0 12px; background: var(--bg-panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; gap: 6px; }
    .brand { font-weight: 900; font-size: 16px; display: flex; align-items: center; gap: 6px; }
    .brand span { background: linear-gradient(135deg, #ff3b7f, #ff8a3d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .draft-badge { font-size: 10px; color: var(--cyan); background: rgba(44, 230, 195, 0.12); border: 1px solid rgba(44, 230, 195, 0.35); padding: 2px 7px; border-radius: 99px; cursor: pointer; white-space: nowrap; }
    .ratio-group { display: flex; background: var(--bg-card); border-radius: 8px; padding: 2px; gap: 2px; }
    .ratio-btn { border: none; background: transparent; color: var(--text-muted); font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 6px; cursor: pointer; }
    .ratio-btn.active { background: var(--accent); color: #fff; }
    .btn-export { background: linear-gradient(135deg, #ff3b7f, #ff6b4a); color: #fff; border: none; border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 14px; }
    .modal-backdrop.open { display: flex; }
    .export-modal { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 14px; width: 100%; max-width: 410px; max-height: 90dvh; overflow-y: auto; padding: 15px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85); }
    .export-modal h3 { margin: 0 0 6px; font-size: 15px; color: #fff; display: flex; align-items: center; justify-content: space-between; }
    .export-modal p.sub { margin: 0 0 10px; font-size: 11px; color: var(--text-muted); line-height: 1.45; }
    .modal-sec-title { font-size: 11px; font-weight: 800; color: var(--cyan); margin: 10px 0 6px; padding-top: 8px; border-top: 1px solid var(--border); }
    .quality-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
    .quality-card { background: var(--bg-card); border: 1.5px solid var(--border); border-radius: 9px; padding: 8px 10px; text-align: left; color: var(--text-main); cursor: pointer; }
    .quality-card.active { border-color: var(--cyan); background: rgba(44, 230, 195, 0.13); }
    .quality-card .q-name { font-size: 12px; font-weight: 800; color: #fff; display: block; }
    .quality-card .q-spec { font-size: 10px; color: var(--text-muted); display: block; margin-top: 2px; }
    .export-option-card { width: 100%; background: var(--bg-card); border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 7px; text-align: left; color: var(--text-main); cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
    .export-option-card:hover { border-color: var(--accent); background: rgba(255, 59, 127, 0.12); }
    .export-option-card.proj-pack:hover { border-color: var(--gold); background: rgba(255, 204, 51, 0.12); }
    .export-option-card.proj-open { border-color: var(--purple); background: rgba(168, 85, 247, 0.12); }
    .export-option-card .opt-title { font-size: 12.5px; font-weight: 800; color: #fff; }
    .export-option-card .opt-desc { font-size: 10.5px; color: var(--text-muted); line-height: 1.35; }
    .relink-box { display: none; background: #12141c; border: 1.5px solid var(--gold); border-radius: 10px; padding: 12px; margin-top: 8px; }
    .relink-box h4 { margin: 0 0 6px; font-size: 13px; color: var(--gold); }
    .relink-list { margin: 6px 0 10px; padding-left: 18px; font-size: 11px; color: #e5e7eb; max-height: 110px; overflow-y: auto; }
    .export-progress-box { display: none; background: #101218; border: 1px solid var(--cyan); border-radius: 10px; padding: 14px; text-align: center; margin-top: 8px; }
    .export-percent-big { font-size: 26px; font-weight: 900; margin-bottom: 4px; background: linear-gradient(90deg, var(--cyan), #fff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .export-progress-box .prog-title { font-size: 12px; font-weight: 700; color: var(--cyan); margin-bottom: 4px; }
    .export-progress-box .prog-sub { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
    .export-progress-bar { height: 8px; background: #232734; border-radius: 99px; overflow: hidden; }
    .export-progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--cyan), var(--accent)); transition: width 0.08s linear; }

    .stage-wrap { height: var(--stage-height); min-height: 120px; max-height: 68dvh; display: flex; align-items: center; justify-content: center; background: #08090c; position: relative; padding: 10px; overflow: hidden; flex-shrink: 0; }
    canvas#previewCanvas { background: #000; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.85); border-radius: 6px; border: 1px solid #2b2f3b; height: 100%; width: auto; max-width: 100%; max-height: 100%; object-fit: contain; touch-action: none; cursor: grab; }
    canvas#previewCanvas:active { cursor: grabbing; }
    .stage-hint { position: absolute; top: 6px; left: 10px; background: rgba(0, 0, 0, 0.72); color: #d1d5db; font-size: 10px; padding: 3px 9px; border-radius: 99px; pointer-events: none; max-width: 54%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .stage-top-right { position: absolute; top: 6px; right: 10px; display: flex; align-items: center; gap: 4px; z-index: 15; }
    .stage-pill-box { display: flex; gap: 2px; background: rgba(23, 25, 32, 0.9); border: 1px solid var(--border); padding: 2px; border-radius: 8px; }
    .stage-mode-btn, .stage-size-btn { background: transparent; border: none; color: var(--text-muted); font-size: 10px; font-weight: 700; padding: 3px 6px; border-radius: 5px; cursor: pointer; }
    .stage-mode-btn.active { background: var(--blue); color: #090a0d; }
    .stage-mode-btn.crop-active { background: var(--gold); color: #090a0d; }
    .stage-size-btn.active { background: var(--accent-soft); color: #fff; }
    .stage-resizer { height: 12px; background: #14161d; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: ns-resize; touch-action: none; flex-shrink: 0; }
    .stage-resizer:hover, .stage-resizer.active { background: var(--accent-soft); }
    .stage-resizer::after { content: ''; width: 36px; height: 3px; border-radius: 99px; background: #4b5563; }

    .transport { height: 40px; background: var(--bg-panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 8px; gap: 5px; flex-shrink: 0; }
    .time-readout { font-variant-numeric: tabular-nums; font-size: 11px; color: var(--text-muted); white-space: nowrap; }
    .time-readout strong { color: var(--text-main); }
    .play-btn { width: 28px; height: 28px; border-radius: 50%; border: none; background: var(--text-main); color: var(--bg-dark); font-size: 12px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    .quick-actions { display: flex; align-items: center; gap: 4px; overflow-x: auto; padding: 2px 0; }
    .quick-actions::-webkit-scrollbar { display: none; }
    .chip-btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); font-size: 11px; font-weight: 600; padding: 4px 7px; border-radius: 6px; cursor: pointer; white-space: nowrap; flex-shrink: 0; display: inline-flex; align-items: center; gap: 2px; transition: 0.15s; }
    .chip-btn:disabled { opacity: 0.38; cursor: not-allowed; }
    .chip-btn.history-active { border-color: var(--blue); color: #bae6fd; }
    .chip-btn.snap-on { background: rgba(44, 230, 195, 0.16); border-color: var(--cyan); color: var(--cyan); }
    .chip-btn.danger { background: var(--danger-soft); border-color: var(--danger); color: #fca5a5; }
    .chip-btn.danger:hover { background: var(--danger); color: #fff; }
    
    .chip-btn.mode-active { background: rgba(168, 85, 247, 0.18); border-color: var(--purple); color: #e9d5ff; }
    #marqueeBox { position: absolute; border: 1.5px dashed var(--blue); background: rgba(56, 189, 248, 0.15); z-index: 50; display: none; pointer-events: none; border-radius: 4px; }
    .multi-selected { box-shadow: 0 0 0 1.5px #10b981 !important; border-color: #10b981 !important; }
    .group-badge { position: absolute; top: 2px; left: 2px; font-size: 9px; color: #fbbf24; text-shadow: 0 1px 2px #000; z-index: 10; pointer-events: none; }

    .zoom-box { display: flex; align-items: center; gap: 4px; background: var(--bg-card); border: 1px solid var(--border); padding: 2px 6px; border-radius: 6px; flex-shrink: 0; }
    .zoom-box span { font-size: 10px; color: var(--text-muted); }
    .zoom-box input[type="range"] { width: 48px; height: 14px; accent-color: var(--cyan); }
    @media (min-width: 768px) { .zoom-box input[type="range"] { width: 85px; } }

    .timeline-shell { position: relative; flex: 1; min-height: 95px; display: flex; flex-direction: column; overflow: hidden; }
    .timeline-area { flex: 1; min-height: 95px; background: #121419; position: relative; overflow-x: auto; overflow-y: auto; border-bottom: 1px solid var(--border); cursor: grab; touch-action: pan-y; }
    .timeline-area.grabbing { cursor: grabbing; }
    .timeline-area.crosshair { cursor: crosshair; }
    .timeline-area.compact-reorder-mode { background: #161822; overflow-x: hidden; }
    .timeline-area.compact-reorder-mode .ruler { opacity: 0.15; }
    .timeline-area.compact-reorder-mode .timeline-inner { width: 100% !important; padding: 24px 16px 18px 16px; display: flex; flex-direction: column; align-items: center; }
    .timeline-area.compact-reorder-mode #tracksContainer { width: 100%; }
    .timeline-area.compact-reorder-mode #mainVideoTrack { height: 52px; justify-content: center; gap: 8px; width: 100%; }
    .timeline-area.compact-reorder-mode .track-row:not(#mainVideoTrack):not(.pip-track) { opacity: 0.2; pointer-events: none; }
    .timeline-inner { position: relative; min-height: 100%; padding: 24px 50vw 18px 50vw; }
    .ruler { position: sticky; top: 0; left: 0; height: 20px; background: rgba(18, 20, 25, 0.95); border-bottom: 1px solid #2a2e3b; display: flex; font-size: 10px; color: var(--text-muted); z-index: 18; margin-top: -24px; margin-bottom: 4px; }
    .playhead { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: #fff; z-index: 25; pointer-events: none; box-shadow: 0 0 6px rgba(255,255,255,0.85); }
    .playhead::before { content: ''; position: absolute; top: 0; left: -5px; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 8px solid #fff; }
    .track-sidebar-overlay { position: absolute; top: 24px; left: 4px; z-index: 22; display: flex; flex-direction: column; gap: 5px; pointer-events: none; }
    .track-controls { height: 34px; display: inline-flex; align-items: center; gap: 3px; background: rgba(15, 16, 20, 0.9); padding: 0 6px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); pointer-events: auto; width: fit-content; }
    .eye-btn { background: none; border: none; padding: 0 2px; font-size: 12px; cursor: pointer; line-height: 1; }
    .track-badge { font-size: 9px; font-weight: 700; color: var(--text-muted); pointer-events: none; }
    .track-row { height: 34px; margin-bottom: 5px; display: flex; align-items: center; position: relative; border-radius: 6px; transition: opacity 0.18s, background 0.15s; }
    .track-row.pip-track { background: rgba(168, 85, 247, 0.06); }
    .track-row.main-track { background: rgba(59, 130, 246, 0.05); }
    .track-row.audio-track { background: rgba(44, 230, 195, 0.04); }
    .track-row.track-hidden { opacity: 0.36; filter: grayscale(0.85); }
    .track-row.drop-target { background: rgba(255, 204, 51, 0.18) !important; outline: 1.5px dashed var(--gold); }
    .empty-track-hint { font-size: 11px; color: #9ca3af; border: 1px dashed #4b5563; border-radius: 6px; padding: 5px 10px; cursor: pointer; white-space: nowrap; background: rgba(255,255,255,0.02); }
    .empty-track-hint:hover { border-color: var(--accent); color: #fff; }

    .clip-block { height: 32px; background: linear-gradient(90deg, #2b3244, #384158); border: 1.5px solid #4c5670; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #fff; position: relative; overflow: visible; white-space: nowrap; padding: 0 16px; flex-shrink: 0; touch-action: none; transition: transform 0.12s ease, box-shadow 0.12s ease; }
    .clip-block.compact-card { height: 46px !important; padding: 4px 8px !important; flex-direction: column; justify-content: center; border-radius: 10px; background: #262b38; border-color: #5b6682; }
    .compact-num { font-size: 13px; font-weight: 900; color: var(--gold); line-height: 1.1; }
    .compact-sub { font-size: 10px; color: #e5e7eb; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
    .clip-block.pip-clip { position: absolute; background: linear-gradient(90deg, #3b2654, #523475); border-color: #8b5cf6; }
    .clip-block.selected { border-color: var(--accent); box-shadow: 0 0 0 1.5px var(--accent); }
    .clip-block.reordering { border-color: var(--gold) !important; background: linear-gradient(135deg, #5c481d, #826526) !important; box-shadow: 0 8px 20px rgba(255, 204, 51, 0.55), 0 0 0 2px var(--gold) !important; transform: translateY(-5px) scale(1.06); z-index: 40; cursor: move; }
    .clip-label { overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
    .trim-handle { position: absolute; top: -1px; bottom: -1px; width: 15px; background: rgba(255, 255, 255, 0.28); display: flex; align-items: center; justify-content: center; cursor: ew-resize; z-index: 15; touch-action: none; }
    .trim-handle:hover, .trim-handle.active { background: var(--accent); }
    .trim-handle.left { left: -1px; border-radius: 5px 0 0 5px; border-right: 1px solid rgba(255,255,255,0.45); }
    .trim-handle.right { right: -1px; border-radius: 0 5px 5px 0; border-left: 1px solid rgba(255,255,255,0.45); }
    .trim-handle::after { content: '⋮'; font-size: 11px; color: #fff; font-weight: bold; }
    .trans-node { position: absolute; right: -10px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; z-index: 18; background: var(--bg-panel); border: 1.5px solid var(--cyan); color: var(--cyan); border-radius: 5px; font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .kf-diamond { position: absolute; width: 8px; height: 8px; background: var(--gold); transform: translateX(-50%) rotate(45deg); top: 2px; border: 1px solid #000; pointer-events: none; }
    .sub-block { position: absolute; height: 26px; background: rgba(255, 59, 127, 0.28); border: 1px solid var(--accent); border-radius: 5px; font-size: 10px; padding: 0 15px; display: flex; align-items: center; color: #ffd1e1; white-space: nowrap; touch-action: none; }
    .sub-block.selected { background: rgba(255, 59, 127, 0.6); color: #fff; box-shadow: 0 0 0 1.5px #fff; }
    .audio-clip-block { position: absolute; height: 28px; background: linear-gradient(90deg, rgba(20, 184, 166, 0.35), rgba(44, 230, 195, 0.25)); border: 1.5px solid var(--cyan); border-radius: 6px; font-size: 10px; font-weight: 600; padding: 0 16px; display: flex; align-items: center; justify-content: center; color: #ccfbf1; white-space: nowrap; touch-action: none; cursor: pointer; }
    .audio-clip-block.selected { background: rgba(44, 230, 195, 0.5); color: #fff; border-color: #fff; box-shadow: 0 0 0 1.5px var(--cyan); }

    .drawer { background: var(--bg-panel); height: 215px; display: flex; flex-direction: column; flex-shrink: 0; transition: height 0.18s ease; }
    .drawer.collapsed { height: 48px; }
    .drawer.collapsed .drawer-content { display: none; }
    .drawer-content { flex: 1; padding: 9px 12px; overflow-y: auto; font-size: 12px; }
    .nav-tabs { height: 48px; background: #121318; border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; flex-shrink: 0; overflow-x: auto; }
    .nav-tab { background: none; border: none; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; cursor: pointer; padding: 4px 5px; white-space: nowrap; }
    .nav-tab.active { color: var(--accent); font-weight: 700; }
    .nav-tab span.icon { font-size: 15px; }
    .drawer-toggle-tab { position: sticky; right: 0; z-index: 10; background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; color: var(--cyan); font-size: 10px; font-weight: 700; padding: 4px 7px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 1px; flex-shrink: 0; margin-right: 4px; }

    .control-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 8px; }
    .control-row label { color: var(--text-muted); font-size: 11px; min-width: 62px; }
    input[type="range"] { flex: 1; accent-color: var(--accent); }
    input[type="text"], input[type="password"], select, textarea { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); padding: 6px 8px; border-radius: 6px; font-size: 12px; flex: 1; user-select: text; min-width: 0; font-family: inherit; }
    textarea { width: 100%; resize: none; height: 52px; line-height: 1.4; }
    .pill-group { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 8px; }
    .pill-group::-webkit-scrollbar { display: none; }
    .pill { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-muted); padding: 4px 9px; border-radius: 99px; font-size: 11px; font-weight: 600; white-space: nowrap; cursor: pointer; }
    .pill.active { background: var(--accent-soft); border-color: var(--accent); color: #fff; }
    .font-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 6px; }
    @media (min-width: 768px) { .font-grid { grid-template-columns: repeat(4, 1fr); } }
    .font-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 7px; text-align: left; color: var(--text-main); cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
    .font-card.active { border-color: var(--accent); background: var(--accent-soft); }
    .font-card .sample { font-size: 14px; font-weight: 700; }
    .font-card .meta { font-size: 9px; color: var(--text-muted); font-family: 'Noto Sans TC', sans-serif; }
    .action-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .box-btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); padding: 8px 6px; border-radius: 8px; font-size: 11px; font-weight: 600; text-align: center; cursor: pointer; }
    .box-btn.primary { border-color: var(--accent); background: var(--accent-soft); }
    .box-btn.purple { border-color: var(--purple); background: rgba(168, 85, 247, 0.18); color: #e9d5ff; }
    .box-btn.cyan { border-color: var(--cyan); background: rgba(44, 230, 195, 0.16); color: #99f6e4; }
    .box-btn.danger { border-color: var(--danger); background: var(--danger-soft); color: #fca5a5; }
    .hidden-input { display: none; }

          <div class="pill-group"><button class="pill ${bg.mode === 'solid' ? 'active' : ''}" data-bg="solid">⬛ 純色底板</button><button class="pill ${bg.mode === 'gradient' ? 'active' : ''}" data-bg="gradient">🌈 漸層底板</button><button class="pill ${bg.mode === 'blur' ? 'active' : ''}" data-bg="blur">🌫️ 原片模糊背景</button><button class="pill ${bg.mode === 'custom' ? 'active' : ''}" data-bg="custom">🖼️ 自訂圖片/影片底板</button></div>
          ${bg.mode === 'solid' ? `<div class="control-row"><label>底板顏色</label><input type="color" value="${bg.color1}" id="bgColor1" style="width:44px; height:28px; border:none; background:none;"><button class="chip-btn" onclick="pushUndo(); state.background.color1='#000000'; renderDrawer(); renderFrame(); scheduleAutoSaveDraft();">重設純黑</button><button class="chip-btn" onclick="pushUndo(); state.background.color1='#ffffff'; renderDrawer(); renderFrame(); scheduleAutoSaveDraft();">純白</button></div>` : ''}
          ${bg.mode === 'gradient' ? `<div class="control-row"><label>漸層起訖色</label><input type="color" value="${bg.color1}" id="bgGrad1" style="width:40px; height:28px; border:none; background:none;"><input type="color" value="${bg.color2}" id="bgGrad2" style="width:40px; height:28px; border:none; background:none;"></div>` : ''}
          ${bg.mode === 'custom' ? `<div class="control-row"><button class="box-btn primary" style="flex:1;" onclick="document.getElementById('bgFileInput').click()">＋ 匯入自訂底板圖片或影片</button></div><p style="color:var(--text-muted); font-size:11px; margin:4px 0 0;">目前自訂底板：${bg.mediaName || '尚未匯入檔案'}</p>` : ''}
        `;
        container.querySelectorAll('[data-bg]').forEach(btn => { btn.onclick = () => { pushUndo(); state.background.mode = btn.dataset.bg; if (state.background.mode === 'custom' && !state.background.mediaEl) document.getElementById('bgFileInput').click(); renderDrawer(); renderFrame(); scheduleAutoSaveDraft(); }; });
        if (document.getElementById('bgColor1')) document.getElementById('bgColor1').oninput = (e) => { state.background.color1 = e.target.value; renderFrame(); scheduleAutoSaveDraft(); };
        if (document.getElementById('bgGrad1')) { document.getElementById('bgGrad1').oninput = (e) => { state.background.color1 = e.target.value; renderFrame(); scheduleAutoSaveDraft(); }; document.getElementById('bgGrad2').oninput = (e) => { state.background.color2 = e.target.value; renderFrame(); scheduleAutoSaveDraft(); }; }
      }
      else if (state.activeTab === 'text') {
        const cats = ['全部', '現代', '手寫', '圓體', '古典', '特色'];
        const filteredFonts = state.fontFilter === '全部' ? FREE_FONTS : FREE_FONTS.filter(f => f.cat === state.fontFilter);
        container.innerHTML = `
          <div class="control-row">
            <button class="chip-btn" style="background:var(--accent); border:none; color:#fff;" id="newSubBtn">＋ 新增字幕</button>
            <button class="chip-btn" style="border-color:var(--cyan); color:var(--cyan);" id="importSrtBtn">📄 匯入 .srt</button>
            ${sub ? `<button class="chip-btn" style="border-color:var(--purple); color:#e9d5ff;" id="subToVoiceBtn">🎙️ AI配音</button><button class="chip-btn danger" id="delSubBtn">🗑️</button>` : ''}
          </div>
          ${sub ? `<div class="control-row"><label>排版方向</label><button class="pill ${sub.orientation !== 'vertical' ? 'active' : ''}" id="orientHorizBtn">➡️ 橫排</button><button class="pill ${sub.orientation === 'vertical' ? 'active' : ''}" id="orientVertBtn">⬇️ 直排</button><input type="range" min="14" max="48" value="${sub.size}" id="subSizeRange" style="max-width:90px;"><input type="color" value="${sub.color}" id="subColorPick" style="width:28px; height:24px; border:none; background:none;"></div>` : ''}
          <div class="pill-group">${cats.map(c => `<button class="pill ${state.fontFilter === c ? 'active' : ''}" data-cat="${c}">${c}</button>`).join('')}<button class="pill" onclick="document.getElementById('fontFileInput').click()">＋ 本機字體</button></div>
          <div class="font-grid">${filteredFonts.map(f => `<button class="font-card ${sub && sub.font === f.family ? 'active' : ''}" data-family="${f.family.replace(/"/g, '&quot;')}"><span class="sample" style="font-family:${f.family};">${f.name}</span><span class="meta">${f.desc}</span></button>`).join('')}</div>
        `;
        document.getElementById('newSubBtn').onclick = addNewSubtitle;
        document.getElementById('importSrtBtn').onclick = () => document.getElementById('srtFileInput').click();
        if (document.getElementById('subToVoiceBtn')) document.getElementById('subToVoiceBtn').onclick = () => { state.activeTab = 'voice'; updateTabsUI(); renderDrawer(); };
        if (document.getElementById('delSubBtn')) document.getElementById('delSubBtn').onclick = () => { state.lastSelectedType = 'sub'; deleteCurrentSelected(); };
        if (sub) {
          document.getElementById('subTextInput').oninput = (e) => { sub.text = e.target.value; renderTimeline(); renderFrame(); scheduleAutoSaveDraft(); };
          document.getElementById('orientHorizBtn').onclick = () => { pushUndo(); sub.orientation = 'horizontal'; renderTimeline(); renderDrawer(); renderFrame(); scheduleAutoSaveDraft(); };
          document.getElementById('orientVertBtn').onclick = () => { pushUndo(); sub.orientation = 'vertical'; renderTimeline(); renderDrawer(); renderFrame(); scheduleAutoSaveDraft(); showToast('已切換為傳統直式書寫（可用 | 分直行）'); };
          document.getElementById('subSizeRange').oninput = (e) => { sub.size = parseInt(e.target.value, 10); renderFrame(); scheduleAutoSaveDraft(); };
          document.getElementById('subColorPick').oninput = (e) => { sub.color = e.target.value; renderFrame(); scheduleAutoSaveDraft(); };
        }
        container.querySelectorAll('.pill[data-cat]').forEach(btn => { btn.onclick = () => { state.fontFilter = btn.dataset.cat; renderDrawer(); }; });
        container.querySelectorAll('.font-card').forEach(card => { card.onclick = () => { if (!sub) return showToast('請先點上方「＋ 新增字幕」'); pushUndo(); sub.font = card.dataset.family; renderDrawer(); renderFrame(); scheduleAutoSaveDraft(); setTimeout(renderFrame, 600); }; });
      }
      else if (state.activeTab === 'color') {
        if (!clip) { container.innerHTML = `<p style="color:var(--text-muted); text-align:center; margin-top:20px;">請先匯入並選取主影片或畫中畫，再調整調色濾鏡 🎨</p>`; return; }
        const col = clip.color;
        container.innerHTML = `
          <div class="pill-group">${FILTER_PRESETS.map(p => `<button class="pill" data-preset="${p.id}">${p.name}</button>`).join('')}</div>
          <div class="control-row"><label>亮度</label><input type="range" min="60" max="150" value="${col.b}" id="colB"><span>${col.b}%</span></div>
          <div class="control-row"><label>對比度</label><input type="range" min="60" max="160" value="${col.c}" id="colC"><span>${col.c}%</span></div>
          <div class="control-row"><label>飽和度</label><input type="range" min="0" max="180" value="${col.s}" id="colS"><span>${col.s}%</span></div>
          <div class="control-row"><label>色溫冷暖</label><input type="range" min="-40" max="40" value="${col.warm}" id="colW"><span>${col.warm}</span></div>
        `;
        container.querySelectorAll('[data-preset]').forEach(btn => {
          btn.onclick = () => { pushUndo(); const p = FILTER_PRESETS.find(x => x.id === btn.dataset.preset); clip.color = { b: p.b, c: p.c, s: p.s, warm: p.warm }; renderDrawer(); renderFrame(); scheduleAutoSaveDraft(); };
        });
        ['colB', 'colC', 'colS', 'colW'].forEach(id => {
          document.getElementById(id).oninput = (e) => {
            const val = parseInt(e.target.value, 10);
            if (id === 'colB') col.b = val; if (id === 'colC') col.c = val; if (id === 'colS') col.s = val; if (id === 'colW') col.warm = val;
            renderFrame(); scheduleAutoSaveDraft();
          };
        });
      }
      else if (state.activeTab === 'audio') {
        const hasVideoClip = clip && clip.mediaEl?.tagName === 'VIDEO';
        container.innerHTML = `
          <div class="action-grid" style="margin-bottom:8px;"><button class="box-btn cyan" onclick="document.getElementById('audioFileInput').click()">🎵 插入音樂檔</button><button class="box-btn primary" onclick="document.getElementById('videoToAudioInput').click()">🎬 匯入影片轉音軌</button><button class="box-btn" id="extractCurVidBtn" ${hasVideoClip ? '' : 'disabled style="opacity:0.4;"'}>📤 分離目前影片音軌</button></div>
          ${hasVideoClip ? `<div style="font-size:11px; color:#93c5fd; font-weight:700; margin:4px 0;">🎞️ 影片原聲控制（${clip.name}）</div><div class="control-row"><button class="chip-btn ${clip.muted ? 'danger' : ''}" id="toggleVidMuteBtn">${clip.muted ? '🔇 原聲已靜音' : '🔊 原聲開啟中'}</button><label style="min-width:52px;">原聲增益</label><input type="range" min="0" max="3" step="0.05" value="${clip.audioGain ?? 1}" id="vidGainRange" ${clip.muted ? 'disabled' : ''}><span>${Math.round((clip.audioGain ?? 1) * 100)}%</span></div>` : ''}
          ${aClip ? `<div style="font-size:11px; color:#6ee7b7; font-weight:700; margin:6px 0 4px;">🎵 獨立音軌片段控制（${aClip.name}）</div><div class="control-row"><button class="chip-btn ${aClip.muted ? 'danger' : ''}" id="toggleAudMuteBtn">${aClip.muted ? '🔇 音軌已靜音' : '🔊 音軌開啟'}</button><label style="min-width:52px;">音軌增益</label><input type="range" min="0" max="3" step="0.05" value="${aClip.gain ?? 1}" id="audGainRange" ${aClip.muted ? 'disabled' : ''}><span>${Math.round((aClip.gain ?? 1) * 100)}%</span></div>` : `<p style="color:var(--text-muted); font-size:11px; text-align:center; margin:8px 0 0;">支援直接匯入音樂、AI 配音或「匯入影片轉音軌」，匯出時自動混音。</p>`}
        `;
        if (document.getElementById('extractCurVidBtn') && hasVideoClip) document.getElementById('extractCurVidBtn').onclick = () => extractAudioFromClip(clip, selObj.isPip);
        if (hasVideoClip) {
          document.getElementById('toggleVidMuteBtn').onclick = () => { pushUndo(); clip.muted = !clip.muted; applyMediaAudioGain(clip.mediaEl, clip.muted, clip.audioGain ?? 1.0); renderTimeline(); renderDrawer(); scheduleAutoSaveDraft(); showToast(clip.muted ? '已將此影片原聲靜音 🔇' : '已恢復影片原聲 🔊'); };
          document.getElementById('vidGainRange').oninput = (e) => { clip.audioGain = parseFloat(e.target.value); applyMediaAudioGain(clip.mediaEl, clip.muted, clip.audioGain); renderTimeline(); renderDrawer(); scheduleAutoSaveDraft(); };
        }
        if (aClip) {
          document.getElementById('toggleAudMuteBtn').onclick = () => { pushUndo(); aClip.muted = !aClip.muted; applyMediaAudioGain(aClip.mediaEl, aClip.muted, aClip.gain ?? 1.0); renderTimeline(); renderDrawer(); scheduleAutoSaveDraft(); };
          document.getElementById('audGainRange').oninput = (e) => { aClip.gain = parseFloat(e.target.value); applyMediaAudioGain(aClip.mediaEl, aClip.muted, aClip.gain); renderTimeline(); renderDrawer(); scheduleAutoSaveDraft(); };
        }
      }
    }

    function updateTabsUI() { document.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === state.activeTab && !state.drawerCollapsed)); }
    document.querySelectorAll('.nav-tab').forEach(tab => { tab.onclick = () => { if (state.activeTab === tab.dataset.tab && !state.drawerCollapsed) { setDrawerCollapsed(true); updateTabsUI(); return; } state.activeTab = tab.dataset.tab; setDrawerCollapsed(false); updateTabsUI(); renderDrawer(); }; });

    function applyCanvasResolutionForRatio(ratio, exportQualityMode = null) {
      if (!exportQualityMode) {
        state.renderScaleFactor = 1;
        if (ratio === '9:16') { canvas.width = 360; canvas.height = 640; canvas.style.aspectRatio = '9 / 16'; }
        else if (ratio === '16:9') { canvas.width = 640; canvas.height = 360; canvas.style.aspectRatio = '16 / 9'; }
        else { canvas.width = 480; canvas.height = 480; canvas.style.aspectRatio = '1 / 1'; }
        return;
      }
      if (exportQualityMode === '4k') {
        if (ratio === '9:16') { canvas.width = 2160; canvas.height = 3840; state.renderScaleFactor = 6; }
        else if (ratio === '16:9') { canvas.width = 3840; canvas.height = 2160; state.renderScaleFactor = 6; }
        else { canvas.width = 2160; canvas.height = 2160; state.renderScaleFactor = 4.5; }
      } else {
        if (ratio === '9:16') { canvas.width = 1080; canvas.height = 1920; state.renderScaleFactor = 3; }
        else if (ratio === '16:9') { canvas.width = 1920; canvas.height = 1080; state.renderScaleFactor = 3; }
        else { canvas.width = 1080; canvas.height = 1080; state.renderScaleFactor = 2.25; }
      }
    }

    document.querySelectorAll('.ratio-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.ratio-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active');
        state.ratio = btn.dataset.ratio; applyCanvasResolutionForRatio(state.ratio, null); renderFrame(); scheduleAutoSaveDraft();
      };
    });

    function updateExportQualityUI() {
      const is4K = state.exportQuality === '4k';
      document.getElementById('qCard1080').classList.toggle('active', !is4K);
      document.getElementById('qCard4K').classList.toggle('active', is4K);
      const qLabel = is4K ? '4K 60fps (45Mbps)' : '1080p 60fps (18Mbps)';
      const segs = collectEditableSegments();
      document.getElementById('fullExportDesc').textContent = `輸出 1 支 ${qLabel} MP4 完整影片檔`;
      document.getElementById('splitCountDesc').textContent = `同時下載 1 支完整影片 ＋ 目前已裁切的 ${segs.length} 份獨立編輯片段`;
    }
    document.getElementById('qCard1080').onclick = () => { state.exportQuality = '1080p'; updateExportQualityUI(); scheduleAutoSaveDraft(); };
    document.getElementById('qCard4K').onclick = () => { state.exportQuality = '4k'; updateExportQualityUI(); scheduleAutoSaveDraft(); };

    function detectBestExportFormat() {
      for (const mime of ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4']) { if (MediaRecorder.isTypeSupported(mime)) return { mimeType: mime, ext: 'mp4' }; }
      for (const mime of ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm']) { if (MediaRecorder.isTypeSupported(mime)) return { mimeType: mime, ext: 'webm' }; }
      return { mimeType: '', ext: 'webm' };
    }

    function collectEditableSegments() {
      const list = []; let acc = 0;
      state.clips.forEach((c, idx) => { list.push({ label: `主軌分段${idx + 1}_${c.name.replace(/[^\w\u4e00-\u9fa5-]/g, '')}`, start: roundSec(acc), end: roundSec(acc + c.duration) }); acc += c.duration; });
      state.pipTracks.forEach((tr, tIdx) => {
        if (tr.visible === false) return;
        tr.clips.forEach((p, pIdx) => { const s = roundSec(p.start || 0); list.push({ label: `頂層${tIdx + 1}分段${pIdx + 1}_${p.name.replace(/[^\w\u4e00-\u9fa5-]/g, '')}`, start: s, end: roundSec(s + p.duration) }); });
      });
      return list;
    }

    function recordTimeRangeHighQuality(startSec, endSec, baseFilename, taskIndex, totalTasks) {
      return new Promise((resolve) => {
        getAudioCtx();
        const videoStream = canvas.captureStream(60), combinedStream = new MediaStream();
        videoStream.getVideoTracks().forEach(track => combinedStream.addTrack(track));
        if (exportMixDest?.stream) exportMixDest.stream.getAudioTracks().forEach(track => combinedStream.addTrack(track));
        const fmt = detectBestExportFormat(), is4K = state.exportQuality === '4k';
        const recOptions = { videoBitsPerSecond: is4K ? 45000000 : 18000000 }; if (fmt.mimeType) recOptions.mimeType = fmt.mimeType;

        const recorder = new MediaRecorder(combinedStream, recOptions), chunks = [];
        recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
        recorder.onstop = () => { downloadBlobAsFile(new Blob(chunks, { type: fmt.mimeType || 'video/mp4' }), `${baseFilename}.${fmt.ext}`); resolve(fmt.ext); };

        const segDur = Math.max(0.1, endSec - startSec), qTag = is4K ? '4K · 60fps' : '1080p · 60fps';
        exportProgressHook = (curT) => {
          const localElapsed = Math.max(0, Math.min(segDur, curT - startSec)), overallPct = Math.min(99, Math.round(((taskIndex + localElapsed / segDur) / totalTasks) * 100));
          exportPercentBig.textContent = `${overallPct}%`; exportProgressFill.style.width = `${overallPct}%`;
          exportProgressSub.textContent = `本段進度：${formatTime(localElapsed)} / ${formatTime(segDur)}（${qTag} · ${state.ratio} · ${fmt.ext.toUpperCase()}）`;
        };

        state.currentTime = startSec; timelineScroll.scrollLeft = Math.round(startSec * state.pxPerSec);
        exportSegmentStopTime = endSec; syncVideoElements(true); renderFrame();
        setTimeout(() => {
          recorder.start(); togglePlay(true);
          const checkStop = setInterval(() => { if (!state.isPlaying) { clearInterval(checkStop); exportSegmentStopTime = null; exportProgressHook = null; if (recorder.state !== 'inactive') recorder.stop(); } }, 100);
        }, 140);
      });
    }

    async function runBatchExport(includeSplits) {
      if (state.isExporting) return; state.isExporting = true;
      exportOptionsList.style.display = 'none'; exportProgressBox.style.display = 'block';
      const qMode = state.exportQuality, qLabel = qMode === '4k' ? '4K60' : '1080p60';
      applyCanvasResolutionForRatio(state.ratio, qMode);
      const stamp = new Date().toISOString().slice(11, 19).replace(/:/g, '');
      const segments = includeSplits ? collectEditableSegments() : [], totalTasks = 1 + segments.length;

      exportProgressText.textContent = `正在渲染完整影片 (1 / ${totalTasks})...`;
      const usedExt = await recordTimeRangeHighQuality(0, getTotalDuration(), `CutVideo_完整影片_${qLabel}_${stamp}`, 0, totalTasks);
      for (let i = 0; i < segments.length; i++) {
        const seg = segments[i]; exportProgressText.textContent = `正在分開存檔裁切片段 (${i + 2} / ${totalTasks})：${seg.label}`; await new Promise(r => setTimeout(r, 350));
        await recordTimeRangeHighQuality(seg.start, seg.end, `CutVideo_${seg.label}_${qLabel}_${stamp}`, i + 1, totalTasks);
      }
      exportPercentBig.textContent = '100%'; exportProgressFill.style.width = '100%'; applyCanvasResolutionForRatio(state.ratio, null);
      state.isExporting = false; state.currentTime = 0; timelineScroll.scrollLeft = 0; renderFrame();
      exportModalBackdrop.classList.remove('open'); exportOptionsList.style.display = 'block'; exportProgressBox.style.display = 'none';
      showToast(includeSplits ? `${qLabel} ${usedExt.toUpperCase()} 全部匯出完成（共 ${totalTasks} 支檔案）📦` : `${qLabel} ${usedExt.toUpperCase()} 完整影片匯出完成！🎬🔊`);
    }

    document.getElementById('exportBtn').onclick = () => {
      if (state.isPlaying) togglePlay(false); updateExportQualityUI(); document.getElementById('relinkAssetsBox').style.display = 'none';
      exportOptionsList.style.display = 'block'; exportProgressBox.style.display = 'none'; exportModalBackdrop.classList.add('open');
    };
    document.getElementById('closeExportModalBtn').onclick = () => { if (state.isExporting) return showToast('正在渲染高畫質影片中，請稍候完成'); exportModalBackdrop.classList.remove('open'); };

    const canExportVideo = () => {
      const hasAnyPip = state.pipTracks.some(t => t.clips.length > 0);
      if (state.clips.length === 0 && !hasAnyPip && state.audioClips.length === 0) { showToast('請先匯入影片或音訊再匯出'); return false; }
      if (typeof MediaRecorder === 'undefined') { showToast('目前瀏覽器不支援直接錄製匯出，請改用 Chrome 或 Safari 最新版'); return false; }
      return true;
    };
    document.getElementById('optExportFullOnly').onclick = () => { if (canExportVideo()) runBatchExport(false); };
    document.getElementById('optExportFullAndSplits').onclick = () => { if (canExportVideo()) runBatchExport(true); };

    updateHistoryButtonsUI(); updateGroupButtons(); renderTimeline(); renderDrawer(); renderFrame(); restoreDraftFromDB();
  </script>
</body>
</html>
