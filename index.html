    // ====== 關鍵幀內插計算 ======
    function getInterpolatedTransform(clip, localT) {
      if (!clip || !clip.keyframes || clip.keyframes.length === 0) return { scale: 1, x: 0, y: 0, rot: 0 };
      const kfs = [...clip.keyframes].sort((a, b) => a.t - b.t);
      if (localT <= kfs[0].t) return { ...kfs[0] };
      if (localT >= kfs[kfs.length - 1].t) return { ...kfs[kfs.length - 1] };

      for (let i = 0; i < kfs.length - 1; i++) {
        const k1 = kfs[i], k2 = kfs[i + 1];
        if (localT >= k1.t && localT <= k2.t) {
          const rawRatio = (localT - k1.t) / Math.max(0.001, k2.t - k1.t);
          const ratio = rawRatio * rawRatio * (3 - 2 * rawRatio);
          return {
            scale: k1.scale + (k2.scale - k1.scale) * ratio,
            x: k1.x + (k2.x - k1.x) * ratio,
            y: k1.y + (k2.y - k1.y) * ratio,
            rot: k1.rot + (k2.rot - k1.rot) * ratio
          };
        }
      }
      return { scale: 1, x: 0, y: 0, rot: 0 };
    }

    // ====== 單一圖層視覺繪製器 ======
    function hexToRgb(hex) {
      const clean = hex.replace('#', '');
      const num = parseInt(clean, 16);
      return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
    }

    function drawVisualClip(targetCtx, clip, localT, W, H, isPipLayer) {
      const el = clip.mediaEl;
      if (!el) return;
      const isVideo = el.tagName === 'VIDEO';
      if (isVideo && (el.error || el.readyState < 1 || el.videoWidth === 0)) return;
      if (!isVideo && (!el.complete || el.naturalWidth === 0)) return;

      const srcW = isVideo ? el.videoWidth : el.naturalWidth;
      const srcH = isVideo ? el.videoHeight : el.naturalHeight;

      let drawSource = el;
      if (clip.cutout && clip.cutout.mode !== 'none') {
        const procW = Math.min(480, srcW);
        const procH = Math.round(procW * (srcH / srcW));
        offCanvas.width = procW;
        offCanvas.height = procH;
        offCtx.clearRect(0, 0, procW, procH);
        offCtx.drawImage(el, 0, 0, procW, procH);

        if (clip.cutout.mode === 'chroma') {
          const imgData = offCtx.getImageData(0, 0, procW, procH);
          const data = imgData.data;
          const targetRgb = hexToRgb(clip.cutout.keyColor || '#00ff00');
          const tol = clip.cutout.tolerance || 65;
          const smooth = Math.max(1, clip.cutout.smoothness || 15);

          for (let i = 0; i < data.length; i += 4) {
            const dr = data[i] - targetRgb.r;
            const dg = data[i + 1] - targetRgb.g;
            const db = data[i + 2] - targetRgb.b;
            const dist = Math.sqrt(dr * dr + dg * dg + db * db);
            if (dist < tol) {
              data[i + 3] = 0;
            } else if (dist < tol + smooth) {
              const alphaRatio = (dist - tol) / smooth;
              data[i + 3] = Math.round(data[i + 3] * alphaRatio);
            }
          }
          offCtx.putImageData(imgData, 0, 0);
          drawSource = offCanvas;
        } else if (clip.cutout.mode === 'ai') {
          runAISegmentation(el);
          if (latestSegMask) {
            offCtx.globalCompositeOperation = 'destination-in';
            offCtx.drawImage(latestSegMask, 0, 0, procW, procH);
            offCtx.globalCompositeOperation = 'source-over';
            drawSource = offCanvas;
          }
        }
      }

      const tr = getInterpolatedTransform(clip, localT);
      const baseRatio = srcW / srcH;
      const canvasRatio = W / H;
      let dw = W, dh = H;
      if (baseRatio > canvasRatio) {
        dh = H;
        dw = H * baseRatio;
      } else {
        dw = W;
        dh = W / baseRatio;
      }
      if (isPipLayer) {
        dw *= 0.58;
        dh *= 0.58;
      }

      targetCtx.save();
      targetCtx.globalAlpha = clip.opacity !== undefined ? clip.opacity : 1.0;
      targetCtx.globalCompositeOperation = clip.blendMode || 'source-over';

      targetCtx.translate(W / 2 + tr.x, H / 2 + tr.y);
      targetCtx.rotate((tr.rot * Math.PI) / 180);
      targetCtx.scale(tr.scale, tr.scale);

      const col = clip.color || { b: 100, c: 100, s: 100, warm: 0 };
      const sepia = col.warm > 0 ? col.warm * 0.6 : 0;
      const hue = col.warm < 0 ? col.warm * 0.8 : 0;
      targetCtx.filter = `brightness(${col.b}%) contrast(${col.c}%) saturate(${col.s}%) sepia(${sepia}%) hue-rotate(${hue}deg)`;

      const mask = clip.mask || { type: 'none', feather: 12, penPoints: [] };
      if (mask.type !== 'none') {
        targetCtx.beginPath();
        if (mask.type === 'circle') {
          const r = Math.min(dw, dh) * 0.45;
          targetCtx.arc(0, 0, r, 0, Math.PI * 2);
          targetCtx.clip();
        } else if (mask.type === 'roundrect') {
          const mw = dw * 0.88, mh = dh * 0.88;
          targetCtx.roundRect(-mw / 2, -mh / 2, mw, mh, 24);
          targetCtx.clip();
        } else if (mask.type === 'feather') {
          maskCanvas.width = Math.max(10, Math.round(dw));
          maskCanvas.height = Math.max(10, Math.round(dh));
          maskCtx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);
          maskCtx.drawImage(drawSource, 0, 0, maskCanvas.width, maskCanvas.height);

          const fPx = Math.min(maskCanvas.width * 0.4, (mask.feather || 20) * 1.8);
          maskCtx.globalCompositeOperation = 'destination-in';
          const gradH = maskCtx.createLinearGradient(0, 0, maskCanvas.width, 0);
          gradH.addColorStop(0, 'rgba(0,0,0,0)');
          gradH.addColorStop(Math.min(0.49, fPx / maskCanvas.width), 'rgba(0,0,0,1)');
          gradH.addColorStop(Math.max(0.51, 1 - fPx / maskCanvas.width), 'rgba(0,0,0,1)');
          gradH.addColorStop(1, 'rgba(0,0,0,0)');
          maskCtx.fillStyle = gradH;
          maskCtx.fillRect(0, 0, maskCanvas.width, maskCanvas.height);

          const gradV = maskCtx.createLinearGradient(0, 0, 0, maskCanvas.height);
          gradV.addColorStop(0, 'rgba(0,0,0,0)');
          gradV.addColorStop(Math.min(0.49, fPx / maskCanvas.height), 'rgba(0,0,0,1)');
          gradV.addColorStop(Math.max(0.51, 1 - fPx / maskCanvas.height), 'rgba(0,0,0,1)');
          gradV.addColorStop(1, 'rgba(0,0,0,0)');
          maskCtx.globalCompositeOperation = 'destination-in';
          maskCtx.fillStyle = gradV;
          maskCtx.fillRect(0, 0, maskCanvas.width, maskCanvas.height);
          maskCtx.globalCompositeOperation = 'source-over';
          drawSource = maskCanvas;
        } else if (mask.type === 'pen' && mask.penPoints && mask.penPoints.length >= 3) {
          mask.penPoints.forEach((pt, idx) => {
            const px = (pt.x - 0.5) * dw;
            const py = (pt.y - 0.5) * dh;
            if (idx === 0) targetCtx.moveTo(px, py);
            else targetCtx.lineTo(px, py);
          });
          targetCtx.closePath();
          targetCtx.clip();
        }
      }

      targetCtx.drawImage(drawSource, -dw / 2, -dh / 2, dw, dh);

      const fadeIn = clip.fadeIn || { type: 'none', dur: 0.8 };
      if (fadeIn.type !== 'none' && localT < fadeIn.dur) {
        const alpha = Math.max(0, Math.min(1, 1 - (localT / Math.max(0.05, fadeIn.dur))));
        targetCtx.filter = 'none';
        targetCtx.fillStyle = fadeIn.type === 'white' ? `rgba(255,255,255,${alpha})` : `rgba(0,0,0,${alpha})`;
        targetCtx.fillRect(-dw / 2, -dh / 2, dw, dh);
      }

      const fadeOut = clip.fadeOut || { type: 'none', dur: 0.8 };
      const timeRemaining = clip.duration - localT;
      if (fadeOut.type !== 'none' && timeRemaining < fadeOut.dur) {
        const alpha = Math.max(0, Math.min(1, 1 - (timeRemaining / Math.max(0.05, fadeOut.dur))));
        targetCtx.filter = 'none';
        targetCtx.fillStyle = fadeOut.type === 'white' ? `rgba(255,255,255,${alpha})` : `rgba(0,0,0,${alpha})`;
        targetCtx.fillRect(-dw / 2, -dh / 2, dw, dh);
      }

      targetCtx.restore();

      if (state.penEditMode && clip.id === state.selectedClipId && mask.type === 'pen') {
        targetCtx.save();
        targetCtx.translate(W / 2 + tr.x, H / 2 + tr.y);
        targetCtx.rotate((tr.rot * Math.PI) / 180);
        targetCtx.scale(tr.scale, tr.scale);
        if (mask.penPoints.length > 0) {
          targetCtx.strokeStyle = '#ffcc33';
          targetCtx.lineWidth = 2;
          targetCtx.beginPath();
          mask.penPoints.forEach((pt, idx) => {
            const px = (pt.x - 0.5) * dw;
            const py = (pt.y - 0.5) * dh;
            if (idx === 0) targetCtx.moveTo(px, py);
            else targetCtx.lineTo(px, py);
          });
          if (mask.penPoints.length >= 3) targetCtx.closePath();
          targetCtx.stroke();
          mask.penPoints.forEach((pt) => {
            const px = (pt.x - 0.5) * dw;
            const py = (pt.y - 0.5) * dh;
            targetCtx.fillStyle = '#ff3b7f';
            targetCtx.beginPath();
            targetCtx.arc(px, py, 5, 0, Math.PI * 2);
            targetCtx.fill();
            targetCtx.strokeStyle = '#fff';
            targetCtx.lineWidth = 1.5;
            targetCtx.stroke();
          });
        }
        targetCtx.restore();
      }
    }

    // ====== 氛圍特效渲染器 ======
    function renderAtmosphereEffects(targetCtx, W, H, t) {
      const fx = state.effects;

      if (fx.spotlight && fx.spotlight.enabled) {
        const sp = fx.spotlight;
        const fxPx = sp.focusX * W;
        const fyPx = sp.focusY * H;
        const angleRad = (sp.angle * Math.PI) / 180;
        const beamTopX = fxPx - Math.tan(angleRad) * fyPx;
        const spreadHalfW = W * sp.spread;

        targetCtx.save();
        maskCanvas.width = W;
        maskCanvas.height = H;
        maskCtx.clearRect(0, 0, W, H);
        maskCtx.fillStyle = `rgba(0, 0, 0, ${sp.darkness})`;
        maskCtx.fillRect(0, 0, W, H);

        maskCtx.globalCompositeOperation = 'destination-out';
        const beamGrad = maskCtx.createLinearGradient(beamTopX, 0, fxPx, fyPx + spreadHalfW);
        beamGrad.addColorStop(0, 'rgba(0,0,0,0.95)');
        beamGrad.addColorStop(0.75, 'rgba(0,0,0,0.9)');
        beamGrad.addColorStop(1, 'rgba(0,0,0,0)');
        maskCtx.fillStyle = beamGrad;
        maskCtx.beginPath();
        maskCtx.moveTo(beamTopX - spreadHalfW * 0.25, 0);
        maskCtx.lineTo(beamTopX + spreadHalfW * 0.25, 0);
        maskCtx.lineTo(fxPx + spreadHalfW * 1.25, fyPx + spreadHalfW * 0.4);
        maskCtx.lineTo(fxPx - spreadHalfW * 1.25, fyPx + spreadHalfW * 0.4);
        maskCtx.closePath();
        maskCtx.fill();

        const spotGrad = maskCtx.createRadialGradient(fxPx, fyPx, spreadHalfW * 0.15, fxPx, fyPx, spreadHalfW * 1.25);
        spotGrad.addColorStop(0, 'rgba(0,0,0,1)');
        spotGrad.addColorStop(0.6, 'rgba(0,0,0,0.85)');
        spotGrad.addColorStop(1, 'rgba(0,0,0,0)');
        maskCtx.fillStyle = spotGrad;
        maskCtx.beginPath();
        maskCtx.arc(fxPx, fyPx, spreadHalfW * 1.25, 0, Math.PI * 2);
        maskCtx.fill();
        maskCtx.globalCompositeOperation = 'source-over';

        targetCtx.drawImage(maskCanvas, 0, 0);

        targetCtx.globalCompositeOperation = 'screen';
        const tintGrad = targetCtx.createRadialGradient(fxPx, fyPx, 5, fxPx, fyPx, spreadHalfW * 1.15);
        tintGrad.addColorStop(0, sp.color + '44');
        tintGrad.addColorStop(1, 'rgba(0,0,0,0)');
        targetCtx.fillStyle = tintGrad;
        targetCtx.fillRect(0, 0, W, H);
        targetCtx.restore();
      }

      if (fx.particleType !== 'none') {
        const count = Math.min(150, fx.particleDensity || 45);
        const baseSize = fx.particleSize || 6;
        const spd = fx.particleSpeed || 1.0;

        targetCtx.save();
        for (let i = 0; i < count; i++) {
          const p = PARTICLE_SEEDS[i];
          const fallProgress = (p.y0 + t * 0.16 * spd * p.speedMul) % 1.15;
          const py = (fallProgress - 0.08) * H;
          const sway = Math.sin(t * 2.1 * p.speedMul + p.phase) * p.swayAmp * W;
          const windDrift = (t * 0.03 * spd * (i % 3 - 1)) * W;
          const px = (((p.x0 * W + sway + windDrift) % W) + W) % W;
          const r = baseSize * p.sizeMul;

          if (fx.particleType === 'snow') {
            const snowGrad = targetCtx.createRadialGradient(px, py, 0, px, py, r);
            snowGrad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
            snowGrad.addColorStop(0.6, 'rgba(255, 255, 255, 0.55)');
            snowGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
            targetCtx.fillStyle = snowGrad;
            targetCtx.beginPath();
            targetCtx.arc(px, py, r, 0, Math.PI * 2);
            targetCtx.fill();
          } else if (fx.particleType === 'petal') {
            targetCtx.save();
            targetCtx.translate(px, py);
            targetCtx.rotate(t * p.rotSpeed + p.phase);
            const flipScale = 0.45 + 0.55 * Math.abs(Math.cos(t * 2.5 + p.phase));
            targetCtx.scale(1, flipScale);
            targetCtx.fillStyle = fx.petalColor || '#ffb7c5';
            targetCtx.globalAlpha = 0.88;
            targetCtx.beginPath();
            targetCtx.moveTo(0, -r);
            targetCtx.bezierCurveTo(r * 0.9, -r * 0.6, r * 0.9, r * 0.7, 0, r);
            targetCtx.bezierCurveTo(-r * 0.9, r * 0.7, -r * 0.9, -r * 0.6, 0, -r);
            targetCtx.fill();
            targetCtx.restore();
          }
        }
        targetCtx.restore();
      }
    }

    // ====== 主畫布渲染管線 ======
    function renderFrame() {
      const W = canvas.width;
      const H = canvas.height;
      ctx.clearRect(0, 0, W, H);

      const bg = state.background;
      if (bg.mode === 'solid') {
        ctx.fillStyle = bg.color1 || '#000000';
        ctx.fillRect(0, 0, W, H);
      } else if (bg.mode === 'gradient') {
        const grad = ctx.createLinearGradient(0, 0, W, H);
        grad.addColorStop(0, bg.color1 || '#1e1b4b');
        grad.addColorStop(1, bg.color2 || '#4c1d95');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);
      } else if (bg.mode === 'custom' && bg.mediaEl) {
        const el = bg.mediaEl;
        const sw = el.tagName === 'VIDEO' ? el.videoWidth : el.naturalWidth;
        const sh = el.tagName === 'VIDEO' ? el.videoHeight : el.naturalHeight;
        if (sw > 0 && sh > 0) {
          const r = Math.max(W / sw, H / sh);
          ctx.drawImage(el, (W - sw * r) / 2, (H - sh * r) / 2, sw * r, sh * r);
        } else {
          ctx.fillStyle = '#000';
          ctx.fillRect(0, 0, W, H);
        }
      } else {
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, W, H);
      }

      let acc = 0;
      let activeMainClip = null;
      let mainLocalT = 0;
      let mainIndex = 0;

      if (activeTrim && activeTrim.type === 'clip' && !activeTrim.isPip) {
        activeMainClip = activeTrim.item;
        mainLocalT = activeTrim.edge === 'left' ? 0 : Math.max(0, activeMainClip.duration - 0.02);
        mainIndex = state.clips.indexOf(activeMainClip);
      } else {
        for (let i = 0; i < state.clips.length; i++) {
          const c = state.clips[i];
          if (state.currentTime >= acc && state.currentTime <= acc + c.duration) {
            activeMainClip = c;
            mainLocalT = state.currentTime - acc;
            mainIndex = i;
            break;
          }
          acc += c.duration;
        }
      }

      if (bg.mode === 'blur' && activeMainClip && activeMainClip.mediaEl) {
        const el = activeMainClip.mediaEl;
        const sw = el.tagName === 'VIDEO' ? el.videoWidth : el.naturalWidth;
        const sh = el.tagName === 'VIDEO' ? el.videoHeight : el.naturalHeight;
        if (sw > 0 && sh > 0) {
          ctx.save();
          ctx.filter = 'blur(18px) brightness(0.65)';
          const r = Math.max(W / sw, H / sh) * 1.15;
          ctx.drawImage(el, (W - sw * r) / 2, (H - sh * r) / 2, sw * r, sh * r);
          ctx.restore();
        }
      }

      if (activeMainClip) {
        drawVisualClip(ctx, activeMainClip, mainLocalT, W, H, false);

        const timeLeft = activeMainClip.duration - mainLocalT;
        if (!activeTrim && timeLeft <= 0.6 && activeMainClip.transitionAfter !== 'none' && mainIndex < state.clips.length - 1) {
          const p = 1 - (timeLeft / 0.6);
          if (activeMainClip.transitionAfter === 'fade') {
            ctx.fillStyle = `rgba(0, 0, 0, ${p})`;
            ctx.fillRect(0, 0, W, H);
          } else if (activeMainClip.transitionAfter === 'flash') {
            ctx.fillStyle = `rgba(255, 255, 255, ${Math.sin(p * Math.PI) * 0.85})`;
            ctx.fillRect(0, 0, W, H);
          } else if (activeMainClip.transitionAfter === 'zoom') {
            ctx.strokeStyle = `rgba(255, 59, 127, ${1 - p})`;
            ctx.lineWidth = 12 * (1 - p);
            ctx.strokeRect(p * 30, p * 30, W - p * 60, H - p * 60);
          } else if (activeMainClip.transitionAfter === 'slide') {
            ctx.fillStyle = '#000';
            ctx.fillRect(W * (1 - p), 0, W * p, H);
          }
        }
      }

      for (let tIdx = state.pipTracks.length - 1; tIdx >= 0; tIdx--) {
        const track = state.pipTracks[tIdx];
        track.clips.forEach(pClip => {
          const pStart = pClip.start || 0;
          const isBeingTrimmed = activeTrim && activeTrim.item.id === pClip.id;
          if (isBeingTrimmed || (state.currentTime >= pStart && state.currentTime <= pStart + pClip.duration)) {
            const localT = isBeingTrimmed
              ? (activeTrim.edge === 'left' ? 0 : Math.max(0, pClip.duration - 0.02))
              : (state.currentTime - pStart);
            drawVisualClip(ctx, pClip, localT, W, H, true);
          }
        });
      }

      renderAtmosphereEffects(ctx, W, H, state.currentTime);

      const hasAnyPip = state.pipTracks.some(t => t.clips.length > 0);
      if (state.clips.length === 0 && !hasAnyPip && bg.mode === 'solid' && bg.color1 === '#000000') {
        ctx.fillStyle = '#9ca3af';
        ctx.font = "600 13px 'Noto Sans TC', sans-serif";
        ctx.textAlign = 'center';
        ctx.fillText('空白底板（上方軌道覆蓋下方軌道）', W / 2, H / 2 - 10);
        ctx.font = "400 11px 'Noto Sans TC', sans-serif";
        ctx.fillText('請點下方「＋ 匯入主影片」或「＋ 匯入畫中畫」', W / 2, H / 2 + 12);
      }

      state.subtitles.forEach(sub => {
        if (state.currentTime >= sub.start && state.currentTime <= sub.start + sub.duration) {
          ctx.save();
          ctx.font = `700 ${sub.size}px ${sub.font}`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          const sx = sub.x * W;
          const sy = sub.y * H;
          const isVertical = sub.orientation === 'vertical';

          if (!isVertical) {
            const metrics = ctx.measureText(sub.text);
            const padX = 14, padY = 8;
            const boxW = metrics.width + padX * 2;
            const boxH = sub.size + padY * 2;

            if (sub.bg && sub.bg !== 'transparent') {
              ctx.fillStyle = sub.bg;
              ctx.beginPath();
              ctx.roundRect(sx - boxW / 2, sy - boxH / 2, boxW, boxH, 8);
              ctx.fill();
            }
            if (sub.stroke) {
              ctx.lineWidth = 3;
              ctx.strokeStyle = sub.stroke;
              ctx.strokeText(sub.text, sx, sy);
            }
            ctx.fillStyle = sub.color;
            ctx.fillText(sub.text, sx, sy);

            if (sub.id === state.selectedSubId && state.lastSelectedType === 'sub' && !state.isPlaying) {
              ctx.strokeStyle = '#ff3b7f';
              ctx.lineWidth = 1.5;
              ctx.setLineDash([4, 3]);
              ctx.strokeRect(sx - boxW / 2 - 4, sy - boxH / 2 - 4, boxW + 8, boxH + 8);
            }
          } else {
            const lines = sub.text.split(/\n|\|/);
            const charStep = sub.size * 1.12;
            const colStep = sub.size * 1.3;
            const maxChars = Math.max(...lines.map(l => Array.from(l).length), 1);
            const totalW = lines.length * colStep + 18;
            const totalH = maxChars * charStep + 18;

            if (sub.bg && sub.bg !== 'transparent') {
              ctx.fillStyle = sub.bg;
              ctx.beginPath();
              ctx.roundRect(sx - totalW / 2, sy - totalH / 2, totalW, totalH, 8);
              ctx.fill();
            }

            lines.forEach((lineStr, colIdx) => {
              const chars = Array.from(lineStr);
              const colX = sx + ((lines.length - 1) / 2 - colIdx) * colStep;
              chars.forEach((ch, rowIdx) => {
                const charY = sy - ((chars.length - 1) / 2 - rowIdx) * charStep;
                if (sub.stroke) {
                  ctx.lineWidth = 3;
                  ctx.strokeStyle = sub.stroke;
                  ctx.strokeText(ch, colX, charY);
                }
                ctx.fillStyle = sub.color;
                ctx.fillText(ch, colX, charY);
              });
            });

            if (sub.id === state.selectedSubId && state.lastSelectedType === 'sub' && !state.isPlaying) {
              ctx.strokeStyle = '#ff3b7f';
              ctx.lineWidth = 1.5;
              ctx.setLineDash([4, 3]);
              ctx.strokeRect(sx - totalW / 2 - 4, sy - totalH / 2 - 4, totalW + 8, totalH + 8);
            }
          }
          ctx.restore();
        }
      });

      if (activeTrim && (activeTrim.type === 'clip' || activeTrim.type === 'pip' || activeTrim.type === 'audio')) {
        const c = activeTrim.item;
        ctx.save();
        ctx.fillStyle = activeTrim.type === 'audio' ? 'rgba(20, 184, 166, 0.92)' : 'rgba(255, 59, 127, 0.92)';
        ctx.beginPath();
        ctx.roundRect(10, H - 36, 205, 24, 6);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = "700 11px 'Noto Sans TC', sans-serif";
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        const edgeText = activeTrim.edge === 'left'
          ? `裁切起點：${(c.trimStart || 0).toFixed(2)}s（長 ${c.duration.toFixed(1)}s）`
          : `裁切終點：${((c.trimStart || 0) + c.duration * (c.speed || 1)).toFixed(2)}s（長 ${c.duration.toFixed(1)}s）`;
        ctx.fillText(edgeText, 16, H - 24);
        ctx.restore();
      }

      document.getElementById('curTimeLabel').textContent = formatTime(state.currentTime);
      document.getElementById('totTimeLabel').textContent = formatTime(getTotalDuration());
    }

    // ====== 雙向即時裁切（主軌、畫中畫、獨立音軌通用） ======
    let activeTrim = null;

    function formatClipLabel(clip, prefix = '') {
      const trimTag = (clip.trimStart || 0) > 0.05 ? ` [裁${(clip.trimStart).toFixed(1)}s]` : '';
      const speedTag = Math.abs(clip.speed - 1.0) > 0.01 ? ` ${clip.speed > 1 ? '⚡' : '🐢'}${clip.speed}x` : '';
      const muteTag = clip.muted ? ' 🔇' : (Math.abs((clip.audioGain ?? 1) - 1) > 0.05 ? ` 🔊${Math.round(clip.audioGain * 100)}%` : '');
      return `${prefix}${clip.name}${muteTag}${speedTag}${trimTag} (${clip.duration.toFixed(1)}s)`;
    }

    function formatAudioClipLabel(aClip) {
      const trimTag = (aClip.trimStart || 0) > 0.05 ? ` [裁${(aClip.trimStart).toFixed(1)}s]` : '';
      const muteTag = aClip.muted ? '🔇' : `🎵 ${Math.round((aClip.gain ?? 1) * 100)}%`;
      const srcTag = aClip.fromVideo ? '[影轉音] ' : '';
      return `${muteTag} ${srcTag}${aClip.name}${trimTag} (${aClip.duration.toFixed(1)}s)`;
    }

    function attachTrimEvents(handleEl, type, item, edge, blockEl, labelEl, isPip = false) {
      handleEl.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        e.preventDefault();
        cancelLongPress();
        if (state.isPlaying) togglePlay(false);
        pushUndo();

        handleEl.setPointerCapture(e.pointerId);
        handleEl.classList.add('active');
        activeTrim = {
          type,
          isPip,
          item,
          edge,
          startX: e.clientX,
          origTrimStart: item.trimStart || 0,
          origStart: item.start || 0,
          origDur: item.duration,
          handleEl,
          blockEl,
          labelEl
        };

        if ((type === 'clip' || type === 'pip') && item.mediaEl && item.mediaEl.tagName === 'VIDEO') {
          const target = edge === 'left'
            ? (item.trimStart || 0)
            : (item.trimStart || 0) + item.duration * item.speed - 0.02;
          requestVideoSeek(item.mediaEl, target);
        }
        renderFrame();
      });

      handleEl.addEventListener('pointermove', (e) => {
        if (!activeTrim || activeTrim.handleEl !== handleEl) return;
        e.stopPropagation();
        const deltaSec = (e.clientX - activeTrim.startX) / state.pxPerSec;

        if (activeTrim.type === 'clip' || activeTrim.type === 'pip') {
          const maxTotal = item.maxDuration || 120;
          const spd = item.speed || 1.0;

          if (edge === 'left') {
            const minDelta = isPip ? -activeTrim.origStart : -(activeTrim.origTrimStart / spd);
            const maxDelta = activeTrim.origDur - 0.3;
            const clampedDelta = Math.max(minDelta, Math.min(maxDelta, deltaSec));

            if (isPip) {
              item.start = activeTrim.origStart + clampedDelta;
              item.trimStart = Math.max(0, activeTrim.origTrimStart + clampedDelta * spd);
            } else {
              item.trimStart = activeTrim.origTrimStart + clampedDelta * spd;
            }
            item.duration = activeTrim.origDur - clampedDelta;

            if (item.mediaEl && item.mediaEl.tagName === 'VIDEO') {
              requestVideoSeek(item.mediaEl, item.trimStart);
            }
          } else if (edge === 'right') {
            const maxAvailDur = item.mediaType === 'image'
              ? 120
              : Math.max(0.3, (maxTotal - (item.trimStart || 0)) / spd);
            item.duration = Math.max(0.3, Math.min(maxAvailDur, activeTrim.origDur + deltaSec));

            if (item.mediaEl && item.mediaEl.tagName === 'VIDEO') {
              const endTarget = (item.trimStart || 0) + item.duration * spd - 0.02;
              requestVideoSeek(item.mediaEl, endTarget);
            }
          }

          if (blockEl) {
            if (isPip) blockEl.style.left = ((item.start || 0) * state.pxPerSec) + 'px';
            blockEl.style.width = (item.duration * state.pxPerSec) + 'px';
          }
          if (labelEl) labelEl.textContent = formatClipLabel(item);
          renderFrame();
        } else if (activeTrim.type === 'audio') {
          const maxTotal = item.maxDuration || 300;
          if (edge === 'left') {
            // 往右拉裁切音訊開頭並順移起點，往左拉還原
            const minDelta = -Math.min(activeTrim.origStart, activeTrim.origTrimStart);
            const maxDelta = activeTrim.origDur - 0.3;
            const clampedDelta = Math.max(minDelta, Math.min(maxDelta, deltaSec));

            item.start = Math.max(0, activeTrim.origStart + clampedDelta);
            item.trimStart = Math.max(0, activeTrim.origTrimStart + clampedDelta);
            item.duration = activeTrim.origDur - clampedDelta;
          } else if (edge === 'right') {
            const maxAvailDur = Math.max(0.3, maxTotal - (item.trimStart || 0));
            item.duration = Math.max(0.3, Math.min(maxAvailDur, activeTrim.origDur + deltaSec));
          }
          if (blockEl) {
            blockEl.style.left = ((item.start || 0) * state.pxPerSec) + 'px';
            blockEl.style.width = (item.duration * state.pxPerSec) + 'px';
          }
          if (labelEl) labelEl.textContent = formatAudioClipLabel(item);
          renderFrame();
        } else if (activeTrim.type === 'sub') {
          if (edge === 'right') {
            item.duration = Math.max(0.4, activeTrim.origDur + deltaSec);
          } else if (edge === 'left') {
            const maxShift = activeTrim.origDur - 0.4;
            const shift = Math.max(-activeTrim.origStart, Math.min(maxShift, deltaSec));
            item.start = activeTrim.origStart + shift;
            item.duration = activeTrim.origDur - shift;
          }
          if (blockEl) {
            blockEl.style.left = (item.start * state.pxPerSec) + 'px';
            blockEl.style.width = (item.duration * state.pxPerSec) + 'px';
          }
          if (labelEl) labelEl.textContent = `T ${item.text} (${item.duration.toFixed(1)}s)`;
          renderFrame();
        }
      });

      const finishTrim = (e) => {
        if (!activeTrim || activeTrim.handleEl !== handleEl) return;
        e.stopPropagation();
        handleEl.classList.remove('active');
        activeTrim = null;
        showToast(`已裁切片段長度：${item.duration.toFixed(1)} 秒`);
        renderTimeline();
        renderDrawer();
        syncVideoElements(true);
        renderFrame();
      };

      handleEl.addEventListener('pointerup', finishTrim);
      handleEl.addEventListener('pointercancel', finishTrim);
    }

    // ====== 長按片段拖曳（主軌 <-> 畫中畫軌，或音訊軌左右移動出現位置） ======
    let longPressTimer = null;
    let reorderState = null;

    function cancelLongPress() {
      if (longPressTimer) {
        clearTimeout(longPressTimer);
        longPressTimer = null;
      }
    }

    function startClipLongPress(e, clip, sourceType, sourceTrackId = null) {
      if (e.target.closest('.trim-handle') || activeTrim) return;

      cancelLongPress();
      const startX = e.clientX;
      const startY = e.clientY;

      longPressTimer = setTimeout(() => {
        isDraggingTimeline = false;
        timelineScroll.classList.remove('grabbing');

        pushUndo();
        reorderState = {
          clipId: clip.id,
          sourceType, // 'main' | 'pip' | 'audio'
          sourceTrackId,
          startX,
          startY,
          origStart: clip.start || 0
        };

        if (sourceType === 'audio') {
          state.selectedAudioId = clip.id;
          state.lastSelectedType = 'audio';
          showToast('已啟動音軌移動：左右拖曳對齊時間位置 ↔️');
        } else {
          state.selectedClipId = clip.id;
          state.lastSelectedType = sourceType === 'pip' ? 'pip' : 'clip';
          showToast('已啟動跨軌拖曳：上下拖轉畫中畫，左右拖調順序 ↕️↔️');
        }
        updateDeleteButtonLabel();
        if (navigator.vibrate) navigator.vibrate(25);
        renderTimeline();
      }, 220);
    }

    window.addEventListener('pointermove', (e) => {
      if (longPressTimer && !reorderState) {
        if (Math.hypot(e.clientX - dragStartX, e.clientY - dragStartY) > 10) {
          cancelLongPress();
        }
      }

      if (!reorderState) return;
      e.preventDefault();

      // 若是獨立音訊條，左右拖動自由改變出現秒數 start
      if (reorderState.sourceType === 'audio') {
        const aClip = state.audioClips.find(a => a.id === reorderState.clipId);
        if (aClip) {
          const dxSec = (e.clientX - reorderState.startX) / state.pxPerSec;
          aClip.start = Math.max(0, reorderState.origStart + dxSec);
          const blockEl = document.querySelector(`.audio-clip-block[data-audio-id="${aClip.id}"]`);
          if (blockEl) blockEl.style.left = (aClip.start * state.pxPerSec) + 'px';
          renderFrame();
        }
        return;
      }

      const trackEls = document.querySelectorAll('#tracksContainer .track-row[data-track-kind]');
      trackEls.forEach(el => el.classList.remove('drop-target'));

      let hoveredTrackEl = null;
      trackEls.forEach(el => {
        const rect = el.getBoundingClientRect();
        if (e.clientY >= rect.top - 8 && e.clientY <= rect.bottom + 8) {
          hoveredTrackEl = el;
          el.classList.add('drop-target');
        }
      });

      if (reorderState.sourceType === 'pip') {
        const tr = state.pipTracks.find(t => t.id === reorderState.sourceTrackId);
        const pClip = tr?.clips.find(c => c.id === reorderState.clipId);
        if (pClip) {
          const dxSec = (e.clientX - reorderState.startX) / state.pxPerSec;
          pClip.start = Math.max(0, reorderState.origStart + dxSec);
          const blockEl = document.querySelector(`.clip-block[data-clip-id="${pClip.id}"]`);
          if (blockEl) blockEl.style.left = (pClip.start * state.pxPerSec) + 'px';
          renderFrame();
        }
      }

      if (reorderState.sourceType === 'main' && (!hoveredTrackEl || hoveredTrackEl.dataset.trackKind === 'main')) {
        const curIdx = state.clips.findIndex(c => c.id === reorderState.clipId);
        const clipEls = document.querySelectorAll('#mainVideoTrack .clip-block');
        if (curIdx > 0 && clipEls[curIdx - 1]) {
          const prevRect = clipEls[curIdx - 1].getBoundingClientRect();
          if (e.clientX < prevRect.left + prevRect.width / 2) {
            [state.clips[curIdx - 1], state.clips[curIdx]] = [state.clips[curIdx], state.clips[curIdx - 1]];
            renderTimeline();
            renderFrame();
          }
        } else if (curIdx >= 0 && curIdx < state.clips.length - 1 && clipEls[curIdx + 1]) {
          const nextRect = clipEls[curIdx + 1].getBoundingClientRect();
          if (e.clientX > nextRect.left + nextRect.width / 2) {
            [state.clips[curIdx + 1], state.clips[curIdx]] = [state.clips[curIdx], state.clips[curIdx + 1]];
            renderTimeline();
            renderFrame();
          }
        }
      }
    }, { passive: false });

    const endReorder = (e) => {
      cancelLongPress();
      if (!reorderState) return;

      if (reorderState.sourceType === 'audio') {
        reorderState = null;
        renderTimeline();
        renderDrawer();
        syncVideoElements(true);
        showToast('已更新音軌時間位置 ✅');
        return;
      }

      const dropEl = document.querySelector('#tracksContainer .track-row.drop-target');
      const targetKind = dropEl?.dataset.trackKind;
      const targetTrackId = dropEl?.dataset.trackId;

      let draggedClip = null;
      if (reorderState.sourceType === 'main') {
        const idx = state.clips.findIndex(c => c.id === reorderState.clipId);
        if (idx !== -1 && targetKind === 'pip') {
          draggedClip = state.clips.splice(idx, 1)[0];
        }
      } else if (reorderState.sourceType === 'pip') {
        const srcTr = state.pipTracks.find(t => t.id === reorderState.sourceTrackId);
        const idx = srcTr ? srcTr.clips.findIndex(c => c.id === reorderState.clipId) : -1;
        if (idx !== -1 && (targetKind === 'main' || (targetKind === 'pip' && targetTrackId !== reorderState.sourceTrackId))) {
          draggedClip = srcTr.clips.splice(idx, 1)[0];
        }
      }

      if (draggedClip) {
        if (targetKind === 'pip') {
          const destTrack = state.pipTracks.find(t => t.id === targetTrackId) || state.pipTracks[0];
          draggedClip.start = Math.max(0, state.currentTime);
          destTrack.clips.push(draggedClip);
          state.lastSelectedType = 'pip';
          state.selectedClipId = draggedClip.id;
          showToast(`已移至「${destTrack.name}」（覆蓋下方圖層）🖼️`);
        } else if (targetKind === 'main') {
          state.clips.push(draggedClip);
          state.lastSelectedType = 'clip';
          state.selectedClipId = draggedClip.id;
          showToast('已移回主影片軌道 🎞️');
        }
      } else if (e && e.clientY < timelineScroll.getBoundingClientRect().top + 24 && reorderState.sourceType === 'main') {
        const idx = state.clips.findIndex(c => c.id === reorderState.clipId);
        if (idx !== -1) {
          const moved = state.clips.splice(idx, 1)[0];
          const newTrackId = 'pip-track-' + Date.now();
          const layerNum = state.pipTracks.length + 1;
          state.pipTracks.unshift({
            id: newTrackId,
            name: `畫中畫 L${layerNum} (最頂層)`,
            clips: [{ ...moved, start: Math.max(0, state.currentTime) }]
          });
          state.lastSelectedType = 'pip';
          state.selectedClipId = moved.id;
          showToast(`已自動新增最上層畫中畫軌道 L${layerNum} ✨`);
        }
      }

      reorderState = null;
      updateDeleteButtonLabel();
      renderTimeline();
      renderDrawer();
      syncVideoElements(true);
      renderFrame();
    };

    window.addEventListener('pointerup', endReorder);
    window.addEventListener('pointercancel', endReorder);

    // ====== 渲染多層時間軸 ======
    function renderTimeline() {
      const pps = state.pxPerSec;
      const total = getTotalDuration();
      const displaySec = Math.max(total + 5, 15);
      const totalPx = displaySec * pps;
      const ruler = document.getElementById('ruler');
      ruler.style.width = totalPx + 'px';
      ruler.innerHTML = '';

      const step = pps < 25 ? 5 : (pps < 40 ? 2 : (pps > 110 ? 0.5 : 1));
      for (let s = 0; s <= Math.ceil(displaySec); s += step) {
        const mark = document.createElement('div');
        mark.style.position = 'absolute';
        mark.style.left = (s * pps) + 'px';
        mark.textContent = Number.isInteger(s) ? `${s}s` : `${s.toFixed(1)}s`;
        ruler.appendChild(mark);
      }

      const container = document.getElementById('tracksContainer');
      container.innerHTML = '';

      // 1. 畫中畫軌道
      state.pipTracks.forEach((pTrack, tIdx) => {
        const row = document.createElement('div');
        row.className = 'track-row pip-track';
        row.dataset.trackKind = 'pip';
        row.dataset.trackId = pTrack.id;

        const badge = document.createElement('span');
        badge.className = 'track-badge';
        badge.style.color = '#d8b4fe';
        badge.textContent = `頂層${tIdx + 1}`;
        row.appendChild(badge);

        if (pTrack.clips.length === 0) {
          const hint = document.createElement('div');
          hint.className = 'empty-track-hint';
          hint.textContent = `＋ 匯入畫中畫素材（或長按下方影片往上拖至此層）`;
          hint.onclick = () => {
            if (timelineWasDragged) return;
            window._targetPipTrackId = pTrack.id;
            document.getElementById('pipFileInput').click();
          };
          row.appendChild(hint);
        } else {
          pTrack.clips.forEach(pClip => {
            const isSel = pClip.id === state.selectedClipId && state.lastSelectedType === 'pip';
            const isReordering = reorderState && reorderState.clipId === pClip.id;
            const el = document.createElement('div');
            el.className = 'clip-block pip-clip' + (isSel ? ' selected' : '') + (isReordering ? ' reordering' : '');
            el.dataset.clipId = pClip.id;
            el.style.left = ((pClip.start || 0) * pps) + 'px';
            el.style.width = (pClip.duration * pps) + 'px';

            const leftHandle = document.createElement('div');
            leftHandle.className = 'trim-handle left';
            const labelSpan = document.createElement('span');
            labelSpan.className = 'clip-label';
            labelSpan.textContent = formatClipLabel(pClip);
            const rightHandle = document.createElement('div');
            rightHandle.className = 'trim-handle right';

            attachTrimEvents(leftHandle, 'pip', pClip, 'left', el, labelSpan, true);
            attachTrimEvents(rightHandle, 'pip', pClip, 'right', el, labelSpan, true);

            el.appendChild(leftHandle);
            el.appendChild(labelSpan);
            el.appendChild(rightHandle);

            el.addEventListener('pointerdown', (e) => {
              startClipLongPress(e, pClip, 'pip', pTrack.id);
            });

            el.onclick = () => {
              if (timelineWasDragged || reorderState) return;
              state.selectedClipId = pClip.id;
              state.lastSelectedType = 'pip';
              updateDeleteButtonLabel();
              renderTimeline();
              renderDrawer();
              renderFrame();
            };

            (pClip.keyframes || []).forEach(kf => {
              const d = document.createElement('div');
              d.className = 'kf-diamond';
              d.style.left = (kf.t * pps) + 'px';
              el.appendChild(d);
            });

            row.appendChild(el);
          });
        }
        container.appendChild(row);
      });

      // 2. 主影片軌道
      const vTrack = document.createElement('div');
      vTrack.id = 'mainVideoTrack';
      vTrack.className = 'track-row main-track';
      vTrack.dataset.trackKind = 'main';

      const mainBadge = document.createElement('span');
      mainBadge.className = 'track-badge';
      mainBadge.style.color = '#93c5fd';
      mainBadge.textContent = '主軌';
      vTrack.appendChild(mainBadge);

      if (state.clips.length === 0) {
        const emptyBtn = document.createElement('div');
        emptyBtn.className = 'empty-track-hint';
        emptyBtn.textContent = '＋ 點此匯入主影片／圖片';
        emptyBtn.onclick = () => { if (!timelineWasDragged) document.getElementById('videoFileInput').click(); };
        vTrack.appendChild(emptyBtn);
      } else {
        state.clips.forEach((clip, idx) => {
          const isSel = clip.id === state.selectedClipId && state.lastSelectedType === 'clip';
          const isReordering = reorderState && reorderState.clipId === clip.id;
          const el = document.createElement('div');
          el.className = 'clip-block' + (isSel ? ' selected' : '') + (isReordering ? ' reordering' : '');
          el.dataset.clipId = clip.id;
          el.style.width = (clip.duration * pps) + 'px';

          const leftHandle = document.createElement('div');
          leftHandle.className = 'trim-handle left';
          const labelSpan = document.createElement('span');
          labelSpan.className = 'clip-label';
          labelSpan.textContent = formatClipLabel(clip, `#${idx + 1} `);
          const rightHandle = document.createElement('div');
          rightHandle.className = 'trim-handle right';

          attachTrimEvents(leftHandle, 'clip', clip, 'left', el, labelSpan, false);
          attachTrimEvents(rightHandle, 'clip', clip, 'right', el, labelSpan, false);

          el.appendChild(leftHandle);
          el.appendChild(labelSpan);
          el.appendChild(rightHandle);

          el.addEventListener('pointerdown', (e) => {
            startClipLongPress(e, clip, 'main');
          });

          el.onclick = () => {
            if (timelineWasDragged || reorderState) return;
            state.selectedClipId = clip.id;
            state.lastSelectedType = 'clip';
            updateDeleteButtonLabel();
            renderTimeline();
            renderDrawer();
            renderFrame();
          };

          (clip.keyframes || []).forEach(kf => {
            const d = document.createElement('div');
            d.className = 'kf-diamond';
            d.style.left = (kf.t * pps) + 'px';
            el.appendChild(d);
          });

          vTrack.appendChild(el);

          if (idx < state.clips.length - 1) {
            const trBtn = document.createElement('div');
            trBtn.className = 'trans-node';
            const trObj = TRANSITIONS.find(t => t.id === clip.transitionAfter) || TRANSITIONS[0];
            trBtn.textContent = trObj.icon;
            trBtn.title = '切換轉場特效';
            trBtn.onclick = (e) => {
              e.stopPropagation();
              if (timelineWasDragged || reorderState) return;
              pushUndo();
              const curIdx = TRANSITIONS.findIndex(t => t.id === clip.transitionAfter);
              const next = TRANSITIONS[(curIdx + 1) % TRANSITIONS.length];
              clip.transitionAfter = next.id;
              showToast(`已切換轉場：${next.name}`);
              renderTimeline();
              renderFrame();
            };
            vTrack.appendChild(trBtn);
          }
        });
      }
      container.appendChild(vTrack);

      // 3. 獨立音訊軌道（多段獨立音軌：支援頭尾裁切、左右移動對齊、增益放大與影片轉音軌）
      const aTrack = document.createElement('div');
      aTrack.className = 'track-row audio-track';
      const audBadge = document.createElement('span');
      audBadge.className = 'track-badge';
      audBadge.style.color = '#6ee7b7';
      audBadge.textContent = '音軌';
      aTrack.appendChild(audBadge);

      if (state.audioClips.length === 0) {
        const emptyAudio = document.createElement('div');
        emptyAudio.className = 'empty-track-hint';
        emptyAudio.textContent = '＋ 點此插入音樂 或「匯入影片轉音軌」';
        emptyAudio.onclick = () => {
          if (timelineWasDragged) return;
          state.activeTab = 'audio';
          updateTabsUI();
          renderDrawer();
        };
        aTrack.appendChild(emptyAudio);
      } else {
        state.audioClips.forEach(aClip => {
          const isSel = aClip.id === state.selectedAudioId && state.lastSelectedType === 'audio';
          const isReordering = reorderState && reorderState.clipId === aClip.id;
          const aEl = document.createElement('div');
          aEl.className = 'audio-clip-block' + (isSel ? ' selected' : '') + (isReordering ? ' reordering' : '');
          aEl.dataset.audioId = aClip.id;
          aEl.style.left = ((aClip.start || 0) * pps) + 'px';
          aEl.style.width = (aClip.duration * pps) + 'px';

          const leftHandle = document.createElement('div');
          leftHandle.className = 'trim-handle left';
          const labelSpan = document.createElement('span');
          labelSpan.className = 'clip-label';
          labelSpan.textContent = formatAudioClipLabel(aClip);
          const rightHandle = document.createElement('div');
          rightHandle.className = 'trim-handle right';

          attachTrimEvents(leftHandle, 'audio', aClip, 'left', aEl, labelSpan, false);
          attachTrimEvents(rightHandle, 'audio', aClip, 'right', aEl, labelSpan, false);

          aEl.appendChild(leftHandle);
          aEl.appendChild(labelSpan);
          aEl.appendChild(rightHandle);

          aEl.addEventListener('pointerdown', (e) => {
            startClipLongPress(e, aClip, 'audio');
          });

          aEl.onclick = () => {
            if (timelineWasDragged || reorderState) return;
            state.selectedAudioId = aClip.id;
            state.lastSelectedType = 'audio';
            state.activeTab = 'audio';
            updateTabsUI();
            updateDeleteButtonLabel();
            renderTimeline();
            renderDrawer();
          };
          aTrack.appendChild(aEl);
        });
      }
      container.appendChild(aTrack);

      // 4. 字幕軌道
      const sTrack = document.createElement('div');
      sTrack.className = 'track-row';
      const subBadge = document.createElement('span');
      subBadge.className = 'track-badge';
      subBadge.style.color = '#f9a8d4';
      subBadge.textContent = '字幕';
      sTrack.appendChild(subBadge);

      if (state.subtitles.length === 0) {
        const emptySub = document.createElement('div');
        emptySub.className = 'empty-track-hint';
        emptySub.textContent = '＋ 點此新增字幕（支援橫排 / 直式書寫）';
        emptySub.onclick = () => { if (!timelineWasDragged) addNewSubtitle(); };
        sTrack.appendChild(emptySub);
      } else {
        state.subtitles.forEach(sub => {
          const isSel = sub.id === state.selectedSubId && state.lastSelectedType === 'sub';
          const el = document.createElement('div');
          el.className = 'sub-block' + (isSel ? ' selected' : '');
          el.style.left = (sub.start * pps) + 'px';
          el.style.width = (sub.duration * pps) + 'px';

          const leftHandle = document.createElement('div');
          leftHandle.className = 'trim-handle left';
          const labelSpan = document.createElement('span');
          labelSpan.className = 'clip-label';
          const dirTag = sub.orientation === 'vertical' ? '[直]' : '[橫]';
          labelSpan.textContent = `${dirTag} ${sub.text} (${sub.duration.toFixed(1)}s)`;
          const rightHandle = document.createElement('div');
          rightHandle.className = 'trim-handle right';

          attachTrimEvents(leftHandle, 'sub', sub, 'left', el, labelSpan);
          attachTrimEvents(rightHandle, 'sub', sub, 'right', el, labelSpan);

          el.appendChild(leftHandle);
          el.appendChild(labelSpan);
          el.appendChild(rightHandle);

          el.onclick = () => {
            if (timelineWasDragged) return;
            state.selectedSubId = sub.id;
            state.lastSelectedType = 'sub';
            state.activeTab = 'text';
            updateTabsUI();
            updateDeleteButtonLabel();
            renderTimeline();
            renderDrawer();
            renderFrame();
          };
          sTrack.appendChild(el);
        });
      }
      container.appendChild(sTrack);
    }

    // ====== 按住時間軸軌道直接左右拖曳 ======
    let isDraggingTimeline = false;
    let timelineWasDragged = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let dragStartScrollLeft = 0;

    timelineScroll.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.trim-handle') || activeTrim || reorderState) return;
      if (state.isPlaying) togglePlay(false);

      isDraggingTimeline = true;
      timelineWasDragged = false;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      dragStartScrollLeft = timelineScroll.scrollLeft;
      timelineScroll.classList.add('grabbing');
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDraggingTimeline || activeTrim || reorderState) return;
      const dx = e.clientX - dragStartX;
      if (Math.abs(dx) > 5) {
        timelineWasDragged = true;
      }
      const nextScroll = Math.max(0, dragStartScrollLeft - dx);
      timelineScroll.scrollLeft = nextScroll;

      const t = Math.max(0, Math.min(getTotalDuration(), nextScroll / state.pxPerSec));
      state.currentTime = t;
      document.getElementById('curTimeLabel').textContent = formatTime(t);
      syncVideoElements(true);
      renderFrame();
    });

    window.addEventListener('pointerup', () => {
      if (!isDraggingTimeline) return;
      isDraggingTimeline = false;
      timelineScroll.classList.remove('grabbing');
      setTimeout(() => { timelineWasDragged = false; }, 30);
    });

    document.getElementById('ruler').addEventListener('click', (e) => {
      if (timelineWasDragged || reorderState) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      seekTo(clickX / state.pxPerSec);
    });

    timelineScroll.addEventListener('wheel', (e) => {
      if (reorderState) return;
      if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
        e.preventDefault();
        timelineScroll.scrollLeft += e.deltaY;
      }
    }, { passive: false });

    // ====== 即時同步所有圖層的影像與音訊（含原聲靜音/增益與獨立音軌） ======
    function syncVideoElements(immediate = false) {
      if (activeTrim) return;

      // 1. 主影片軌道（影像 + 原聲增益控制）
      let acc = 0;
      state.clips.forEach(c => {
        if (c.mediaEl && c.mediaEl.tagName === 'VIDEO') {
          c.mediaEl.playbackRate = c.speed || 1.0;
          applyMediaAudioGain(c.mediaEl, c.muted, c.audioGain ?? 1.0);
          if (state.currentTime >= acc && state.currentTime <= acc + c.duration) {
            const offset = c.trimStart || 0;
            const targetT = Math.max(0.01, offset + (state.currentTime - acc) * c.speed);
            if (immediate) requestVideoSeek(c.mediaEl, targetT);
            else if (Math.abs(c.mediaEl.currentTime - targetT) > 0.18) c.mediaEl.currentTime = targetT;
          } else {
            if (!c.mediaEl.paused) c.mediaEl.pause();
          }
        }
        acc += c.duration;
      });

      // 2. 所有畫中畫軌道
      state.pipTracks.forEach(tr => {
        tr.clips.forEach(pClip => {
          if (pClip.mediaEl && pClip.mediaEl.tagName === 'VIDEO') {
            pClip.mediaEl.playbackRate = pClip.speed || 1.0;
            applyMediaAudioGain(pClip.mediaEl, pClip.muted, pClip.audioGain ?? 1.0);
            const pStart = pClip.start || 0;
            if (state.currentTime >= pStart && state.currentTime <= pStart + pClip.duration) {
              const offset = pClip.trimStart || 0;
              const targetT = Math.max(0.01, offset + (state.currentTime - pStart) * pClip.speed);
              if (immediate) requestVideoSeek(pClip.mediaEl, targetT);
              else if (Math.abs(pClip.mediaEl.currentTime - targetT) > 0.18) pClip.mediaEl.currentTime = targetT;
            } else {
              if (!pClip.mediaEl.paused) pClip.mediaEl.pause();
            }
          }
        });
      });

      // 3. 獨立音訊軌道（支援多段音訊與「影片轉音軌」片段同步）
      state.audioClips.forEach(aClip => {
        if (!aClip.mediaEl) return;
        applyMediaAudioGain(aClip.mediaEl, aClip.muted, aClip.gain ?? 1.0);
        const aStart = aClip.start || 0;
        if (state.currentTime >= aStart && state.currentTime <= aStart + aClip.duration) {
          const offset = aClip.trimStart || 0;
          const targetT = Math.max(0.01, offset + (state.currentTime - aStart));
          if (Math.abs(aClip.mediaEl.currentTime - targetT) > 0.18) {
            aClip.mediaEl.currentTime = Math.min(aClip.mediaEl.duration || 999, targetT);
          }
          if (state.isPlaying && aClip.mediaEl.paused) {
            aClip.mediaEl.play().catch(() => {});
          }
        } else {
          if (!aClip.mediaEl.paused) aClip.mediaEl.pause();
        }
      });

      // 4. 自訂背景影片（固定靜音）
      if (state.background.mode === 'custom' && state.background.mediaEl?.tagName === 'VIDEO') {
        const bgVid = state.background.mediaEl;
        bgVid.muted = true;
        const dur = bgVid.duration || 10;
        const targetT = state.currentTime % dur;
        if (immediate) requestVideoSeek(bgVid, targetT);
      }
    }

    // ====== 畫布互動 ======
    let draggingCanvasItem = null;

    function getClipLocalTime(clip, isPip) {
      if (isPip) {
        return Math.max(0, Math.min(clip.duration, state.currentTime - (clip.start || 0)));
      }
      let acc = 0;
      for (const c of state.clips) {
        if (c.id === clip.id) {
          return Math.max(0, Math.min(c.duration, state.currentTime - acc));
        }
        acc += c.duration;
      }
      return 0;
    }

    function upsertClipKeyframe(clip, localT, patch) {
      if (!clip.keyframes) clip.keyframes = [];
      let existing = clip.keyframes.find(k => Math.abs(k.t - localT) < 0.2);
      if (!existing) {
        const curTr = getInterpolatedTransform(clip, localT);
        existing = { t: localT, ...curTr };
        clip.keyframes.push(existing);
      }
      Object.assign(existing, patch);
    }

    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const normX = (e.clientX - rect.left) / rect.width;
      const normY = (e.clientY - rect.top) / rect.height;
      const canvasX = normX * canvas.width;
      const canvasY = normY * canvas.height;

      const sel = getSelectedVisualClip();

      if (state.eyedropperMode && sel) {
        const px = ctx.getImageData(Math.round(canvasX), Math.round(canvasY), 1, 1).data;
        const hex = '#' + [px[0], px[1], px[2]].map(v => v.toString(16).padStart(2, '0')).join('');
        sel.clip.cutout.keyColor = hex;
        state.eyedropperMode = false;
        showToast(`已吸取去背顏色：${hex}`);
        renderDrawer();
        renderFrame();
        return;
      }

      if (state.penEditMode && sel) {
        pushUndo();
        if (!sel.clip.mask.penPoints) sel.clip.mask.penPoints = [];
        sel.clip.mask.penPoints.push({ x: normX, y: normY });
        showToast(`已加入第 ${sel.clip.mask.penPoints.length} 個鋼筆錨點（滿 3 點自動裁切）`);
        renderDrawer();
        renderFrame();
        return;
      }

      if (state.activeTab === 'text' && state.selectedSubId) {
        const sub = state.subtitles.find(s => s.id === state.selectedSubId);
        if (sub) {
          draggingCanvasItem = { type: 'sub', sub };
          state.lastSelectedType = 'sub';
          updateDeleteButtonLabel();
          updateSubPos(e, sub);
          return;
        }
      }

      if (sel) {
        pushUndo();
        const localT = getClipLocalTime(sel.clip, sel.isPip);
        const curTr = getInterpolatedTransform(sel.clip, localT);
        draggingCanvasItem = {
          type: 'clip',
          clip: sel.clip,
          isPip: sel.isPip,
          localT,
          startX: e.clientX,
          startY: e.clientY,
          origX: curTr.x,
          origY: curTr.y
        };
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!draggingCanvasItem) return;
      if (draggingCanvasItem.type === 'sub') {
        updateSubPos(e, draggingCanvasItem.sub);
      } else if (draggingCanvasItem.type === 'clip') {
        const rect = canvas.getBoundingClientRect();
        const scaleRatioX = canvas.width / rect.width;
        const scaleRatioY = canvas.height / rect.height;
        const dx = (e.clientX - draggingCanvasItem.startX) * scaleRatioX;
        const dy = (e.clientY - draggingCanvasItem.startY) * scaleRatioY;

        upsertClipKeyframe(draggingCanvasItem.clip, draggingCanvasItem.localT, {
          x: draggingCanvasItem.origX + dx,
          y: draggingCanvasItem.origY + dy
        });
        renderTimeline();
        renderDrawer();
        renderFrame();
      }
    });

    window.addEventListener('pointerup', () => {
      if (draggingCanvasItem?.type === 'clip') {
        showToast(`已在 ${draggingCanvasItem.localT.toFixed(1)}s 記錄位移關鍵幀 ◆`);
      }
      draggingCanvasItem = null;
    });

    canvas.addEventListener('wheel', (e) => {
      const sel = getSelectedVisualClip();
      if (!sel) return;
      e.preventDefault();
      const localT = getClipLocalTime(sel.clip, sel.isPip);
      const curTr = getInterpolatedTransform(sel.clip, localT);
      const nextScale = Math.max(0.1, Math.min(4.0, curTr.scale + (e.deltaY < 0 ? 0.06 : -0.06)));
      upsertClipKeyframe(sel.clip, localT, { scale: nextScale });
      renderTimeline();
      renderDrawer();
      renderFrame();
    }, { passive: false });

    function updateSubPos(e, sub) {
      const rect = canvas.getBoundingClientRect();
      sub.x = Math.max(0.05, Math.min(0.95, (e.clientX - rect.left) / rect.width));
      sub.y = Math.max(0.05, Math.min(0.95, (e.clientY - rect.top) / rect.height));
      renderFrame();
    }

    // ====== 刪除目前選取項目 ======
    function deleteCurrentSelected() {
      if (state.lastSelectedType === 'sub' && state.selectedSubId) {
        const target = state.subtitles.find(s => s.id === state.selectedSubId);
        if (target) {
          pushUndo();
          state.subtitles = state.subtitles.filter(s => s.id !== target.id);
          state.selectedSubId = state.subtitles[0]?.id || null;
          state.lastSelectedType = state.selectedSubId ? 'sub' : 'clip';
          updateDeleteButtonLabel();
          showToast('已刪除選取字幕 🗑️');
          renderTimeline(); renderDrawer(); renderFrame();
          return;
        }
      }

      if (state.lastSelectedType === 'audio' && state.selectedAudioId) {
        const target = state.audioClips.find(a => a.id === state.selectedAudioId);
        if (target) {
          pushUndo();
          if (target.mediaEl) target.mediaEl.pause();
          state.audioClips = state.audioClips.filter(a => a.id !== target.id);
          state.selectedAudioId = state.audioClips[0]?.id || null;
          state.lastSelectedType = state.selectedAudioId ? 'audio' : 'clip';
          updateDeleteButtonLabel();
          showToast('已刪除選取音軌片段 🗑️');
          renderTimeline(); renderDrawer();
          return;
        }
      }

      if (state.lastSelectedType === 'pip' && state.selectedClipId) {
        for (const tr of state.pipTracks) {
          const found = tr.clips.find(c => c.id === state.selectedClipId);
          if (found) {
            pushUndo();
            if (found.mediaEl?.tagName === 'VIDEO') found.mediaEl.pause();
            tr.clips = tr.clips.filter(c => c.id !== found.id);
            state.selectedClipId = state.clips[0]?.id || null;
            state.lastSelectedType = 'clip';
            updateDeleteButtonLabel();
            showToast('已刪除畫中畫素材 🗑️');
            renderTimeline(); renderDrawer(); renderFrame();
            return;
          }
        }
      }

      if (state.clips.length > 0 && state.selectedClipId) {
        const found = state.clips.find(c => c.id === state.selectedClipId);
        if (found?.mediaEl?.tagName === 'VIDEO') found.mediaEl.pause();
        pushUndo();
        state.clips = state.clips.filter(c => c.id !== state.selectedClipId);
        state.selectedClipId = state.clips[0]?.id || null;
        updateDeleteButtonLabel();
        showToast('已刪除影片片段 🗑️');
        renderTimeline(); renderDrawer(); renderFrame();
        return;
      }

      showToast('請先點選要刪除的片段、音軌或字幕');
    }

    document.getElementById('deleteSelectedBtn').onclick = deleteCurrentSelected;

    // 清空全部軌道
    document.getElementById('clearAllBtn').onclick = () => {
      pushUndo();
      state.clips.forEach(c => { if (c.mediaEl?.tagName === 'VIDEO') c.mediaEl.pause(); });
      state.audioClips.forEach(a => { if (a.mediaEl) a.mediaEl.pause(); });
      state.clips = [];
      state.pipTracks = [{ id: 'pip-track-1', name: '畫中畫 L1 (頂層)', clips: [] }];
      state.subtitles = [];
      state.audioClips = [];
      state.selectedClipId = null;
      state.selectedSubId = null;
      state.selectedAudioId = null;
      state.lastSelectedType = 'clip';
      state.currentTime = 0;
      timelineScroll.scrollLeft = 0;
      updateDeleteButtonLabel();
      renderTimeline();
      renderDrawer();
      renderFrame();
      showToast('已清空所有軌道 🧹');
    };

    // ====== 電腦鍵盤快捷鍵監聽 ======
    window.addEventListener('keydown', (e) => {
      const tag = document.activeElement?.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

      if (e.code === 'Space') {
        e.preventDefault();
        togglePlay();
      }
      else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
        e.preventDefault();
        undoLastAction();
      }
      else if (((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'b') || e.key.toLowerCase() === 's') {
        e.preventDefault();
        splitAtPlayhead();
      }
      else if (e.key === 'Delete' || e.key === 'Backspace') {
        e.preventDefault();
        deleteCurrentSelected();
      }
      else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        seekTo(state.currentTime - (e.shiftKey ? 1.0 : 0.1));
      }
      else if (e.key === 'ArrowRight') {
        e.preventDefault();
        seekTo(state.currentTime + (e.shiftKey ? 1.0 : 0.1));
      }
    });

    function addNewSubtitle() {
      pushUndo();
      const id = 'sub-' + Date.now();
      state.subtitles.push({
        id,
        text: '新字幕點此編輯',
        orientation: 'horizontal',
        start: state.currentTime,
        duration: 3.0,
        x: 0.5,
        y: 0.75,
        size: 24,
        font: "'Noto Sans TC', sans-serif",
        color: '#ffffff',
        stroke: '#000000',
        bg: 'rgba(0,0,0,0.45)'
      });
      state.selectedSubId = id;
      state.lastSelectedType = 'sub';
      state.activeTab = 'text';
      updateTabsUI();
      updateDeleteButtonLabel();
      renderTimeline(); renderDrawer(); renderFrame();
    }

    // 從目前選取的影片分離出獨立音軌
    function extractAudioFromClip(clip, isPip) {
      if (!clip || !clip.mediaEl || clip.mediaEl.tagName !== 'VIDEO') {
        return showToast('請先選取一段影片再分離音軌');
      }
      pushUndo();
      // 建立一個獨立的音訊播放器共用同一份影片來源 URL
      const audEl = document.createElement('video');
      audEl.src = clip.mediaEl.src;
      audEl.preload = 'auto';
      audEl.playsInline = true;
      ensureAudioNode(audEl);

      // 計算該影片在時間軸上的起始位置
      let startSec = clip.start || 0;
      if (!isPip) {
        startSec = 0;
        for (const c of state.clips) {
          if (c.id === clip.id) break;
          startSec += c.duration;
        }
      }

      const id = 'aud-' + Date.now() + Math.random();
      state.audioClips.push({
        id,
        name: clip.name,
        fromVideo: true,
        start: startSec,
        trimStart: clip.trimStart || 0,
        duration: clip.duration,
        maxDuration: clip.maxDuration || 300,
        gain: clip.audioGain ?? 1.0,
        muted: false,
        mediaEl: audEl
      });

      // 將原影片設為靜音避免聲音重疊
      clip.muted = true;
      state.selectedAudioId = id;
      state.lastSelectedType = 'audio';
      state.activeTab = 'audio';
      updateTabsUI();
      updateDeleteButtonLabel();
      renderTimeline(); renderDrawer(); syncVideoElements(true);
      showToast('已從影片分離出獨立音軌（原影片已自動靜音）🎵');
    }

    // ====== 底部抽屜工具面板 ======
    function renderDrawer() {
      const container = document.getElementById('drawerContent');
      const selObj = getSelectedVisualClip();
      const clip = selObj?.clip || null;

      const aClip = state.audioClips.find(a => a.id === state.selectedAudioId) || state.audioClips[0];

      if (state.activeTab !== 'cutout') {
        state.penEditMode = false;
        state.eyedropperMode = false;
      }

      if (state.activeTab === 'media') {
        container.innerHTML = `
          <div class="action-grid" style="margin-bottom:8px;">

            <button class="box-btn" id="addPipLayerBtn">＋ 新增頂層軌道</button>
          </div>
          <div class="action-grid" style="margin-bottom:8px;">
            <button class="box-btn" id="drawerSplitBtn">✂️ 在此分割</button>
            <button class="box-btn danger" id="delClipBtn">🗑️ 刪除此素材</button>
            <button class="box-btn" id="resetPosBtn">🎯 置中復位</button>
          </div>
          ${clip ? `
            <div style="font-size:11px; color:var(--text-muted); margin-bottom:4px; display:flex; justify-content:space-between;">
              <span>目前選取：${selObj.isPip ? '【畫中畫】' : '【主軌】'}${clip.name}</span>
              <strong style="color:${clip.speed > 1 ? 'var(--cyan)' : (clip.speed < 1 ? 'var(--gold)' : '#fff')}">${clip.speed}x</strong>
            </div>
            <div class="pill-group">
              ${SPEED_PRESETS.map(sp => `
                <button class="pill ${Math.abs(clip.speed - sp.val) < 0.01 ? 'active' : ''}" data-speed="${sp.val}">${sp.label}</button>
              `).join('')}
            </div>
            <div class="control-row">

            </div>
          `}
        `;
        document.getElementById('importPipBtn').onclick = () => {
          window._targetPipTrackId = state.pipTracks[0]?.id;
          document.getElementById('pipFileInput').click();

        document.getElementById('addPipLayerBtn').onclick = () => {
          const layerNum = state.pipTracks.length + 1;
          state.pipTracks.unshift({

          });

        document.getElementById('drawerSplitBtn').onclick = splitAtPlayhead;

        document.getElementById('resetPosBtn').onclick = () => {
          if (!clip) return;
          pushUndo();
          const localT = getClipLocalTime(clip, selObj.isPip);

        };

        if (clip) {
          container.querySelectorAll('.pill[data-speed]').forEach(btn => {

          const speedSlider = document.getElementById('clipSpeedRange');
          let sliderUndoSaved = false;
          speedSlider.addEventListener('pointerdown', () => { sliderUndoSaved = false; });
          speedSlider.oninput = (e) => {
            applyClipSpeed(clip, parseFloat(e.target.value), !sliderUndoSaved);
            sliderUndoSaved = true;
          };
        }
      }

      else if (state.activeTab === 'fx') {
        const fx = state.effects;
        const sp = fx.spotlight;
        const fadeIn = clip?.fadeIn || { type: 'none', dur: 0.8 };
        const fadeOut = clip?.fadeOut || { type: 'none', dur: 0.8 };

        container.innerHTML = `
          ${clip ? `
            <div style="font-size:11px; color:#fda4af; font-weight:700; margin-bottom:4px;">1. 片頭/片尾出入畫動畫（針對：${clip.name}）</div>
            <div class="control-row">
              <label>片頭進場</label>
              <button class="pill ${fadeIn.type === 'none' ? 'active' : ''}" data-fi="none">無</button>

              <button class="pill ${fadeIn.type === 'white' ? 'active' : ''}" data-fi="white">⬜ 漸白</button>
              <input type="range" min="0.2" max="3.0" step="0.1" value="${fadeIn.dur}" id="fiDurRange" style="max-width:75px;">
              <span>${fadeIn.dur.toFixed(1)}s</span>
            </div>
            <div class="control-row">
              <label>片尾出場</label>
              <button class="pill ${fadeOut.type === 'none' ? 'active' : ''}" data-fo="none">無</button>
              <button class="pill ${fadeOut.type === 'black' ? 'active' : ''}" data-fo="black">⬛ 漸黑</button>
              <button class="pill ${fadeOut.type === 'white' ? 'active' : ''}" data-fo="white">⬜ 漸白</button>
              <input type="range" min="0.2" max="3.0" step="0.1" value="${fadeOut.dur}" id="foDurRange" style="max-width:75px;">
              <span>${fadeOut.dur.toFixed(1)}s</span>

          ` : ''}

          <div class="pill-group">

            <button class="pill ${fx.particleType === 'snow' ? 'active' : ''}" data-pt="snow">❄️ 下雪特效</button>

          ${fx.particleType !== 'none' ? `

              <input type="range" min="2" max="18" step="0.5" value="${fx.particleSize}" id="ptSizeRange">
              <span>${fx.particleSize}</span>
              <label style="min-width:34px;">密度</label>
              <input type="range" min="10" max="150" step="5" value="${fx.particleDensity}" id="ptDensRange">
              <span>${fx.particleDensity}</span>
            </div>
            ${fx.particleType === 'petal' ? `
              <div class="pill-group">
                ${PETAL_COLORS.map(pc => `
                  <button class="pill ${fx.petalColor === pc.hex ? 'active' : ''}" data-pcol="${pc.hex}">${pc.name}</button>
                `).join('')}
              </div>
            ` : ''}
          ` : ''}

          <div style="font-size:11px; color:#ffcc33; font-weight:700; margin:6px 0 4px;">3. 舞台聚光燈效果（可調打光角度與範圍）</div>
          <div class="control-row">
            <button class="pill ${sp.enabled ? 'active' : ''}" id="toggleSpotBtn">
              ${sp.enabled ? '🔦 聚光燈：開啟中' : '🔦 開啟舞台聚光燈'}

            ${sp.enabled ? `
              <label style="min-width:52px;">打光角度</label>
              <input type="range" min="-60" max="60" step="2" value="${sp.angle}" id="spotAngleRange">

          </div>
          ${sp.enabled ? `
            <div class="control-row">
              <label>光圈寬度</label>
              <input type="range" min="0.15" max="0.75" step="0.02" value="${sp.spread}" id="spotSpreadRange">
              <label style="min-width:52px;">環境暗度</label>
              <input type="range" min="0.2" max="0.95" step="0.05" value="${sp.darkness}" id="spotDarkRange">
            </div>
            <div class="control-row">
              <label>焦點左右</label>
              <input type="range" min="0.05" max="0.95" step="0.02" value="${sp.focusX}" id="spotXRange">

              <input type="range" min="0.1" max="0.95" step="0.02" value="${sp.focusY}" id="spotYRange">
            </div>
          ` : ''}
        `;

        if (clip) {
          container.querySelectorAll('[data-fi]').forEach(btn => {
            btn.onclick = () => {
