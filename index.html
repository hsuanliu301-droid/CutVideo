    // ====== 所見即所得零偏移分割（直接讀取白色播放線在畫面上的真實相對座標） ======
    let lastSplitTimestamp = 0;

    function splitAtPlayhead() {
      const now = Date.now();
      if (now - lastSplitTimestamp < 320) return;
      lastSplitTimestamp = now;

      if (state.isPlaying) togglePlay(false);

      // 取得白色播放線正中央在螢幕上的真實 X 座標
      const playheadRect = document.getElementById('playheadLine').getBoundingClientRect();
      const playheadCenterX = playheadRect.left + playheadRect.width / 2;

      // 1. 獨立音訊軌分割（僅當目前選取音訊軌時）
      if (state.lastSelectedType === 'audio' && state.selectedAudioId) {
        const idx = state.audioClips.findIndex(a => a.id === state.selectedAudioId);
        if (idx !== -1) {
          const a = state.audioClips[idx];
          const blockEl = document.querySelector(`.audio-clip-block[data-audio-id="${a.id}"]`);
          const blockRect = blockEl ? blockEl.getBoundingClientRect() : null;
          const leftDur = blockRect
            ? roundSec((playheadCenterX - blockRect.left) / state.pxPerSec)
            : roundSec(state.currentTime - (a.start || 0));

          if (leftDur > 0.1 && leftDur < a.duration - 0.1) {
            pushUndo();
            const rightDur = roundSec(a.duration - leftDur);
            const exactCutGlobalSec = roundSec((a.start || 0) + leftDur);
            const exactRightTrimStart = roundSec((a.trimStart || 0) + leftDur);
            a.duration = leftDur;

            let newEl;
            if (a.mediaEl.tagName === 'VIDEO') {
              newEl = createClonedVideoElement(a.mediaEl.src, exactRightTrimStart);
            } else {
              newEl = new Audio(a.mediaEl.src);
              newEl.preload = 'auto';
              ensureAudioNode(newEl);
              newEl.onloadedmetadata = () => {
                newEl.currentTime = exactRightTrimStart;
              };
            }

            const clone = {
              ...a,
              id: 'aud-' + Date.now(),
              name: a.name + '(切)',
              start: exactCutGlobalSec,
              trimStart: exactRightTrimStart,
              duration: rightDur,
              mediaEl: newEl
            };
            state.audioClips.splice(idx + 1, 0, clone);
            state.selectedAudioId = clone.id;
            renderTimeline(); renderDrawer();
            seekTo(exactCutGlobalSec);
            showToast(`已精準在 ${exactCutGlobalSec.toFixed(2)}s 分割音軌 ✂️`);
            return;
          }
        }
      }

      // 2. 畫中畫軌道分割（僅當目前選取畫中畫片段時）
      if (state.lastSelectedType === 'pip' && state.selectedClipId) {
        for (const tr of state.pipTracks) {
          const idx = tr.clips.findIndex(p => p.id === state.selectedClipId);
          if (idx !== -1) {
            const p = tr.clips[idx];
            const blockEl = document.querySelector(`.clip-block[data-clip-id="${p.id}"]`);
            const blockRect = blockEl ? blockEl.getBoundingClientRect() : null;
            const leftDur = blockRect
              ? roundSec((playheadCenterX - blockRect.left) / state.pxPerSec)
              : roundSec(state.currentTime - (p.start || 0));

            if (leftDur > 0.1 && leftDur < p.duration - 0.1) {
              pushUndo();
              const rightDur = roundSec(p.duration - leftDur);
              const exactCutGlobalSec = roundSec((p.start || 0) + leftDur);
              const exactRightTrimStart = roundSec((p.trimStart || 0) + leftDur * (p.speed || 1.0));
              p.duration = leftDur;

              let rightMediaEl = p.mediaEl;
              if (p.mediaEl?.tagName === 'VIDEO') {
                rightMediaEl = createClonedVideoElement(p.mediaEl.src, exactRightTrimStart);
              }

              const clone = {
                ...cloneClipData(p),
                id: 'pip-' + Date.now(),
                name: p.name + '(切)',
                start: exactCutGlobalSec,
                trimStart: exactRightTrimStart,
                duration: rightDur,
                mediaEl: rightMediaEl
              };
              tr.clips.splice(idx + 1, 0, clone);
              state.selectedClipId = clone.id;
              updateDeleteButtonLabel();
              renderTimeline(); renderDrawer();
              seekTo(exactCutGlobalSec);
              showToast(`已精準在 ${exactCutGlobalSec.toFixed(2)}s 分割畫中畫 ✂️`);
              return;
            }
          }
        }
      }

      // 3. 主影片軌道分割（直接以白色播放線在畫面上的真實落點計算 leftDur，絕不偏移）
      let acc = 0;
      for (let i = 0; i < state.clips.length; i++) {
        const c = state.clips[i];
        const blockEl = document.querySelector(`#mainVideoTrack .clip-block[data-clip-id="${c.id}"]`);
        const blockRect = blockEl ? blockEl.getBoundingClientRect() : null;

        // 優先判斷白色播放線是否直接壓在這個主軌方塊上
        const isVisuallyInside = blockRect
          ? (playheadCenterX > blockRect.left + 4 && playheadCenterX < blockRect.right - 4)
          : (state.currentTime > acc + 0.1 && state.currentTime < acc + c.duration - 0.1);

        if (isVisuallyInside) {
          const leftDur = blockRect
            ? roundSec((playheadCenterX - blockRect.left) / state.pxPerSec)
            : roundSec(state.currentTime - acc);

          if (leftDur > 0.1 && leftDur < c.duration - 0.1) {
            pushUndo();
            const rightDur = roundSec(c.duration - leftDur);
            const origTrimStart = c.trimStart || 0;
            const exactRightTrimStart = roundSec(origTrimStart + leftDur * (c.speed || 1.0));
            const exactCutGlobalSec = roundSec(acc + leftDur);
            c.duration = leftDur;

            let rightMediaEl = c.mediaEl;
            if (c.mediaEl?.tagName === 'VIDEO') {
              rightMediaEl = createClonedVideoElement(c.mediaEl.src, exactRightTrimStart);
            }

            const clone = {
              ...cloneClipData(c),
              id: 'clip-' + Date.now(),
              name: c.name + '(切)',
              trimStart: exactRightTrimStart,
              duration: rightDur,
              mediaEl: rightMediaEl
            };
            state.clips.splice(i + 1, 0, clone);
            state.selectedClipId = clone.id;
            state.lastSelectedType = 'clip';
            updateDeleteButtonLabel();
            renderTimeline(); renderDrawer();
            seekTo(exactCutGlobalSec);
            showToast(`已精準在 ${exactCutGlobalSec.toFixed(2)}s 分割（無偏移）✂️`);
            return;
          }
        }
        acc += c.duration;
      }

      showToast('請將白色播放線停在片段或音軌中間再按下分割');
    }

    document.getElementById('splitBtn').onclick = splitAtPlayhead;

    // ====== 檔案載入 ======
    function loadMediaFile(file, onReady) {
      const url = URL.createObjectURL(file);
      const isImage = file.type.startsWith('image/');

      if (isImage) {
        const img = new Image();
        img.onload = () => {
          onReady({ mediaEl: img, mediaType: 'image', duration: 5.0, maxDuration: 120 });
        };
        img.src = url;
      } else {
        const vid = document.createElement('video');
        vid.src = url;
        vid.preload = 'auto';
        vid.playsInline = true;
        vid.setAttribute('playsinline', '');
        vid.setAttribute('webkit-playsinline', '');
        ensureAudioNode(vid);

        vid.onloadeddata = () => {
          if (vid._imported) return;
          vid._imported = true;
          requestVideoSeek(vid, 0.01);
          const realDur = (vid.duration && isFinite(vid.duration)) ? roundSec(vid.duration) : 10;
          onReady({ mediaEl: vid, mediaType: 'video', duration: realDur, maxDuration: realDur });
        };

        vid.onseeked = () => {
          renderFrame();
          if (typeof vid._pendingSeekTime === 'number') {
            const nextT = vid._pendingSeekTime;
            vid._pendingSeekTime = null;
            if (Math.abs(vid.currentTime - nextT) > 0.008) {
              vid.currentTime = nextT;
            }
          }
        };

        vid.load();
      }
    }

    document.getElementById('videoFileInput').onchange = (e) => {
      const files = Array.from(e.target.files);
      if (files.length > 0) pushUndo();
      files.forEach(file => {
        loadMediaFile(file, ({ mediaEl, mediaType, duration, maxDuration }) => {
          const id = 'clip-' + Date.now() + Math.random();
          state.clips.push(createDefaultClipProps({
            id,
            name: file.name.slice(0, 12),
            duration,
            maxDuration,
            mediaEl,
            mediaType
          }));
          state.selectedClipId = id;
          state.lastSelectedType = 'clip';
          updateDeleteButtonLabel();
          renderTimeline(); renderDrawer(); renderFrame();
          showToast(`已匯入主軌：${file.name}`);
        });
      });
      e.target.value = '';
    };

    document.getElementById('pipFileInput').onchange = (e) => {
      const files = Array.from(e.target.files);
      if (files.length > 0) pushUndo();
      const targetTrack = state.pipTracks.find(t => t.id === window._targetPipTrackId) || state.pipTracks[0];
      files.forEach(file => {
        loadMediaFile(file, ({ mediaEl, mediaType, duration, maxDuration }) => {
          const id = 'pip-' + Date.now() + Math.random();
          targetTrack.clips.push(createDefaultClipProps({
            id,
            name: file.name.slice(0, 12),
            start: roundSec(state.currentTime),
            duration,
            maxDuration,
            mediaEl,
            mediaType
          }));
          state.selectedClipId = id;
          state.lastSelectedType = 'pip';
          updateDeleteButtonLabel();
          renderTimeline(); renderDrawer(); renderFrame();
          showToast(`已匯入畫中畫（頂層）：${file.name}`);
        });
      });
      e.target.value = '';
    };

    document.getElementById('bgFileInput').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      loadMediaFile(file, ({ mediaEl, mediaType }) => {
        if (mediaType === 'video') {
          mediaEl.loop = true;
          mediaEl.muted = true;
        }
        state.background.mode = 'custom';
        state.background.mediaEl = mediaEl;
        state.background.mediaType = mediaType;
        state.background.mediaName = file.name;
        renderDrawer(); renderFrame();
        showToast(`已套用自訂底板：${file.name}`);
      });
      e.target.value = '';
    };

    document.getElementById('audioFileInput').onchange = (e) => {
      const files = Array.from(e.target.files);
      if (files.length > 0) pushUndo();
      files.forEach(file => {
        const url = URL.createObjectURL(file);
        const audioEl = new Audio(url);
        audioEl.preload = 'auto';
        ensureAudioNode(audioEl);

        audioEl.onloadedmetadata = () => {
          const id = 'aud-' + Date.now() + Math.random();
          const realDur = (audioEl.duration && isFinite(audioEl.duration)) ? roundSec(audioEl.duration) : 15;
          state.audioClips.push({
            id,
            name: file.name.slice(0, 14),
            fromVideo: false,
            start: roundSec(state.currentTime),
            trimStart: 0,
            duration: realDur,
            maxDuration: realDur,
            gain: 1.0,
            muted: false,
            mediaEl: audioEl
          });
          state.selectedAudioId = id;
          state.lastSelectedType = 'audio';
          updateDeleteButtonLabel();
          renderTimeline(); renderDrawer();
          showToast(`已插入音樂音軌：${file.name} 🎵`);
        };
      });
      e.target.value = '';
    };

    document.getElementById('videoToAudioInput').onchange = (e) => {
      const files = Array.from(e.target.files);
      if (files.length > 0) pushUndo();
      files.forEach(file => {
        const url = URL.createObjectURL(file);
        const vidAud = createClonedVideoElement(url, 0.01);

        vidAud.onloadedmetadata = () => {
          const id = 'aud-' + Date.now() + Math.random();
          const realDur = (vidAud.duration && isFinite(vidAud.duration)) ? roundSec(vidAud.duration) : 15;
          state.audioClips.push({
            id,
            name: file.name.slice(0, 14),
            fromVideo: true,
            start: roundSec(state.currentTime),
            trimStart: 0,
            duration: realDur,
            maxDuration: realDur,
            gain: 1.0,
            muted: false,
            mediaEl: vidAud
          });
          state.selectedAudioId = id;
          state.lastSelectedType = 'audio';
          updateDeleteButtonLabel();
          renderTimeline(); renderDrawer();
          showToast(`已將影片轉成獨立音軌：${file.name} 🎬➡️🎵`);
        };
      });
      e.target.value = '';
    };

    document.getElementById('fontFileInput').onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const fontName = 'CustomFont_' + Date.now();
      const buf = await file.arrayBuffer();
      const face = new FontFace(fontName, buf);
      await face.load();
      document.fonts.add(face);
      FREE_FONTS.unshift({
        name: file.name.replace(/\.[^/.]+$/, ''),
        family: `'${fontName}', sans-serif`,
        cat: '特色',
        desc: '本機匯入自訂字體'
      });
      const sub = state.subtitles.find(s => s.id === state.selectedSubId);
      if (sub) sub.font = `'${fontName}', sans-serif`;
      renderDrawer(); renderFrame();
      showToast('自訂字體載入成功！');
      e.target.value = '';
    };

    // ====== 播放迴圈 ======
    let lastTs = 0;
    let exportSegmentStopTime = null;

    function checkAutoSpeakSubtitles() {
      if (!state.isPlaying || state.isExporting) return;
      if (state.voiceConfig.engine !== 'browser' || !state.voiceConfig.autoSyncPlayback) return;
      if (state.trackVisibility.sub === false) return;

      state.subtitles.forEach(sub => {
        if (state.currentTime >= sub.start && state.currentTime <= sub.start + sub.duration) {
          if (!spokenSubIdsThisRun.has(sub.id)) {
            spokenSubIdsThisRun.add(sub.id);
            speakWithBrowserTTS(sub.text);
          }
        }
      });
    }

    function tick(ts) {
      if (!state.isPlaying) return;
      if (!lastTs) lastTs = ts;
      const dt = (ts - lastTs) / 1000;
      lastTs = ts;

      state.currentTime = roundSec(state.currentTime + dt);
      const targetStop = exportSegmentStopTime !== null ? exportSegmentStopTime : getTotalDuration();

      if (state.currentTime >= targetStop) {
        if (exportSegmentStopTime !== null) {
          state.currentTime = targetStop;
        } else {
          state.currentTime = 0;
        }
        togglePlay(false);
      } else {
        timelineScroll.scrollLeft = Math.round(state.currentTime * state.pxPerSec);
        syncVideoElements(false);
        checkAutoSpeakSubtitles();
        renderFrame();
        requestAnimationFrame(tick);
      }
    }

    function togglePlay(force) {
      const hasAnyPip = state.pipTracks.some(t => t.clips.length > 0);
      if (state.clips.length === 0 && !hasAnyPip && state.subtitles.length === 0 && state.audioClips.length === 0) {
        return showToast('請先匯入影片、音訊或新增字幕再播放');
      }
      state.isPlaying = typeof force === 'boolean' ? force : !state.isPlaying;
      document.getElementById('playBtn').textContent = state.isPlaying ? '⏸' : '▶';
      if (state.isPlaying) {
        getAudioCtx();
        lastTs = 0;
        spokenSubIdsThisRun.clear();
        syncVideoElements(true);
        checkAutoSpeakSubtitles();

        const isMainVis = state.trackVisibility.main !== false;
        state.clips.forEach(c => {
          if (c.mediaEl?.tagName === 'VIDEO') {
            c.mediaEl.playbackRate = c.speed || 1.0;
            applyMediaAudioGain(c.mediaEl, c.muted || !isMainVis, c.audioGain ?? 1.0);
            c.mediaEl.play().catch(() => {});
          }
        });
        state.pipTracks.forEach(tr => {
          const isPipVis = tr.visible !== false;
          tr.clips.forEach(p => {
            if (p.mediaEl?.tagName === 'VIDEO') {
              p.mediaEl.playbackRate = p.speed || 1.0;
              applyMediaAudioGain(p.mediaEl, p.muted || !isPipVis, p.audioGain ?? 1.0);
              p.mediaEl.play().catch(() => {});
            }
          });
        });
        const isAudVis = state.trackVisibility.audio !== false;
        state.audioClips.forEach(a => {
          if (a.mediaEl) {
            applyMediaAudioGain(a.mediaEl, a.muted || !isAudVis, a.gain ?? 1.0);
            const aStart = a.start || 0;
            if (state.currentTime >= aStart && state.currentTime < aStart + a.duration) {
              a.mediaEl.currentTime = Math.max(0.01, (a.trimStart || 0) + (state.currentTime - aStart));
              a.mediaEl.play().catch(() => {});
            }
          }
        });
        if (state.background.mode === 'custom' && state.background.mediaEl?.tagName === 'VIDEO') {
          state.background.mediaEl.muted = true;
          state.background.mediaEl.play().catch(() => {});
        }
        requestAnimationFrame(tick);
      } else {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        state.clips.forEach(c => { if (c.mediaEl?.tagName === 'VIDEO') c.mediaEl.pause(); });
        state.pipTracks.forEach(tr => tr.clips.forEach(p => {
          if (p.mediaEl?.tagName === 'VIDEO') p.mediaEl.pause();
        }));
        state.audioClips.forEach(a => { if (a.mediaEl) a.mediaEl.pause(); });
        if (state.background.mediaEl?.tagName === 'VIDEO') state.background.mediaEl.pause();
        renderFrame();
      }
    }

    document.getElementById('playBtn').onclick = () => {
      exportSegmentStopTime = null;
      togglePlay();
    };

    // ====== 匯出系統 ======
    const exportModalBackdrop = document.getElementById('exportModalBackdrop');
    const exportOptionsList = document.getElementById('exportOptionsList');
    const exportProgressBox = document.getElementById('exportProgressBox');
    const exportProgressText = document.getElementById('exportProgressText');
    const exportProgressFill = document.getElementById('exportProgressFill');

    function collectEditableSegments() {
      const list = [];
      let acc = 0;
      state.clips.forEach((c, idx) => {
        list.push({
          label: `主軌分段${idx + 1}_${c.name.replace(/[^\w\u4e00-\u9fa5-]/g, '')}`,
          start: roundSec(acc),
          end: roundSec(acc + c.duration)
        });
        acc += c.duration;
      });
      state.pipTracks.forEach((tr, tIdx) => {
        if (tr.visible === false) return;
        tr.clips.forEach((p, pIdx) => {
          const s = roundSec(p.start || 0);
          list.push({
            label: `頂層${tIdx + 1}分段${pIdx + 1}_${p.name.replace(/[^\w\u4e00-\u9fa5-]/g, '')}`,
            start: s,
            end: roundSec(s + p.duration)
          });
        });
      });
      return list;
    }

    function recordTimeRangeToWebm(startSec, endSec, filename) {
      return new Promise((resolve) => {
        getAudioCtx();
        const videoStream = canvas.captureStream(30);
        const combinedStream = new MediaStream();
        videoStream.getVideoTracks().forEach(track => combinedStream.addTrack(track));
        if (exportMixDest && exportMixDest.stream) {
          exportMixDest.stream.getAudioTracks().forEach(track => combinedStream.addTrack(track));
        }

        let mimeType = 'video/webm';
        if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')) {
          mimeType = 'video/webm;codecs=vp9,opus';
        } else if (MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus')) {
          mimeType = 'video/webm;codecs=vp8,opus';
        }

        const recorder = new MediaRecorder(combinedStream, { mimeType });
        const chunks = [];
        recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
        recorder.onstop = () => {
          const blob = new Blob(chunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = filename;
          a.click();
          setTimeout(() => URL.revokeObjectURL(url), 5000);
          resolve();
        };

        state.currentTime = startSec;
        timelineScroll.scrollLeft = Math.round(startSec * state.pxPerSec);
        exportSegmentStopTime = endSec;
        syncVideoElements(true);
        renderFrame();

        setTimeout(() => {
          recorder.start();
          togglePlay(true);

          const checkStop = setInterval(() => {
            if (!state.isPlaying) {
              clearInterval(checkStop);
              exportSegmentStopTime = null;
              if (recorder.state !== 'inactive') recorder.stop();
            }
          }, 120);
        }, 120);
      });
    }

    async function runBatchExport(includeSplits) {
      if (state.isExporting) return;
      state.isExporting = true;
      exportOptionsList.style.display = 'none';
      exportProgressBox.style.display = 'block';

      const stamp = new Date().toISOString().slice(11, 19).replace(/:/g, '');
      const segments = includeSplits ? collectEditableSegments() : [];
      const totalTasks = 1 + segments.length;

      exportProgressText.textContent = `正在渲染完整影片 (1 / ${totalTasks})...`;
      exportProgressFill.style.width = `${Math.round((1 / (totalTasks + 1)) * 100)}%`;
      await recordTimeRangeToWebm(0, getTotalDuration(), `CutVideo_完整影片_${stamp}.webm`);

      for (let i = 0; i < segments.length; i++) {
        const seg = segments[i];
        exportProgressText.textContent = `正在分開存檔裁切片段 (${i + 2} / ${totalTasks})：${seg.label}`;
        exportProgressFill.style.width = `${Math.round(((i + 2) / (totalTasks + 1)) * 100)}%`;
        await new Promise(r => setTimeout(r, 350));
        await recordTimeRangeToWebm(seg.start, seg.end, `CutVideo_${seg.label}_${stamp}.webm`);
      }

      exportProgressFill.style.width = '100%';
      state.isExporting = false;
      state.currentTime = 0;
      timelineScroll.scrollLeft = 0;
      renderFrame();

      exportModalBackdrop.classList.remove('open');
      exportOptionsList.style.display = 'block';
      exportProgressBox.style.display = 'none';
      showToast(includeSplits
        ? `全部匯出完成！共下載 1 支完整影片 ＋ ${segments.length} 個裁切分段 📦`
        : '完整影片匯出完成！已開始下載 🎬🔊');
    }

    document.getElementById('exportBtn').onclick = () => {
      const hasAnyPip = state.pipTracks.some(t => t.clips.length > 0);
      if (state.clips.length === 0 && !hasAnyPip && state.audioClips.length === 0) {
        return showToast('請先匯入影片或音訊再匯出');
      }
      if (typeof MediaRecorder === 'undefined') {
        return showToast('目前瀏覽器不支援直接錄製匯出，請改用 Chrome 或 Safari 最新版');
      }
      if (state.isPlaying) togglePlay(false);

      const segs = collectEditableSegments();
      document.getElementById('splitCountDesc').textContent =
        `同時下載 1 支完整影片 ＋ 目前已裁切的 ${segs.length} 份獨立編輯片段，方便素材二次利用`;

      exportOptionsList.style.display = 'block';
      exportProgressBox.style.display = 'none';
      exportModalBackdrop.classList.add('open');
    };

    document.getElementById('closeExportModalBtn').onclick = () => {
      if (state.isExporting) return showToast('正在渲染匯出中，請稍候完成');
      exportModalBackdrop.classList.remove('open');
    };

    document.getElementById('optExportFullOnly').onclick = () => runBatchExport(false);
    document.getElementById('optExportFullAndSplits').onclick = () => runBatchExport(true);

    // 初始化啟動
    updateDeleteButtonLabel();
    renderTimeline();
    renderDrawer();
    renderFrame();
  </script>
</body>
</html>
