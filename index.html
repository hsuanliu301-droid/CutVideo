<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CutVideo</title>
  <!-- Google Fonts & 開源免費繁體字體庫 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chiron+Hei+HK:wght@400;700&family=Chiron+Sung+HK:wght@400;700&family=Iansui&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;700;900&family=Noto+Serif+TC:wght@400;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <!-- MediaPipe Selfie Segmentation -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/npm/open-huninn-font@1.1.0/font.css');
    @import url('https://cdn.jsdelivr.net/npm/cubic-11@1.0.1/fonts/web/cubic-11.css');
    @import url('https://cdn.jsdelivr.net/npm/smiley-sans@2.0.1/dist/smiley-sans.css');

    @font-face {
      font-family: 'Taipei Sans TC';
      src: url('https://cdn.jsdelivr.net/gh/max32002/taipeisanstc@master/webfont/TaipeiSansTCBeta-Regular.woff2') format('woff2');
      font-display: swap;
    }
    @font-face {
      font-family: 'ChenYuluoyan';
      src: url('https://cdn.jsdelivr.net/gh/Chenyu-otf/chenyuluoyan_thin@main/ChenYuluoyan-Thin-Monospaced.woff2') format('woff2');
      font-display: swap;
    }
    @font-face {
      font-family: 'GenSenRounded';
      src: url('https://cdn.jsdelivr.net/gh/ButTaiwan/gensen-font@master/webfont/GenSenRounded-M.woff2') format('woff2');
      font-display: swap;
    }
    @font-face {
      font-family: 'TASA Explorer';
      src: url('https://cdn.jsdelivr.net/gh/ButTaiwan/tasa-explorer@main/webfont/TASAExplorer-Medium.woff2') format('woff2');
      font-display: swap;
    }

    :root {
      --bg-dark: #0e0f13;
      --bg-panel: #171920;
      --bg-card: #21242e;
      --accent: #ff3b7f;
      --accent-soft: rgba(255, 59, 127, 0.2);
      --danger: #ef4444;
      --danger-soft: rgba(239, 68, 68, 0.18);
      --gold: #ffcc33;
      --cyan: #2ce6c3;
      --purple: #a855f7;
      --blue: #38bdf8;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #2b2f3b;
      --stage-height: 230px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Bar */
    .topbar {
      height: 44px;
      padding: 0 12px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .brand {
      font-weight: 900;
      font-size: 16px;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand span {
      background: linear-gradient(135deg, #ff3b7f, #ff8a3d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .shortcut-badge {
      display: none;
      font-size: 10px;
      color: var(--text-muted);
      background: var(--bg-card);
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    @media (min-width: 820px) {
      .shortcut-badge { display: inline-block; }
    }

    .ratio-group {
      display: flex;
      background: var(--bg-card);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
    }

    .ratio-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
    }

    .ratio-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .btn-export {
      background: linear-gradient(135deg, #ff3b7f, #ff6b4a);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Export Modal Dialog */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .export-modal {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      width: 100%;
      max-width: 360px;
      padding: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
    }

    .export-modal h3 {
      margin: 0 0 6px;
      font-size: 15px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .export-modal p.sub {
      margin: 0 0 12px;
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .export-option-card {
      width: 100%;
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 11px 12px;
      margin-bottom: 8px;
      text-align: left;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .export-option-card:hover {
      border-color: var(--accent);
      background: rgba(255, 59, 127, 0.12);
    }

    .export-option-card .opt-title {
      font-size: 13px;
      font-weight: 800;
      color: #fff;
    }

    .export-option-card .opt-desc {
      font-size: 11px;
      color: var(--text-muted);
    }

    .export-progress-box {
      display: none;
      background: #101218;
      border: 1px solid var(--cyan);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      margin-top: 8px;
    }

    .export-progress-box .prog-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--cyan);
      margin-bottom: 6px;
    }

    .export-progress-bar {
      height: 6px;
      background: #232734;
      border-radius: 99px;
      overflow: hidden;
    }

    .export-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--cyan), var(--accent));
      transition: width 0.2s;
    }

    /* Stage / Preview Area */
    .stage-wrap {
      height: var(--stage-height);
      min-height: 120px;
      max-height: 68dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #08090c;
      position: relative;
      padding: 10px;
      overflow: hidden;
      flex-shrink: 0;
    }

    canvas#previewCanvas {
      background: #000;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.85);
      border-radius: 6px;
      border: 1px solid #2b2f3b;
      height: 100%;
      width: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      touch-action: none;
      cursor: grab;
    }

    canvas#previewCanvas:active {
      cursor: grabbing;
    }

    .stage-hint {
      position: absolute;
      top: 6px;
      left: 10px;
      background: rgba(0, 0, 0, 0.72);
      color: #d1d5db;
      font-size: 10px;
      padding: 3px 9px;
      border-radius: 99px;
      pointer-events: none;
      max-width: 54%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .stage-top-right {
      position: absolute;
      top: 6px;
      right: 10px;
      display: flex;
      align-items: center;
      gap: 4px;
      z-index: 15;
    }

    .stage-pill-box {
      display: flex;
      gap: 2px;
      background: rgba(23, 25, 32, 0.9);
      border: 1px solid var(--border);
      padding: 2px;
      border-radius: 8px;
    }

    .stage-mode-btn, .stage-size-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 700;
      padding: 3px 6px;
      border-radius: 5px;
      cursor: pointer;
    }

    .stage-mode-btn.active {
      background: var(--blue);
      color: #090a0d;
    }

    .stage-mode-btn.crop-active {
      background: var(--gold);
      color: #090a0d;
    }

    .stage-size-btn.active {
      background: var(--accent-soft);
      color: #fff;
    }

    .stage-resizer {
      height: 12px;
      background: #14161d;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: ns-resize;
      touch-action: none;
      flex-shrink: 0;
    }

    .stage-resizer:hover, .stage-resizer.active {
      background: var(--accent-soft);
    }

    .stage-resizer::after {
      content: '';
      width: 36px;
      height: 3px;
      border-radius: 99px;
      background: #4b5563;
    }

    .stage-resizer.active::after {
      background: var(--accent);
    }

    /* Transport & Timeline Zoom + Magnetic Snap Bar */
    .transport {
      height: 40px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      gap: 5px;
      flex-shrink: 0;
    }

    .time-readout {
      font-variant-numeric: tabular-nums;
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .time-readout strong {
      color: var(--text-main);
    }

    .play-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: var(--text-main);
      color: var(--bg-dark);
      font-size: 12px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .quick-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      padding: 2px 0;
    }

    .quick-actions::-webkit-scrollbar {
      display: none;
    }

    .chip-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      font-size: 11px;
      font-weight: 600;
      padding: 4px 7px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }

    .chip-btn:active {
      transform: scale(0.96);
    }

    .chip-btn.snap-on {
      background: rgba(44, 230, 195, 0.16);
      border-color: var(--cyan);
      color: var(--cyan);
    }

    .chip-btn.danger {
      background: var(--danger-soft);
      border-color: var(--danger);
      color: #fca5a5;
    }

    .chip-btn.danger:hover {
      background: var(--danger);
      color: #fff;
    }

    .zoom-box {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .zoom-box span {
      font-size: 10px;
      color: var(--text-muted);
    }

    .zoom-box input[type="range"] {
      width: 48px;
      height: 14px;
      accent-color: var(--cyan);
    }

    @media (min-width: 768px) {
      .zoom-box input[type="range"] { width: 85px; }
    }

    /* Multi-Layer Timeline（0秒基準線與白色播放線 100% 重合無偏移） */
    .timeline-shell {
      position: relative;
      flex: 1;
      min-height: 95px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .timeline-area {
      flex: 1;
      min-height: 95px;
      background: #121419;
      position: relative;
      overflow-x: auto;
      overflow-y: auto;
      border-bottom: 1px solid var(--border);
      scroll-behavior: auto;
      cursor: grab;
      touch-action: pan-y;
    }

    .timeline-area.grabbing {
      cursor: grabbing;
    }

    .timeline-inner {
      position: relative;
      min-height: 100%;
      min-width: 100%;
      /* 左右各留 50vw，確保 0.00s 精準對齊螢幕正中央 50% 白色播放線 */
      padding: 24px 50vw 18px 50vw;
    }

    .ruler {
      position: sticky;
      top: 0;
      left: 0;
      height: 20px;
      background: rgba(18, 20, 25, 0.95);
      border-bottom: 1px solid #2a2e3b;
      display: flex;
      font-size: 10px;
      color: var(--text-muted);
      z-index: 18;
      margin-top: -24px;
      margin-bottom: 4px;
    }

    .playhead {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 2px;
      background: #fff;
      z-index: 25;
      pointer-events: none;
      box-shadow: 0 0 6px rgba(255,255,255,0.85);
    }

    .playhead::before {
      content: '';
      position: absolute;
      top: 0;
      left: -5px;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 8px solid #fff;
    }

    /* 固定懸浮在時間軸最左側的獨立軌道眼睛／標籤欄（不佔用軌道 0 秒空間） */
    .track-sidebar-overlay {
      position: absolute;
      top: 24px;
      left: 4px;
      z-index: 22;
      display: flex;
      flex-direction: column;
      gap: 5px;
      pointer-events: none;
    }

    .track-controls {
      height: 34px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: rgba(15, 16, 20, 0.9);
      padding: 0 6px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.1);
      pointer-events: auto;
      width: fit-content;
    }

    .eye-btn {
      background: none;
      border: none;
      padding: 0 2px;
      font-size: 12px;
      cursor: pointer;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .eye-btn:active {
      transform: scale(0.88);
    }

    .track-badge {
      font-size: 9px;
      font-weight: 700;
      color: var(--text-muted);
      pointer-events: none;
    }

    .track-row {
      height: 34px;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      position: relative;
      border-radius: 6px;
      transition: opacity 0.18s, background 0.15s;
    }

    .track-row.pip-track {
      background: rgba(168, 85, 247, 0.06);
    }

    .track-row.main-track {
      background: rgba(59, 130, 246, 0.05);
    }

    .track-row.audio-track {
      background: rgba(44, 230, 195, 0.04);
    }

    .track-row.track-hidden {
      opacity: 0.36;
      filter: grayscale(0.85);
    }

    .track-row.drop-target {
      background: rgba(255, 204, 51, 0.18) !important;
      outline: 1.5px dashed var(--gold);
    }

    .empty-track-hint {
      font-size: 11px;
      color: #9ca3af;
      border: 1px dashed #4b5563;
      border-radius: 6px;
      padding: 5px 10px;
      cursor: pointer;
      white-space: nowrap;
      background: rgba(255,255,255,0.02);
    }

    .empty-track-hint:hover {
      border-color: var(--accent);
      color: #fff;
    }

    /* Clip Block & Trim Handles */
    .clip-block {
      height: 32px;
      background: linear-gradient(90deg, #2b3244, #384158);
      border: 1.5px solid #4c5670;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      position: relative;
      overflow: visible;
      white-space: nowrap;
      padding: 0 16px;
      flex-shrink: 0;
      touch-action: none;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .clip-block.pip-clip {
      position: absolute;
      background: linear-gradient(90deg, #3b2654, #523475);
      border-color: #8b5cf6;
    }

    .clip-block.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 1.5px var(--accent);
    }

    .clip-block.reordering {
      border-color: var(--gold) !important;
      background: linear-gradient(135deg, #5c481d, #826526) !important;
      box-shadow: 0 8px 20px rgba(255, 204, 51, 0.55), 0 0 0 2px var(--gold) !important;
      transform: translateY(-4px) scale(1.04);
      z-index: 40;
      cursor: move;
    }

    .clip-label {
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }

    .trim-handle {
      position: absolute;
      top: -1px;
      bottom: -1px;
      width: 15px;
      background: rgba(255, 255, 255, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: ew-resize;
      z-index: 15;
      touch-action: none;
    }

    .trim-handle:hover, .trim-handle.active {
      background: var(--accent);
    }

    .trim-handle.left {
      left: -1px;
      border-radius: 5px 0 0 5px;
      border-right: 1px solid rgba(255,255,255,0.45);
    }

    .trim-handle.right {
      right: -1px;
      border-radius: 0 5px 5px 0;
      border-left: 1px solid rgba(255,255,255,0.45);
    }

    .trim-handle::after {
      content: '⋮';
      font-size: 11px;
      color: #fff;
      font-weight: bold;
    }

    /* 轉場節點改為絕對定位懸浮在接縫正上方，絕不擠佔時間軸橫向寬度 */
    .trans-node {
      position: absolute;
      right: -10px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      z-index: 18;
      background: var(--bg-panel);
      border: 1.5px solid var(--cyan);
      color: var(--cyan);
      border-radius: 5px;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .kf-diamond {
      position: absolute;
      width: 8px;
      height: 8px;
      background: var(--gold);
      transform: translateX(-50%) rotate(45deg);
      top: 2px;
      border: 1px solid #000;
      pointer-events: none;
    }

    .sub-block {
      position: absolute;
      height: 26px;
      background: rgba(255, 59, 127, 0.28);
      border: 1px solid var(--accent);
      border-radius: 5px;
      font-size: 10px;
      padding: 0 15px;
      display: flex;
      align-items: center;
      color: #ffd1e1;
      white-space: nowrap;
      touch-action: none;
    }

    .sub-block.selected {
      background: rgba(255, 59, 127, 0.6);
      color: #fff;
      box-shadow: 0 0 0 1.5px #fff;
    }

    .audio-clip-block {
      position: absolute;
      height: 28px;
      background: linear-gradient(90deg, rgba(20, 184, 166, 0.35), rgba(44, 230, 195, 0.25));
      border: 1.5px solid var(--cyan);
      border-radius: 6px;
      font-size: 10px;
      font-weight: 600;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ccfbf1;
      white-space: nowrap;
      touch-action: none;
      cursor: pointer;
    }

    .audio-clip-block.selected {
      background: rgba(44, 230, 195, 0.5);
      color: #fff;
      border-color: #fff;
      box-shadow: 0 0 0 1.5px var(--cyan);
    }

    /* Tool Drawer */
    .drawer {
      background: var(--bg-panel);
      height: 215px;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: height 0.18s ease;
    }

    .drawer.collapsed {
      height: 48px;
    }

    .drawer.collapsed .drawer-content {
      display: none;
    }

    .drawer-content {
      flex: 1;
      padding: 9px 12px;
      overflow-y: auto;
      font-size: 12px;
    }

    .nav-tabs {
      height: 48px;
      background: #121318;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      flex-shrink: 0;
      overflow-x: auto;
    }

    .nav-tab {
      background: none;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 10px;
      cursor: pointer;
      padding: 4px 5px;
      white-space: nowrap;
    }

    .nav-tab.active {
      color: var(--accent);
      font-weight: 700;
    }

    .nav-tab span.icon {
      font-size: 15px;
    }

    .drawer-toggle-tab {
      position: sticky;
      right: 0;
      z-index: 10;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--cyan);
      font-size: 10px;
      font-weight: 700;
      padding: 4px 7px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      flex-shrink: 0;
      margin-right: 4px;
    }

    /* Controls inside Drawer */
    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      gap: 8px;
    }

    .control-row label {
      color: var(--text-muted);
      font-size: 11px;
      min-width: 62px;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
    }

    input[type="text"], input[type="password"], select, textarea {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 12px;
      flex: 1;
      user-select: text;
      min-width: 0;
      font-family: inherit;
    }

    textarea {
      width: 100%;
      resize: none;
      height: 52px;
      line-height: 1.4;
    }

    .pill-group {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 8px;
    }

    .pill-group::-webkit-scrollbar {
      display: none;
    }

    .pill {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 9px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .pill.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: #fff;
    }

    .font-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin-top: 6px;
    }

    @media (min-width: 768px) {
      .font-grid { grid-template-columns: repeat(4, 1fr); }
    }

    .font-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px;
      text-align: left;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .font-card.active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .font-card .sample {
      font-size: 14px;
      font-weight: 700;
    }

    .font-card .meta {
      font-size: 9px;
      color: var(--text-muted);
      font-family: 'Noto Sans TC', sans-serif;
    }

    .action-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .box-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 6px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
    }

    .box-btn.primary {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .box-btn.purple {
      border-color: var(--purple);
      background: rgba(168, 85, 247, 0.18);
      color: #e9d5ff;
    }

    .box-btn.cyan {
      border-color: var(--cyan);
      background: rgba(44, 230, 195, 0.16);
      color: #99f6e4;
    }

    .box-btn.danger {
      border-color: var(--danger);
      background: var(--danger-soft);
      color: #fca5a5;
    }

    .hidden-input {
      display: none;
    }

    #toast {
      position: fixed;
      top: 52px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(24, 26, 32, 0.96);
      border: 1px solid var(--accent);
      color: #fff;
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 12px;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div id="toast">提示訊息</div>

  <!-- Export Options Modal -->
  <div class="modal-backdrop" id="exportModalBackdrop">

  <!-- Top Bar -->
  <div class="topbar">

  <!-- Transport & Timeline Zoom + Magnetic Snap Control -->

  <!-- Bottom Drawer -->

  <input type="file" id="videoFileInput" class="hidden-input" accept="video/*,image/*" multiple />
  <input type="file" id="pipFileInput" class="hidden-input" accept="video/*,image/*" multiple />
  <input type="file" id="bgFileInput" class="hidden-input" accept="video/*,image/*" />

  <input type="file" id="fontFileInput" class="hidden-input" accept=".ttf,.otf,.woff,.woff2" />

  <script>
    // ====== 14 款免費開源繁體字體清單 ======
    const FREE_FONTS = [
      { name: '思源黑體', family: "'Noto Sans TC', sans-serif", cat: '現代', desc: '清晰百搭 · 教學解說' },
      { name: '台北黑體', family: "'Taipei Sans TC', 'Noto Sans TC', sans-serif", cat: '現代', desc: '俐落平衡 · Vlog字幕' },
      { name: '昭源黑體', family: "'Chiron Hei HK', sans-serif", cat: '現代', desc: '現代簡潔 · 時尚標題' },
      { name: '探空體', family: "'TASA Explorer', sans-serif", cat: '現代', desc: '未來科技 · 帥氣舞風' },
      { name: '芫荽體', family: "'Iansui', cursive", cat: '手寫', desc: '硬筆楷書 · 生活溫度' },
      { name: '霞鶩文楷', family: "'LXGW WenKai TC', serif", cat: '手寫', desc: '溫潤楷韻 · 古典抒情' },
      { name: '辰宇落雁體', family: "'ChenYuluoyan', cursive", cat: '手寫', desc: '飄逸手寫 · 感性歌詞' },
      { name: 'jf open 粉圓', family: "'jf-openhuninn', sans-serif", cat: '圓體', desc: '圓潤可愛 · 旅遊美食' },
      { name: '源泉圓體', family: "'GenSenRounded', sans-serif", cat: '圓體', desc: '飽滿圓角 · 親切活潑' },
      { name: '思源宋體', family: "'Noto Serif TC', serif", cat: '古典', desc: '典雅大氣 · 電影質感' },
      { name: '昭源宋體', family: "'Chiron Sung HK', serif", cat: '古典', desc: '文學書卷 · 藝文紀錄' },
      { name: '得意黑', family: "'Smiley Sans', sans-serif", cat: '特色', desc: '斜體張力 · 節拍標題' },
      { name: '俐方體11號', family: "'Cubic 11', monospace", cat: '特色', desc: '復古像素 · 趣味梗圖' },
      { name: '站酷快樂體', family: "'ZCOOL KuaiLe', sans-serif", cat: '特色', desc: '動感活潑 · 綜藝字卡' }
    ];

    const FILTER_PRESETS = [
      { id: 'none', name: '原圖', b: 100, c: 100, s: 100, warm: 0 },
      { id: 'dance', name: '練舞室高對比', b: 105, c: 122, s: 112, warm: -5 },
      { id: 'vlog', name: '日系清新 Vlog', b: 108, c: 94, s: 92, warm: 10 },
      { id: 'warm', name: '暖陽微光', b: 104, c: 105, s: 115, warm: 22 },
      { id: 'film', name: '復古膠片', b: 96, c: 114, s: 82, warm: 14 },
      { id: 'bw', name: '黑白極簡', b: 105, c: 125, s: 0, warm: 0 }
    ];

    const TRANSITIONS = [
      { id: 'none', name: '無轉場', icon: '｜' },
      { id: 'fade', name: '疊化淡入', icon: '◐' },
      { id: 'zoom', name: '節拍推進', icon: '⊕' },
      { id: 'flash', name: '節拍閃白', icon: '⚡' },
      { id: 'slide', name: '向左滑動', icon: '⇄' }
    ];

    const SPEED_PRESETS = [
      { val: 0.25, label: '0.25x 極慢' },
      { val: 0.5,  label: '0.5x 慢動作' },
      { val: 0.75, label: '0.75x' },
      { val: 1.0,  label: '1.0x 原速' },
      { val: 1.5,  label: '1.5x' },
      { val: 2.0,  label: '2.0x 快轉' },
      { val: 3.0,  label: '3.0x 縮時' }
    ];

    const BLEND_MODES = [
      { id: 'source-over', name: '正常覆蓋' },
      { id: 'screen', name: '濾色 (去黑底)' },
      { id: 'multiply', name: '正片疊底 (去白底)' },
      { id: 'overlay', name: '疊加融合' },
      { id: 'soft-light', name: '柔光融合' }
    ];

    const MASK_TYPES = [
      { id: 'none', name: '無遮罩' },
      { id: 'circle', name: '圓形' },
      { id: 'roundrect', name: '圓角矩形' },
      { id: 'feather', name: '四周羽化融合' },
      { id: 'pen', name: '✒️ 鋼筆自訂形狀' }
    ];

    const PETAL_COLORS = [
      { hex: '#ffb7c5', name: '櫻花粉' },
      { hex: '#e11d48', name: '玫瑰紅' },
      { hex: '#fff5f7', name: '純白花瓣' },
      { hex: '#fbbf24', name: '金箔感' }
    ];

    // ====== 核心時間精度與可調式磁吸對齊引擎 ======
    function roundSec(val) {
      return Math.round(val * 100) / 100;
    }

    let undoStack = [];
    const savedVoiceCfg = (() => {
      try { return JSON.parse(localStorage.getItem('cutvideo_voice_cfg') || '{}'); } catch (_) { return {}; }
    })();

    let state = {
      pxPerSec: 55,
      snapEnabled: true,
      snapThresholdPx: 14,
      ratio: '9:16',
      currentTime: 0,
      isPlaying: false,
      isExporting: false,
      activeTab: 'media',
      drawerCollapsed: false,
      canvasBoxMode: 'transform',
      lastSelectedType: 'clip',
      selectedClipId: null,
      selectedSubId: null,
      selectedAudioId: null,
      fontFilter: '全部',
      penEditMode: false,
      eyedropperMode: false,
      trackVisibility: {
        main: true,
        audio: true,
        sub: true
      },
      voiceConfig: {
        engine: savedVoiceCfg.engine || 'browser',
        browserVoiceURI: savedVoiceCfg.browserVoiceURI || '',
        rate: savedVoiceCfg.rate || 1.0,
        autoSyncPlayback: savedVoiceCfg.autoSyncPlayback !== false,
        provider: savedVoiceCfg.provider || 'elevenlabs',
        apiKey: savedVoiceCfg.apiKey || '',
        voiceId: savedVoiceCfg.voiceId || '',
        scriptDraft: ''
      },
      background: {
        mode: 'solid',
        color1: '#000000',
        color2: '#2d1b4e',
        mediaEl: null,
        mediaType: null,
        mediaName: ''
      },
      effects: {
        particleType: 'none',
        particleSize: 6,
        particleDensity: 45,
        particleSpeed: 1.0,
        petalColor: '#ffb7c5',
        spotlight: {
          enabled: false,
          angle: 0,
          focusX: 0.5,
          focusY: 0.55,
          spread: 0.34,
          darkness: 0.72,
          color: '#fff8e7'
        }
      },
      pipTracks: [
        { id: 'pip-track-1', name: '畫中畫 L1 (頂層)', visible: true, clips: [] }
      ],
      clips: [],
      subtitles: [],
      audioClips: []
    };

    function saveVoiceConfig() {
      try {
        const { scriptDraft, ...toPersist } = state.voiceConfig;
        localStorage.setItem('cutvideo_voice_cfg', JSON.stringify(toPersist));
      } catch (_) {}
    }

    function collectSnapTargets(excludeId = null) {
      const points = new Set([0, roundSec(state.currentTime)]);
      let acc = 0;
      state.clips.forEach(c => {
        points.add(roundSec(acc));
        acc += c.duration;
        points.add(roundSec(acc));
      });
      state.pipTracks.forEach(tr => {
        tr.clips.forEach(p => {
          if (p.id === excludeId) return;
          points.add(roundSec(p.start || 0));
          points.add(roundSec((p.start || 0) + p.duration));
        });
      });
      state.audioClips.forEach(a => {
        if (a.id === excludeId) return;
        points.add(roundSec(a.start || 0));
        points.add(roundSec((a.start || 0) + a.duration));
      });
      state.subtitles.forEach(s => {
        if (s.id === excludeId) return;
        points.add(roundSec(s.start));
        points.add(roundSec(s.start + s.duration));
      });
      return Array.from(points);
    }

    function snapTimeValue(rawSec, excludeId = null) {
      const clamped = Math.max(0, rawSec);
      if (!state.snapEnabled || state.snapThresholdPx <= 0) {
        return roundSec(clamped);
      }
      const thresholdSec = state.snapThresholdPx / state.pxPerSec;
      const targets = collectSnapTargets(excludeId);
      let bestTarget = clamped;
      let minDiff = thresholdSec;

      for (const t of targets) {
        const diff = Math.abs(clamped - t);
        if (diff <= minDiff) {
          minDiff = diff;
          bestTarget = t;
        }
      }
      return roundSec(bestTarget);
    }

    const toggleSnapBtn = document.getElementById('toggleSnapBtn');
    const snapStrengthRange = document.getElementById('snapStrengthRange');

    toggleSnapBtn.onclick = () => {
      state.snapEnabled = !state.snapEnabled;
      toggleSnapBtn.textContent = state.snapEnabled ? '🧲 磁吸:開' : '🧲 磁吸:關';
      toggleSnapBtn.classList.toggle('snap-on', state.snapEnabled);
      snapStrengthRange.disabled = !state.snapEnabled;
      showToast(state.snapEnabled ? `已開啟軌道磁吸對齊（靈敏度 ${state.snapThresholdPx}px）🧲` : '已關閉軌道磁吸（自由無段微調）');
    };

    snapStrengthRange.oninput = (e) => {
      state.snapThresholdPx = parseInt(e.target.value, 10);
      if (!state.snapEnabled) {
        state.snapEnabled = true;
        toggleSnapBtn.textContent = '🧲 磁吸:開';
        toggleSnapBtn.classList.add('snap-on');
      }
      showToast(`磁吸吸附範圍：${state.snapThresholdPx}px（${state.snapThresholdPx >= 22 ? '強吸附' : (state.snapThresholdPx <= 8 ? '弱吸附' : '適中')}）`);
    };

    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');
    const timelineScroll = document.getElementById('timelineScroll');
    const stageWrap = document.getElementById('stageWrap');
    const stageResizer = document.getElementById('stageResizer');
    const bottomDrawer = document.getElementById('bottomDrawer');

    // ====== 雙軌 AI 配音引擎 ======
    let availableSystemVoices = [];
    const spokenSubIdsThisRun = new Set();

    function refreshSystemVoices() {
      if (!('speechSynthesis' in window)) return;
      const list = window.speechSynthesis.getVoices();
      if (list && list.length > 0) {
        availableSystemVoices = [...list].sort((a, b) => {
          const aZh = a.lang.toLowerCase().includes('zh') ? 0 : 1;
          const bZh = b.lang.toLowerCase().includes('zh') ? 0 : 1;
          return aZh - bZh;
        });
        if (!state.voiceConfig.browserVoiceURI && availableSystemVoices.length > 0) {
          const twVoice = availableSystemVoices.find(v => v.lang.toLowerCase().includes('tw')) || availableSystemVoices[0];
          state.voiceConfig.browserVoiceURI = twVoice.voiceURI;
        }
      }
    }

    if ('speechSynthesis' in window) {
      refreshSystemVoices();
      window.speechSynthesis.onvoiceschanged = () => {
        refreshSystemVoices();
        if (state.activeTab === 'voice') renderDrawer();
      };
    }

    function speakWithBrowserTTS(text) {
      if (!('speechSynthesis' in window) || !text) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.rate = state.voiceConfig.rate || 1.0;
      utter.lang = 'zh-TW';
      if (state.voiceConfig.browserVoiceURI) {
        const matched = availableSystemVoices.find(v => v.voiceURI === state.voiceConfig.browserVoiceURI);
        if (matched) utter.voice = matched;
      }
      window.speechSynthesis.speak(utter);
    }

    async function fetchClonedVoiceBlob(text) {
      const vc = state.voiceConfig;
      if (!vc.apiKey) throw new Error('請先貼上 API Key 才能使用克隆聲音生成');
      const cleanText = text.replace(/\|/g, '，').trim();

      if (vc.provider === 'elevenlabs') {
        const vid = vc.voiceId || '21m00Tcm4TlvDq8ikWAM';
        const res = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${encodeURIComponent(vid)}`, {
          method: 'POST',
          headers: {
            'xi-api-key': vc.apiKey.trim(),
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            text: cleanText,
            model_id: 'eleven_multilingual_v2'
          })
        });
        if (!res.ok) throw new Error(`ElevenLabs 錯誤 (${res.status})：請檢查金鑰與 Voice ID`);
        return await res.blob();
      } else {
        const voiceName = vc.voiceId || 'nova';
        const res = await fetch('https://api.openai.com/v1/audio/speech', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${vc.apiKey.trim()}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: 'tts-1',
            input: cleanText,
            voice: voiceName
          })
        });
        if (!res.ok) throw new Error(`OpenAI TTS 錯誤 (${res.status})：請檢查 API Key`);
        return await res.blob();
      }
    }

    function attachAudioBlobToTimeline(blob, labelName, startSec, linkedSub = null) {
      return new Promise((resolve) => {
        const url = URL.createObjectURL(blob);
        const audioEl = new Audio(url);
        audioEl.preload = 'auto';
        ensureAudioNode(audioEl);

        audioEl.onloadedmetadata = () => {
          const realDur = (audioEl.duration && isFinite(audioEl.duration)) ? roundSec(audioEl.duration) : 2.5;
          const id = 'aud-ai-' + Date.now() + Math.random();
          state.audioClips.push({
            id,
            name: labelName.slice(0, 14),
            fromVideo: false,
            isAI: true,
            start: roundSec(startSec),
            trimStart: 0,
            duration: realDur,
            maxDuration: realDur,
            gain: 1.15,
            muted: false,
            mediaEl: audioEl
          });
          if (linkedSub && linkedSub.duration < realDur) {
            linkedSub.duration = realDur;
          }
          state.selectedAudioId = id;
          resolve(realDur);
        };
      });
    }

      if (!raw) return showToast('請先在文字框輸入講稿（一行一句）');

    let resizingStage = false;

    let resizeStartH = 230;

    stageResizer.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      resizingStage = true;
      resizeStartY = e.clientY;
      resizeStartH = stageWrap.getBoundingClientRect().height;

    // ====== Web Audio API 混音增益與匯出音訊引擎 ======
    let sharedAudioCtx = null;
    let exportMixDest = null;

    function getAudioCtx() {
      if (!sharedAudioCtx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          sharedAudioCtx = new AudioCtx();
          exportMixDest = sharedAudioCtx.createMediaStreamDestination();
        }
      }
      if (sharedAudioCtx && sharedAudioCtx.state === 'suspended') {
        sharedAudioCtx.resume().catch(() => {});
      }
      return sharedAudioCtx;
    }

    function ensureAudioNode(mediaEl) {
      if (!mediaEl || mediaEl._gainNode) return mediaEl?._gainNode;
      const actx = getAudioCtx();
      if (!actx) return null;
      try {
        const src = actx.createMediaElementSource(mediaEl);
        const gainNode = actx.createGain();
        src.connect(gainNode);
        gainNode.connect(actx.destination);
        if (exportMixDest) gainNode.connect(exportMixDest);
        mediaEl._gainNode = gainNode;
        return gainNode;
      } catch (err) {
        return null;
      }
    }

    function applyMediaAudioGain(mediaEl, muted, gainValue) {
      if (!mediaEl) return;
      mediaEl.muted = Boolean(muted);
      const effectiveGain = muted ? 0 : Math.max(0, Math.min(3.0, gainValue ?? 1.0));
      const gNode = ensureAudioNode(mediaEl);
      if (gNode && sharedAudioCtx) {
        gNode.gain.setValueAtTime(effectiveGain, sharedAudioCtx.currentTime);
        mediaEl.volume = 1.0;
      } else {
        mediaEl.volume = Math.min(1.0, effectiveGain);
      }
    }

    function createClonedVideoElement(srcUrl, initialSeekTime) {
      const vid = document.createElement('video');
      vid.src = srcUrl;
      vid.preload = 'auto';
      vid.playsInline = true;
      vid.setAttribute('playsinline', '');
      vid.setAttribute('webkit-playsinline', '');
      ensureAudioNode(vid);

      vid.onloadeddata = () => {
        requestVideoSeek(vid, initialSeekTime);
      };

      vid.onseeked = () => {
        renderFrame();
        if (typeof vid._pendingSeekTime === 'number') {
          const nextT = vid._pendingSeekTime;
          vid._pendingSeekTime = null;
          if (Math.abs(vid.currentTime - nextT) > 0.008) {
            vid.currentTime = nextT;
          }
        }
      };

      vid.load();
      return vid;
    }

    // ====== 確定性粒子種子 ======
    const PARTICLE_SEEDS = Array.from({ length: 150 }, (_, i) => ({
      x0: ((i * 73) % 100) / 100,
      y0: ((i * 37) % 100) / 100,
      speedMul: 0.65 + ((i * 19) % 70) / 100,
      sizeMul: 0.6 + ((i * 29) % 80) / 100,
      phase: (i * 1.7) % (Math.PI * 2),
      swayAmp: 0.02 + ((i * 13) % 40) / 1000,
      rotSpeed: ((i % 2 === 0 ? 1 : -1) * (1.2 + (i % 5) * 0.4))
    }));

    const offCanvas = document.createElement('canvas');
    const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });
    const maskCanvas = document.createElement('canvas');
    const maskCtx = maskCanvas.getContext('2d');

    // ====== MediaPipe AI 人像去背 ======
    let selfieSeg = null;
    let latestSegMask = null;
    let segBusy = false;

    function initAISegmentation() {
      if (selfieSeg || typeof SelfieSegmentation === 'undefined') return;
      try {
        selfieSeg = new SelfieSegmentation({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
        });
        selfieSeg.setOptions({ modelSelection: 1, selfieMode: false });
        selfieSeg.onResults((results) => {
          latestSegMask = results.segmentationMask;
          segBusy = false;
          renderFrame();
        });
      } catch (err) {}
    }

    function runAISegmentation(sourceEl) {
      initAISegmentation();
      if (!selfieSeg || segBusy || !sourceEl) return;
      if (sourceEl.tagName === 'VIDEO' && sourceEl.readyState < 2) return;
      segBusy = true;
      selfieSeg.send({ image: sourceEl }).catch(() => { segBusy = false; });
    }

    // ====== 時間軸縮放滑桿 ======
    const zoomRange = document.getElementById('timelineZoomRange');
    zoomRange.addEventListener('input', (e) => {
      const anchorTime = state.currentTime;
      state.pxPerSec = parseInt(e.target.value, 10);
      renderTimeline();
      timelineScroll.scrollLeft = Math.round(anchorTime * state.pxPerSec);
    });

    function getSelectedVisualClip() {
      if (state.lastSelectedType === 'pip' && state.selectedClipId) {
        for (const tr of state.pipTracks) {
          const found = tr.clips.find(c => c.id === state.selectedClipId);
          if (found) return { clip: found, isPip: true, track: tr };
        }
      }
      if (state.selectedClipId) {
        const mainFound = state.clips.find(c => c.id === state.selectedClipId);
        if (mainFound) return { clip: mainFound, isPip: false, track: null };
        for (const tr of state.pipTracks) {
          const found = tr.clips.find(c => c.id === state.selectedClipId);
          if (found) return { clip: found, isPip: true, track: tr };
        }
      }
      if (state.clips.length > 0) return { clip: state.clips[0], isPip: false, track: null };
      for (const tr of state.pipTracks) {
        if (tr.clips.length > 0) return { clip: tr.clips[0], isPip: true, track: tr };
      }
      return null;
    }

    function createDefaultClipProps(overrides = {}) {
      return {
        trimStart: 0,
        start: 0,
        duration: 5,
        maxDuration: 60,
        speed: 1.0,
        muted: false,

        fadeIn: { type: 'none', dur: 0.8 },
        fadeOut: { type: 'none', dur: 0.8 },
        opacity: 1.0,
        blendMode: 'source-over',
        color: { b: 100, c: 100, s: 100, warm: 0 },
        cutout: {
          mode: 'none',
          keyColor: '#00ff00',
          tolerance: 65,
          smoothness: 15
        },
        mask: {

          penPoints: []
        },

        crop: { left: 0, right: 0, top: 0, bottom: 0 },

        ...overrides
      };
    }

    function requestVideoSeek(vid, targetTime) {
      if (!vid || vid.tagName !== 'VIDEO') return;
      const dur = (vid.duration && isFinite(vid.duration)) ? vid.duration : 999;
      const clamped = Math.max(0.01, Math.min(dur - 0.01, targetTime));

      if (vid.seeking) {
        vid._pendingSeekTime = clamped;
        return;
      }

      if (Math.abs(vid.currentTime - clamped) < 0.008) {
        renderFrame();
        return;
      }

      vid._pendingSeekTime = null;
      vid.currentTime = clamped;
    }

    function applyClipSpeed(clip, newSpeed, saveUndo = true) {
      if (!clip) return;
      const clampedSpeed = Math.max(0.25, Math.min(4.0, Math.round(newSpeed * 100) / 100));
      if (Math.abs(clip.speed - clampedSpeed) < 0.001) return;

      if (saveUndo) pushUndo();
      const sourceSpan = clip.duration * clip.speed;
      clip.speed = clampedSpeed;
      clip.duration = roundSec(Math.max(0.25, sourceSpan / clampedSpeed));

      if (clip.mediaEl && clip.mediaEl.tagName === 'VIDEO') {
        clip.mediaEl.playbackRate = clampedSpeed;
      }

      renderTimeline();
      renderDrawer();
      syncVideoElements(true);
      renderFrame();
    }

    function cloneClipData(c) {
      return {
        ...c,
        fadeIn: { ...(c.fadeIn || { type: 'none', dur: 0.8 }) },
        fadeOut: { ...(c.fadeOut || { type: 'none', dur: 0.8 }) },
        baseTransform: { ...(c.baseTransform || { scaleX: 1.0, scaleY: 1.0, x: 0, y: 0, rot: 0 }) },
        crop: { ...(c.crop || { left: 0, right: 0, top: 0, bottom: 0 }) },
        keyframes: JSON.parse(JSON.stringify(c.keyframes || [])),
        color: { ...c.color },
        cutout: { ...c.cutout },
        mask: { ...c.mask, penPoints: JSON.parse(JSON.stringify(c.mask.penPoints || [])) }

    function pushUndo() {
      const snapshot = {
        clips: state.clips.map(cloneClipData),
        pipTracks: state.pipTracks.map(tr => ({
          ...tr,
          visible: tr.visible !== false,
          clips: tr.clips.map(cloneClipData)
        })),
        subtitles: JSON.parse(JSON.stringify(state.subtitles)),
        audioClips: state.audioClips.map(a => ({ ...a })),
        trackVisibility: { ...state.trackVisibility },
        selectedClipId: state.selectedClipId,
        selectedSubId: state.selectedSubId,
        selectedAudioId: state.selectedAudioId,
        lastSelectedType: state.lastSelectedType
      };
      undoStack.push(snapshot);
      if (undoStack.length > 25) undoStack.shift();
    }

    function undoLastAction() {
      if (undoStack.length === 0) return showToast('目前沒有可復原的操作');
      const prev = undoStack.pop();
      state.clips = prev.clips;
      state.pipTracks = prev.pipTracks;
      state.subtitles = prev.subtitles;
      state.audioClips = prev.audioClips;
      state.trackVisibility = prev.trackVisibility || { main: true, audio: true, sub: true };
      state.selectedClipId = prev.selectedClipId;
      state.selectedSubId = prev.selectedSubId;
      state.selectedAudioId = prev.selectedAudioId;
      state.lastSelectedType = prev.lastSelectedType;
      updateDeleteButtonLabel();
      renderTimeline();
      renderDrawer();
      syncVideoElements(true);
      renderFrame();
      showToast('已復原上一步 ↩️');

    document.getElementById('undoBtn').onclick = undoLastAction;

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.opacity = '1';
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.style.opacity = '0', 2300);

    function getTotalDuration() {
      const mainDur = state.clips.reduce((acc, c) => acc + c.duration, 0);
      let pipEnd = 0;
      state.pipTracks.forEach(tr => {
        tr.clips.forEach(c => {
          pipEnd = Math.max(pipEnd, (c.start || 0) + c.duration);
        });
      });
      const subEnd = state.subtitles.reduce((max, s) => Math.max(max, s.start + s.duration), 0);
      const audEnd = state.audioClips.reduce((max, a) => Math.max(max, (a.start || 0) + a.duration), 0);
      return roundSec(Math.max(mainDur, pipEnd, subEnd, audEnd, 1));
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = (sec % 60).toFixed(1);
      return `${String(m).padStart(2, '0')}:${s.padStart(4, '0')}`;
    }

    function seekTo(sec) {
      state.currentTime = roundSec(Math.max(0, Math.min(getTotalDuration(), sec)));
      timelineScroll.scrollLeft = Math.round(state.currentTime * state.pxPerSec);
      syncVideoElements(true);
      renderFrame();
    }

    function updateDeleteButtonLabel() {
      const btn = document.getElementById('deleteSelectedBtn');
      if (state.lastSelectedType === 'sub' && state.selectedSubId) {
        btn.innerHTML = '🗑️ 刪字幕';
      } else if (state.lastSelectedType === 'audio' && state.selectedAudioId) {
        btn.innerHTML = '🗑️ 刪音軌';
