<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CutVideo</title>
  <!-- Google Fonts & 開源免費繁體字體庫 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chiron+Hei+HK:wght@400;700&family=Chiron+Sung+HK:wght@400;700&family=Iansui&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;700;900&family=Noto+Serif+TC:wght@400;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <!-- MediaPipe Selfie Segmentation -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/npm/open-huninn-font@1.1.0/font.css');
    @import url('https://cdn.jsdelivr.net/npm/cubic-11@1.0.1/fonts/web/cubic-11.css');
    @import url('https://cdn.jsdelivr.net/npm/smiley-sans@2.0.1/dist/smiley-sans.css');

    @font-face {
      font-family: 'Taipei Sans TC';
      src: url('https://cdn.jsdelivr.net/gh/max32002/taipeisanstc@master/webfont/TaipeiSansTCBeta-Regular.woff2') format('woff2');
      font-display: swap;
    }
    @font-face {
      font-family: 'ChenYuluoyan';
      src: url('https://cdn.jsdelivr.net/gh/Chenyu-otf/chenyuluoyan_thin@main/ChenYuluoyan-Thin-Monospaced.woff2') format('woff2');
      font-display: swap;
    }
    @font-face {
      font-family: 'GenSenRounded';
      src: url('https://cdn.jsdelivr.net/gh/ButTaiwan/gensen-font@master/webfont/GenSenRounded-M.woff2') format('woff2');
      font-display: swap;
    }
    @font-face {
      font-family: 'TASA Explorer';
      src: url('https://cdn.jsdelivr.net/gh/ButTaiwan/tasa-explorer@main/webfont/TASAExplorer-Medium.woff2') format('woff2');
      font-display: swap;
    }

    :root {
      --bg-dark: #0e0f13;
      --bg-panel: #171920;
      --bg-card: #21242e;
      --accent: #ff3b7f;
      --accent-soft: rgba(255, 59, 127, 0.2);
      --danger: #ef4444;
      --danger-soft: rgba(239, 68, 68, 0.18);
      --gold: #ffcc33;
      --cyan: #2ce6c3;
      --purple: #a855f7;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #2b2f3b;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Bar */
    .topbar {
      height: 44px;
      padding: 0 12px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .brand {
      font-weight: 900;
      font-size: 16px;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand span {
      background: linear-gradient(135deg, #ff3b7f, #ff8a3d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .shortcut-badge {
      display: none;
      font-size: 10px;
      color: var(--text-muted);
      background: var(--bg-card);
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    @media (min-width: 820px) {
      .shortcut-badge { display: inline-block; }
    }

    .ratio-group {
      display: flex;
      background: var(--bg-card);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
    }

    .ratio-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
    }

    .ratio-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .btn-export {
      background: linear-gradient(135deg, #ff3b7f, #ff6b4a);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Stage / Preview Area */
    .stage-wrap {
      flex: 1;
      min-height: 135px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #08090c;
      position: relative;
      padding: 6px;
      overflow: hidden;
    }

    canvas#previewCanvas {
      background: #000;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.8);
      border-radius: 6px;
      max-width: 100%;
      max-height: 100%;
      touch-action: none;
      cursor: grab;
    }

    canvas#previewCanvas:active {
      cursor: grabbing;
    }

    .stage-hint {
      position: absolute;
      top: 6px;
      left: 10px;
      background: rgba(0, 0, 0, 0.68);
      color: #d1d5db;
      font-size: 10px;
      padding: 3px 9px;
      border-radius: 99px;
      pointer-events: none;
      max-width: 92%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Transport & Timeline Zoom Bar */
    .transport {
      height: 42px;
      background: var(--bg-panel);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      gap: 6px;
      flex-shrink: 0;
    }

    .time-readout {
      font-variant-numeric: tabular-nums;
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .time-readout strong {
      color: var(--text-main);
    }

    .play-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: none;
      background: var(--text-main);
      color: var(--bg-dark);
      font-size: 12px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .quick-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      padding: 2px 0;
    }

    .quick-actions::-webkit-scrollbar {
      display: none;
    }

    .chip-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      font-size: 11px;
      font-weight: 600;
      padding: 4px 7px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }

    .chip-btn:active {
      transform: scale(0.96);
    }

    .chip-btn.danger {
      background: var(--danger-soft);
      border-color: var(--danger);
      color: #fca5a5;
    }

    .chip-btn.danger:hover {
      background: var(--danger);
      color: #fff;
    }

    .zoom-box {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .zoom-box span {
      font-size: 10px;
      color: var(--text-muted);
    }

    .zoom-box input[type="range"] {
      width: 58px;
      height: 14px;
      accent-color: var(--cyan);
    }

    @media (min-width: 768px) {
      .zoom-box input[type="range"] { width: 95px; }
    }

    /* Multi-Layer Timeline */
    .timeline-area {
      height: 164px;
      background: #121419;
      position: relative;
      overflow-x: auto;
      overflow-y: auto;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      scroll-behavior: auto;
      cursor: grab;
      touch-action: none;
    }

    .timeline-area.grabbing {
      cursor: grabbing;
    }

    .timeline-inner {
      position: relative;
      min-height: 100%;
      min-width: 100%;
      padding: 24px 50vw 12px 50vw;
    }

    .ruler {
      position: absolute;
      top: 0;
      left: 50vw;
      height: 20px;
      border-bottom: 1px solid #2a2e3b;
      display: flex;
      font-size: 10px;
      color: var(--text-muted);
    }

    .playhead {
      position: fixed;
      left: 50%;
      width: 2px;
      height: 164px;
      background: #fff;
      z-index: 25;
      pointer-events: none;
      box-shadow: 0 0 6px rgba(255,255,255,0.85);
    }

    .playhead::before {
      content: '';
      position: absolute;
      top: 0;
      left: -5px;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 8px solid #fff;
    }

    .track-row {
      height: 34px;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      position: relative;
      border-radius: 6px;
      transition: background 0.15s;
    }

    .track-row.pip-track {
      background: rgba(168, 85, 247, 0.06);
      border-left: 2px solid var(--purple);
    }

    .track-row.main-track {
      background: rgba(59, 130, 246, 0.05);
      border-left: 2px solid #3b82f6;
    }

    .track-row.audio-track {
      background: rgba(44, 230, 195, 0.04);
      border-left: 2px solid var(--cyan);
    }

    .track-row.drop-target {
      background: rgba(255, 204, 51, 0.18) !important;
      outline: 1.5px dashed var(--gold);
    }

    .track-badge {
      position: sticky;
      left: 4px;
      z-index: 12;
      font-size: 9px;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 4px;
      background: rgba(15, 16, 20, 0.85);
      color: var(--text-muted);
      margin-right: 6px;
      pointer-events: none;
      flex-shrink: 0;
    }

    .empty-track-hint {
      font-size: 11px;
      color: #9ca3af;
      border: 1px dashed #4b5563;
      border-radius: 6px;
      padding: 5px 10px;
      cursor: pointer;
      white-space: nowrap;
      background: rgba(255,255,255,0.02);
    }

    .empty-track-hint:hover {
      border-color: var(--accent);
      color: #fff;
    }

    /* Clip Block & Trim Handles */
    .clip-block {
      height: 32px;
      background: linear-gradient(90deg, #2b3244, #384158);
      border: 1.5px solid #4c5670;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      position: relative;
      overflow: visible;
      white-space: nowrap;
      padding: 0 16px;
      flex-shrink: 0;
      touch-action: none;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .clip-block.pip-clip {
      position: absolute;
      background: linear-gradient(90deg, #3b2654, #523475);
      border-color: #8b5cf6;
    }

    .clip-block.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 1.5px var(--accent);
    }

    .clip-block.reordering {
      border-color: var(--gold) !important;
      background: linear-gradient(135deg, #5c481d, #826526) !important;
      box-shadow: 0 8px 20px rgba(255, 204, 51, 0.55), 0 0 0 2px var(--gold) !important;
      transform: translateY(-4px) scale(1.04);
      z-index: 40;
      cursor: move;
    }

    .clip-label {
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }

    .trim-handle {
      position: absolute;
      top: -1px;
      bottom: -1px;
      width: 15px;
      background: rgba(255, 255, 255, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: ew-resize;
      z-index: 15;
      touch-action: none;
    }

    .trim-handle:hover, .trim-handle.active {
      background: var(--accent);
    }

    .trim-handle.left {
      left: -1px;
      border-radius: 5px 0 0 5px;
      border-right: 1px solid rgba(255,255,255,0.45);
    }

    .trim-handle.right {
      right: -1px;
      border-radius: 0 5px 5px 0;
      border-left: 1px solid rgba(255,255,255,0.45);
    }

    .trim-handle::after {
      content: '⋮';
      font-size: 11px;
      color: #fff;
      font-weight: bold;
    }

    .trans-node {
      width: 20px;
      height: 20px;
      margin: 0 2px;
      z-index: 5;
      background: var(--bg-panel);
      border: 1.5px solid var(--cyan);
      color: var(--cyan);
      border-radius: 5px;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .kf-diamond {
      position: absolute;
      width: 8px;
      height: 8px;
      background: var(--gold);
      transform: translateX(-50%) rotate(45deg);
      top: 2px;
      border: 1px solid #000;
      pointer-events: none;
    }

    .sub-block {
      position: absolute;
      height: 26px;
      background: rgba(255, 59, 127, 0.28);
      border: 1px solid var(--accent);
      border-radius: 5px;
      font-size: 10px;
      padding: 0 15px;
      display: flex;
      align-items: center;
      color: #ffd1e1;
      white-space: nowrap;
      touch-action: none;
    }

    .sub-block.selected {
      background: rgba(255, 59, 127, 0.6);
      color: #fff;
      box-shadow: 0 0 0 1.5px #fff;
    }

    /* 獨立音訊片段方塊（支援頭尾白條裁切、長按左右拖移、分割與增益） */
    .audio-clip-block {
      position: absolute;
      height: 28px;
      background: linear-gradient(90deg, rgba(20, 184, 166, 0.35), rgba(44, 230, 195, 0.25));
      border: 1.5px solid var(--cyan);
      border-radius: 6px;
      font-size: 10px;
      font-weight: 600;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ccfbf1;
      white-space: nowrap;
      touch-action: none;
      cursor: pointer;
    }

    .audio-clip-block.selected {
      background: rgba(44, 230, 195, 0.5);
      color: #fff;
      border-color: #fff;
      box-shadow: 0 0 0 1.5px var(--cyan);
    }

    /* Tool Drawer */
    .drawer {
      background: var(--bg-panel);
      height: 232px;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .drawer-content {
      flex: 1;
      padding: 9px 12px;
      overflow-y: auto;
      font-size: 12px;
    }

    .nav-tabs {
      height: 50px;
      background: #121318;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      flex-shrink: 0;
      overflow-x: auto;
    }

    .nav-tab {
      background: none;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 10px;
      cursor: pointer;
      padding: 4px 5px;
      white-space: nowrap;
    }

    .nav-tab.active {
      color: var(--accent);
      font-weight: 700;
    }

    .nav-tab span.icon {
      font-size: 15px;
    }

    /* Controls inside Drawer */
    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      gap: 8px;
    }

    .control-row label {
      color: var(--text-muted);
      font-size: 11px;
      min-width: 62px;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
    }

    input[type="text"], select {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 12px;
      flex: 1;
      user-select: text;
      min-width: 0;
    }

    .pill-group {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 8px;
    }

    .pill-group::-webkit-scrollbar {
      display: none;
    }

    .pill {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 9px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .pill.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: #fff;
    }

    .font-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin-top: 6px;
    }

    @media (min-width: 768px) {
      .font-grid { grid-template-columns: repeat(4, 1fr); }
    }

    .font-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px;
      text-align: left;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .font-card.active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .font-card .sample {
      font-size: 14px;
      font-weight: 700;
    }

    .font-card .meta {
      font-size: 9px;
      color: var(--text-muted);
      font-family: 'Noto Sans TC', sans-serif;
    }

    .action-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .box-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 6px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
    }

    .box-btn.primary {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .box-btn.purple {
      border-color: var(--purple);
      background: rgba(168, 85, 247, 0.18);
      color: #e9d5ff;
    }

    .box-btn.cyan {
      border-color: var(--cyan);
      background: rgba(44, 230, 195, 0.16);
      color: #99f6e4;
    }

    .box-btn.danger {
      border-color: var(--danger);
      background: var(--danger-soft);
      color: #fca5a5;
    }

    .hidden-input {
      display: none;
    }

    #toast {
      position: fixed;
      top: 52px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(24, 26, 32, 0.96);
      border: 1px solid var(--accent);
      color: #fff;
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 12px;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div id="toast">提示訊息</div>

  <!-- Top Bar -->
  <div class="topbar">
    <div class="brand">
      🎬 <span>CutVideo</span>
      <span class="shortcut-badge">匯出自動混音背景音樂與影片原聲 · 支援影片轉音軌 · 音軌可拉頭尾裁切與增益</span>
    </div>
    <div class="ratio-group">
      <button class="ratio-btn active" data-ratio="9:16">9:16</button>
      <button class="ratio-btn" data-ratio="16:9">16:9</button>
      <button class="ratio-btn" data-ratio="1:1">1:1</button>
    </div>
    <button class="btn-export" id="exportBtn">匯出影片</button>
  </div>

  <!-- Stage -->
  <div class="stage-wrap">
    <div class="stage-hint" id="stageHint">支援匯入影片轉獨立音軌 · 音軌可拉頭尾裁切、靜音與增益</div>
    <canvas id="previewCanvas" width="360" height="640"></canvas>
  </div>

  <!-- Transport & Timeline Zoom Control -->
  <div class="transport">
    <div class="time-readout"><strong id="curTimeLabel">00:00.0</strong>/<span id="totTimeLabel">00:01.0</span></div>
    <button class="play-btn" id="playBtn" title="播放/暫停 (Space)">▶</button>
    <div class="quick-actions">
      <button class="chip-btn" id="splitBtn" title="分割片段/音軌 (S)">✂️ 分割</button>
      <button class="chip-btn danger" id="deleteSelectedBtn" title="刪除選取項目 (Delete)">🗑️ 刪除</button>
      <button class="chip-btn" id="undoBtn" title="復原上一步 (Ctrl+Z)">↩️ 復原</button>
      <button class="chip-btn" id="clearAllBtn" title="清空全部軌道">🧹 清空</button>
    </div>
    <div class="zoom-box" title="調整時間軸顯示間距">
      <span>🔍</span>
      <input type="range" id="timelineZoomRange" min="15" max="180" step="5" value="55">
    </div>
  </div>

  <!-- Multi-Layer Timeline -->
  <div class="timeline-area" id="timelineScroll">
    <div class="playhead"></div>
    <div class="timeline-inner" id="timelineInner">
      <div class="ruler" id="ruler"></div>
      <div id="tracksContainer"></div>
    </div>
  </div>

  <!-- Bottom Drawer -->
  <div class="drawer">

    // ====== 核心狀態 ======

    let state = {

    const canvas = document.getElementById('previewCanvas');

    const timelineScroll = document.getElementById('timelineScroll');

    // ====== Web Audio API 混音增益與匯出音訊引擎（支援 0%~300% 增益 ＋ 雙軌即時混音匯出） ======
    let sharedAudioCtx = null;
    let exportMixDest = null;

    function getAudioCtx() {
      if (!sharedAudioCtx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          sharedAudioCtx = new AudioCtx();
          exportMixDest = sharedAudioCtx.createMediaStreamDestination();
        }
      }
      if (sharedAudioCtx && sharedAudioCtx.state === 'suspended') {
        sharedAudioCtx.resume().catch(() => {});
      }
      return sharedAudioCtx;
    }

    // 將任何 HTMLVideoElement 或 HTMLAudioElement 接入 Web Audio GainNode（支援超過 100% 的增益放大，同時分流到喇叭與匯出錄製端）
    function ensureAudioNode(mediaEl) {
      if (!mediaEl || mediaEl._gainNode) return mediaEl?._gainNode;
      const actx = getAudioCtx();
      if (!actx) return null;
      try {
        const src = actx.createMediaElementSource(mediaEl);
        const gainNode = actx.createGain();
        src.connect(gainNode);
        gainNode.connect(actx.destination);
        if (exportMixDest) gainNode.connect(exportMixDest);
        mediaEl._gainNode = gainNode;
        return gainNode;
      } catch (err) {
        return null;
      }
    }

    function applyMediaAudioGain(mediaEl, muted, gainValue) {
      if (!mediaEl) return;
      mediaEl.muted = Boolean(muted);
      const effectiveGain = muted ? 0 : Math.max(0, Math.min(3.0, gainValue ?? 1.0));
      const gNode = ensureAudioNode(mediaEl);
      if (gNode && sharedAudioCtx) {
        gNode.gain.setValueAtTime(effectiveGain, sharedAudioCtx.currentTime);
        mediaEl.volume = 1.0; // 由 GainNode 控制 0~300% 精準增益
      } else {
        mediaEl.volume = Math.min(1.0, effectiveGain);
      }
    }

    // ====== 確定性粒子種子 ======
    const PARTICLE_SEEDS = Array.from({ length: 150 }, (_, i) => ({
      x0: ((i * 73) % 100) / 100,
      y0: ((i * 37) % 100) / 100,
      speedMul: 0.65 + ((i * 19) % 70) / 100,
      sizeMul: 0.6 + ((i * 29) % 80) / 100,
      phase: (i * 1.7) % (Math.PI * 2),
      swayAmp: 0.02 + ((i * 13) % 40) / 1000,
      rotSpeed: ((i % 2 === 0 ? 1 : -1) * (1.2 + (i % 5) * 0.4))
    }));

    const offCanvas = document.createElement('canvas');
    const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });
    const maskCanvas = document.createElement('canvas');
    const maskCtx = maskCanvas.getContext('2d');

    // ====== MediaPipe AI 人像去背 ======
    let selfieSeg = null;
    let latestSegMask = null;
    let segBusy = false;

    function initAISegmentation() {
      if (selfieSeg || typeof SelfieSegmentation === 'undefined') return;
      try {
        selfieSeg = new SelfieSegmentation({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
        });
        selfieSeg.setOptions({ modelSelection: 1, selfieMode: false });
        selfieSeg.onResults((results) => {
          latestSegMask = results.segmentationMask;
          segBusy = false;
          renderFrame();
        });
      } catch (err) {}
    }

    function runAISegmentation(sourceEl) {
      initAISegmentation();
      if (!selfieSeg || segBusy || !sourceEl) return;
      if (sourceEl.tagName === 'VIDEO' && sourceEl.readyState < 2) return;
      segBusy = true;
      selfieSeg.send({ image: sourceEl }).catch(() => { segBusy = false; });
    }

    // ====== 時間軸縮放滑桿 ======
    const zoomRange = document.getElementById('timelineZoomRange');
    zoomRange.addEventListener('input', (e) => {
      const anchorTime = state.currentTime;
      state.pxPerSec = parseInt(e.target.value, 10);
      renderTimeline();
      timelineScroll.scrollLeft = anchorTime * state.pxPerSec;
    });

    function getSelectedVisualClip() {
      if (state.lastSelectedType === 'pip' && state.selectedClipId) {
        for (const tr of state.pipTracks) {
          const found = tr.clips.find(c => c.id === state.selectedClipId);
          if (found) return { clip: found, isPip: true, track: tr };
        }
      }
      if (state.selectedClipId) {
        const mainFound = state.clips.find(c => c.id === state.selectedClipId);
        if (mainFound) return { clip: mainFound, isPip: false, track: null };
        for (const tr of state.pipTracks) {
          const found = tr.clips.find(c => c.id === state.selectedClipId);
          if (found) return { clip: found, isPip: true, track: tr };
        }
      }
      if (state.clips.length > 0) return { clip: state.clips[0], isPip: false, track: null };
      for (const tr of state.pipTracks) {
        if (tr.clips.length > 0) return { clip: tr.clips[0], isPip: true, track: tr };
      }
      return null;
    }

    function createDefaultClipProps(overrides = {}) {
      return {
        trimStart: 0,
        start: 0,
        duration: 5,
        maxDuration: 60,
        speed: 1.0,
        muted: false,      // 影片原聲靜音開關

        transitionAfter: 'none',

        fadeOut: { type: 'none', dur: 0.8 },
        opacity: 1.0,
        blendMode: 'source-over',
        color: { b: 100, c: 100, s: 100, warm: 0 },
        cutout: {
          mode: 'none',
          keyColor: '#00ff00',
          tolerance: 65,
          smoothness: 15
        },
        mask: {
          type: 'none',
          feather: 12,
          penPoints: []
        },
        keyframes: [{ t: 0, scale: 1.0, x: 0, y: 0, rot: 0 }],

      };
    }

    function requestVideoSeek(vid, targetTime) {
      if (!vid || vid.tagName !== 'VIDEO') return;
      const dur = (vid.duration && isFinite(vid.duration)) ? vid.duration : 999;
      const clamped = Math.max(0.01, Math.min(dur - 0.01, targetTime));

      if (vid.seeking) {
        vid._pendingSeekTime = clamped;
        return;
      }

      if (Math.abs(vid.currentTime - clamped) < 0.008) {
        renderFrame();
        return;
      }

      vid._pendingSeekTime = null;
      vid.currentTime = clamped;
    }

    function applyClipSpeed(clip, newSpeed, saveUndo = true) {
      if (!clip) return;
      const clampedSpeed = Math.max(0.25, Math.min(4.0, Math.round(newSpeed * 100) / 100));
      if (Math.abs(clip.speed - clampedSpeed) < 0.001) return;

      if (saveUndo) pushUndo();
      const sourceSpan = clip.duration * clip.speed;
      clip.speed = clampedSpeed;
      clip.duration = Math.max(0.25, sourceSpan / clampedSpeed);

      if (clip.mediaEl && clip.mediaEl.tagName === 'VIDEO') {
        clip.mediaEl.playbackRate = clampedSpeed;
      }

      renderTimeline();
      renderDrawer();
      syncVideoElements(true);
      renderFrame();
    }

    function cloneClipData(c) {
      return {
        ...c,
        fadeIn: { ...(c.fadeIn || { type: 'none', dur: 0.8 }) },
        fadeOut: { ...(c.fadeOut || { type: 'none', dur: 0.8 }) },
        keyframes: JSON.parse(JSON.stringify(c.keyframes)),
        color: { ...c.color },
        cutout: { ...c.cutout },
        mask: { ...c.mask, penPoints: JSON.parse(JSON.stringify(c.mask.penPoints || [])) }
      };
    }

    function pushUndo() {
      const snapshot = {
        clips: state.clips.map(cloneClipData),
        pipTracks: state.pipTracks.map(tr => ({
          ...tr,
          clips: tr.clips.map(cloneClipData)
        })),
        subtitles: JSON.parse(JSON.stringify(state.subtitles)),
        audioClips: state.audioClips.map(a => ({ ...a })),
        selectedClipId: state.selectedClipId,
        selectedSubId: state.selectedSubId,
        selectedAudioId: state.selectedAudioId,
        lastSelectedType: state.lastSelectedType
      };
      undoStack.push(snapshot);
      if (undoStack.length > 25) undoStack.shift();
    }

    function undoLastAction() {
      if (undoStack.length === 0) return showToast('目前沒有可復原的操作');
      const prev = undoStack.pop();
      state.clips = prev.clips;
      state.pipTracks = prev.pipTracks;
      state.subtitles = prev.subtitles;
      state.audioClips = prev.audioClips;
      state.selectedClipId = prev.selectedClipId;
      state.selectedSubId = prev.selectedSubId;
      state.selectedAudioId = prev.selectedAudioId;
      state.lastSelectedType = prev.lastSelectedType;
      updateDeleteButtonLabel();
      renderTimeline();
      renderDrawer();
      syncVideoElements(true);
      renderFrame();
      showToast('已復原上一步 ↩️');
    }

    document.getElementById('undoBtn').onclick = undoLastAction;

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.opacity = '1';
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.style.opacity = '0', 2300);
    }

    function getTotalDuration() {
      const mainDur = state.clips.reduce((acc, c) => acc + c.duration, 0);
      let pipEnd = 0;
      state.pipTracks.forEach(tr => {
        tr.clips.forEach(c => {
          pipEnd = Math.max(pipEnd, (c.start || 0) + c.duration);
        });
      });
      const subEnd = state.subtitles.reduce((max, s) => Math.max(max, s.start + s.duration), 0);
      const audEnd = state.audioClips.reduce((max, a) => Math.max(max, (a.start || 0) + a.duration), 0);
      return Math.max(mainDur, pipEnd, subEnd, audEnd, 1);
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = (sec % 60).toFixed(1);
      return `${String(m).padStart(2, '0')}:${s.padStart(4, '0')}`;
    }

    function seekTo(sec) {
      state.currentTime = Math.max(0, Math.min(getTotalDuration(), sec));
      timelineScroll.scrollLeft = state.currentTime * state.pxPerSec;
      syncVideoElements(true);
      renderFrame();

    function updateDeleteButtonLabel() {
      const btn = document.getElementById('deleteSelectedBtn');
      if (state.lastSelectedType === 'sub' && state.selectedSubId) {
