<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CutVideo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chiron+Hei+HK:wght@400;700&family=Chiron+Sung+HK:wght@400;700&family=Iansui&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;700;900&family=Noto+Serif+TC:wght@400;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/npm/open-huninn-font@1.1.0/font.css');
    @import url('https://cdn.jsdelivr.net/npm/cubic-11@1.0.1/fonts/web/cubic-11.css');
    @import url('https://cdn.jsdelivr.net/npm/smiley-sans@2.0.1/dist/smiley-sans.css');

    @font-face { font-family: 'Taipei Sans TC'; src: url('https://cdn.jsdelivr.net/gh/max32002/taipeisanstc@master/webfont/TaipeiSansTCBeta-Regular.woff2') format('woff2'); font-display: swap; }
    @font-face { font-family: 'ChenYuluoyan'; src: url('https://cdn.jsdelivr.net/gh/Chenyu-otf/chenyuluoyan_thin@main/ChenYuluoyan-Thin-Monospaced.woff2') format('woff2'); font-display: swap; }
    @font-face { font-family: 'GenSenRounded'; src: url('https://cdn.jsdelivr.net/gh/ButTaiwan/gensen-font@master/webfont/GenSenRounded-M.woff2') format('woff2'); font-display: swap; }
    @font-face { font-family: 'TASA Explorer'; src: url('https://cdn.jsdelivr.net/gh/ButTaiwan/tasa-explorer@main/webfont/TASAExplorer-Medium.woff2') format('woff2'); font-display: swap; }

    :root {
      --bg-dark: #0e0f13; --bg-panel: #171920; --bg-card: #21242e;
      --accent: #ff3b7f; --accent-soft: rgba(255, 59, 127, 0.2);
      --danger: #ef4444; --danger-soft: rgba(239, 68, 68, 0.18);
      --gold: #ffcc33; --cyan: #2ce6c3; --purple: #a855f7; --blue: #38bdf8;
      --text-main: #f3f4f6; --text-muted: #9ca3af; --border: #2b2f3b;
      --stage-height: 230px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    body { margin: 0; background: var(--bg-dark); color: var(--text-main); font-family: 'Noto Sans TC', sans-serif; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    #videoDecodePool { position: fixed; bottom: 0; right: 0; width: 2px; height: 2px; opacity: 0.001; pointer-events: none; overflow: hidden; z-index: -1; }

    .topbar { height: 44px; padding: 0 12px; background: var(--bg-panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; gap: 6px; }
    .brand { font-weight: 900; font-size: 16px; display: flex; align-items: center; gap: 6px; }
    .brand span { background: linear-gradient(135deg, #ff3b7f, #ff8a3d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .draft-badge { font-size: 10px; color: var(--cyan); background: rgba(44, 230, 195, 0.12); border: 1px solid rgba(44, 230, 195, 0.35); padding: 2px 7px; border-radius: 99px; cursor: pointer; white-space: nowrap; }
    .ratio-group { display: flex; background: var(--bg-card); border-radius: 8px; padding: 2px; gap: 2px; }
    .ratio-btn { border: none; background: transparent; color: var(--text-muted); font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 6px; cursor: pointer; }
    .ratio-btn.active { background: var(--accent); color: #fff; }
    .btn-export { background: linear-gradient(135deg, #ff3b7f, #ff6b4a); color: #fff; border: none; border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 14px; }
    .modal-backdrop.open { display: flex; }
    .export-modal { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 14px; width: 100%; max-width: 410px; max-height: 90dvh; overflow-y: auto; padding: 15px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85); }
    .export-modal h3 { margin: 0 0 6px; font-size: 15px; color: #fff; display: flex; align-items: center; justify-content: space-between; }
    .export-modal p.sub { margin: 0 0 10px; font-size: 11px; color: var(--text-muted); line-height: 1.45; }
    .modal-sec-title { font-size: 11px; font-weight: 800; color: var(--cyan); margin: 10px 0 6px; padding-top: 8px; border-top: 1px solid var(--border); }
    .quality-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
    .quality-card { background: var(--bg-card); border: 1.5px solid var(--border); border-radius: 9px; padding: 8px 10px; text-align: left; color: var(--text-main); cursor: pointer; }
    .quality-card.active { border-color: var(--cyan); background: rgba(44, 230, 195, 0.13); }
    .quality-card .q-name { font-size: 12px; font-weight: 800; color: #fff; display: block; }
    .quality-card .q-spec { font-size: 10px; color: var(--text-muted); display: block; margin-top: 2px; }
    .export-option-card { width: 100%; background: var(--bg-card); border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 7px; text-align: left; color: var(--text-main); cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
    .export-option-card:hover { border-color: var(--accent); background: rgba(255, 59, 127, 0.12); }
    .export-option-card.proj-pack:hover { border-color: var(--gold); background: rgba(255, 204, 51, 0.12); }
    .export-option-card.proj-open { border-color: var(--purple); background: rgba(168, 85, 247, 0.12); }
    .export-option-card .opt-title { font-size: 12.5px; font-weight: 800; color: #fff; }
    .export-option-card .opt-desc { font-size: 10.5px; color: var(--text-muted); line-height: 1.35; }
    .relink-box { display: none; background: #12141c; border: 1.5px solid var(--gold); border-radius: 10px; padding: 12px; margin-top: 8px; }
    .relink-box h4 { margin: 0 0 6px; font-size: 13px; color: var(--gold); }
    .relink-list { margin: 6px 0 10px; padding-left: 18px; font-size: 11px; color: #e5e7eb; max-height: 110px; overflow-y: auto; }
    .export-progress-box { display: none; background: #101218; border: 1px solid var(--cyan); border-radius: 10px; padding: 14px; text-align: center; margin-top: 8px; }
    .export-percent-big { font-size: 26px; font-weight: 900; margin-bottom: 4px; background: linear-gradient(90deg, var(--cyan), #fff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .export-progress-box .prog-title { font-size: 12px; font-weight: 700; color: var(--cyan); margin-bottom: 4px; }
    .export-progress-box .prog-sub { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
    .export-progress-bar { height: 8px; background: #232734; border-radius: 99px; overflow: hidden; }
    .export-progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--cyan), var(--accent)); transition: width 0.08s linear; }

    .stage-wrap { height: var(--stage-height); min-height: 120px; max-height: 68dvh; display: flex; align-items: center; justify-content: center; background: #08090c; position: relative; padding: 10px; overflow: hidden; flex-shrink: 0; }
    canvas#previewCanvas { background: #000; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.85); border-radius: 6px; border: 1px solid #2b2f3b; height: 100%; width: auto; max-width: 100%; max-height: 100%; object-fit: contain; touch-action: none; cursor: grab; }
    canvas#previewCanvas:active { cursor: grabbing; }
    .stage-hint { position: absolute; top: 6px; left: 10px; background: rgba(0, 0, 0, 0.72); color: #d1d5db; font-size: 10px; padding: 3px 9px; border-radius: 99px; pointer-events: none; max-width: 54%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .stage-top-right { position: absolute; top: 6px; right: 10px; display: flex; align-items: center; gap: 4px; z-index: 15; }
    .stage-pill-box { display: flex; gap: 2px; background: rgba(23, 25, 32, 0.9); border: 1px solid var(--border); padding: 2px; border-radius: 8px; }
    .stage-mode-btn, .stage-size-btn { background: transparent; border: none; color: var(--text-muted); font-size: 10px; font-weight: 700; padding: 3px 6px; border-radius: 5px; cursor: pointer; }
    .stage-mode-btn.active { background: var(--blue); color: #090a0d; }
    .stage-mode-btn.crop-active { background: var(--gold); color: #090a0d; }
    .stage-size-btn.active { background: var(--accent-soft); color: #fff; }
    .stage-resizer { height: 12px; background: #14161d; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: ns-resize; touch-action: none; flex-shrink: 0; }
    .stage-resizer:hover, .stage-resizer.active { background: var(--accent-soft); }
    .stage-resizer::after { content: ''; width: 36px; height: 3px; border-radius: 99px; background: #4b5563; }

    .transport { height: 40px; background: var(--bg-panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 8px; gap: 5px; flex-shrink: 0; }
    .time-readout { font-variant-numeric: tabular-nums; font-size: 11px; color: var(--text-muted); white-space: nowrap; }
    .time-readout strong { color: var(--text-main); }
    .play-btn { width: 28px; height: 28px; border-radius: 50%; border: none; background: var(--text-main); color: var(--bg-dark); font-size: 12px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    .quick-actions { display: flex; align-items: center; gap: 4px; overflow-x: auto; padding: 2px 0; }
    .quick-actions::-webkit-scrollbar { display: none; }
    .chip-btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); font-size: 11px; font-weight: 600; padding: 4px 7px; border-radius: 6px; cursor: pointer; white-space: nowrap; flex-shrink: 0; display: inline-flex; align-items: center; gap: 2px; }
    .chip-btn:disabled { opacity: 0.38; cursor: not-allowed; }
    .chip-btn.history-active { border-color: var(--blue); color: #bae6fd; }
    .chip-btn.snap-on { background: rgba(44, 230, 195, 0.16); border-color: var(--cyan); color: var(--cyan); }
    .chip-btn.danger { background: var(--danger-soft); border-color: var(--danger); color: #fca5a5; }
    .zoom-box { display: flex; align-items: center; gap: 4px; background: var(--bg-card); border: 1px solid var(--border); padding: 2px 6px; border-radius: 6px; flex-shrink: 0; }
    .zoom-box span { font-size: 10px; color: var(--text-muted); }
    .zoom-box input[type="range"] { width: 48px; height: 14px; accent-color: var(--cyan); }
    @media (min-width: 768px) { .zoom-box input[type="range"] { width: 85px; } }

    .timeline-shell { position: relative; flex: 1; min-height: 95px; display: flex; flex-direction: column; overflow: hidden; }
    .timeline-area { flex: 1; min-height: 95px; background: #121419; position: relative; overflow-x: auto; overflow-y: auto; border-bottom: 1px solid var(--border); cursor: grab; touch-action: pan-y; }
    .timeline-area.grabbing { cursor: grabbing; }
    .timeline-area.compact-reorder-mode { background: #161822; overflow-x: hidden; }
    .timeline-area.compact-reorder-mode .ruler { opacity: 0.15; }
    .timeline-area.compact-reorder-mode .timeline-inner { width: 100% !important; padding: 24px 16px 18px 16px; display: flex; flex-direction: column; align-items: center; }
    .timeline-area.compact-reorder-mode #tracksContainer { width: 100%; }
    .timeline-area.compact-reorder-mode #mainVideoTrack { height: 52px; justify-content: center; gap: 8px; width: 100%; }
    .timeline-area.compact-reorder-mode .track-row:not(#mainVideoTrack):not(.pip-track) { opacity: 0.2; pointer-events: none; }
    .timeline-inner { position: relative; min-height: 100%; padding: 24px 50vw 18px 50vw; }
    .ruler { position: sticky; top: 0; left: 0; height: 20px; background: rgba(18, 20, 25, 0.95); border-bottom: 1px solid #2a2e3b; display: flex; font-size: 10px; color: var(--text-muted); z-index: 18; margin-top: -24px; margin-bottom: 4px; }
    .playhead { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: #fff; z-index: 25; pointer-events: none; box-shadow: 0 0 6px rgba(255,255,255,0.85); }
    .playhead::before { content: ''; position: absolute; top: 0; left: -5px; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 8px solid #fff; }
    .track-sidebar-overlay { position: absolute; top: 24px; left: 4px; z-index: 22; display: flex; flex-direction: column; gap: 5px; pointer-events: none; }
    .track-controls { height: 34px; display: inline-flex; align-items: center; gap: 3px; background: rgba(15, 16, 20, 0.9); padding: 0 6px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); pointer-events: auto; width: fit-content; }
    .eye-btn { background: none; border: none; padding: 0 2px; font-size: 12px; cursor: pointer; line-height: 1; }
    .track-badge { font-size: 9px; font-weight: 700; color: var(--text-muted); pointer-events: none; }
    .track-row { height: 34px; margin-bottom: 5px; display: flex; align-items: center; position: relative; border-radius: 6px; transition: opacity 0.18s, background 0.15s; }
    .track-row.pip-track { background: rgba(168, 85, 247, 0.06); }
    .track-row.main-track { background: rgba(59, 130, 246, 0.05); }
    .track-row.audio-track { background: rgba(44, 230, 195, 0.04); }
    .track-row.track-hidden { opacity: 0.36; filter: grayscale(0.85); }
    .track-row.drop-target { background: rgba(255, 204, 51, 0.18) !important; outline: 1.5px dashed var(--gold); }
    .empty-track-hint { font-size: 11px; color: #9ca3af; border: 1px dashed #4b5563; border-radius: 6px; padding: 5px 10px; cursor: pointer; white-space: nowrap; background: rgba(255,255,255,0.02); }
    .empty-track-hint:hover { border-color: var(--accent); color: #fff; }

    .clip-block { height: 32px; background: linear-gradient(90deg, #2b3244, #384158); border: 1.5px solid #4c5670; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #fff; position: relative; overflow: visible; white-space: nowrap; padding: 0 16px; flex-shrink: 0; touch-action: none; }
    .clip-block.compact-card { height: 46px !important; padding: 4px 8px !important; flex-direction: column; justify-content: center; border-radius: 10px; background: #262b38; border-color: #5b6682; }
    .compact-num { font-size: 13px; font-weight: 900; color: var(--gold); line-height: 1.1; }
    .compact-sub { font-size: 10px; color: #e5e7eb; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
    .clip-block.pip-clip { position: absolute; background: linear-gradient(90deg, #3b2654, #523475); border-color: #8b5cf6; }
    .clip-block.selected { border-color: var(--accent); box-shadow: 0 0 0 1.5px var(--accent); }
    .clip-block.reordering { border-color: var(--gold) !important; background: linear-gradient(135deg, #5c481d, #826526) !important; box-shadow: 0 8px 20px rgba(255, 204, 51, 0.55), 0 0 0 2px var(--gold) !important; transform: translateY(-5px) scale(1.06); z-index: 40; cursor: move; }
    .clip-label { overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
    .trim-handle { position: absolute; top: -1px; bottom: -1px; width: 15px; background: rgba(255, 255, 255, 0.28); display: flex; align-items: center; justify-content: center; cursor: ew-resize; z-index: 15; touch-action: none; }
    .trim-handle:hover, .trim-handle.active { background: var(--accent); }
    .trim-handle.left { left: -1px; border-radius: 5px 0 0 5px; border-right: 1px solid rgba(255,255,255,0.45); }
    .trim-handle.right { right: -1px; border-radius: 0 5px 5px 0; border-left: 1px solid rgba(255,255,255,0.45); }
    .trim-handle::after { content: '⋮'; font-size: 11px; color: #fff; font-weight: bold; }
    .trans-node { position: absolute; right: -10px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; z-index: 18; background: var(--bg-panel); border: 1.5px solid var(--cyan); color: var(--cyan); border-radius: 5px; font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .kf-diamond { position: absolute; width: 8px; height: 8px; background: var(--gold); transform: translateX(-50%) rotate(45deg); top: 2px; border: 1px solid #000; pointer-events: none; }
    .sub-block { position: absolute; height: 26px; background: rgba(255, 59, 127, 0.28); border: 1px solid var(--accent); border-radius: 5px; font-size: 10px; padding: 0 15px; display: flex; align-items: center; color: #ffd1e1; white-space: nowrap; touch-action: none; }
    .sub-block.selected { background: rgba(255, 59, 127, 0.6); color: #fff; box-shadow: 0 0 0 1.5px #fff; }
    .audio-clip-block { position: absolute; height: 28px; background: linear-gradient(90deg, rgba(20, 184, 166, 0.35), rgba(44, 230, 195, 0.25)); border: 1.5px solid var(--cyan); border-radius: 6px; font-size: 10px; font-weight: 600; padding: 0 16px; display: flex; align-items: center; justify-content: center; color: #ccfbf1; white-space: nowrap; touch-action: none; cursor: pointer; }
    .audio-clip-block.selected { background: rgba(44, 230, 195, 0.5); color: #fff; border-color: #fff; box-shadow: 0 0 0 1.5px var(--cyan); }

    .drawer { background: var(--bg-panel); height: 235px; display: flex; flex-direction: column; flex-shrink: 0; transition: height 0.18s ease; }
    .drawer.collapsed { height: 48px; }
    .drawer.collapsed .drawer-content { display: none; }
    .drawer-content { flex: 1; padding: 9px 12px; overflow-y: auto; font-size: 12px; }
    .nav-tabs { height: 48px; background: #121318; border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; flex-shrink: 0; overflow-x: auto; }
    .nav-tab { background: none; border: none; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; cursor: pointer; padding: 4px 5px; white-space: nowrap; }
    .nav-tab.active { color: var(--accent); font-weight: 700; }
    .nav-tab span.icon { font-size: 15px; }
    .drawer-toggle-tab { position: sticky; right: 0; z-index: 10; background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; color: var(--cyan); font-size: 10px; font-weight: 700; padding: 4px 7px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 1px; flex-shrink: 0; margin-right: 4px; }

    .control-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 6px; flex-wrap: wrap; }
    .control-row label { color: var(--text-muted); font-size: 11px; min-width: 56px; }
    input[type="range"] { flex: 1; accent-color: var(--accent); min-width: 60px; }
    input[type="text"], input[type="password"], select, textarea { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); padding: 6px 8px; border-radius: 6px; font-size: 12px; flex: 1; user-select: text; min-width: 0; font-family: inherit; }
    textarea { width: 100%; resize: none; height: 52px; line-height: 1.4; }
    .pill-group { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 8px; }
    .pill-group::-webkit-scrollbar { display: none; }
    .pill { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-muted); padding: 4px 9px; border-radius: 99px; font-size: 11px; font-weight: 600; white-space: nowrap; cursor: pointer; }
    .pill.active { background: var(--accent-soft); border-color: var(--accent); color: #fff; }
    .swatch-dot { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.45); cursor: pointer; flex-shrink: 0; padding: 0; }
    .swatch-dot.active { border: 2px solid var(--cyan); transform: scale(1.15); }
    .sub-style-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px; margin-bottom: 8px; }
    .sub-sec-label { font-size: 11px; font-weight: 700; color: var(--cyan); margin-bottom: 5px; display: flex; align-items: center; justify-content: space-between; }
    .font-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 6px; }
    @media (min-width: 768px) { .font-grid { grid-template-columns: repeat(4, 1fr); } }
    .font-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 7px; text-align: left; color: var(--text-main); cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
    .font-card.active { border-color: var(--accent); background: var(--accent-soft); }
    .font-card .sample { font-size: 14px; font-weight: 700; }
    .font-card .meta { font-size: 9px; color: var(--text-muted); font-family: 'Noto Sans TC', sans-serif; }
    .action-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .box-btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); padding: 8px 6px; border-radius: 8px; font-size: 11px; font-weight: 600; text-align: center; cursor: pointer; }
    .box-btn.primary { border-color: var(--accent); background: var(--accent-soft); }
    .box-btn.purple { border-color: var(--purple); background: rgba(168, 85, 247, 0.18); color: #e9d5ff; }
    .box-btn.cyan { border-color: var(--cyan); background: rgba(44, 230, 195, 0.16); color: #99f6e4; }
    .box-btn.gold { border-color: var(--gold); background: rgba(255, 204, 51, 0.16); color: #fef08a; }
    .box-btn.danger { border-color: var(--danger); background: var(--danger-soft); color: #fca5a5; }
    .hidden-input { display: none; }
    #toast { position: fixed; top: 52px; left: 50%; transform: translateX(-50%); background: rgba(24, 26, 32, 0.96); border: 1px solid var(--accent); color: #fff; padding: 6px 14px; border-radius: 99px; font-size: 12px; z-index: 999; opacity: 0; pointer-events: none; transition: opacity 0.25s; white-space: nowrap; }
  </style>

    // ====== 標準 .srt 解析與智慧多行分段引擎（支援 UTF-8 BOM / Big5 自動解碼與高容錯空行/時間軸識別） ======
    async function decodeSubtitleFileSmart(file) {
      const buf = await file.arrayBuffer();
      let text = '';
      try {
        text = new TextDecoder('utf-8', { fatal: true }).decode(buf);
      } catch (_) {
        try {
          text = new TextDecoder('big5').decode(buf);
        } catch (__) {
          text = new TextDecoder('utf-8').decode(buf);
        }
      }
      return text.replace(/^\uFEFF/, '');
    }

    function parseSrtTimeToSec(timeStr) {
      const m = timeStr.trim().match(/^(\d{1,2})[:：](\d{2})[:：](\d{2})[,.，．](\d{1,3})$/);
      if (!m) return null;
      const hours = parseInt(m[1], 10);
      const mins = parseInt(m[2], 10);
      const secs = parseInt(m[3], 10);
      const ms = parseInt(m[4].padEnd(3, '0').slice(0, 3), 10);
      return roundSec(hours * 3600 + mins * 60 + secs + ms / 1000);
    }

    function splitMultiLineSrtBlock(startSec, endSec, lines) {
      const cleanLines = lines.map(l => l.trim()).filter(Boolean);
      const totalDur = Math.max(0.5, roundSec(endSec - startSec));
      if (cleanLines.length <= 1 || totalDur < 1.0) {
        return [{
          text: cleanLines.join(' ') || '字幕',
          start: roundSec(startSec),
          duration: totalDur
        }];
      }

      const weights = cleanLines.map(l => Math.max(1, Array.from(l).length));
      const sumW = weights.reduce((a, b) => a + b, 0);
      const rawSegments = [];
      let cursor = roundSec(startSec);

      cleanLines.forEach((lineText, idx) => {
        const isLast = idx === cleanLines.length - 1;
        const segDur = isLast
          ? roundSec(Math.max(0.5, startSec + totalDur - cursor))
          : roundSec(totalDur * (weights[idx] / sumW));
        rawSegments.push({ text: lineText, start: cursor, duration: segDur });
        cursor = roundSec(cursor + segDur);
      });

      const merged = [];
      for (const seg of rawSegments) {
        if (seg.duration < 0.5 && merged.length > 0) {
          const prev = merged[merged.length - 1];
          prev.text = `${prev.text} ${seg.text}`;
          prev.duration = roundSec(prev.duration + seg.duration);
        } else {
          merged.push({ ...seg });
        }
      }
      if (merged.length >= 2 && merged[0].duration < 0.5) {
        const second = merged[1];
        second.text = `${merged[0].text} ${second.text}`;
        second.start = merged[0].start;
        second.duration = roundSec(second.duration + merged[0].duration);
        merged.shift();
      }
      return merged;
    }

    function parseSrtContentToSubtitles(srtText) {
      const normalized = srtText
        .replace(/^\uFEFF/, '')
        .replace(/\r\n/g, '\n')
        .replace(/\r/g, '\n')
        .trim();
      if (!normalized) return [];

      const blocks = normalized.split(/\n\s*\n+/);
      const generated = [];
      const timeRangeRegex = /(\d{1,2}[:：]\d{2}[:：]\d{2}[,.，．]\d{1,3})\s*(?:-->|—>|->|－>)\s*(\d{1,2}[:：]\d{2}[:：]\d{2}[,.，．]\d{1,3})/;

      blocks.forEach((block, bIdx) => {
        const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
        if (lines.length < 2) return;

        let timeLineIdx = -1;
        let timeMatch = null;
        for (let i = 0; i < Math.min(3, lines.length); i++) {
          const m = lines[i].match(timeRangeRegex);
          if (m) {
            timeLineIdx = i;
            timeMatch = m;
            break;
          }
        }
        if (timeLineIdx === -1 || !timeMatch) return;

        const startSec = parseSrtTimeToSec(timeMatch[1]);
        const endSec = parseSrtTimeToSec(timeMatch[2]);
        if (startSec === null || endSec === null || endSec <= startSec) return;

        const textLines = lines
          .slice(timeLineIdx + 1)
          .map(l => l.replace(/<[^>]+>/g, '').replace(/\{\\[^}]+\}/g, '').trim())
          .filter(Boolean);
        if (textLines.length === 0) return;

        const splitSubs = splitMultiLineSrtBlock(startSec, endSec, textLines);

        splitSubs.forEach((item, sIdx) => {
          generated.push(createDefaultSubtitleProps({
            id: `sub-srt-${Date.now()}-${bIdx}-${sIdx}`,
            text: item.text,
            start: item.start,
            duration: item.duration
          }));
        });
      });

      return generated;
    }

    // ====== IndexedDB 大容量草稿緩存系統 ======
    const DB_NAME = 'CutVideoDraftDB';
    const DB_VERSION = 1;
    const STORE_FILES = 'mediaFiles';
    const STORE_PROJECT = 'projectState';
    const memoryBlobRegistry = new Map();

    function openDraftDB() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) return reject(new Error('No IndexedDB'));
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_FILES)) db.createObjectStore(STORE_FILES);
          if (!db.objectStoreNames.contains(STORE_PROJECT)) db.createObjectStore(STORE_PROJECT);
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveMediaBlobToDB(fileId, blob) {
      if (!fileId || !blob) return;
      memoryBlobRegistry.set(fileId, blob);
      try {
        const db = await openDraftDB();
        const tx = db.transaction(STORE_FILES, 'readwrite');
        tx.objectStore(STORE_FILES).put(blob, fileId);
      } catch (_) {}
    }

    async function getMediaBlobFromDB(fileId) {
      if (!fileId) return null;
      if (memoryBlobRegistry.has(fileId)) return memoryBlobRegistry.get(fileId);
      try {
        const db = await openDraftDB();
        return await new Promise((resolve) => {
          const tx = db.transaction(STORE_FILES, 'readonly');
          const req = tx.objectStore(STORE_FILES).get(fileId);
          req.onsuccess = () => {
            if (req.result) memoryBlobRegistry.set(fileId, req.result);
            resolve(req.result || null);
          };
          req.onerror = () => resolve(null);
        });
      } catch (_) { return null; }
    }

    function recreateElementFromBlob(blob, mediaType, initialSeek = 0.01, isAudioOnly = false) {
      return new Promise((resolve) => {
        if (!blob) return resolve(null);
        const url = URL.createObjectURL(blob);
        if (mediaType === 'image') {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => resolve(null);
          img.src = url;
        } else if (isAudioOnly && blob.type.startsWith('audio/')) {
          const aud = new Audio(url);
          aud.preload = 'auto';
          ensureAudioNode(aud);
          aud.onloadedmetadata = () => {
            aud.currentTime = Math.max(0.01, initialSeek);
            resolve(aud);
          };
          aud.onerror = () => resolve(null);
        } else {
          const vid = createClonedVideoElement(url, initialSeek);
          vid.addEventListener('loadeddata', () => resolve(vid), { once: true });
          vid.addEventListener('error', () => resolve(null), { once: true });
        }
      });
    }

    async function applyDeserializedProject(saved, customBlobMap = null) {
      const resolveBlob = async (fileId) => {
        if (customBlobMap && customBlobMap.has(fileId)) {
          const b = customBlobMap.get(fileId);
          await saveMediaBlobToDB(fileId, b);
          return b;
        }
        return await getMediaBlobFromDB(fileId);
      };

      const restoredClips = [];
      for (const c of (saved.clips || [])) {
        const blob = await resolveBlob(c.fileId);
        const el = await recreateElementFromBlob(blob, c.mediaType, c.trimStart || 0.01, false);
        if (el) restoredClips.push({ ...c, mediaEl: el });
      }

      const restoredPipTracks = [];
      for (const tr of (saved.pipTracks || [])) {
        const pClips = [];
        for (const p of (tr.clips || [])) {
          const blob = await resolveBlob(p.fileId);
          const el = await recreateElementFromBlob(blob, p.mediaType, p.trimStart || 0.01, false);
          if (el) pClips.push({ ...p, mediaEl: el });
        }
        restoredPipTracks.push({ ...tr, clips: pClips });
      }

      const restoredAudio = [];
      for (const a of (saved.audioClips || [])) {
        const blob = await resolveBlob(a.fileId);
        const el = await recreateElementFromBlob(blob, a.fromVideo ? 'video' : 'audio', a.trimStart || 0.01, true);
        if (el) restoredAudio.push({ ...a, mediaEl: el });
      }

      if (saved.background) {
        state.background = { ...saved.background, mediaEl: null };
        if (saved.background.mode === 'custom' && saved.background.mediaFileId) {
          const bgBlob = await resolveBlob(saved.background.mediaFileId);
          const bgEl = await recreateElementFromBlob(bgBlob, saved.background.mediaType, 0.01, false);
          if (bgEl) {
            if (saved.background.mediaType === 'video') { bgEl.loop = true; bgEl.muted = true; }
            state.background.mediaEl = bgEl;
          }
        }
      }

      state.clips = restoredClips;
      state.pipTracks = restoredPipTracks.length > 0 ? restoredPipTracks : [{ id: 'pip-track-1', name: '畫中畫 L1 (頂層)', visible: true, clips: [] }];
      state.subtitles = (saved.subtitles || []).map(s => normalizeSubtitleObject({ ...s }));
      state.audioClips = restoredAudio;
      state.trackVisibility = saved.trackVisibility || { main: true, audio: true, sub: true };
      if (saved.effects) state.effects = saved.effects;
      if (saved.exportQuality) state.exportQuality = saved.exportQuality;
      if (saved.ratio) {
        state.ratio = saved.ratio;
        document.querySelectorAll('.ratio-btn').forEach(b => b.classList.toggle('active', b.dataset.ratio === state.ratio));
        applyCanvasResolutionForRatio(state.ratio, null);
      }
      state.selectedClipId = state.clips[0]?.id || state.pipTracks[0]?.clips[0]?.id || null;
      state.lastSelectedType = state.clips[0] ? 'clip' : (state.pipTracks[0]?.clips[0] ? 'pip' : 'clip');
      state.currentTime = 0;
      timelineScroll.scrollLeft = 0;

      updateDeleteButtonLabel();
      renderTimeline();
      renderDrawer();
      syncVideoElements(true);
      renderFrame();
      scheduleAutoSaveDraft();
    }

    function collectSnapTargets(excludeId = null) {
      const points = new Set([0, roundSec(state.currentTime)]);
      let acc = 0;
      state.clips.forEach(c => {
        points.add(roundSec(acc));
        acc += c.duration;
        points.add(roundSec(acc));
      });
      state.pipTracks.forEach(tr => {
        tr.clips.forEach(p => {
          if (p.id === excludeId) return;
          points.add(roundSec(p.start || 0));
          points.add(roundSec((p.start || 0) + p.duration));
        });
      });
      state.audioClips.forEach(a => {
        if (a.id === excludeId) return;
        points.add(roundSec(a.start || 0));
        points.add(roundSec((a.start || 0) + a.duration));
      });
      state.subtitles.forEach(s => {
        if (s.id === excludeId) return;
        points.add(roundSec(s.start));
        points.add(roundSec(s.start + s.duration));
      });
      return Array.from(points);
    }

    function snapTimeValue(rawSec, excludeId = null) {
      const clamped = Math.max(0, rawSec);
      if (!state.snapEnabled || state.snapThresholdPx <= 0) return roundSec(clamped);
      const thresholdSec = state.snapThresholdPx / state.pxPerSec;
      const targets = collectSnapTargets(excludeId);
      let bestTarget = clamped;
      let minDiff = thresholdSec;
      for (const t of targets) {
        const diff = Math.abs(clamped - t);
        if (diff <= minDiff) { minDiff = diff; bestTarget = t; }
      }
      return roundSec(bestTarget);
    }

    let availableSystemVoices = [];

    function refreshSystemVoices() {
      if (!('speechSynthesis' in window)) return;
      const list = window.speechSynthesis.getVoices();
      if (list && list.length > 0) {
        availableSystemVoices = [...list].sort((a, b) => {
          const aZh = a.lang.toLowerCase().includes('zh') ? 0 : 1;
          const bZh = b.lang.toLowerCase().includes('zh') ? 0 : 1;
          return aZh - bZh;
        });
        if (!state.voiceConfig.browserVoiceURI && availableSystemVoices.length > 0) {
          const twVoice = availableSystemVoices.find(v => v.lang.toLowerCase().includes('tw')) || availableSystemVoices[0];
          state.voiceConfig.browserVoiceURI = twVoice.voiceURI;
        }
      }
    }

    if ('speechSynthesis' in window) {
      refreshSystemVoices();
      window.speechSynthesis.onvoiceschanged = () => {
        refreshSystemVoices();
        if (state.activeTab === 'voice') renderDrawer();
      };

    function speakWithBrowserTTS(text) {
      if (!('speechSynthesis' in window) || !text) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.rate = state.voiceConfig.rate || 1.0;
      utter.lang = 'zh-TW';
      if (state.voiceConfig.browserVoiceURI) {
        const matched = availableSystemVoices.find(v => v.voiceURI === state.voiceConfig.browserVoiceURI);
        if (matched) utter.voice = matched;
      }
      window.speechSynthesis.speak(utter);
    }

    async function fetchClonedVoiceBlob(text) {
      const vc = state.voiceConfig;
      if (!vc.apiKey) throw new Error('請先貼上 API Key 才能使用克隆聲音生成');
      const cleanText = text.replace(/\|/g, '，').trim();

      if (vc.provider === 'elevenlabs') {
        const vid = vc.voiceId || '21m00Tcm4TlvDq8ikWAM';
        const res = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${encodeURIComponent(vid)}`, {
          method: 'POST',
          headers: { 'xi-api-key': vc.apiKey.trim(), 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: cleanText, model_id: 'eleven_multilingual_v2' })
        });
        if (!res.ok) throw new Error(`ElevenLabs 錯誤 (${res.status})：請檢查金鑰與 Voice ID`);
        return await res.blob();
      } else {
        const voiceName = vc.voiceId || 'nova';
        const res = await fetch('https://api.openai.com/v1/audio/speech', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${vc.apiKey.trim()}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ model: 'tts-1', input: cleanText, voice: voiceName })
        });
        if (!res.ok) throw new Error(`OpenAI TTS 錯誤 (${res.status})：請檢查 API Key`);
        return await res.blob();
      }
    }

    function attachAudioBlobToTimeline(blob, labelName, startSec, linkedSub = null) {
      return new Promise((resolve) => {
        const fileId = 'file-ai-' + Date.now() + Math.random();
        saveMediaBlobToDB(fileId, blob);
        const url = URL.createObjectURL(blob);
        const audioEl = new Audio(url);
        audioEl.preload = 'auto';
        ensureAudioNode(audioEl);

        audioEl.onloadedmetadata = () => {
          const realDur = (audioEl.duration && isFinite(audioEl.duration)) ? roundSec(audioEl.duration) : 2.5;
          const id = 'aud-ai-' + Date.now() + Math.random();
          state.audioClips.push({
            id, fileId, origFileName: labelName.slice(0, 14) + '.mp3', name: labelName.slice(0, 14),
            fromVideo: false, isAI: true, start: roundSec(startSec), trimStart: 0,
            duration: realDur, maxDuration: realDur, gain: 1.15, muted: false, mediaEl: audioEl
          });
          if (linkedSub && realDur > linkedSub.duration) {
            linkedSub.duration = realDur;
          }
          state.selectedAudioId = id;
          resolve(realDur);
        };
      });
    }

    async function generateVoiceAndSubtitlesFromScript() {
      const raw = (state.voiceConfig.scriptDraft || '').trim();
      if (!raw) return showToast('請先在文字框輸入講稿（一行一句）');
      const lines = raw.split(/\n+/).map(l => l.trim()).filter(Boolean);
      if (lines.length === 0) return;

      pushUndo();
      let cursorSec = roundSec(state.currentTime);
      const vc = state.voiceConfig;

      if (vc.engine === 'browser') {
        lines.forEach((line, idx) => {
          const estDur = roundSec(Math.max(1.5, line.length * 0.28 / (vc.rate || 1)));
          state.subtitles.push(createDefaultSubtitleProps({
            id: 'sub-ai-' + Date.now() + idx,
            text: line,
            start: cursorSec,
            duration: estDur
          }));
          cursorSec = roundSec(cursorSec + estDur + 0.15);
        });
        vc.autoSyncPlayback = true;
        saveVoiceConfig();
        renderTimeline(); renderDrawer(); renderFrame();
        scheduleAutoSaveDraft();
        showToast(`已生成 ${lines.length} 段同步字幕，按播放鍵自動朗讀 🎙️`);
        return;
      }

      try {
        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];
          showToast(`正在生成講稿配音 (${i + 1}/${lines.length})...`);
          const blob = await fetchClonedVoiceBlob(line);
          const subObj = createDefaultSubtitleProps({
            id: 'sub-ai-' + Date.now() + i,
            text: line,
            start: cursorSec,
            duration: 1.5
          });
          state.subtitles.push(subObj);
          const actualDur = await attachAudioBlobToTimeline(blob, line, cursorSec, subObj);
          cursorSec = roundSec(cursorSec + actualDur + 0.15);
        }
        renderTimeline(); renderDrawer(); renderFrame();
        scheduleAutoSaveDraft();
        showToast(`已批次生成 ${lines.length} 段克隆語音與同步字幕 ✅`);
      } catch (err) { showToast(err.message); }
    }

    function setCanvasBoxMode(mode) {
      state.canvasBoxMode = mode;
      document.getElementById('modeTransformBtn').classList.toggle('active', mode === 'transform');
      document.getElementById('modeCropBtn').classList.toggle('crop-active', mode === 'crop');
      renderFrame();
    }
    document.getElementById('modeTransformBtn').onclick = () => { setCanvasBoxMode('transform'); showToast('已切換為「自由拉伸寬高／移動」模式（藍框）↔️'); };
    document.getElementById('modeCropBtn').onclick = () => { setCanvasBoxMode('crop'); showToast('已切換為「框線裁剪畫面」模式（黃虛線框）✂️'); };

    function setStageHeight(px) {
      const maxH = Math.round(window.innerHeight * 0.68);
      const clamped = Math.max(120, Math.min(maxH, px));
      document.documentElement.style.setProperty('--stage-height', clamped + 'px');
      document.querySelectorAll('.stage-size-btn').forEach(b => {
        b.classList.toggle('active', Math.abs(parseInt(b.dataset.h, 10) - clamped) < 15);
      });
    }
    document.querySelectorAll('.stage-size-btn').forEach(btn => { btn.onclick = () => setStageHeight(parseInt(btn.dataset.h, 10)); });

    let resizingStage = false, resizeStartY = 0, resizeStartH = 230;
    stageResizer.addEventListener('pointerdown', (e) => {
      e.preventDefault(); resizingStage = true; resizeStartY = e.clientY;
      resizeStartH = stageWrap.getBoundingClientRect().height;
      stageResizer.classList.add('active'); stageResizer.setPointerCapture(e.pointerId);
    });
    stageResizer.addEventListener('pointermove', (e) => { if (resizingStage) setStageHeight(resizeStartH + (e.clientY - resizeStartY)); });
    const endStageResize = () => { if (!resizingStage) return; resizingStage = false; stageResizer.classList.remove('active'); };
    stageResizer.addEventListener('pointerup', endStageResize);
    stageResizer.addEventListener('pointercancel', endStageResize);

    // ====== Web Audio API 混音增益引擎 ======
    let sharedAudioCtx = null, exportMixDest = null;
    function getAudioCtx() {
      if (!sharedAudioCtx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) { sharedAudioCtx = new AudioCtx(); exportMixDest = sharedAudioCtx.createMediaStreamDestination(); }
      }
      if (sharedAudioCtx && sharedAudioCtx.state === 'suspended') sharedAudioCtx.resume().catch(() => {});
      return sharedAudioCtx;
    }

    function ensureAudioNode(mediaEl) {
      if (!mediaEl || mediaEl._gainNode) return mediaEl?._gainNode;
      const actx = getAudioCtx();
      if (!actx) return null;
      try {
        const src = actx.createMediaElementSource(mediaEl);
        const gainNode = actx.createGain();
        src.connect(gainNode);
        gainNode.connect(actx.destination);
        if (exportMixDest) gainNode.connect(exportMixDest);
        mediaEl._gainNode = gainNode;
        return gainNode;
      } catch (err) { return null; }
    }

    function applyMediaAudioGain(mediaEl, muted, gainValue) {
      if (!mediaEl) return;
      mediaEl.muted = Boolean(muted);
      const effectiveGain = muted ? 0 : Math.max(0, Math.min(3.0, gainValue ?? 1.0));
      const gNode = ensureAudioNode(mediaEl);
      if (gNode && sharedAudioCtx) {
        gNode.gain.setValueAtTime(effectiveGain, sharedAudioCtx.currentTime);
        mediaEl.volume = 1.0;
      } else {
        mediaEl.volume = Math.min(1.0, effectiveGain);
      }
    }

    function createClonedVideoElement(srcUrl, initialSeekTime) {
      const vid = document.createElement('video');
      vid.src = srcUrl;
      vid.preload = 'auto';
      vid.playsInline = true;
      vid.setAttribute('playsinline', '');
      vid.setAttribute('webkit-playsinline', '');
      mountVideoToDecodePool(vid);
      ensureAudioNode(vid);

      vid.onloadeddata = () => requestVideoSeek(vid, initialSeekTime);
      vid.onseeked = () => {
        renderFrame();
        if (typeof vid._pendingSeekTime === 'number') {
          const nextT = vid._pendingSeekTime;
          vid._pendingSeekTime = null;
          if (Math.abs(vid.currentTime - nextT) > 0.008) vid.currentTime = nextT;
        }
      };
      vid.load();
      return vid;
    }

    const PARTICLE_SEEDS = Array.from({ length: 150 }, (_, i) => ({
      x0: ((i * 73) % 100) / 100, y0: ((i * 37) % 100) / 100,
      speedMul: 0.65 + ((i * 19) % 70) / 100, sizeMul: 0.6 + ((i * 29) % 80) / 100,
      phase: (i * 1.7) % (Math.PI * 2), swayAmp: 0.02 + ((i * 13) % 40) / 1000,
      rotSpeed: ((i % 2 === 0 ? 1 : -1) * (1.2 + (i % 5) * 0.4))
    }));

    const offCanvas = document.createElement('canvas');
    const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });
    const maskCanvas = document.createElement('canvas');
    const maskCtx = maskCanvas.getContext('2d');

    let selfieSeg = null, latestSegMask = null, segBusy = false;
    function initAISegmentation() {
      if (selfieSeg || typeof SelfieSegmentation === 'undefined') return;
      try {
        selfieSeg = new SelfieSegmentation({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}` });
        selfieSeg.setOptions({ modelSelection: 1, selfieMode: false });
        selfieSeg.onResults((results) => { latestSegMask = results.segmentationMask; segBusy = false; renderFrame(); });
      } catch (err) {}
    }
    function runAISegmentation(sourceEl) {
      initAISegmentation();
      if (!selfieSeg || segBusy || !sourceEl) return;
      if (sourceEl.tagName === 'VIDEO' && sourceEl.readyState < 2) return;
      segBusy = true;
      selfieSeg.send({ image: sourceEl }).catch(() => { segBusy = false; });
    }

    const zoomRange = document.getElementById('timelineZoomRange');
    zoomRange.addEventListener('input', (e) => {
      const anchorTime = state.currentTime;
      state.pxPerSec = parseInt(e.target.value, 10);
      renderTimeline();
      timelineScroll.scrollLeft = Math.round(anchorTime * state.pxPerSec);
    });

    function isClipActiveAtCurrentTime(clip, isPip) {
      if (!clip) return false;
      if (isPip) {
        const s = clip.start || 0;
        return state.currentTime >= s - 0.02 && state.currentTime <= s + clip.duration + 0.02;
      }
      let acc = 0;
      for (const c of state.clips) {
        if (c.id === clip.id) {
          return state.currentTime >= acc - 0.02 && state.currentTime <= acc + c.duration + 0.02;
        }
        acc += c.duration;
      }
      return false;
    }

    function getActiveVisualClipAtCurrentTime() {
      // 優先回傳目前選取且正處於播放線時間範圍內的素材
      if (state.lastSelectedType === 'pip' && state.selectedClipId) {
        for (const tr of state.pipTracks) {
          if (tr.visible === false) continue;
          const found = tr.clips.find(c => c.id === state.selectedClipId);
          if (found && isClipActiveAtCurrentTime(found, true)) return { clip: found, isPip: true, track: tr };
        }
      }
      if (state.selectedClipId) {
        if (state.trackVisibility.main !== false) {
          const mainFound = state.clips.find(c => c.id === state.selectedClipId);
          if (mainFound && isClipActiveAtCurrentTime(mainFound, false)) return { clip: mainFound, isPip: false, track: null };
        }
        for (const tr of state.pipTracks) {
          if (tr.visible === false) continue;
          const found = tr.clips.find(c => c.id === state.selectedClipId);
          if (found && isClipActiveAtCurrentTime(found, true)) return { clip: found, isPip: true, track: tr };
        }
      }
      // 若原本選取的素材不在當前時間點，自動尋找播放線當下正在顯示的頂層畫中畫或主軌片段
      for (const tr of state.pipTracks) {
        if (tr.visible === false) continue;
        for (const p of tr.clips) {
          if (isClipActiveAtCurrentTime(p, true)) return { clip: p, isPip: true, track: tr };
        }
      }
      if (state.trackVisibility.main !== false) {
        for (const c of state.clips) {
          if (isClipActiveAtCurrentTime(c, false)) return { clip: c, isPip: false, track: null };
        }
      }
      return null;
    }

    function getSelectedVisualClip() {
      if (state.lastSelectedType === 'pip' && state.selectedClipId) {
        for (const tr of state.pipTracks) {
          const found = tr.clips.find(c => c.id === state.selectedClipId);
          if (found) return { clip: found, isPip: true, track: tr };
        }
      }
      if (state.selectedClipId) {
        const mainFound = state.clips.find(c => c.id === state.selectedClipId);
        if (mainFound) return { clip: mainFound, isPip: false, track: null };
        for (const tr of state.pipTracks) {
          const found = tr.clips.find(c => c.id === state.selectedClipId);
          if (found) return { clip: found, isPip: true, track: tr };
        }
      }
      if (state.clips.length > 0) return { clip: state.clips[0], isPip: false, track: null };
      for (const tr of state.pipTracks) {
        if (tr.clips.length > 0) return { clip: tr.clips[0], isPip: true, track: tr };
      }
      return null;
    }

    function createDefaultClipProps(overrides = {}) {
      return {
        fileId: null, origFileName: '', trimStart: 0, start: 0, duration: 5, maxDuration: 60,
        speed: 1.0, muted: false, audioGain: 1.0, transitionAfter: 'none',
        fadeIn: { type: 'none', dur: 0.8 }, fadeOut: { type: 'none', dur: 0.8 },
        opacity: 1.0, blendMode: 'source-over', color: { b: 100, c: 100, s: 100, warm: 0 },
        cutout: { mode: 'none', keyColor: '#00ff00', tolerance: 65, smoothness: 15 },
        mask: { type: 'none', feather: 12, penPoints: [] },
        baseTransform: { scaleX: 1.0, scaleY: 1.0, x: 0, y: 0, rot: 0 },
        crop: { left: 0, right: 0, top: 0, bottom: 0 }, keyframes: [], ...overrides
      };
    }

    function requestVideoSeek(vid, targetTime) {
      if (!vid || vid.tagName !== 'VIDEO') return;
      mountVideoToDecodePool(vid);
      const dur = (vid.duration && isFinite(vid.duration)) ? vid.duration : 999;
      const clamped = Math.max(0.01, Math.min(dur - 0.01, targetTime));
      if (vid.seeking) { vid._pendingSeekTime = clamped; return; }
      if (Math.abs(vid.currentTime - clamped) < 0.008) { renderFrame(); return; }
      vid._pendingSeekTime = null;
      vid.currentTime = clamped;
    }

    function applyClipSpeed(clip, newSpeed, saveUndo = true) {
      if (!clip) return;
      const clampedSpeed = Math.max(0.25, Math.min(4.0, Math.round(newSpeed * 100) / 100));
      if (Math.abs(clip.speed - clampedSpeed) < 0.001) return;
      if (saveUndo) pushUndo();
      const sourceSpan = clip.duration * clip.speed;
      clip.speed = clampedSpeed;
      clip.duration = roundSec(Math.max(0.25, sourceSpan / clampedSpeed));
      if (clip.mediaEl && clip.mediaEl.tagName === 'VIDEO') clip.mediaEl.playbackRate = clampedSpeed;
      renderTimeline(); renderDrawer(); syncVideoElements(true); renderFrame();
      scheduleAutoSaveDraft();
    }

    function cloneClipData(c) {
      return {
        ...c,
        fadeIn: { ...(c.fadeIn || { type: 'none', dur: 0.8 }) },
        fadeOut: { ...(c.fadeOut || { type: 'none', dur: 0.8 }) },
        baseTransform: { ...(c.baseTransform || { scaleX: 1.0, scaleY: 1.0, x: 0, y: 0, rot: 0 }) },
        crop: { ...(c.crop || { left: 0, right: 0, top: 0, bottom: 0 }) },
        keyframes: JSON.parse(JSON.stringify(c.keyframes || [])),
        color: { ...c.color }, cutout: { ...c.cutout },
        mask: { ...c.mask, penPoints: JSON.parse(JSON.stringify(c.mask.penPoints || [])) }
      };
    }

    function captureStateSnapshot() {
      return {
        clips: state.clips.map(cloneClipData),
        pipTracks: state.pipTracks.map(tr => ({ ...tr, visible: tr.visible !== false, clips: tr.clips.map(cloneClipData) })),
        subtitles: JSON.parse(JSON.stringify(state.subtitles)),
        audioClips: state.audioClips.map(a => ({ ...a })),
        trackVisibility: { ...state.trackVisibility },
        background: { ...state.background },
        effects: JSON.parse(JSON.stringify(state.effects)),
        selectedClipId: state.selectedClipId, selectedSubId: state.selectedSubId,
        selectedAudioId: state.selectedAudioId, lastSelectedType: state.lastSelectedType,
        currentTime: state.currentTime
      };
    }

    function applyStateSnapshot(snap) {
      state.clips = snap.clips.map(cloneClipData);
      state.pipTracks = snap.pipTracks.map(tr => ({ ...tr, visible: tr.visible !== false, clips: tr.clips.map(cloneClipData) }));
      state.subtitles = JSON.parse(JSON.stringify(snap.subtitles)).map(s => normalizeSubtitleObject(s));
      state.audioClips = snap.audioClips.map(a => ({ ...a }));
      state.trackVisibility = snap.trackVisibility ? { ...snap.trackVisibility } : { main: true, audio: true, sub: true };
      if (snap.background) state.background = { ...snap.background };
      if (snap.effects) state.effects = JSON.parse(JSON.stringify(snap.effects));
      state.selectedClipId = snap.selectedClipId; state.selectedSubId = snap.selectedSubId;
      state.selectedAudioId = snap.selectedAudioId; state.lastSelectedType = snap.lastSelectedType;
      if (typeof snap.currentTime === 'number') {
        state.currentTime = snap.currentTime;
        timelineScroll.scrollLeft = Math.round(state.currentTime * state.pxPerSec);
      }
    }

    function updateHistoryButtonsUI() {
      const uBtn = document.getElementById('undoBtn'), rBtn = document.getElementById('redoBtn');
      if (uBtn) { uBtn.disabled = undoStack.length === 0; uBtn.classList.toggle('history-active', undoStack.length > 0); }
      if (rBtn) { rBtn.disabled = redoStack.length === 0; rBtn.classList.toggle('history-active', redoStack.length > 0); }
    }

    function pushUndo() {
      undoStack.push(captureStateSnapshot());
      if (undoStack.length > 35) undoStack.shift();
      redoStack = [];
      updateHistoryButtonsUI();
    }

    function undoLastAction() {
      if (undoStack.length === 0) return showToast('目前沒有可撤回的上一步');
      if (state.isPlaying) togglePlay(false);
      redoStack.push(captureStateSnapshot());
      applyStateSnapshot(undoStack.pop());
      updateHistoryButtonsUI(); updateDeleteButtonLabel();
      renderTimeline(); renderDrawer(); syncVideoElements(true); renderFrame();
      scheduleAutoSaveDraft();
      showToast(`已返回上一步（剩餘可撤回 ${undoStack.length} 步）↩️`);
    }

    function redoNextAction() {
      if (redoStack.length === 0) return showToast('目前已是最新編輯狀態');
      if (state.isPlaying) togglePlay(false);
      undoStack.push(captureStateSnapshot());
      applyStateSnapshot(redoStack.pop());
      updateHistoryButtonsUI(); updateDeleteButtonLabel();
      renderTimeline(); renderDrawer(); syncVideoElements(true); renderFrame();
      scheduleAutoSaveDraft();
      showToast(`已前進下一步（剩餘可重做 ${redoStack.length} 步）↪️`);
    }

    document.getElementById('undoBtn').onclick = undoLastAction;
    document.getElementById('redoBtn').onclick = redoNextAction;

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.style.opacity = '1';
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.style.opacity = '0', 2300);
    }

    function getTotalDuration() {
      const mainDur = state.clips.reduce((acc, c) => acc + c.duration, 0);
      let pipEnd = 0;
      state.pipTracks.forEach(tr => tr.clips.forEach(c => { pipEnd = Math.max(pipEnd, (c.start || 0) + c.duration); }));
      const subEnd = state.subtitles.reduce((max, s) => Math.max(max, s.start + s.duration), 0);
      const audEnd = state.audioClips.reduce((max, a) => Math.max(max, (a.start || 0) + a.duration), 0);
      return roundSec(Math.max(mainDur, pipEnd, subEnd, audEnd, 1));
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = (sec % 60).toFixed(1);
      return `${String(m).padStart(2, '0')}:${s.padStart(4, '0')}`;
    }

    function seekTo(sec) {
      state.currentTime = roundSec(Math.max(0, Math.min(getTotalDuration(), sec)));
      timelineScroll.scrollLeft = Math.round(state.currentTime * state.pxPerSec);
      syncVideoElements(true);
      renderFrame();
    }

    function updateDeleteButtonLabel() {
      const btn = document.getElementById('deleteSelectedBtn');
      if (state.lastSelectedType === 'sub' && state.selectedSubId) btn.innerHTML = '🗑️ 刪字幕';
      else if (state.lastSelectedType === 'audio' && state.selectedAudioId) btn.innerHTML = '🗑️ 刪音軌';
      else if (state.lastSelectedType === 'pip') btn.innerHTML = '🗑️ 刪畫中畫';
      else btn.innerHTML = '🗑️ 刪片段';
    }

    function getInterpolatedTransform(clip, localT) {
      const base = clip?.baseTransform || { scaleX: 1.0, scaleY: 1.0, x: 0, y: 0, rot: 0 };
      if (!clip || !clip.keyframes || clip.keyframes.length === 0) return { ...base };
      const kfs = [...clip.keyframes].sort((a, b) => a.t - b.t);
      if (localT <= kfs[0].t) return { ...kfs[0] };
      if (localT >= kfs[kfs.length - 1].t) return { ...kfs[kfs.length - 1] };
      for (let i = 0; i < kfs.length - 1; i++) {
        const k1 = kfs[i], k2 = kfs[i + 1];
        if (localT >= k1.t && localT <= k2.t) {
          const rawRatio = (localT - k1.t) / Math.max(0.001, k2.t - k1.t);
          const ratio = rawRatio * rawRatio * (3 - 2 * rawRatio);
          return {
            scaleX: (k1.scaleX ?? 1) + ((k2.scaleX ?? 1) - (k1.scaleX ?? 1)) * ratio,
            scaleY: (k1.scaleY ?? 1) + ((k2.scaleY ?? 1) - (k1.scaleY ?? 1)) * ratio,
            x: k1.x + (k2.x - k1.x) * ratio,
            y: k1.y + (k2.y - k1.y) * ratio,
            rot: (k1.rot || 0) + ((k2.rot || 0) - (k1.rot || 0)) * ratio
          };
        }
      }
      return { ...base };
    }

    function computeClipStageRects(clip, localT, W, H, isPipLayer) {
      const sf = state.renderScaleFactor || 1;
      const el = clip.mediaEl;
      const isVideo = el && el.tagName === 'VIDEO';
      const srcW = isVideo ? (el.videoWidth || 360) : (el?.naturalWidth || 360);
      const srcH = isVideo ? (el.videoHeight || 640) : (el?.naturalHeight || 640);
      const baseRatio = srcW / srcH, canvasRatio = W / H;
      let baseW = W, baseH = H;
      if (baseRatio > canvasRatio) { baseH = H; baseW = H * baseRatio; }
      else { baseW = W; baseH = W / baseRatio; }
      if (isPipLayer) { baseW *= 0.58; baseH *= 0.58; }

      const tr = getInterpolatedTransform(clip, localT);
      const dispW = baseW * (tr.scaleX ?? 1), dispH = baseH * (tr.scaleY ?? 1);
      const cx = W / 2 + (tr.x || 0) * sf, cy = H / 2 + (tr.y || 0) * sf;
      const crop = clip.crop || { left: 0, right: 0, top: 0, bottom: 0 };
      const fullLeft = cx - dispW / 2, fullTop = cy - dispH / 2;
      const cropLeft = fullLeft + dispW * crop.left, cropTop = fullTop + dispH * crop.top;
      const cropW = dispW * Math.max(0.05, 1 - crop.left - crop.right);
      const cropH = dispH * Math.max(0.05, 1 - crop.top - crop.bottom);
      return { baseW, baseH, dispW, dispH, cx, cy, fullLeft, fullTop, cropLeft, cropTop, cropW, cropH, tr, crop };
    }

    function hexToRgb(hex) {
      const clean = (hex || '#000000').replace('#', '');
      const num = parseInt(clean.length === 3 ? clean.split('').map(c => c + c).join('') : clean, 16) || 0;
      return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
    }

    function drawVisualClip(targetCtx, clip, localT, W, H, isPipLayer) {
      const el = clip.mediaEl;
      if (!el) return;
      const isVideo = el.tagName === 'VIDEO';
      if (isVideo && (el.error || el.readyState < 1 || el.videoWidth === 0)) return;
      if (!isVideo && (!el.complete || el.naturalWidth === 0)) return;

      const srcW = isVideo ? el.videoWidth : el.naturalWidth;
      const srcH = isVideo ? el.videoHeight : el.naturalHeight;
      let drawSource = el;

      if (clip.cutout && clip.cutout.mode !== 'none') {
        const procW = Math.min(480, srcW), procH = Math.round(procW * (srcH / srcW));
        offCanvas.width = procW; offCanvas.height = procH;
        offCtx.clearRect(0, 0, procW, procH);
        offCtx.drawImage(el, 0, 0, procW, procH);

        if (clip.cutout.mode === 'chroma') {
          const imgData = offCtx.getImageData(0, 0, procW, procH), data = imgData.data;
          const targetRgb = hexToRgb(clip.cutout.keyColor || '#00ff00');
          const tol = clip.cutout.tolerance || 65, smooth = Math.max(1, clip.cutout.smoothness || 15);
          for (let i = 0; i < data.length; i += 4) {
            const dr = data[i] - targetRgb.r, dg = data[i + 1] - targetRgb.g, db = data[i + 2] - targetRgb.b;
            const dist = Math.sqrt(dr * dr + dg * dg + db * db);
            if (dist < tol) data[i + 3] = 0;
            else if (dist < tol + smooth) data[i + 3] = Math.round(data[i + 3] * ((dist - tol) / smooth));
          }
          offCtx.putImageData(imgData, 0, 0);
          drawSource = offCanvas;
        } else if (clip.cutout.mode === 'ai') {
          runAISegmentation(el);
          if (latestSegMask) {
            offCtx.globalCompositeOperation = 'destination-in';
            offCtx.drawImage(latestSegMask, 0, 0, procW, procH);
            offCtx.globalCompositeOperation = 'source-over';
            drawSource = offCanvas;
          }
        }
      }

      const rects = computeClipStageRects(clip, localT, W, H, isPipLayer);
      const { dispW, dispH, cx, cy, tr, crop } = rects;
      const sf = state.renderScaleFactor || 1;

      targetCtx.save();
      targetCtx.imageSmoothingEnabled = true;
      targetCtx.imageSmoothingQuality = 'high';
      targetCtx.globalAlpha = clip.opacity !== undefined ? clip.opacity : 1.0;
      targetCtx.globalCompositeOperation = clip.blendMode || 'source-over';
      targetCtx.translate(cx, cy);
      targetCtx.rotate(((tr.rot || 0) * Math.PI) / 180);

      const col = clip.color || { b: 100, c: 100, s: 100, warm: 0 };
      targetCtx.filter = `brightness(${col.b}%) contrast(${col.c}%) saturate(${col.s}%) sepia(${col.warm > 0 ? col.warm * 0.6 : 0}%) hue-rotate(${col.warm < 0 ? col.warm * 0.8 : 0}deg)`;

      const isEditingCrop = (!state.isPlaying && !state.isExporting && state.canvasBoxMode === 'crop' && clip.id === state.selectedClipId);
      if (isEditingCrop) {
        targetCtx.save(); targetCtx.globalAlpha = 0.26;
        targetCtx.drawImage(drawSource, -dispW / 2, -dispH / 2, dispW, dispH);
        targetCtx.restore();
      }

      const cLeftLocal = -dispW / 2 + dispW * crop.left, cTopLocal = -dispH / 2 + dispH * crop.top;
      const cWLocal = dispW * Math.max(0.05, 1 - crop.left - crop.right);
      const cHLocal = dispH * Math.max(0.05, 1 - crop.top - crop.bottom);
      targetCtx.beginPath();
      targetCtx.rect(cLeftLocal, cTopLocal, cWLocal, cHLocal);
      targetCtx.clip();

      const mask = clip.mask || { type: 'none', feather: 12, penPoints: [] };
      if (mask.type !== 'none') {
        targetCtx.beginPath();
        if (mask.type === 'circle') {
          targetCtx.arc(cLeftLocal + cWLocal / 2, cTopLocal + cHLocal / 2, Math.min(cWLocal, cHLocal) * 0.45, 0, Math.PI * 2);
          targetCtx.clip();
        } else if (mask.type === 'roundrect') {

          const gradV = maskCtx.createLinearGradient(0, 0, 0, maskCanvas.height);
          gradV.addColorStop(0, 'rgba(0,0,0,0)'); gradV.addColorStop(Math.min(0.49, fPx / maskCanvas.height), 'rgba(0,0,0,1)');
          gradV.addColorStop(Math.max(0.51, 1 - fPx / maskCanvas.height), 'rgba(0,0,0,1)'); gradV.addColorStop(1, 'rgba(0,0,0,0)');

    function getSelectionBoxHandles(selObj, W, H) {
      if (!selObj) return null;
      const localT = getClipLocalTime(selObj.clip, selObj.isPip);
      const rects = computeClipStageRects(selObj.clip, localT, W, H, selObj.isPip);
      const { cropLeft, cropTop, cropW, cropH } = rects;
      const rawRight = cropLeft + cropW, rawBottom = cropTop + cropH;

      const visTop = Math.max(inset, Math.min(H - inset - 24, cropTop));
      const visRight = Math.max(visLeft + 24, Math.min(W - inset, rawRight));
      const visBottom = Math.max(visTop + 24, Math.min(H - inset, rawBottom));
      const visWidth = visRight - visLeft;
      const visHeight = visBottom - visTop;
      const midX = visLeft + visWidth / 2;
      const midY = visTop + visHeight / 2;

      return {
        box: { left: visLeft, top: visTop, right: visRight, bottom: visBottom, width: visWidth, height: visHeight, midX, midY },
        rects,
        handles: [
          { id: 'nw', x: visLeft, y: visTop }, { id: 'n', x: midX, y: visTop }, { id: 'ne', x: visRight, y: visTop },
          { id: 'e', x: visRight, y: midY }, { id: 'se', x: visRight, y: visBottom }, { id: 's', x: midX, y: visBottom },
          { id: 'sw', x: visLeft, y: visBottom }, { id: 'w', x: visLeft, y: midY }

    }

    function drawSelectionOverlay(targetCtx, W, H) {
      if (state.isPlaying || state.isExporting || state.penEditMode) return;
      const selObj = getActiveVisualClipAtCurrentTime();
      if (!selObj) return;
      const info = getSelectionBoxHandles(selObj, W, H);
      if (!info) return;
      const { box, handles } = info;
      const isCrop = state.canvasBoxMode === 'crop';
      targetCtx.save();
      targetCtx.strokeStyle = isCrop ? '#ffcc33' : '#38bdf8';
      targetCtx.lineWidth = 2;

      targetCtx.restore();
    }

    function renderAtmosphereEffects(targetCtx, W, H, t) {
      const fx = state.effects, sf = state.renderScaleFactor || 1;
      if (fx.spotlight && fx.spotlight.enabled) {
        const sp = fx.spotlight, fxPx = sp.focusX * W, fyPx = sp.focusY * H;
        const beamTopX = fxPx - Math.tan((sp.angle * Math.PI) / 180) * fyPx, spreadHalfW = W * sp.spread;
        targetCtx.save();

        maskCtx.fillRect(0, 0, W, H);

        const beamGrad = maskCtx.createLinearGradient(beamTopX, 0, fxPx, fyPx + spreadHalfW);

        spotGrad.addColorStop(0, 'rgba(0,0,0,1)'); spotGrad.addColorStop(0.6, 'rgba(0,0,0,0.85)'); spotGrad.addColorStop(1, 'rgba(0,0,0,0)');
        maskCtx.fillStyle = spotGrad; maskCtx.beginPath(); maskCtx.arc(fxPx, fyPx, spreadHalfW * 1.25, 0, Math.PI * 2); maskCtx.fill();

        targetCtx.save();
        for (let i = 0; i < count; i++) {

          const py = (((p.y0 + t * 0.16 * spd * p.speedMul) % 1.15) - 0.08) * H;
          const sway = Math.sin(t * 2.1 * p.speedMul + p.phase) * p.swayAmp * W;

        targetCtx.restore();

    }

    // ====== 字幕進出場動畫計算引擎 ======
    function computeSubtitleAnimState(sub, localT) {
      const anim = sub.anim || 'none';
      if (anim === 'none') {
        return { alpha: 1, scale: 1, offsetY: 0, charRatio: 1, wipeRatio: 1 };
      }
      const inDur = Math.min(sub.animDur || 0.35, Math.max(0.12, sub.duration * 0.45));
      const outDur = Math.min(0.22, Math.max(0.08, sub.duration * 0.25));
      const timeLeft = sub.duration - localT;
      const outAlpha = (timeLeft < outDur && anim !== 'typewriter') ? Math.max(0, timeLeft / outDur) : 1;

      if (anim === 'fade') {
        const p = Math.min(1, localT / inDur);
        const eased = p * (2 - p);
        return { alpha: eased * outAlpha, scale: 1, offsetY: 0, charRatio: 1, wipeRatio: 1 };
      }
      if (anim === 'pop') {
        const p = Math.min(1, localT / inDur);
        const c1 = 1.70158;
        const c3 = c1 + 1;
        const scale = p >= 1 ? 1 : 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2);
        return { alpha: Math.min(1, p * 2.5) * outAlpha, scale: Math.max(0.15, scale), offsetY: 0, charRatio: 1, wipeRatio: 1 };
      }
      if (anim === 'slideUp') {
        const p = Math.min(1, localT / inDur);
        const eased = 1 - Math.pow(1 - p, 3);
        return { alpha: eased * outAlpha, scale: 1, offsetY: (1 - eased) * 26, charRatio: 1, wipeRatio: 1 };
      }
      if (anim === 'typewriter') {
        const typeSpan = Math.max(0.2, Math.min(sub.duration * 0.78, Math.max(inDur * 1.6, Array.from(sub.text || '').length * 0.055)));
        const charRatio = Math.min(1, Math.max(0.05, localT / typeSpan));
        return { alpha: 1, scale: 1, offsetY: 0, charRatio, wipeRatio: 1 };
      }
      if (anim === 'wipe') {
        const p = Math.min(1, localT / inDur);
        const eased = 1 - Math.pow(1 - p, 2.5);
        return { alpha: outAlpha, scale: 1, offsetY: 0, charRatio: 1, wipeRatio: Math.max(0.02, eased) };
      }
      return { alpha: 1, scale: 1, offsetY: 0, charRatio: 1, wipeRatio: 1 };
    }

    function applySubtitleTextEffects(targetCtx, sub, sf) {
      if (sub.shadowEnabled) {
        targetCtx.shadowColor = sub.shadowColor || '#000000';
        targetCtx.shadowBlur = (sub.shadowBlur ?? 8) * sf;
        const off = (sub.shadowOffset ?? 3) * sf;
        targetCtx.shadowOffsetX = off;
        targetCtx.shadowOffsetY = off;
      } else {
        targetCtx.shadowColor = 'transparent';
        targetCtx.shadowBlur = 0;
        targetCtx.shadowOffsetX = 0;
        targetCtx.shadowOffsetY = 0;
      }
    }

    function resetCanvasShadow(targetCtx) {
      targetCtx.shadowColor = 'transparent';
      targetCtx.shadowBlur = 0;
      targetCtx.shadowOffsetX = 0;
      targetCtx.shadowOffsetY = 0;
    }

    function renderFrame() {
      const W = canvas.width, H = canvas.height, sf = state.renderScaleFactor || 1;
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
      ctx.clearRect(0, 0, W, H);

      const bg = state.background;
      if (bg.mode === 'solid') {
        ctx.fillStyle = bg.color1 || '#000000'; ctx.fillRect(0, 0, W, H);
      } else if (bg.mode === 'gradient') {
        const grad = ctx.createLinearGradient(0, 0, W, H);
        grad.addColorStop(0, bg.color1 || '#1e1b4b'); grad.addColorStop(1, bg.color2 || '#4c1d95');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);

        if (sw > 0 && sh > 0) { const r = Math.max(W / sw, H / sh); ctx.drawImage(el, (W - sw * r) / 2, (H - sh * r) / 2, sw * r, sh * r); }
        else { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); }
      } else { ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, W, H); }

      const isMainVisible = state.trackVisibility.main !== false;
      let acc = 0, activeMainClip = null, mainLocalT = 0, mainIndex = 0;

      if (isMainVisible) {
        if (activeTrim && activeTrim.type === 'clip' && !activeTrim.isPip) {
          activeMainClip = activeTrim.item;
          mainLocalT = activeTrim.edge === 'left' ? 0 : Math.max(0, activeMainClip.duration - 0.02);
          mainIndex = state.clips.indexOf(activeMainClip);
        } else if (reorderState && reorderState.sourceType === 'main') {

          for (let i = 0; i < state.clips.length; i++) {

            if (state.currentTime >= acc && state.currentTime <= acc + c.duration) {

            }

      if (bg.mode === 'blur' && activeMainClip && activeMainClip.mediaEl) {

      if (isMainVisible && activeMainClip) {

        const timeLeft = activeMainClip.duration - mainLocalT;
        if (!activeTrim && !reorderState && timeLeft <= 0.6 && activeMainClip.transitionAfter !== 'none' && mainIndex < state.clips.length - 1) {
          const p = 1 - (timeLeft / 0.6);

      drawSelectionOverlay(ctx, W, H);

      if (state.trackVisibility.sub !== false) {
        state.subtitles.forEach(rawSub => {
          const sub = normalizeSubtitleObject(rawSub);

            ctx.save();

            ctx.font = `700 ${scaledFontSize}px ${sub.font}`;

            ctx.textBaseline = 'middle';

            ctx.lineCap = 'round';

            if (sub.orientation !== 'vertical') {

              const displayText = allChars.slice(0, visibleCount).join('');

              }

              if (bgFill && bgFill !== 'transparent') {

              }
              ctx.fillStyle = sub.color || '#ffffff';
              ctx.fillText(displayText, 0, 0);
              resetCanvasShadow(ctx);

              if (sub.id === state.selectedSubId && state.lastSelectedType === 'sub' && !state.isPlaying && !state.isExporting) {
                ctx.strokeStyle = '#ff3b7f'; ctx.lineWidth = 1.5; ctx.setLineDash([4, 3]);

              const lines = rawLines.map(l => {

              const charStep = scaledFontSize * 1.12, colStep = scaledFontSize * 1.3;

              if (bgFill && bgFill !== 'transparent') {
