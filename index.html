                ctx.fill();
              }

              lines.forEach((lineStr, colIdx) => {
                const chars = Array.from(lineStr);
                const colX = ((lines.length - 1) / 2 - colIdx) * colStep;
                chars.forEach((ch, rowIdx) => {
                  const charY = -((chars.length - 1) / 2 - rowIdx) * charStep;
                  applySubtitleTextEffects(ctx, sub, sf);
                  if (hasStroke) {
                    ctx.lineWidth = strokePx;
                    ctx.strokeStyle = sub.stroke || '#000000';
                    ctx.strokeText(ch, colX, charY);
                    resetCanvasShadow(ctx);
                  }
                  ctx.fillStyle = sub.color || '#ffffff';
                  ctx.fillText(ch, colX, charY);
                  resetCanvasShadow(ctx);
                });
              });

              if (sub.id === state.selectedSubId && state.lastSelectedType === 'sub' && !state.isPlaying && !state.isExporting) {
                ctx.strokeStyle = '#ff3b7f'; ctx.lineWidth = 1.5; ctx.setLineDash([4, 3]);
                ctx.strokeRect(-totalW / 2 - 4, -totalH / 2 - 4, totalW + 8, totalH + 8);
              }
            }
            ctx.restore();
          }
        });
      }

      if (!state.isExporting && reorderState && reorderState.sourceType === 'main') {
        ctx.save(); ctx.fillStyle = 'rgba(255, 204, 51, 0.94)'; ctx.beginPath(); ctx.roundRect(10, H - 36, 215, 24, 6); ctx.fill();
        ctx.fillStyle = '#111'; ctx.font = "800 11px 'Noto Sans TC', sans-serif"; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        ctx.fillText(`全局排序：第 ${mainIndex + 1} 段 / 共 ${state.clips.length} 段（上拖轉畫中畫）`, 16, H - 24);
        ctx.restore();
      }

      if (!state.isExporting && activeTrim && (activeTrim.type === 'clip' || activeTrim.type === 'pip' || activeTrim.type === 'audio')) {
        const c = activeTrim.item;
        ctx.save(); ctx.fillStyle = activeTrim.type === 'audio' ? 'rgba(20, 184, 166, 0.92)' : 'rgba(255, 59, 127, 0.92)';
        ctx.beginPath(); ctx.roundRect(10, H - 36, 205, 24, 6); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = "700 11px 'Noto Sans TC', sans-serif"; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        const edgeText = activeTrim.edge === 'left'
          ? `裁切起點：${(c.trimStart || 0).toFixed(2)}s（長 ${c.duration.toFixed(1)}s）`
          : `裁切終點：${((c.trimStart || 0) + c.duration * (c.speed || 1)).toFixed(2)}s（長 ${c.duration.toFixed(1)}s）`;
        ctx.fillText(edgeText, 16, H - 24);
        ctx.restore();
      }

      document.getElementById('curTimeLabel').textContent = formatTime(state.currentTime);
      document.getElementById('totTimeLabel').textContent = formatTime(getTotalDuration());
    }

    let activeTrim = null;

    function formatClipLabel(clip, prefix = '') {
      const trimTag = (clip.trimStart || 0) > 0.05 ? ` [裁${(clip.trimStart).toFixed(1)}s]` : '';
      const speedTag = Math.abs(clip.speed - 1.0) > 0.01 ? ` ${clip.speed > 1 ? '⚡' : '🐢'}${clip.speed}x` : '';
      const muteTag = clip.muted ? ' 🔇' : (Math.abs((clip.audioGain ?? 1) - 1) > 0.05 ? ` 🔊${Math.round(clip.audioGain * 100)}%` : '');
      return `${prefix}${clip.name}${muteTag}${speedTag}${trimTag} (${clip.duration.toFixed(1)}s)`;
    }

    function formatAudioClipLabel(aClip) {
      const trimTag = (aClip.trimStart || 0) > 0.05 ? ` [裁${(aClip.trimStart).toFixed(1)}s]` : '';
      const muteTag = aClip.muted ? '🔇' : (aClip.isAI ? `🎙️ ${Math.round((aClip.gain ?? 1) * 100)}%` : `🎵 ${Math.round((aClip.gain ?? 1) * 100)}%`);
      const srcTag = aClip.fromVideo ? '[影轉音] ' : '';
      return `${muteTag} ${srcTag}${aClip.name}${trimTag} (${aClip.duration.toFixed(1)}s)`;
    }

    function attachTrimEvents(handleEl, type, item, edge, blockEl, labelEl, isPip = false) {
      handleEl.addEventListener('pointerdown', (e) => {
        e.stopPropagation(); e.preventDefault(); cancelLongPress();
        if (state.isPlaying) togglePlay(false);
        pushUndo();
        handleEl.setPointerCapture(e.pointerId); handleEl.classList.add('active');
        activeTrim = { type, isPip, item, edge, startX: e.clientX, origTrimStart: item.trimStart || 0, origStart: item.start || 0, origDur: item.duration, handleEl, blockEl, labelEl };
        if ((type === 'clip' || type === 'pip') && item.mediaEl?.tagName === 'VIDEO') {
          requestVideoSeek(item.mediaEl, edge === 'left' ? (item.trimStart || 0) : (item.trimStart || 0) + item.duration * item.speed - 0.02);
        }
        renderFrame();
      });

      handleEl.addEventListener('pointermove', (e) => {
        if (!activeTrim || activeTrim.handleEl !== handleEl) return;
        e.stopPropagation();
        const rawDeltaSec = (e.clientX - activeTrim.startX) / state.pxPerSec;

        if (activeTrim.type === 'clip' || activeTrim.type === 'pip') {
          const maxTotal = item.maxDuration || 120, spd = item.speed || 1.0;
          if (edge === 'left') {
            if (isPip) {
              const targetStart = snapTimeValue(activeTrim.origStart + rawDeltaSec, item.id);
              const clampedDelta = Math.max(-activeTrim.origStart, Math.min(activeTrim.origDur - 0.2, targetStart - activeTrim.origStart));
              item.start = roundSec(activeTrim.origStart + clampedDelta);
              item.trimStart = roundSec(Math.max(0, activeTrim.origTrimStart + clampedDelta * spd));
              item.duration = roundSec(activeTrim.origDur - clampedDelta);
            } else {
              const clampedDelta = roundSec(Math.max(-(activeTrim.origTrimStart / spd), Math.min(activeTrim.origDur - 0.2, rawDeltaSec)));
              item.trimStart = roundSec(activeTrim.origTrimStart + clampedDelta * spd);
              item.duration = roundSec(activeTrim.origDur - clampedDelta);
            }
            if (item.mediaEl?.tagName === 'VIDEO') requestVideoSeek(item.mediaEl, item.trimStart);
          } else {
            const maxAvailDur = item.mediaType === 'image' ? 120 : Math.max(0.2, (maxTotal - (item.trimStart || 0)) / spd);
            if (isPip) {
              const targetEnd = snapTimeValue(activeTrim.origStart + activeTrim.origDur + rawDeltaSec, item.id);
              item.duration = roundSec(Math.max(0.2, Math.min(maxAvailDur, targetEnd - item.start)));
            } else {
              let clipStartAcc = 0;
              for (const c of state.clips) { if (c.id === item.id) break; clipStartAcc += c.duration; }
              const targetEnd = snapTimeValue(clipStartAcc + activeTrim.origDur + rawDeltaSec, item.id);
              item.duration = roundSec(Math.max(0.2, Math.min(maxAvailDur, targetEnd - clipStartAcc)));
            }
            if (item.mediaEl?.tagName === 'VIDEO') requestVideoSeek(item.mediaEl, (item.trimStart || 0) + item.duration * spd - 0.02);
          }
          if (blockEl) {
            if (isPip) blockEl.style.left = Math.round((item.start || 0) * state.pxPerSec) + 'px';
            blockEl.style.width = Math.round(item.duration * state.pxPerSec) + 'px';
          }
          if (labelEl) labelEl.textContent = formatClipLabel(item);
          renderFrame();
        } else if (activeTrim.type === 'audio') {
          const maxTotal = item.maxDuration || 300;
          if (edge === 'left') {
            const targetStart = snapTimeValue(activeTrim.origStart + rawDeltaSec, item.id);
            const clampedDelta = roundSec(Math.max(-Math.min(activeTrim.origStart, activeTrim.origTrimStart), Math.min(activeTrim.origDur - 0.2, targetStart - activeTrim.origStart)));
            item.start = roundSec(Math.max(0, activeTrim.origStart + clampedDelta));
            item.trimStart = roundSec(Math.max(0, activeTrim.origTrimStart + clampedDelta));
            item.duration = roundSec(activeTrim.origDur - clampedDelta);
          } else {
            const targetEnd = snapTimeValue(activeTrim.origStart + activeTrim.origDur + rawDeltaSec, item.id);
            item.duration = roundSec(Math.max(0.2, Math.min(Math.max(0.2, maxTotal - (item.trimStart || 0)), targetEnd - item.start)));
          }
          if (blockEl) { blockEl.style.left = Math.round((item.start || 0) * state.pxPerSec) + 'px'; blockEl.style.width = Math.round(item.duration * state.pxPerSec) + 'px'; }
          if (labelEl) labelEl.textContent = formatAudioClipLabel(item);
          renderFrame();
        } else if (activeTrim.type === 'sub') {
          if (edge === 'right') {
            item.duration = roundSec(Math.max(0.3, snapTimeValue(activeTrim.origStart + activeTrim.origDur + rawDeltaSec, item.id) - item.start));
          } else {
            const targetStart = snapTimeValue(activeTrim.origStart + rawDeltaSec, item.id);
            const shift = roundSec(Math.max(-activeTrim.origStart, Math.min(activeTrim.origDur - 0.3, targetStart - activeTrim.origStart)));
            item.start = roundSec(activeTrim.origStart + shift);
            item.duration = roundSec(activeTrim.origDur - shift);
          }
          if (blockEl) { blockEl.style.left = Math.round(item.start * state.pxPerSec) + 'px'; blockEl.style.width = Math.round(item.duration * state.pxPerSec) + 'px'; }
          if (labelEl) labelEl.textContent = `${item.orientation === 'vertical' ? '[直]' : '[橫]'} ${item.text} (${item.duration.toFixed(1)}s)`;
          renderFrame();
        }
      });

      const finishTrim = (e) => {
        if (!activeTrim || activeTrim.handleEl !== handleEl) return;
        e.stopPropagation(); handleEl.classList.remove('active'); activeTrim = null;
        showToast(`已精準裁切長度：${item.duration.toFixed(2)} 秒`);
        renderTimeline(); renderDrawer(); syncVideoElements(true); renderFrame();
        scheduleAutoSaveDraft();
      };
      handleEl.addEventListener('pointerup', finishTrim);
      handleEl.addEventListener('pointercancel', finishTrim);
    }

    let longPressTimer = null, reorderState = null;
    function cancelLongPress() { if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; } }

    function startClipLongPress(e, clip, sourceType, sourceTrackId = null) {
      if (e.target.closest('.trim-handle') || e.target.closest('.eye-btn') || activeTrim) return;
      cancelLongPress();
      const startX = e.clientX, startY = e.clientY;
      longPressTimer = setTimeout(() => {
        isDraggingTimeline = false; timelineScroll.classList.remove('grabbing');
        if (sourceType === 'main') timelineScroll.scrollLeft = 0;
        pushUndo();
        reorderState = { clipId: clip.id, sourceType, sourceTrackId, startX, startY, origStart: clip.start || 0 };
        if (sourceType === 'audio') { state.selectedAudioId = clip.id; state.lastSelectedType = 'audio'; showToast('已啟動音軌移動：左右拖曳磁吸對齊位置 ↔️'); }
        else if (sourceType === 'main') {
          state.selectedClipId = clip.id; state.lastSelectedType = 'clip';
          if (clip.mediaEl?.tagName === 'VIDEO') requestVideoSeek(clip.mediaEl, clip.trimStart || 0);
          showToast(`全局縮略排序（共 ${state.clips.length} 段）：左右拖改順序，往上拖轉畫中畫 ↔️↕️`);
        } else { state.selectedClipId = clip.id; state.lastSelectedType = 'pip'; showToast('已啟動畫中畫移動：左右調時間，往下拖回主軌 ↔️↕️'); }
        updateDeleteButtonLabel();
        if (navigator.vibrate) navigator.vibrate(25);
        renderTimeline(); renderFrame();
      }, 220);
    }

    window.addEventListener('pointermove', (e) => {
      if (longPressTimer && !reorderState && Math.hypot(e.clientX - dragStartX, e.clientY - dragStartY) > 10) cancelLongPress();
      if (!reorderState) return;
      e.preventDefault();

      if (reorderState.sourceType === 'audio') {
        const aClip = state.audioClips.find(a => a.id === reorderState.clipId);
        if (aClip) {
          aClip.start = snapTimeValue(reorderState.origStart + (e.clientX - reorderState.startX) / state.pxPerSec, aClip.id);
          const blockEl = document.querySelector(`.audio-clip-block[data-audio-id="${aClip.id}"]`);
          if (blockEl) blockEl.style.left = Math.round(aClip.start * state.pxPerSec) + 'px';
          renderFrame();
        }
        return;
      }

      const trackEls = document.querySelectorAll('#tracksContainer .track-row[data-track-kind]');
      trackEls.forEach(el => el.classList.remove('drop-target'));
      let hoveredTrackEl = null;
      trackEls.forEach(el => {
        const rect = el.getBoundingClientRect();
        if (e.clientY >= rect.top - 8 && e.clientY <= rect.bottom + 8) { hoveredTrackEl = el; el.classList.add('drop-target'); }
      });

      if (reorderState.sourceType === 'pip') {
        const tr = state.pipTracks.find(t => t.id === reorderState.sourceTrackId);
        const pClip = tr?.clips.find(c => c.id === reorderState.clipId);
        if (pClip) {
          pClip.start = snapTimeValue(reorderState.origStart + (e.clientX - reorderState.startX) / state.pxPerSec, pClip.id);
          const blockEl = document.querySelector(`.clip-block[data-clip-id="${pClip.id}"]`);
          if (blockEl) blockEl.style.left = Math.round(pClip.start * state.pxPerSec) + 'px';
          renderFrame();
        }
      }

      if (reorderState.sourceType === 'main' && (!hoveredTrackEl || hoveredTrackEl.dataset.trackKind === 'main')) {
        const curIdx = state.clips.findIndex(c => c.id === reorderState.clipId);
        const clipEls = document.querySelectorAll('#mainVideoTrack .clip-block');
        if (curIdx > 0 && clipEls[curIdx - 1] && e.clientX < clipEls[curIdx - 1].getBoundingClientRect().left + clipEls[curIdx - 1].getBoundingClientRect().width / 2) {
          [state.clips[curIdx - 1], state.clips[curIdx]] = [state.clips[curIdx], state.clips[curIdx - 1]];
          renderTimeline(); renderFrame();
        } else if (curIdx >= 0 && curIdx < state.clips.length - 1 && clipEls[curIdx + 1] && e.clientX > clipEls[curIdx + 1].getBoundingClientRect().left + clipEls[curIdx + 1].getBoundingClientRect().width / 2) {
          [state.clips[curIdx + 1], state.clips[curIdx]] = [state.clips[curIdx], state.clips[curIdx + 1]];
          renderTimeline(); renderFrame();
        }
      }
    }, { passive: false });

    const endReorder = (e) => {
      cancelLongPress();
      if (!reorderState) return;
      if (reorderState.sourceType === 'audio') {
        reorderState = null; renderTimeline(); renderDrawer(); syncVideoElements(true); scheduleAutoSaveDraft();
        showToast('已對齊音軌時間位置 ✅'); return;
      }

      const movedId = reorderState.clipId, wasMainReorder = reorderState.sourceType === 'main';
      const dropEl = document.querySelector('#tracksContainer .track-row.drop-target');
      const targetKind = dropEl?.dataset.trackKind, targetTrackId = dropEl?.dataset.trackId;
      let draggedClip = null;

      if (reorderState.sourceType === 'main') {
        const idx = state.clips.findIndex(c => c.id === reorderState.clipId);
        if (idx !== -1 && targetKind === 'pip') draggedClip = state.clips.splice(idx, 1)[0];
      } else if (reorderState.sourceType === 'pip') {
        const srcTr = state.pipTracks.find(t => t.id === reorderState.sourceTrackId);
        const idx = srcTr ? srcTr.clips.findIndex(c => c.id === reorderState.clipId) : -1;
        if (idx !== -1 && (targetKind === 'main' || (targetKind === 'pip' && targetTrackId !== reorderState.sourceTrackId))) draggedClip = srcTr.clips.splice(idx, 1)[0];
      }

      if (draggedClip) {
        if (targetKind === 'pip') {
          const destTrack = state.pipTracks.find(t => t.id === targetTrackId) || state.pipTracks[0];
          draggedClip.start = roundSec(Math.max(0, state.currentTime));
          destTrack.clips.push(draggedClip);
          state.lastSelectedType = 'pip'; state.selectedClipId = draggedClip.id;
          showToast(`已移至「${destTrack.name}」🖼️`);
        } else if (targetKind === 'main') {
          state.clips.push(draggedClip);
          state.lastSelectedType = 'clip'; state.selectedClipId = draggedClip.id;
          showToast('已移回主影片軌道 🎞️');
        }
      } else if (e && e.clientY < timelineScroll.getBoundingClientRect().top + 24 && reorderState.sourceType === 'main') {
        const idx = state.clips.findIndex(c => c.id === reorderState.clipId);
        if (idx !== -1) {
          const moved = state.clips.splice(idx, 1)[0], layerNum = state.pipTracks.length + 1;
          state.pipTracks.unshift({ id: 'pip-track-' + Date.now(), name: `畫中畫 L${layerNum} (最頂層)`, visible: true, clips: [{ ...moved, start: roundSec(Math.max(0, state.currentTime)) }] });
          state.lastSelectedType = 'pip'; state.selectedClipId = moved.id;
          showToast(`已自動新增最上層畫中畫軌道 L${layerNum} ✨`);
        }
      }

      reorderState = null; updateDeleteButtonLabel(); renderTimeline(); renderDrawer(); scheduleAutoSaveDraft();
      if (wasMainReorder && !draggedClip) {
        let newStartSec = 0;
        for (const c of state.clips) { if (c.id === movedId) break; newStartSec += c.duration; }
        seekTo(newStartSec); showToast('已完成片段順序調整 ✅');
      } else { syncVideoElements(true); renderFrame(); }
    };
    window.addEventListener('pointerup', endReorder);
    window.addEventListener('pointercancel', endReorder);

    function createTrackHeaderControl(labelText, labelColor, isVisible, onToggle) {
      const wrap = document.createElement('div'); wrap.className = 'track-controls';
      const eyeBtn = document.createElement('button'); eyeBtn.type = 'button'; eyeBtn.className = 'eye-btn';
      eyeBtn.textContent = isVisible ? '👁️' : '🙈';
      eyeBtn.onclick = (e) => { e.stopPropagation(); onToggle(); };
      const badge = document.createElement('span'); badge.className = 'track-badge'; badge.style.color = labelColor; badge.textContent = labelText;
      wrap.appendChild(eyeBtn); wrap.appendChild(badge);
      return wrap;
    }

    function renderTimeline() {
      const isCompactMainReorder = Boolean(reorderState && reorderState.sourceType === 'main');
      timelineScroll.classList.toggle('compact-reorder-mode', isCompactMainReorder);
      const pps = state.pxPerSec, total = getTotalDuration(), displaySec = Math.max(total + 15, 20), totalPx = Math.round(displaySec * pps);
      const timelineInner = document.getElementById('timelineInner');
      timelineInner.style.width = !isCompactMainReorder ? `calc(${totalPx}px + 100vw)` : '100%';

      const ruler = document.getElementById('ruler');
      ruler.style.width = totalPx + 'px'; ruler.innerHTML = '';
      const step = pps < 25 ? 5 : (pps < 40 ? 2 : (pps > 110 ? 0.5 : 1));
      for (let s = 0; s <= Math.ceil(displaySec); s += step) {
        const mark = document.createElement('div'); mark.style.position = 'absolute'; mark.style.left = Math.round(s * pps) + 'px';
        mark.textContent = Number.isInteger(s) ? `${s}s` : `${s.toFixed(1)}s`;
        ruler.appendChild(mark);
      }

      const sidebar = document.getElementById('trackSidebarOverlay'); sidebar.innerHTML = '';
      const container = document.getElementById('tracksContainer'); container.innerHTML = '';

      state.pipTracks.forEach((pTrack, tIdx) => {
        const isVis = pTrack.visible !== false;
        sidebar.appendChild(createTrackHeaderControl(`頂層${tIdx + 1}`, '#d8b4fe', isVis, () => {
          pushUndo(); pTrack.visible = !isVis; renderTimeline(); syncVideoElements(true); renderFrame(); scheduleAutoSaveDraft();
        }));
        const row = document.createElement('div'); row.className = 'track-row pip-track' + (isVis ? '' : ' track-hidden');
        row.dataset.trackKind = 'pip'; row.dataset.trackId = pTrack.id;
        if (pTrack.clips.length === 0) {
          const hint = document.createElement('div'); hint.className = 'empty-track-hint';
          hint.textContent = `＋ 匯入畫中畫素材（或長按下方影片往上拖至此層）`;
          hint.onclick = () => { if (!timelineWasDragged) { window._targetPipTrackId = pTrack.id; document.getElementById('pipFileInput').click(); } };
          row.appendChild(hint);
        } else {
          pTrack.clips.forEach(pClip => {
            const isSel = pClip.id === state.selectedClipId && state.lastSelectedType === 'pip';
            const el = document.createElement('div');
            el.className = 'clip-block pip-clip' + (isSel ? ' selected' : '') + (reorderState?.clipId === pClip.id ? ' reordering' : '');
            el.dataset.clipId = pClip.id; el.style.left = Math.round((pClip.start || 0) * pps) + 'px'; el.style.width = Math.round(pClip.duration * pps) + 'px';
            const lh = document.createElement('div'); lh.className = 'trim-handle left';
            const lb = document.createElement('span'); lb.className = 'clip-label'; lb.textContent = formatClipLabel(pClip);
            const rh = document.createElement('div'); rh.className = 'trim-handle right';
            attachTrimEvents(lh, 'pip', pClip, 'left', el, lb, true); attachTrimEvents(rh, 'pip', pClip, 'right', el, lb, true);
            el.appendChild(lh); el.appendChild(lb); el.appendChild(rh);
            el.addEventListener('pointerdown', (e) => startClipLongPress(e, pClip, 'pip', pTrack.id));
            el.onclick = () => { if (!timelineWasDragged && !reorderState) { state.selectedClipId = pClip.id; state.lastSelectedType = 'pip'; updateDeleteButtonLabel(); renderTimeline(); renderDrawer(); renderFrame(); } };
            (pClip.keyframes || []).forEach(kf => { const d = document.createElement('div'); d.className = 'kf-diamond'; d.style.left = Math.round(kf.t * pps) + 'px'; el.appendChild(d); });
            row.appendChild(el);
          });
        }
        container.appendChild(row);
      });

      const isMainVis = state.trackVisibility.main !== false;
      sidebar.appendChild(createTrackHeaderControl('主軌', '#93c5fd', isMainVis, () => {
        pushUndo(); state.trackVisibility.main = !isMainVis; renderTimeline(); syncVideoElements(true); renderFrame(); scheduleAutoSaveDraft();
      }));
      const vTrack = document.createElement('div'); vTrack.id = 'mainVideoTrack';
      vTrack.className = 'track-row main-track' + (isMainVis ? '' : ' track-hidden'); vTrack.dataset.trackKind = 'main';
      if (state.clips.length === 0) {
        const emptyBtn = document.createElement('div'); emptyBtn.className = 'empty-track-hint'; emptyBtn.textContent = '＋ 點此匯入主影片／圖片';
        emptyBtn.onclick = () => { if (!timelineWasDragged) document.getElementById('videoFileInput').click(); };
        vTrack.appendChild(emptyBtn);
      } else {
        const availW = Math.max(240, timelineScroll.clientWidth - 88);
        const compactW = Math.max(46, Math.min(92, Math.floor((availW - (state.clips.length - 1) * 8) / state.clips.length)));
        state.clips.forEach((clip, idx) => {
          const isSel = clip.id === state.selectedClipId && state.lastSelectedType === 'clip';
          const el = document.createElement('div');
          if (isCompactMainReorder) {
            el.className = 'clip-block compact-card' + (reorderState?.clipId === clip.id ? ' reordering' : '');
            el.dataset.clipId = clip.id; el.style.width = compactW + 'px';
            el.innerHTML = `<span class="compact-num">#${idx + 1}</span><span class="compact-sub">${clip.duration.toFixed(1)}s</span>`;
          } else {
            el.className = 'clip-block' + (isSel ? ' selected' : '') + (reorderState?.clipId === clip.id ? ' reordering' : '');
            el.dataset.clipId = clip.id; el.style.width = Math.round(clip.duration * pps) + 'px';
            const lh = document.createElement('div'); lh.className = 'trim-handle left';
            const lb = document.createElement('span'); lb.className = 'clip-label'; lb.textContent = formatClipLabel(clip, `#${idx + 1} `);
            const rh = document.createElement('div'); rh.className = 'trim-handle right';
            attachTrimEvents(lh, 'clip', clip, 'left', el, lb, false); attachTrimEvents(rh, 'clip', clip, 'right', el, lb, false);
            el.appendChild(lh); el.appendChild(lb); el.appendChild(rh);
            el.addEventListener('pointerdown', (e) => startClipLongPress(e, clip, 'main'));
            el.onclick = () => { if (!timelineWasDragged && !reorderState) { state.selectedClipId = clip.id; state.lastSelectedType = 'clip'; updateDeleteButtonLabel(); renderTimeline(); renderDrawer(); renderFrame(); } };
            (clip.keyframes || []).forEach(kf => { const d = document.createElement('div'); d.className = 'kf-diamond'; d.style.left = Math.round(kf.t * pps) + 'px'; el.appendChild(d); });
            if (idx < state.clips.length - 1) {
              const trBtn = document.createElement('div'); trBtn.className = 'trans-node';
              trBtn.textContent = (TRANSITIONS.find(t => t.id === clip.transitionAfter) || TRANSITIONS[0]).icon;
              trBtn.onclick = (e) => {
                e.stopPropagation(); if (timelineWasDragged || reorderState) return;
                pushUndo();
                const next = TRANSITIONS[(TRANSITIONS.findIndex(t => t.id === clip.transitionAfter) + 1) % TRANSITIONS.length];
                clip.transitionAfter = next.id; showToast(`已切換轉場：${next.name}`);
                renderTimeline(); renderFrame(); scheduleAutoSaveDraft();
              };
              el.appendChild(trBtn);
            }
          }
          vTrack.appendChild(el);
        });
      }
      container.appendChild(vTrack);

      const isAudVis = state.trackVisibility.audio !== false;
      sidebar.appendChild(createTrackHeaderControl('音軌', '#6ee7b7', isAudVis, () => {
        pushUndo(); state.trackVisibility.audio = !isAudVis; renderTimeline(); syncVideoElements(true); scheduleAutoSaveDraft();
      }));
      const aTrack = document.createElement('div'); aTrack.className = 'track-row audio-track' + (isAudVis ? '' : ' track-hidden');
      if (state.audioClips.length === 0) {
        const emptyAudio = document.createElement('div'); emptyAudio.className = 'empty-track-hint';
        emptyAudio.textContent = '＋ 點此插入音樂、AI 配音或「匯入影片轉音軌」';
        emptyAudio.onclick = () => { if (!timelineWasDragged) { state.activeTab = 'audio'; setDrawerCollapsed(false); updateTabsUI(); renderDrawer(); } };
        aTrack.appendChild(emptyAudio);
      } else {
        state.audioClips.forEach(aClip => {
          const aEl = document.createElement('div');
          aEl.className = 'audio-clip-block' + (aClip.id === state.selectedAudioId && state.lastSelectedType === 'audio' ? ' selected' : '') + (reorderState?.clipId === aClip.id ? ' reordering' : '');
          aEl.dataset.audioId = aClip.id; aEl.style.left = Math.round((aClip.start || 0) * pps) + 'px'; aEl.style.width = Math.round(aClip.duration * pps) + 'px';
          const lh = document.createElement('div'); lh.className = 'trim-handle left';
          const lb = document.createElement('span'); lb.className = 'clip-label'; lb.textContent = formatAudioClipLabel(aClip);
          const rh = document.createElement('div'); rh.className = 'trim-handle right';
          attachTrimEvents(lh, 'audio', aClip, 'left', aEl, lb, false); attachTrimEvents(rh, 'audio', aClip, 'right', aEl, lb, false);
          aEl.appendChild(lh); aEl.appendChild(lb); aEl.appendChild(rh);
          aEl.addEventListener('pointerdown', (e) => startClipLongPress(e, aClip, 'audio'));
          aEl.onclick = () => { if (!timelineWasDragged && !reorderState) { state.selectedAudioId = aClip.id; state.lastSelectedType = 'audio'; state.activeTab = 'audio'; updateTabsUI(); updateDeleteButtonLabel(); renderTimeline(); renderDrawer(); } };
          aTrack.appendChild(aEl);
        });
      }
      container.appendChild(aTrack);

      const isSubVis = state.trackVisibility.sub !== false;
      sidebar.appendChild(createTrackHeaderControl('字幕', '#f9a8d4', isSubVis, () => {
        pushUndo(); state.trackVisibility.sub = !isSubVis; renderTimeline(); renderFrame(); scheduleAutoSaveDraft();
      }));
      const sTrack = document.createElement('div'); sTrack.className = 'track-row' + (isSubVis ? '' : ' track-hidden');
      if (state.subtitles.length === 0) {
        const emptySub = document.createElement('div'); emptySub.className = 'empty-track-hint'; emptySub.textContent = '＋ 點此新增字幕（支援 .srt 匯入 / 直橫 / AI 配音）';
        emptySub.onclick = () => { if (!timelineWasDragged) addNewSubtitle(); };
        sTrack.appendChild(emptySub);
      } else {
        state.subtitles.forEach(sub => {
          const el = document.createElement('div');
          el.className = 'sub-block' + (sub.id === state.selectedSubId && state.lastSelectedType === 'sub' ? ' selected' : '');
          el.style.left = Math.round(sub.start * pps) + 'px'; el.style.width = Math.round(sub.duration * pps) + 'px';
          const lh = document.createElement('div'); lh.className = 'trim-handle left';
          const lb = document.createElement('span'); lb.className = 'clip-label'; lb.textContent = `${sub.orientation === 'vertical' ? '[直]' : '[橫]'} ${sub.text} (${sub.duration.toFixed(1)}s)`;
          const rh = document.createElement('div'); rh.className = 'trim-handle right';
          attachTrimEvents(lh, 'sub', sub, 'left', el, lb); attachTrimEvents(rh, 'sub', sub, 'right', el, lb);
          el.appendChild(lh); el.appendChild(lb); el.appendChild(rh);
          el.onclick = () => { if (!timelineWasDragged) { state.selectedSubId = sub.id; state.lastSelectedType = 'sub'; state.activeTab = 'text'; setDrawerCollapsed(false); updateTabsUI(); updateDeleteButtonLabel(); renderTimeline(); renderDrawer(); renderFrame(); } };
          sTrack.appendChild(el);
        });
      }
      container.appendChild(sTrack);
    }

    timelineScroll.addEventListener('scroll', () => {
      const sidebar = document.getElementById('trackSidebarOverlay');
      if (sidebar) sidebar.style.transform = `translateY(${-timelineScroll.scrollTop}px)`;
    }, { passive: true });

    let isDraggingTimeline = false, timelineWasDragged = false, dragStartX = 0, dragStartY = 0, dragStartScrollLeft = 0;
    timelineScroll.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.trim-handle') || e.target.closest('.eye-btn') || activeTrim || reorderState) return;
      if (state.isPlaying) togglePlay(false);
      isDraggingTimeline = true; timelineWasDragged = false; dragStartX = e.clientX; dragStartY = e.clientY; dragStartScrollLeft = timelineScroll.scrollLeft;
      timelineScroll.classList.add('grabbing');
    });
    window.addEventListener('pointermove', (e) => {
      if (!isDraggingTimeline || activeTrim || reorderState) return;
      const dx = e.clientX - dragStartX;
      if (Math.abs(dx) > 5) timelineWasDragged = true;
      const nextScroll = Math.max(0, dragStartScrollLeft - dx);
      timelineScroll.scrollLeft = nextScroll;
      const t = roundSec(Math.max(0, Math.min(getTotalDuration(), nextScroll / state.pxPerSec)));
      state.currentTime = t; document.getElementById('curTimeLabel').textContent = formatTime(t);
      syncVideoElements(true); renderFrame();
    });
    window.addEventListener('pointerup', () => {
      if (!isDraggingTimeline) return;
      isDraggingTimeline = false; timelineScroll.classList.remove('grabbing');
      setTimeout(() => { timelineWasDragged = false; }, 30);
    });
    document.getElementById('ruler').addEventListener('click', (e) => {
      if (!timelineWasDragged && !reorderState) seekTo((e.clientX - e.currentTarget.getBoundingClientRect().left) / state.pxPerSec);
    });
    timelineScroll.addEventListener('wheel', (e) => { if (!reorderState && e.shiftKey) { e.preventDefault(); timelineScroll.scrollLeft += e.deltaY; } }, { passive: false });

    function syncVideoElements(immediate = false) {
      if (activeTrim) return;
      let acc = 0;
      const isMainVis = state.trackVisibility.main !== false;
      state.clips.forEach(c => {
        if (c.mediaEl?.tagName === 'VIDEO') {
          mountVideoToDecodePool(c.mediaEl);
          c.mediaEl.playbackRate = c.speed || 1.0;
          applyMediaAudioGain(c.mediaEl, c.muted || !isMainVis, c.audioGain ?? 1.0);
          if (state.currentTime >= acc && state.currentTime < acc + c.duration) {
            const targetT = Math.max(0.01, (c.trimStart || 0) + (state.currentTime - acc) * c.speed);
            if (immediate) requestVideoSeek(c.mediaEl, targetT);
            else if (Math.abs(c.mediaEl.currentTime - targetT) > 0.12) c.mediaEl.currentTime = targetT;
            if (state.isPlaying && c.mediaEl.paused && !c.mediaEl.ended) c.mediaEl.play().catch(() => {});
          } else { if (!c.mediaEl.paused) c.mediaEl.pause(); }
        }
        acc += c.duration;
      });

      state.pipTracks.forEach(tr => {
        const isPipVis = tr.visible !== false;
        tr.clips.forEach(pClip => {
          if (pClip.mediaEl?.tagName === 'VIDEO') {
            mountVideoToDecodePool(pClip.mediaEl);
            pClip.mediaEl.playbackRate = pClip.speed || 1.0;
            applyMediaAudioGain(pClip.mediaEl, pClip.muted || !isPipVis, pClip.audioGain ?? 1.0);
            const pStart = pClip.start || 0;
            if (state.currentTime >= pStart && state.currentTime < pStart + pClip.duration) {
              const targetT = Math.max(0.01, (pClip.trimStart || 0) + (state.currentTime - pStart) * pClip.speed);
              if (immediate) requestVideoSeek(pClip.mediaEl, targetT);
              else if (Math.abs(pClip.mediaEl.currentTime - targetT) > 0.12) pClip.mediaEl.currentTime = targetT;
              if (state.isPlaying && pClip.mediaEl.paused && !pClip.mediaEl.ended) pClip.mediaEl.play().catch(() => {});
            } else { if (!pClip.mediaEl.paused) pClip.mediaEl.pause(); }
          }
        });
      });

      const isAudVis = state.trackVisibility.audio !== false;
      state.audioClips.forEach(aClip => {
        if (!aClip.mediaEl) return;
        if (aClip.mediaEl.tagName === 'VIDEO') mountVideoToDecodePool(aClip.mediaEl);
        applyMediaAudioGain(aClip.mediaEl, aClip.muted || !isAudVis, aClip.gain ?? 1.0);
        const aStart = aClip.start || 0;
        if (state.currentTime >= aStart && state.currentTime < aStart + aClip.duration) {
          const targetT = Math.max(0.01, (aClip.trimStart || 0) + (state.currentTime - aStart));
          if (Math.abs(aClip.mediaEl.currentTime - targetT) > 0.15) aClip.mediaEl.currentTime = Math.min(aClip.mediaEl.duration || 999, targetT);
          if (state.isPlaying && aClip.mediaEl.paused) aClip.mediaEl.play().catch(() => {});
        } else { if (!aClip.mediaEl.paused) aClip.mediaEl.pause(); }
      });

      if (state.background.mode === 'custom' && state.background.mediaEl?.tagName === 'VIDEO') {
        const bgVid = state.background.mediaEl;
        mountVideoToDecodePool(bgVid); bgVid.muted = true;
        const targetT = state.currentTime % (bgVid.duration || 10);
        if (immediate) requestVideoSeek(bgVid, targetT);
        if (state.isPlaying && bgVid.paused) bgVid.play().catch(() => {});
      }
    }

    let draggingCanvasItem = null;
    function getClipLocalTime(clip, isPip) {
      if (isPip) return Math.max(0, Math.min(clip.duration, state.currentTime - (clip.start || 0)));
      let acc = 0;
      for (const c of state.clips) { if (c.id === clip.id) return Math.max(0, Math.min(c.duration, state.currentTime - acc)); acc += c.duration; }
      return 0;
    }

    function addManualKeyframeAtCurrentTime(clip, isPip) {
      if (!clip) return;
      const localT = roundSec(getClipLocalTime(clip, isPip)), curTr = getInterpolatedTransform(clip, localT);
      if (!clip.keyframes) clip.keyframes = [];
      let existing = clip.keyframes.find(k => Math.abs(k.t - localT) < 0.1);
      if (existing) Object.assign(existing, curTr); else clip.keyframes.push({ t: localT, ...curTr });
    }

    function updateClipActiveTransform(clip, localT, patch) {
      if (!clip.baseTransform) clip.baseTransform = { scaleX: 1.0, scaleY: 1.0, x: 0, y: 0, rot: 0 };
      if (clip.keyframes?.length > 0) {
        const exactKf = clip.keyframes.find(k => Math.abs(k.t - localT) < 0.1);
        if (exactKf) { Object.assign(exactKf, patch); return; }
      }
      Object.assign(clip.baseTransform, patch);
    }

    function isPointInsideVisibleSubtitle(normX, normY) {
      if (state.trackVisibility.sub === false) return null;
      const activeSubs = state.subtitles.filter(s => state.currentTime >= s.start && state.currentTime <= s.start + s.duration);
      if (activeSubs.length === 0) return null;
      // 優先檢查目前選取的字幕，其次檢查其他當前顯示的字幕
      const ordered = [...activeSubs].sort((a, b) => (a.id === state.selectedSubId ? -1 : b.id === state.selectedSubId ? 1 : 0));
      for (const sub of ordered) {
        if (Math.abs(normX - sub.x) <= 0.36 && Math.abs(normY - sub.y) <= 0.08) {
          return sub;
        }
      }
      return null;
    }

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (state.isPlaying) togglePlay(false);
      try { canvas.setPointerCapture(e.pointerId); } catch (_) {}

      const rect = canvas.getBoundingClientRect();
      const normX = (e.clientX - rect.left) / rect.width, normY = (e.clientY - rect.top) / rect.height;
      const canvasX = normX * canvas.width, canvasY = normY * canvas.height;
      const sel = getActiveVisualClipAtCurrentTime() || getSelectedVisualClip();

      if (state.eyedropperMode && sel) {
        pushUndo();
        const px = ctx.getImageData(Math.round(canvasX), Math.round(canvasY), 1, 1).data;
        sel.clip.cutout.keyColor = '#' + [px[0], px[1], px[2]].map(v => v.toString(16).padStart(2, '0')).join('');
        state.eyedropperMode = false; showToast(`已吸取去背顏色：${sel.clip.cutout.keyColor}`);
        renderDrawer(); renderFrame(); scheduleAutoSaveDraft(); return;
      }

      if (state.penEditMode && sel) {
        pushUndo();
        if (!sel.clip.mask.penPoints) sel.clip.mask.penPoints = [];
        sel.clip.mask.penPoints.push({ x: normX, y: normY });
        showToast(`已加入第 ${sel.clip.mask.penPoints.length} 個鋼筆錨點`);
        renderDrawer(); renderFrame(); scheduleAutoSaveDraft(); return;
      }

      // 1. 優先偵測是否抓到影片/畫中畫控制框的 8 個控制點（或四條邊線）
      if (sel) {
        // 同步選取狀態，確保拖曳的就是目前正在操作的素材
        state.selectedClipId = sel.clip.id;
        state.lastSelectedType = sel.isPip ? 'pip' : 'clip';

        const localT = getClipLocalTime(sel.clip, sel.isPip);
        const boxInfo = getSelectionBoxHandles(sel, canvas.width, canvas.height);
        if (boxInfo) {
          // 擴大控制點感應半徑至 26px，並支援直接拖拉四邊框線進行拉伸或裁剪
          let hitHandleId = null;
          let minDist = 26;
          for (const h of boxInfo.handles) {
            const d = Math.hypot(canvasX - h.x, canvasY - h.y);
            if (d <= minDist) {
              minDist = d;
              hitHandleId = h.id;
            }
          }
          if (!hitHandleId) {
            const { box } = boxInfo;
            const edgePad = 16;
            const withinX = canvasX >= box.left - edgePad && canvasX <= box.right + edgePad;
            const withinY = canvasY >= box.top - edgePad && canvasY <= box.bottom + edgePad;
            if (withinY && Math.abs(canvasX - box.left) <= edgePad) hitHandleId = 'w';
            else if (withinY && Math.abs(canvasX - box.right) <= edgePad) hitHandleId = 'e';
            else if (withinX && Math.abs(canvasY - box.top) <= edgePad) hitHandleId = 'n';
            else if (withinX && Math.abs(canvasY - box.bottom) <= edgePad) hitHandleId = 's';
          }

          if (hitHandleId) {
            pushUndo();
            draggingCanvasItem = {
              type: 'handle', mode: state.canvasBoxMode, handleId: hitHandleId, clip: sel.clip, isPip: sel.isPip, localT,
              startX: e.clientX, startY: e.clientY, origTr: { ...getInterpolatedTransform(sel.clip, localT) },
              origRects: { ...boxInfo.rects }, origCrop: { ...(sel.clip.crop || { left: 0, right: 0, top: 0, bottom: 0 }) }
            };
            renderTimeline();
            renderFrame();
            return;
          }
        }
      }

      // 2. 只有當字幕軌未隱藏、且點擊位置確實落在字幕框範圍內時，才拖曳字幕（避免隱藏字幕或點畫面其他處時誤攔截）
      const hitSub = isPointInsideVisibleSubtitle(normX, normY);
      if (hitSub && state.activeTab === 'text') {
        pushUndo();
        state.selectedSubId = hitSub.id;
        state.lastSelectedType = 'sub';
        draggingCanvasItem = { type: 'sub', sub: hitSub };
        updateDeleteButtonLabel();
        updateSubPos(e, hitSub);
        return;
      }

      // 3. 點住畫面任何位置上下左右挪動：直接平移目前選取的影片或畫中畫
      if (sel) {
        pushUndo();
        const localT = getClipLocalTime(sel.clip, sel.isPip);
        const curTr = getInterpolatedTransform(sel.clip, localT);
        draggingCanvasItem = { type: 'move', clip: sel.clip, isPip: sel.isPip, localT, startX: e.clientX, startY: e.clientY, origX: curTr.x, origY: curTr.y };
        updateDeleteButtonLabel();
        renderTimeline();
        renderFrame();
      } else {
        showToast('請先匯入主影片或畫中畫素材，即可在畫布上自由移動與裁切');
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (!draggingCanvasItem) return;
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const scaleRatioX = canvas.width / rect.width, scaleRatioY = canvas.height / rect.height;
      if (draggingCanvasItem.type === 'sub') {
        updateSubPos(e, draggingCanvasItem.sub);
      } else if (draggingCanvasItem.type === 'move') {
        updateClipActiveTransform(draggingCanvasItem.clip, draggingCanvasItem.localT, {
          x: draggingCanvasItem.origX + (e.clientX - draggingCanvasItem.startX) * scaleRatioX,
          y: draggingCanvasItem.origY + (e.clientY - draggingCanvasItem.startY) * scaleRatioY
        });
        if (state.activeTab === 'keyframe') renderDrawer();
        renderFrame();
      } else if (draggingCanvasItem.type === 'handle') {
        const dx = (e.clientX - draggingCanvasItem.startX) * scaleRatioX, dy = (e.clientY - draggingCanvasItem.startY) * scaleRatioY;
        const { handleId, clip, localT, origTr, origRects, origCrop } = draggingCanvasItem;
        if (draggingCanvasItem.mode === 'transform') {
          let nextScaleX = origTr.scaleX ?? 1, nextScaleY = origTr.scaleY ?? 1;
          if (handleId.length === 2) {
            const uniformMul = Math.max(0.1, 1 + ((dx * (handleId.includes('e') ? 1 : -1)) / origRects.baseW + (dy * (handleId.includes('s') ? 1 : -1)) / origRects.baseH));
            nextScaleX = Math.max(0.1, Math.min(5.0, (origTr.scaleX ?? 1) * uniformMul));
            nextScaleY = Math.max(0.1, Math.min(5.0, (origTr.scaleY ?? 1) * uniformMul));
          } else {
            if (handleId === 'e') nextScaleX = Math.max(0.08, Math.min(5.0, (origTr.scaleX ?? 1) + (dx * 2) / origRects.baseW));
            if (handleId === 'w') nextScaleX = Math.max(0.08, Math.min(5.0, (origTr.scaleX ?? 1) - (dx * 2) / origRects.baseW));
            if (handleId === 's') nextScaleY = Math.max(0.08, Math.min(5.0, (origTr.scaleY ?? 1) + (dy * 2) / origRects.baseH));
            if (handleId === 'n') nextScaleY = Math.max(0.08, Math.min(5.0, (origTr.scaleY ?? 1) - (dy * 2) / origRects.baseH));
          }
          updateClipActiveTransform(clip, localT, { scaleX: nextScaleX, scaleY: nextScaleY });
          if (state.activeTab === 'keyframe') renderDrawer();
          renderFrame();
        } else if (draggingCanvasItem.mode === 'crop') {
          if (!clip.crop) clip.crop = { left: 0, right: 0, top: 0, bottom: 0 };
          const dw = Math.max(10, origRects.dispW), dh = Math.max(10, origRects.dispH);
          if (handleId.includes('w')) clip.crop.left = Math.max(0, Math.min(0.9 - origCrop.right, origCrop.left + dx / dw));
          if (handleId.includes('e')) clip.crop.right = Math.max(0, Math.min(0.9 - origCrop.left, origCrop.right - dx / dw));
          if (handleId.includes('n')) clip.crop.top = Math.max(0, Math.min(0.9 - origCrop.bottom, origCrop.top + dy / dh));
          if (handleId.includes('s')) clip.crop.bottom = Math.max(0, Math.min(0.9 - origCrop.top, origCrop.bottom - dy / dh));
          renderFrame();
        }
      }
    }, { passive: false });

    const finishCanvasDrag = (e) => {
      if (!draggingCanvasItem) return;
      try { if (e && typeof e.pointerId === 'number') canvas.releasePointerCapture(e.pointerId); } catch (_) {}
      draggingCanvasItem = null;
      renderDrawer();
      scheduleAutoSaveDraft();
    };
    window.addEventListener('pointerup', finishCanvasDrag);
    window.addEventListener('pointercancel', finishCanvasDrag);

    function updateSubPos(e, sub) {
      const rect = canvas.getBoundingClientRect();
      sub.x = Math.max(0.05, Math.min(0.95, (e.clientX - rect.left) / rect.width));
      sub.y = Math.max(0.05, Math.min(0.95, (e.clientY - rect.top) / rect.height));
      renderFrame();
    }

    function deleteCurrentSelected() {
      if (state.lastSelectedType === 'sub' && state.selectedSubId) {
        const target = state.subtitles.find(s => s.id === state.selectedSubId);
        if (target) {
          pushUndo(); state.subtitles = state.subtitles.filter(s => s.id !== target.id);
          state.selectedSubId = state.subtitles[0]?.id || null; state.lastSelectedType = state.selectedSubId ? 'sub' : 'clip';
          updateDeleteButtonLabel(); showToast('已刪除選取字幕 🗑️'); renderTimeline(); renderDrawer(); renderFrame(); scheduleAutoSaveDraft(); return;
        }
      }
      if (state.lastSelectedType === 'audio' && state.selectedAudioId) {
        const target = state.audioClips.find(a => a.id === state.selectedAudioId);
        if (target) {
          pushUndo(); if (target.mediaEl) target.mediaEl.pause();
          state.audioClips = state.audioClips.filter(a => a.id !== target.id);
          state.selectedAudioId = state.audioClips[0]?.id || null; state.lastSelectedType = state.selectedAudioId ? 'audio' : 'clip';
          updateDeleteButtonLabel(); showToast('已刪除選取音軌片段 🗑️'); renderTimeline(); renderDrawer(); scheduleAutoSaveDraft(); return;
        }
      }
      if (state.lastSelectedType === 'pip' && state.selectedClipId) {
        for (const tr of state.pipTracks) {
          const found = tr.clips.find(c => c.id === state.selectedClipId);
          if (found) {
            pushUndo(); if (found.mediaEl?.tagName === 'VIDEO') found.mediaEl.pause();
            tr.clips = tr.clips.filter(c => c.id !== found.id);
            state.selectedClipId = state.clips[0]?.id || null; state.lastSelectedType = 'clip';
            updateDeleteButtonLabel(); showToast('已刪除畫中畫素材 🗑️'); renderTimeline(); renderDrawer(); renderFrame(); scheduleAutoSaveDraft(); return;
          }
        }
      }
      if (state.clips.length > 0 && state.selectedClipId) {
        const found = state.clips.find(c => c.id === state.selectedClipId);
        if (found?.mediaEl?.tagName === 'VIDEO') found.mediaEl.pause();
        pushUndo(); state.clips = state.clips.filter(c => c.id !== state.selectedClipId);
        state.selectedClipId = state.clips[0]?.id || null;
        updateDeleteButtonLabel(); showToast('已刪除影片片段 🗑️'); renderTimeline(); renderDrawer(); renderFrame(); scheduleAutoSaveDraft(); return;
      }
      showToast('請先點選要刪除的片段、音軌或字幕');
    }
    document.getElementById('deleteSelectedBtn').onclick = deleteCurrentSelected;

    document.getElementById('clearAllBtn').onclick = () => {
      pushUndo();
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      state.clips.forEach(c => { if (c.mediaEl?.tagName === 'VIDEO') c.mediaEl.pause(); });
      state.audioClips.forEach(a => { if (a.mediaEl) a.mediaEl.pause(); });
      state.clips = []; state.pipTracks = [{ id: 'pip-track-1', name: '畫中畫 L1 (頂層)', visible: true, clips: [] }];
      state.subtitles = []; state.audioClips = []; state.trackVisibility = { main: true, audio: true, sub: true };

          exportPercentBig.textContent = '30%'; exportProgressText.textContent = '正在解包完整工程包與還原素材...';
          exportProgressSub.textContent = file.name; exportProgressFill.style.width = '30%';

          const headerLen = new DataView(await file.slice(8, 12).arrayBuffer()).getUint32(0, true);
          const projectData = JSON.parse(new TextDecoder().decode(await file.slice(12, 12 + headerLen).arrayBuffer()));
          let cursor = 12 + headerLen;
          const customBlobMap = new Map();
          for (const asset of (projectData.packedAssets || [])) {
            customBlobMap.set(asset.fileId, file.slice(cursor, cursor + asset.byteLength, asset.mimeType));
            cursor += asset.byteLength;
          }

          exportPercentBig.textContent = '80%'; exportProgressFill.style.width = '80%';
          pushUndo();
          await applyDeserializedProject(projectData, customBlobMap);
          exportPercentBig.textContent = '100%'; exportProgressFill.style.width = '100%';
          exportModalBackdrop.classList.remove('open'); exportOptionsList.style.display = 'block'; exportProgressBox.style.display = 'none';
          showToast('完整工程包還原成功！所有軌道、分割與特效已就緒 🎉');
          return;
        }

        const projectData = JSON.parse(await file.text());
        const refs = collectRequiredAssetRefs(projectData), missing = [];
        for (const r of refs) { if (!(await getMediaBlobFromDB(r.fileId))) missing.push(r); }

        if (missing.length === 0) {
          pushUndo(); await applyDeserializedProject(projectData, null);
          exportModalBackdrop.classList.remove('open');
          showToast('輕量工程檔已成功還原（本機快取自動配對完成）🎉');
        } else {
          pendingRelinkProject = projectData; pendingMissingRefs = missing;
          document.getElementById('relinkMissingList').innerHTML = missing.map(m => `<li><strong>${m.origFileName}</strong></li>`).join('');
          exportOptionsList.style.display = 'none'; document.getElementById('relinkAssetsBox').style.display = 'block';
        }
      } catch (err) {
        showToast('工程檔讀取失敗，請確認檔案格式正確');
      }
    };

    document.getElementById('relinkSelectFilesBtn').onclick = () => document.getElementById('relinkAssetsInput').click();
    document.getElementById('relinkCancelBtn').onclick = () => {
      pendingRelinkProject = null; pendingMissingRefs = [];
      document.getElementById('relinkAssetsBox').style.display = 'none'; exportOptionsList.style.display = 'block';
    };

    document.getElementById('relinkAssetsInput').onchange = async (e) => {
      const files = Array.from(e.target.files); e.target.value = '';
      if (!files.length || !pendingRelinkProject) return;
      const customBlobMap = new Map(), unmatchedFiles = [...files];
      pendingMissingRefs.forEach(ref => {
        const idx = unmatchedFiles.findIndex(f => f.name === ref.origFileName);
        if (idx !== -1) customBlobMap.set(ref.fileId, unmatchedFiles.splice(idx, 1)[0]);
      });
      pendingMissingRefs.forEach(ref => {
        if (!customBlobMap.has(ref.fileId) && unmatchedFiles.length > 0) customBlobMap.set(ref.fileId, unmatchedFiles.shift());
      });
      pushUndo();
      await applyDeserializedProject(pendingRelinkProject, customBlobMap);
      pendingRelinkProject = null; pendingMissingRefs = [];
      document.getElementById('relinkAssetsBox').style.display = 'none'; exportOptionsList.style.display = 'block'; exportModalBackdrop.classList.remove('open');
      showToast('已自動依照輕量工程檔還原所有分割與剪輯設定 🎉');
    };

    function updateExportQualityUI() {
      const is4K = state.exportQuality === '4k';
      document.getElementById('qCard1080').classList.toggle('active', !is4K);
      document.getElementById('qCard4K').classList.toggle('active', is4K);
      const qLabel = is4K ? '4K 60fps (45Mbps)' : '1080p 60fps (18Mbps)';
      const segs = collectEditableSegments();
      document.getElementById('fullExportDesc').textContent = `輸出 1 支 ${qLabel} MP4 完整影片檔`;
      document.getElementById('splitCountDesc').textContent = `同時下載 1 支完整影片 ＋ 目前已裁切的 ${segs.length} 份獨立編輯片段（皆為 ${qLabel}）`;
    }
    document.getElementById('qCard1080').onclick = () => { state.exportQuality = '1080p'; updateExportQualityUI(); };
    document.getElementById('qCard4K').onclick = () => { state.exportQuality = '4k'; updateExportQualityUI(); };

    function detectBestExportFormat() {
      for (const mime of ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4']) {
        if (MediaRecorder.isTypeSupported(mime)) return { mimeType: mime, ext: 'mp4' };
      }
      for (const mime of ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm']) {
        if (MediaRecorder.isTypeSupported(mime)) return { mimeType: mime, ext: 'webm' };
      }
      return { mimeType: '', ext: 'webm' };
    }

    function collectEditableSegments() {
      const list = []; let acc = 0;
      state.clips.forEach((c, idx) => { list.push({ label: `主軌分段${idx + 1}_${c.name.replace(/[^\w\u4e00-\u9fa5-]/g, '')}`, start: roundSec(acc), end: roundSec(acc + c.duration) }); acc += c.duration; });
      state.pipTracks.forEach((tr, tIdx) => {
        if (tr.visible === false) return;
        tr.clips.forEach((p, pIdx) => { const s = roundSec(p.start || 0); list.push({ label: `頂層${tIdx + 1}分段${pIdx + 1}_${p.name.replace(/[^\w\u4e00-\u9fa5-]/g, '')}`, start: s, end: roundSec(s + p.duration) }); });
      });
      return list;
    }

    function recordTimeRangeHighQuality(startSec, endSec, baseFilename, taskIndex, totalTasks) {
      return new Promise((resolve) => {
        getAudioCtx();
        const videoStream = canvas.captureStream(60), combinedStream = new MediaStream();
        videoStream.getVideoTracks().forEach(track => combinedStream.addTrack(track));
        if (exportMixDest?.stream) exportMixDest.stream.getAudioTracks().forEach(track => combinedStream.addTrack(track));
        const fmt = detectBestExportFormat(), is4K = state.exportQuality === '4k';
        const recOptions = { videoBitsPerSecond: is4K ? 45000000 : 18000000 };
        if (fmt.mimeType) recOptions.mimeType = fmt.mimeType;

        const recorder = new MediaRecorder(combinedStream, recOptions), chunks = [];
        recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
        recorder.onstop = () => { downloadBlobAsFile(new Blob(chunks, { type: fmt.mimeType || 'video/mp4' }), `${baseFilename}.${fmt.ext}`); resolve(fmt.ext); };

        const segDur = Math.max(0.1, endSec - startSec), qTag = is4K ? '4K · 60fps' : '1080p · 60fps';
        exportProgressHook = (curT) => {
          const localElapsed = Math.max(0, Math.min(segDur, curT - startSec));
          const overallPct = Math.min(99, Math.round(((taskIndex + localElapsed / segDur) / totalTasks) * 100));
          exportPercentBig.textContent = `${overallPct}%`; exportProgressFill.style.width = `${overallPct}%`;
          exportProgressSub.textContent = `本段進度：${formatTime(localElapsed)} / ${formatTime(segDur)}（${qTag} · ${state.ratio} · ${fmt.ext.toUpperCase()}）`;
        };

        state.currentTime = startSec; timelineScroll.scrollLeft = Math.round(startSec * state.pxPerSec);
        exportSegmentStopTime = endSec; syncVideoElements(true); renderFrame();
        setTimeout(() => {
          recorder.start(); togglePlay(true);
          const checkStop = setInterval(() => {
            if (!state.isPlaying) { clearInterval(checkStop); exportSegmentStopTime = null; exportProgressHook = null; if (recorder.state !== 'inactive') recorder.stop(); }
          }, 100);
        }, 140);
      });
    }

    async function runBatchExport(includeSplits) {
      if (state.isExporting) return;
      state.isExporting = true;
      exportOptionsList.style.display = 'none'; exportProgressBox.style.display = 'block';
      const qMode = state.exportQuality, qLabel = qMode === '4k' ? '4K60' : '1080p60';
      applyCanvasResolutionForRatio(state.ratio, qMode);
      const stamp = new Date().toISOString().slice(11, 19).replace(/:/g, '');
      const segments = includeSplits ? collectEditableSegments() : [], totalTasks = 1 + segments.length;

      exportProgressText.textContent = `正在渲染完整影片 (1 / ${totalTasks})...`;
      const usedExt = await recordTimeRangeHighQuality(0, getTotalDuration(), `CutVideo_完整影片_${qLabel}_${stamp}`, 0, totalTasks);
      for (let i = 0; i < segments.length; i++) {
        const seg = segments[i];
        exportProgressText.textContent = `正在分開存檔裁切片段 (${i + 2} / ${totalTasks})：${seg.label}`;
        await new Promise(r => setTimeout(r, 350));
        await recordTimeRangeHighQuality(seg.start, seg.end, `CutVideo_${seg.label}_${qLabel}_${stamp}`, i + 1, totalTasks);
      }

      exportPercentBig.textContent = '100%'; exportProgressFill.style.width = '100%';
      applyCanvasResolutionForRatio(state.ratio, null);
      state.isExporting = false; state.currentTime = 0; timelineScroll.scrollLeft = 0; renderFrame();
      exportModalBackdrop.classList.remove('open'); exportOptionsList.style.display = 'block'; exportProgressBox.style.display = 'none';
      showToast(includeSplits ? `${qLabel} ${usedExt.toUpperCase()} 全部匯出完成（共 ${totalTasks} 支檔案）📦` : `${qLabel} ${usedExt.toUpperCase()} 完整影片匯出完成！🎬🔊`);
    }

    document.getElementById('exportBtn').onclick = () => {
      if (state.isPlaying) togglePlay(false);
      updateExportQualityUI();
      document.getElementById('relinkAssetsBox').style.display = 'none';
      exportOptionsList.style.display = 'block';
      exportProgressBox.style.display = 'none';
      exportModalBackdrop.classList.add('open');
    };

    document.getElementById('closeExportModalBtn').onclick = () => {
      if (state.isExporting) return showToast('正在渲染高畫質影片中，請稍候完成');
      exportModalBackdrop.classList.remove('open');
    };

    const canExportVideo = () => {
      const hasAnyPip = state.pipTracks.some(t => t.clips.length > 0);
      if (state.clips.length === 0 && !hasAnyPip && state.audioClips.length === 0) { showToast('請先匯入影片或音訊再匯出'); return false; }
      if (typeof MediaRecorder === 'undefined') { showToast('目前瀏覽器不支援直接錄製匯出，請改用 Chrome 或 Safari 最新版'); return false; }
      return true;
    };
    document.getElementById('optExportFullOnly').onclick = () => { if (canExportVideo()) runBatchExport(false); };
    document.getElementById('optExportFullAndSplits').onclick = () => { if (canExportVideo()) runBatchExport(true); };

    updateHistoryButtonsUI();
    updateDeleteButtonLabel();
    renderTimeline();
    renderDrawer();
    renderFrame();
    restoreDraftFromDB();
  </script>
</body>
</html>
