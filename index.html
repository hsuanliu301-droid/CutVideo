          document.getElementById('toggleAudMuteBtn').onclick = () => {
            pushUndo();
            aClip.muted = !aClip.muted;
            applyMediaAudioGain(aClip.mediaEl, aClip.muted, aClip.gain ?? 1.0);
            renderTimeline(); renderDrawer();
          };
          document.getElementById('audGainRange').oninput = (e) => {
            aClip.gain = parseFloat(e.target.value);
            applyMediaAudioGain(aClip.mediaEl, aClip.muted, aClip.gain);
            renderTimeline(); renderDrawer();
          };
          document.getElementById('delAudClipBtn').onclick = () => {
            state.selectedAudioId = aClip.id;
            state.lastSelectedType = 'audio';
            deleteCurrentSelected();
          };
        }
      }
    }

    function updateTabsUI() {
      document.querySelectorAll('.nav-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.tab === state.activeTab);
      });
    }

    document.querySelectorAll('.nav-tab').forEach(tab => {
      tab.onclick = () => {
        state.activeTab = tab.dataset.tab;
        updateTabsUI();
        renderDrawer();
      };
    });

    // ====== 畫面比例切換 ======
    document.querySelectorAll('.ratio-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.ratio-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.ratio = btn.dataset.ratio;
        if (state.ratio === '9:16') { canvas.width = 360; canvas.height = 640; }
        if (state.ratio === '16:9') { canvas.width = 640; canvas.height = 360; }
        if (state.ratio === '1:1')  { canvas.width = 480; canvas.height = 480; }
        renderFrame();
      };
    });

    // ====== 分割片段（支援主軌、畫中畫、以及獨立音訊軌） ======
    function splitAtPlayhead() {
      // 1. 若目前選取的是音訊軌且播放頭在音訊中間，優先分割音訊
      if (state.lastSelectedType === 'audio' && state.selectedAudioId) {
        const idx = state.audioClips.findIndex(a => a.id === state.selectedAudioId);
        if (idx !== -1) {
          const a = state.audioClips[idx];
          const aStart = a.start || 0;
          if (state.currentTime > aStart + 0.3 && state.currentTime < aStart + a.duration - 0.3) {
            pushUndo();
            const leftDur = state.currentTime - aStart;
            const rightDur = a.duration - leftDur;
            a.duration = leftDur;

            const newEl = document.createElement(a.mediaEl.tagName);
            newEl.src = a.mediaEl.src;
            newEl.preload = 'auto';
            ensureAudioNode(newEl);

            const clone = {
              ...a,
              id: 'aud-' + Date.now(),
              name: a.name + '(切)',
              start: state.currentTime,
              trimStart: (a.trimStart || 0) + leftDur,
              duration: rightDur,
              mediaEl: newEl
            };
            state.audioClips.splice(idx + 1, 0, clone);
            state.selectedAudioId = clone.id;
            showToast('已分割音訊軌道 ✂️');
            renderTimeline(); renderDrawer(); syncVideoElements(true);
            return;
          }
        }
      }

      // 2. 主影片軌道
      let acc = 0;
      for (let i = 0; i < state.clips.length; i++) {
        const c = state.clips[i];
        if (state.currentTime > acc + 0.3 && state.currentTime < acc + c.duration - 0.3) {
          pushUndo();
          const leftDur = state.currentTime - acc;
          const rightDur = c.duration - leftDur;
          const origTrimStart = c.trimStart || 0;
          c.duration = leftDur;

          let rightMediaEl = c.mediaEl;
          if (c.mediaEl?.tagName === 'VIDEO') {
            rightMediaEl = document.createElement('video');
            rightMediaEl.src = c.mediaEl.src;
            rightMediaEl.preload = 'auto';
            rightMediaEl.playsInline = true;
            ensureAudioNode(rightMediaEl);
          }

          const clone = {
            ...cloneClipData(c),
            id: 'clip-' + Date.now(),
            name: c.name + '(切)',
            trimStart: origTrimStart + leftDur * c.speed,
            duration: rightDur,
            mediaEl: rightMediaEl
          };
          state.clips.splice(i + 1, 0, clone);
          state.selectedClipId = clone.id;
          state.lastSelectedType = 'clip';
          updateDeleteButtonLabel();
          showToast('已從播放頭位置分割片段 ✂️');
          renderTimeline(); renderDrawer(); syncVideoElements(true); renderFrame();
          return;
        }
        acc += c.duration;
      }

      // 3. 畫中畫軌道
      for (const tr of state.pipTracks) {
        for (let i = 0; i < tr.clips.length; i++) {
          const p = tr.clips[i];
          const pStart = p.start || 0;
          if (state.currentTime > pStart + 0.3 && state.currentTime < pStart + p.duration - 0.3) {
            pushUndo();
            const leftDur = state.currentTime - pStart;
            const rightDur = p.duration - leftDur;
            p.duration = leftDur;

            let rightMediaEl = p.mediaEl;
            if (p.mediaEl?.tagName === 'VIDEO') {
              rightMediaEl = document.createElement('video');
              rightMediaEl.src = p.mediaEl.src;
              rightMediaEl.preload = 'auto';
              rightMediaEl.playsInline = true;
              ensureAudioNode(rightMediaEl);
            }

            const clone = {
              ...cloneClipData(p),
              id: 'pip-' + Date.now(),
              name: p.name + '(切)',
              start: state.currentTime,
              trimStart: (p.trimStart || 0) + leftDur * p.speed,
              duration: rightDur,
              mediaEl: rightMediaEl
            };
            tr.clips.splice(i + 1, 0, clone);
            state.selectedClipId = clone.id;
            state.lastSelectedType = 'pip';
            updateDeleteButtonLabel();
            showToast('已分割畫中畫片段 ✂️');
            renderTimeline(); renderDrawer(); syncVideoElements(true); renderFrame();
            return;
          }
        }
      }

      showToast('請將播放頭移至片段或音軌中間再分割');
    }

    document.getElementById('splitBtn').onclick = splitAtPlayhead;

    // ====== 檔案載入 ======
    function loadMediaFile(file, onReady) {
      const url = URL.createObjectURL(file);
      const isImage = file.type.startsWith('image/');

      if (isImage) {
        const img = new Image();
        img.onload = () => {
          onReady({ mediaEl: img, mediaType: 'image', duration: 5.0, maxDuration: 120 });
        };
        img.src = url;
      } else {
        const vid = document.createElement('video');
        vid.src = url;
        vid.preload = 'auto';
        vid.playsInline = true;
        vid.setAttribute('playsinline', '');
        vid.setAttribute('webkit-playsinline', '');
        ensureAudioNode(vid);

        vid.onloadeddata = () => {
          if (vid._imported) return;
          vid._imported = true;
          requestVideoSeek(vid, 0.01);
          const realDur = (vid.duration && isFinite(vid.duration)) ? vid.duration : 10;
          onReady({ mediaEl: vid, mediaType: 'video', duration: realDur, maxDuration: realDur });
        };

        vid.onseeked = () => {
          renderFrame();
          if (typeof vid._pendingSeekTime === 'number') {
            const nextT = vid._pendingSeekTime;
            vid._pendingSeekTime = null;
            if (Math.abs(vid.currentTime - nextT) > 0.008) {
              vid.currentTime = nextT;
            }
          }
        };

        vid.load();
      }
    }

    document.getElementById('videoFileInput').onchange = (e) => {
      const files = Array.from(e.target.files);
      if (files.length > 0) pushUndo();
      files.forEach(file => {
        loadMediaFile(file, ({ mediaEl, mediaType, duration, maxDuration }) => {
          const id = 'clip-' + Date.now() + Math.random();
          state.clips.push(createDefaultClipProps({
            id,
            name: file.name.slice(0, 12),
            duration,
            maxDuration,
            mediaEl,
            mediaType
          }));
          state.selectedClipId = id;
          state.lastSelectedType = 'clip';
          updateDeleteButtonLabel();
          renderTimeline(); renderDrawer(); renderFrame();
          showToast(`已匯入主軌：${file.name}`);
        });
      });
      e.target.value = '';
    };

    document.getElementById('pipFileInput').onchange = (e) => {
      const files = Array.from(e.target.files);
      if (files.length > 0) pushUndo();
      const targetTrack = state.pipTracks.find(t => t.id === window._targetPipTrackId) || state.pipTracks[0];
      files.forEach(file => {
        loadMediaFile(file, ({ mediaEl, mediaType, duration, maxDuration }) => {
          const id = 'pip-' + Date.now() + Math.random();
          targetTrack.clips.push(createDefaultClipProps({
            id,
            name: file.name.slice(0, 12),
            start: state.currentTime,
            duration,
            maxDuration,
            mediaEl,
            mediaType
          }));
          state.selectedClipId = id;
          state.lastSelectedType = 'pip';
          updateDeleteButtonLabel();
          renderTimeline(); renderDrawer(); renderFrame();
          showToast(`已匯入畫中畫（頂層）：${file.name}`);
        });
      });
      e.target.value = '';
    };

    document.getElementById('bgFileInput').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      loadMediaFile(file, ({ mediaEl, mediaType }) => {
        if (mediaType === 'video') {
          mediaEl.loop = true;
          mediaEl.muted = true;
        }
        state.background.mode = 'custom';
        state.background.mediaEl = mediaEl;
        state.background.mediaType = mediaType;
        state.background.mediaName = file.name;
        renderDrawer(); renderFrame();
        showToast(`已套用自訂底板：${file.name}`);
      });
      e.target.value = '';
    };

    // 匯入純音訊檔（MP3 / M4A / WAV）
    document.getElementById('audioFileInput').onchange = (e) => {
      const files = Array.from(e.target.files);
      if (files.length > 0) pushUndo();
      files.forEach(file => {
        const url = URL.createObjectURL(file);
        const audioEl = new Audio(url);
        audioEl.preload = 'auto';
        ensureAudioNode(audioEl);

        audioEl.onloadedmetadata = () => {
          const id = 'aud-' + Date.now() + Math.random();
          const realDur = (audioEl.duration && isFinite(audioEl.duration)) ? audioEl.duration : 15;
          state.audioClips.push({
            id,
            name: file.name.slice(0, 14),
            fromVideo: false,
            start: state.currentTime,
            trimStart: 0,
            duration: realDur,
            maxDuration: realDur,
            gain: 1.0,
            muted: false,
            mediaEl: audioEl
          });
          state.selectedAudioId = id;
          state.lastSelectedType = 'audio';
          updateDeleteButtonLabel();
          renderTimeline(); renderDrawer();
          showToast(`已插入音樂音軌：${file.name} 🎵`);
        };
      });
      e.target.value = '';
    };

    // 匯入影片檔直接轉成獨立音軌（抽離畫面只留聲音，與影片軌同步）
    document.getElementById('videoToAudioInput').onchange = (e) => {
      const files = Array.from(e.target.files);
      if (files.length > 0) pushUndo();
      files.forEach(file => {
        const url = URL.createObjectURL(file);
        const vidAud = document.createElement('video');
        vidAud.src = url;
        vidAud.preload = 'auto';
        vidAud.playsInline = true;
        ensureAudioNode(vidAud);

        vidAud.onloadedmetadata = () => {
          const id = 'aud-' + Date.now() + Math.random();
          const realDur = (vidAud.duration && isFinite(vidAud.duration)) ? vidAud.duration : 15;
          state.audioClips.push({
            id,
            name: file.name.slice(0, 14),
            fromVideo: true,
            start: state.currentTime,
            trimStart: 0,
            duration: realDur,
            maxDuration: realDur,
            gain: 1.0,
            muted: false,
            mediaEl: vidAud
          });
          state.selectedAudioId = id;
          state.lastSelectedType = 'audio';
          updateDeleteButtonLabel();
          renderTimeline(); renderDrawer();
          showToast(`已將影片轉成獨立音軌：${file.name} 🎬➡️🎵`);
        };
      });
      e.target.value = '';
    };

    document.getElementById('fontFileInput').onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const fontName = 'CustomFont_' + Date.now();
      const buf = await file.arrayBuffer();
      const face = new FontFace(fontName, buf);
      await face.load();
      document.fonts.add(face);
      FREE_FONTS.unshift({
        name: file.name.replace(/\.[^/.]+$/, ''),
        family: `'${fontName}', sans-serif`,
        cat: '特色',
        desc: '本機匯入自訂字體'
      });
      const sub = state.subtitles.find(s => s.id === state.selectedSubId);
      if (sub) sub.font = `'${fontName}', sans-serif`;
      renderDrawer(); renderFrame();
      showToast('自訂字體載入成功！');
      e.target.value = '';
    };

    // ====== 播放迴圈 ======
    let lastTs = 0;
    function tick(ts) {
      if (!state.isPlaying) return;
      if (!lastTs) lastTs = ts;
      const dt = (ts - lastTs) / 1000;
      lastTs = ts;

      state.currentTime += dt;
      if (state.currentTime >= getTotalDuration()) {
        state.currentTime = 0;
        togglePlay(false);
      } else {
        timelineScroll.scrollLeft = state.currentTime * state.pxPerSec;
        syncVideoElements(false);
        renderFrame();
        requestAnimationFrame(tick);
      }
    }

    function togglePlay(force) {
      const hasAnyPip = state.pipTracks.some(t => t.clips.length > 0);
      if (state.clips.length === 0 && !hasAnyPip && state.subtitles.length === 0 && state.audioClips.length === 0) {
        return showToast('請先匯入影片、音訊或新增字幕再播放');
      }
      state.isPlaying = typeof force === 'boolean' ? force : !state.isPlaying;
      document.getElementById('playBtn').textContent = state.isPlaying ? '⏸' : '▶';
      if (state.isPlaying) {
        getAudioCtx();
        lastTs = 0;
        syncVideoElements(true);

        state.clips.forEach(c => {
          if (c.mediaEl?.tagName === 'VIDEO') {
            c.mediaEl.playbackRate = c.speed || 1.0;
            applyMediaAudioGain(c.mediaEl, c.muted, c.audioGain ?? 1.0);
            c.mediaEl.play().catch(() => {});
          }
        });
        state.pipTracks.forEach(tr => tr.clips.forEach(p => {
          if (p.mediaEl?.tagName === 'VIDEO') {
            p.mediaEl.playbackRate = p.speed || 1.0;
            applyMediaAudioGain(p.mediaEl, p.muted, p.audioGain ?? 1.0);
            p.mediaEl.play().catch(() => {});
          }
        }));
        state.audioClips.forEach(a => {
          if (a.mediaEl) {
            applyMediaAudioGain(a.mediaEl, a.muted, a.gain ?? 1.0);
            const aStart = a.start || 0;
            if (state.currentTime >= aStart && state.currentTime <= aStart + a.duration) {
              a.mediaEl.currentTime = Math.max(0.01, (a.trimStart || 0) + (state.currentTime - aStart));
              a.mediaEl.play().catch(() => {});
            }
          }
        });
        if (state.background.mode === 'custom' && state.background.mediaEl?.tagName === 'VIDEO') {
          state.background.mediaEl.muted = true;
          state.background.mediaEl.play().catch(() => {});
        }
        requestAnimationFrame(tick);
      } else {
        state.clips.forEach(c => { if (c.mediaEl?.tagName === 'VIDEO') c.mediaEl.pause(); });
        state.pipTracks.forEach(tr => tr.clips.forEach(p => {
          if (p.mediaEl?.tagName === 'VIDEO') p.mediaEl.pause();
        }));
        state.audioClips.forEach(a => { if (a.mediaEl) a.mediaEl.pause(); });
        if (state.background.mediaEl?.tagName === 'VIDEO') state.background.mediaEl.pause();
        renderFrame();
      }
    }

    document.getElementById('playBtn').onclick = () => togglePlay();

    // ====== 匯出錄製成影片檔（同步混音錄入所有背景音樂＋影片原聲） ======
    document.getElementById('exportBtn').onclick = () => {
      const hasAnyPip = state.pipTracks.some(t => t.clips.length > 0);
      if (state.clips.length === 0 && !hasAnyPip && state.audioClips.length === 0) {
        return showToast('請先匯入影片或音訊再匯出');
      }
      if (typeof MediaRecorder === 'undefined') {
        return showToast('目前瀏覽器不支援直接錄製匯出，請改用 Chrome 或 Safari 最新版');
      }

      getAudioCtx();
      showToast('正在高速渲染並混音匯出（包含音樂與影片原聲），請稍候...');

      // 合併畫布視訊軌道 ＋ Web Audio API 混音音訊軌道
      const videoStream = canvas.captureStream(30);
      const combinedStream = new MediaStream();
      videoStream.getVideoTracks().forEach(track => combinedStream.addTrack(track));
      if (exportMixDest && exportMixDest.stream) {
        exportMixDest.stream.getAudioTracks().forEach(track => combinedStream.addTrack(track));
      }

      let mimeType = 'video/webm';
      if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')) {
        mimeType = 'video/webm;codecs=vp9,opus';
      } else if (MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus')) {
        mimeType = 'video/webm;codecs=vp8,opus';
      }

      const recorder = new MediaRecorder(combinedStream, { mimeType });
      const chunks = [];
      recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `CutVideo_${Date.now()}.webm`;
        a.click();
        showToast('影片匯出完成（已含完整混音）！開始下載 🎬🔊');
      };

      state.currentTime = 0;
      timelineScroll.scrollLeft = 0;
      recorder.start();
      togglePlay(true);

      const checkStop = setInterval(() => {
        if (!state.isPlaying) {
          clearInterval(checkStop);
          if (recorder.state !== 'inactive') recorder.stop();
        }
      }, 200);
    };

    // 初始化啟動
    updateDeleteButtonLabel();
    renderTimeline();
    renderDrawer();
    renderFrame();
  </script>
</body>
</html>
