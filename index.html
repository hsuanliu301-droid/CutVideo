<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CutVideo</title>
  <!-- Google Fonts & 開源免費繁體字體庫 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chiron+Hei+HK:wght@400;700&family=Chiron+Sung+HK:wght@400;700&family=Iansui&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;700;900&family=Noto+Serif+TC:wght@400;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <style>
    @import url('https://cdn.jsdelivr.net/npm/open-huninn-font@1.1.0/font.css');
    @import url('https://cdn.jsdelivr.net/npm/cubic-11@1.0.1/fonts/web/cubic-11.css');
    @import url('https://cdn.jsdelivr.net/npm/smiley-sans@2.0.1/dist/smiley-sans.css');

    @font-face {
      font-family: 'Taipei Sans TC';
      src: url('https://cdn.jsdelivr.net/gh/max32002/taipeisanstc@master/webfont/TaipeiSansTCBeta-Regular.woff2') format('woff2');
      font-display: swap;
    }
    @font-face {
      font-family: 'ChenYuluoyan';
      src: url('https://cdn.jsdelivr.net/gh/Chenyu-otf/chenyuluoyan_thin@main/ChenYuluoyan-Thin-Monospaced.woff2') format('woff2');
      font-display: swap;
    }
    @font-face {
      font-family: 'GenSenRounded';
      src: url('https://cdn.jsdelivr.net/gh/ButTaiwan/gensen-font@master/webfont/GenSenRounded-M.woff2') format('woff2');
      font-display: swap;
    }
    @font-face {
      font-family: 'TASA Explorer';
      src: url('https://cdn.jsdelivr.net/gh/ButTaiwan/tasa-explorer@main/webfont/TASAExplorer-Medium.woff2') format('woff2');
      font-display: swap;
    }

    :root {
      --bg-dark: #0f1014;
      --bg-panel: #181a20;
      --bg-card: #22252e;
      --accent: #ff3b7f;
      --accent-soft: rgba(255, 59, 127, 0.2);
      --danger: #ef4444;
      --danger-soft: rgba(239, 68, 68, 0.18);
      --gold: #ffcc33;
      --cyan: #2ce6c3;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #2c303c;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Bar */
    .topbar {
      height: 46px;
      padding: 0 12px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .brand {
      font-weight: 900;
      font-size: 16px;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand span {
      background: linear-gradient(135deg, #ff3b7f, #ff8a3d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .shortcut-badge {
      display: none;
      font-size: 11px;
      color: var(--text-muted);
      background: var(--bg-card);
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    @media (min-width: 768px) {
      .shortcut-badge { display: inline-block; }
    }

    .ratio-group {
      display: flex;
      background: var(--bg-card);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
    }

    .ratio-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
    }

    .ratio-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .btn-export {
      background: linear-gradient(135deg, #ff3b7f, #ff6b4a);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Stage / Preview Area */
    .stage-wrap {
      flex: 1;
      min-height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #090a0d;
      position: relative;
      padding: 8px;
      overflow: hidden;
    }

    canvas#previewCanvas {
      background: #000;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
      border-radius: 6px;
      max-width: 100%;
      max-height: 100%;
      touch-action: none;
      cursor: grab;
    }

    canvas#previewCanvas:active {
      cursor: grabbing;
    }

    .stage-hint {
      position: absolute;
      top: 8px;
      left: 10px;
      background: rgba(0, 0, 0, 0.65);
      color: #d1d5db;
      font-size: 10px;
      padding: 3px 9px;
      border-radius: 99px;
      pointer-events: none;
    }

    /* Transport & Direct Touch Action Bar */
    .transport {
      height: 44px;
      background: var(--bg-panel);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      gap: 6px;
      flex-shrink: 0;
    }

    .time-readout {
      font-variant-numeric: tabular-nums;
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .time-readout strong {
      color: var(--text-main);
    }

    .play-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: var(--text-main);
      color: var(--bg-dark);
      font-size: 13px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .quick-actions {
      display: flex;
      align-items: center;
      gap: 5px;
      overflow-x: auto;
      padding: 2px 0;
    }

    .quick-actions::-webkit-scrollbar {
      display: none;
    }

    .chip-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      font-size: 11px;
      font-weight: 600;
      padding: 5px 8px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .chip-btn:active {
      transform: scale(0.96);
    }

    .chip-btn.danger {
      background: var(--danger-soft);
      border-color: var(--danger);
      color: #fca5a5;
    }

    .chip-btn.danger:hover {
      background: var(--danger);
      color: #fff;
    }

    /* Timeline */
    .timeline-area {
      height: 155px;
      background: #13151a;
      position: relative;
      overflow-x: auto;
      overflow-y: hidden;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      scroll-behavior: auto;
      cursor: grab;
      touch-action: none;
    }

    .timeline-area.grabbing {
      cursor: grabbing;
    }

    .timeline-inner {
      position: relative;
      height: 100%;
      min-width: 100%;
      padding: 24px 50vw 10px 50vw;
    }

    .ruler {
      position: absolute;
      top: 0;
      left: 50vw;
      height: 22px;
      border-bottom: 1px solid #2a2e3b;
      display: flex;
      font-size: 10px;
      color: var(--text-muted);
    }

    .playhead {
      position: fixed;
      left: 50%;
      width: 2px;
      height: 155px;
      background: #fff;
      z-index: 20;
      pointer-events: none;
      box-shadow: 0 0 6px rgba(255,255,255,0.85);
    }

    .playhead::before {
      content: '';
      position: absolute;
      top: 0;
      left: -5px;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 8px solid #fff;
    }

    .track-row {
      height: 36px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      position: relative;
    }

    .empty-track-hint {
      font-size: 11px;
      color: #9ca3af;
      border: 1px dashed #4b5563;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      white-space: nowrap;
      background: rgba(255,255,255,0.02);
    }

    .empty-track-hint:hover {
      border-color: var(--accent);
      color: #fff;
    }

    /* Clip Block & Trim Handles */
    .clip-block {
      height: 34px;
      background: linear-gradient(90deg, #2d3446, #394258);
      border: 1.5px solid #4b556e;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      position: relative;
      overflow: visible;
      white-space: nowrap;
      padding: 0 18px;
      flex-shrink: 0;
      touch-action: none;
      transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
    }

    .clip-block.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 1.5px var(--accent);
    }

    .clip-block.reordering {
      border-color: var(--gold) !important;
      background: linear-gradient(90deg, #52411c, #735a24);
      box-shadow: 0 8px 20px rgba(255, 204, 51, 0.5), 0 0 0 2px var(--gold) !important;
      transform: translateY(-5px) scale(1.04);
      z-index: 40;
      cursor: ew-resize;
    }

    .clip-label {
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }

    .trim-handle {
      position: absolute;
      top: -1px;
      bottom: -1px;
      width: 16px;
      background: rgba(255, 255, 255, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: ew-resize;
      z-index: 15;
      touch-action: none;
    }

    .trim-handle:hover, .trim-handle.active {
      background: var(--accent);
    }

    .trim-handle.left {
      left: -1px;
      border-radius: 5px 0 0 5px;
      border-right: 1px solid rgba(255,255,255,0.45);
    }

    .trim-handle.right {
      right: -1px;
      border-radius: 0 5px 5px 0;
      border-left: 1px solid rgba(255,255,255,0.45);
    }

    .trim-handle::after {
      content: '⋮';
      font-size: 12px;
      color: #fff;
      font-weight: bold;
    }

    .trans-node {
      width: 22px;
      height: 22px;
      margin: 0 2px;
      z-index: 5;
      background: var(--bg-panel);
      border: 1.5px solid var(--cyan);
      color: var(--cyan);
      border-radius: 6px;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .kf-diamond {
      position: absolute;
      width: 9px;
      height: 9px;
      background: var(--gold);
      transform: translateX(-50%) rotate(45deg);
      top: 3px;
      border: 1px solid #000;
      pointer-events: none;
    }

    .sub-block {
      position: absolute;
      height: 26px;
      background: rgba(255, 59, 127, 0.28);
      border: 1px solid var(--accent);
      border-radius: 5px;
      font-size: 10px;
      padding: 0 15px;
      display: flex;
      align-items: center;
      color: #ffd1e1;
      white-space: nowrap;
      touch-action: none;
    }

    .sub-block.selected {
      background: rgba(255, 59, 127, 0.6);
      color: #fff;
      box-shadow: 0 0 0 1.5px #fff;
    }

    .audio-block {
      position: absolute;
      height: 26px;
      background: rgba(44, 230, 195, 0.2);
      border: 1px solid var(--cyan);
      border-radius: 5px;
      font-size: 10px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      color: #a7f3d0;
      white-space: nowrap;
    }

    .audio-block.selected {
      background: rgba(44, 230, 195, 0.42);
      color: #fff;
      box-shadow: 0 0 0 1.5px #fff;
    }

    /* Tool Drawer */
    .drawer {
      background: var(--bg-panel);
      height: 215px;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .drawer-content {
      flex: 1;
      padding: 10px 12px;
      overflow-y: auto;
      font-size: 12px;
    }

    .nav-tabs {
      height: 52px;
      background: #121318;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      flex-shrink: 0;
    }

    .nav-tab {
      background: none;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 10px;
      cursor: pointer;
      padding: 4px 10px;
    }

    .nav-tab.active {
      color: var(--accent);
      font-weight: 700;
    }

    .nav-tab span.icon {
      font-size: 16px;
    }

    /* Controls inside Drawer */
    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      gap: 8px;
    }

    .control-row label {
      color: var(--text-muted);
      font-size: 11px;
      min-width: 60px;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
    }

    input[type="text"], select {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 12px;
      flex: 1;
      user-select: text;
      min-width: 0;
    }

    .pill-group {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 8px;
    }

    .pill {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 11px;
      white-space: nowrap;
      cursor: pointer;
    }

    .pill.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: #fff;
    }

    .font-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin-top: 6px;
    }

    @media (min-width: 768px) {
      .font-grid { grid-template-columns: repeat(4, 1fr); }
    }

    .font-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      text-align: left;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .font-card.active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .font-card .sample {
      font-size: 14px;
      font-weight: 700;
    }

    .font-card .meta {
      font-size: 9px;
      color: var(--text-muted);
      font-family: 'Noto Sans TC', sans-serif;
    }

    .action-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .box-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px 6px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
    }

    .box-btn.primary {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .box-btn.danger {
      border-color: var(--danger);
      background: var(--danger-soft);
      color: #fca5a5;
    }

    .hidden-input {
      display: none;
    }

    #toast {
      position: fixed;
      top: 54px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(24, 26, 32, 0.96);
      border: 1px solid var(--accent);
      color: #fff;
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 12px;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div id="toast">提示訊息</div>

  <!-- Top Bar -->
  <div class="topbar">
    <div class="brand">
      🎬 <span>CutVideo</span>
      <span class="shortcut-badge">快捷鍵：Space 播放 · S / Ctrl+B 分割 · Del 刪除 · Ctrl+Z 復原</span>
    </div>
    <div class="ratio-group">
      <button class="ratio-btn active" data-ratio="9:16">9:16</button>
      <button class="ratio-btn" data-ratio="16:9">16:9</button>
      <button class="ratio-btn" data-ratio="1:1">1:1</button>
    </div>
    <button class="btn-export" id="exportBtn">匯出影片</button>
  </div>

  <!-- Stage -->
  <div class="stage-wrap">
    <div class="stage-hint">拖拉前後白條 ⋮ 即時預覽裁切點 · 長按片段 0.2 秒左右調換順序</div>
    <canvas id="previewCanvas" width="360" height="640"></canvas>
  </div>

  <!-- Transport & Mobile/Desktop Direct Buttons -->
  <div class="transport">
    <div class="time-readout"><strong id="curTimeLabel">00:00.0</strong>/<span id="totTimeLabel">00:01.0</span></div>
    <button class="play-btn" id="playBtn" title="播放/暫停 (Space)">▶</button>
    <div class="quick-actions">
      <button class="chip-btn" id="splitBtn" title="分割片段 (S)">✂️ 分割</button>
      <button class="chip-btn danger" id="deleteSelectedBtn" title="刪除選取項目 (Delete)">🗑️ 刪除</button>
      <button class="chip-btn" id="undoBtn" title="復原上一步 (Ctrl+Z)">↩️ 復原</button>
      <button class="chip-btn" id="clearAllBtn" title="清空全部軌道">🧹 全部清空</button>
    </div>
  </div>

  <!-- Timeline -->
  <div class="timeline-area" id="timelineScroll">
    <div class="playhead"></div>
    <div class="timeline-inner" id="timelineInner">
      <div class="ruler" id="ruler"></div>
      <div class="track-row" id="videoTrack"></div>
      <div class="track-row" id="subTrack"></div>
      <div class="track-row" id="audioTrack"></div>
    </div>
  </div>

  <!-- Bottom Drawer -->
  <div class="drawer">
    <div class="drawer-content" id="drawerContent"></div>
    <div class="nav-tabs">
      <button class="nav-tab active" data-tab="media"><span class="icon">🎞️</span>剪輯</button>
      <button class="nav-tab" data-tab="keyframe"><span class="icon">◆</span>關鍵幀</button>
      <button class="nav-tab" data-tab="text"><span class="icon">T</span>文字字庫</button>
      <button class="nav-tab" data-tab="color"><span class="icon">🎨</span>調色濾鏡</button>
      <button class="nav-tab" data-tab="audio"><span class="icon">🎵</span>音訊</button>
    </div>
  </div>

  <input type="file" id="videoFileInput" class="hidden-input" accept="video/*" multiple />
  <input type="file" id="audioFileInput" class="hidden-input" accept="audio/*" />
  <input type="file" id="fontFileInput" class="hidden-input" accept=".ttf,.otf,.woff,.woff2" />

  <script>
    // ====== 14 款免費開源繁體字體清單 ======
    const FREE_FONTS = [
      { name: '思源黑體', family: "'Noto Sans TC', sans-serif", cat: '現代', desc: '清晰百搭 · 教學解說' },
      { name: '台北黑體', family: "'Taipei Sans TC', 'Noto Sans TC', sans-serif", cat: '現代', desc: '俐落平衡 · Vlog字幕' },
      { name: '昭源黑體', family: "'Chiron Hei HK', sans-serif", cat: '現代', desc: '現代簡潔 · 時尚標題' },
      { name: '探空體', family: "'TASA Explorer', sans-serif", cat: '現代', desc: '未來科技 · 帥氣舞風' },
      { name: '芫荽體', family: "'Iansui', cursive", cat: '手寫', desc: '硬筆楷書 · 生活溫度' },
      { name: '霞鶩文楷', family: "'LXGW WenKai TC', serif", cat: '手寫', desc: '溫潤楷韻 · 古典抒情' },
      { name: '辰宇落雁體', family: "'ChenYuluoyan', cursive", cat: '手寫', desc: '飄逸手寫 · 感性歌詞' },
      { name: 'jf open 粉圓', family: "'jf-openhuninn', sans-serif", cat: '圓體', desc: '圓潤可愛 · 旅遊美食' },
      { name: '源泉圓體', family: "'GenSenRounded', sans-serif", cat: '圓體', desc: '飽滿圓角 · 親切活潑' },
      { name: '思源宋體', family: "'Noto Serif TC', serif", cat: '古典', desc: '典雅大氣 · 電影質感' },
      { name: '昭源宋體', family: "'Chiron Sung HK', serif", cat: '古典', desc: '文學書卷 · 藝文紀錄' },
      { name: '得意黑', family: "'Smiley Sans', sans-serif", cat: '特色', desc: '斜體張力 · 節拍標題' },
      { name: '俐方體11號', family: "'Cubic 11', monospace", cat: '特色', desc: '復古像素 · 趣味梗圖' },
      { name: '站酷快樂體', family: "'ZCOOL KuaiLe', sans-serif", cat: '特色', desc: '動感活潑 · 綜藝字卡' }
    ];

    const FILTER_PRESETS = [
      { id: 'none', name: '原圖', b: 100, c: 100, s: 100, warm: 0 },
      { id: 'dance', name: '練舞室高對比', b: 105, c: 122, s: 112, warm: -5 },
      { id: 'vlog', name: '日系清新 Vlog', b: 108, c: 94, s: 92, warm: 10 },
      { id: 'warm', name: '暖陽微光', b: 104, c: 105, s: 115, warm: 22 },
      { id: 'film', name: '復古膠片', b: 96, c: 114, s: 82, warm: 14 },
      { id: 'bw', name: '黑白極簡', b: 105, c: 125, s: 0, warm: 0 }
    ];

    const TRANSITIONS = [
      { id: 'none', name: '無轉場', icon: '｜' },
      { id: 'fade', name: '疊化淡入', icon: '◐' },
      { id: 'zoom', name: '節拍推進', icon: '⊕' },
      { id: 'flash', name: '節拍閃白', icon: '⚡' },
      { id: 'slide', name: '向左滑動', icon: '⇄' }
    ];

    // ====== 核心狀態 ======
    const PX_PER_SEC = 55;
    let undoStack = [];

    let state = {
      ratio: '9:16',
      currentTime: 0,
      isPlaying: false,
      activeTab: 'media',
      lastSelectedType: 'clip',
      selectedClipId: null,
      selectedSubId: null,
      fontFilter: '全部',
      clips: [],
      subtitles: [],
      audio: null
    };

    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');
    const timelineScroll = document.getElementById('timelineScroll');

    function pushUndo() {
      const snapshot = {
        clips: state.clips.map(c => ({ ...c, keyframes: JSON.parse(JSON.stringify(c.keyframes)), color: { ...c.color } })),
        subtitles: JSON.parse(JSON.stringify(state.subtitles)),
        audio: state.audio ? { ...state.audio } : null,
        selectedClipId: state.selectedClipId,
        selectedSubId: state.selectedSubId,
        lastSelectedType: state.lastSelectedType
      };
      undoStack.push(snapshot);
      if (undoStack.length > 25) undoStack.shift();
    }

    function undoLastAction() {
      if (undoStack.length === 0) return showToast('目前沒有可復原的操作');
      const prev = undoStack.pop();
      state.clips = prev.clips;
      state.subtitles = prev.subtitles;
      state.audio = prev.audio;
      state.selectedClipId = prev.selectedClipId;
      state.selectedSubId = prev.selectedSubId;
      state.lastSelectedType = prev.lastSelectedType;
      updateDeleteButtonLabel();
      renderTimeline();
      renderDrawer();
      syncVideoElements(true);
      renderFrame();
      showToast('已復原上一步 ↩️');
    }

    document.getElementById('undoBtn').onclick = undoLastAction;

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.opacity = '1';
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.style.opacity = '0', 2200);
    }

    function getTotalDuration() {
      const clipDur = state.clips.reduce((acc, c) => acc + c.duration, 0);
      const subEnd = state.subtitles.reduce((max, s) => Math.max(max, s.start + s.duration), 0);
      return Math.max(clipDur, subEnd, 1);
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = (sec % 60).toFixed(1);
      return `${String(m).padStart(2, '0')}:${s.padStart(4, '0')}`;
    }

    function seekTo(sec) {
      state.currentTime = Math.max(0, Math.min(getTotalDuration(), sec));
      timelineScroll.scrollLeft = state.currentTime * PX_PER_SEC;
      syncVideoElements(true);
      renderFrame();
    }

    function updateDeleteButtonLabel() {
      const btn = document.getElementById('deleteSelectedBtn');
      if (state.lastSelectedType === 'sub' && state.selectedSubId) {
        btn.innerHTML = '🗑️ 刪字幕';
      } else if (state.lastSelectedType === 'audio' && state.audio) {
        btn.innerHTML = '🗑️ 刪音訊';
      } else {
        btn.innerHTML = '🗑️ 刪片段';
      }
    }

    // ====== 關鍵幀內插計算 ======
    function getInterpolatedTransform(clip, localT) {
      if (!clip || !clip.keyframes || clip.keyframes.length === 0) return { scale: 1, x: 0, y: 0, rot: 0 };
      const kfs = [...clip.keyframes].sort((a, b) => a.t - b.t);
      if (localT <= kfs[0].t) return { ...kfs[0] };
      if (localT >= kfs[kfs.length - 1].t) return { ...kfs[kfs.length - 1] };

      for (let i = 0; i < kfs.length - 1; i++) {
        const k1 = kfs[i], k2 = kfs[i + 1];
        if (localT >= k1.t && localT <= k2.t) {
          const rawRatio = (localT - k1.t) / Math.max(0.001, k2.t - k1.t);
          const ratio = rawRatio * rawRatio * (3 - 2 * rawRatio);
          return {
            scale: k1.scale + (k2.scale - k1.scale) * ratio,
            x: k1.x + (k2.x - k1.x) * ratio,
            y: k1.y + (k2.y - k1.y) * ratio,
            rot: k1.rot + (k2.rot - k1.rot) * ratio
          };
        }
      }
      return { scale: 1, x: 0, y: 0, rot: 0 };
    }

    // ====== 渲染畫布 ======
    function renderFrame() {
      const W = canvas.width;
      const H = canvas.height;
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, H);

      let acc = 0;
      let activeClip = null;
      let localT = 0;
      let clipIndex = 0;

      // 若正在拖拉裁切某段影片，強制直接顯示該片段的裁切邊界畫面，做到零延遲所見即所得
      if (activeTrim && activeTrim.type === 'clip') {
        activeClip = activeTrim.item;
        localT = activeTrim.edge === 'left' ? 0 : Math.max(0, activeClip.duration - 0.02);
        clipIndex = state.clips.indexOf(activeClip);
      } else {
        for (let i = 0; i < state.clips.length; i++) {
          const c = state.clips[i];
          if (state.currentTime >= acc && state.currentTime <= acc + c.duration) {
            activeClip = c;
            localT = state.currentTime - acc;
            clipIndex = i;
            break;
          }
          acc += c.duration;
        }
      }

      if (activeClip) {
        const tr = getInterpolatedTransform(activeClip, localT);
        ctx.save();
        ctx.translate(W / 2 + tr.x, H / 2 + tr.y);
        ctx.rotate((tr.rot * Math.PI) / 180);
        ctx.scale(tr.scale, tr.scale);

        const col = activeClip.color;
        const sepia = col.warm > 0 ? col.warm * 0.6 : 0;
        const hue = col.warm < 0 ? col.warm * 0.8 : 0;
        ctx.filter = `brightness(${col.b}%) contrast(${col.c}%) saturate(${col.s}%) sepia(${sepia}%) hue-rotate(${hue}deg)`;

        if (activeClip.videoEl) {
          const v = activeClip.videoEl;
          if (v.error) {
            ctx.restore();
            ctx.fillStyle = '#fca5a5';
            ctx.font = "600 13px 'Noto Sans TC', sans-serif";
            ctx.textAlign = 'center';
            ctx.fillText('⚠️ 瀏覽器不支援此影片編碼格式', W / 2, H / 2 - 10);
            ctx.font = "400 11px 'Noto Sans TC', sans-serif";
            ctx.fillText('建議使用標準 H.264 MP4 檔案', W / 2, H / 2 + 12);
          } else if (v.readyState >= 1 && v.videoWidth > 0) {
            const vRatio = v.videoWidth / v.videoHeight;
            const cRatio = W / H;
            let dw = W, dh = H;
            if (vRatio > cRatio) {
              dh = H;
              dw = H * vRatio;
            } else {
              dw = W;
              dh = W / vRatio;
            }
            ctx.drawImage(v, -dw / 2, -dh / 2, dw, dh);
            ctx.restore();
          } else {
            ctx.restore();
            ctx.fillStyle = '#9ca3af';
            ctx.font = "500 13px 'Noto Sans TC', sans-serif";
            ctx.textAlign = 'center';
            ctx.fillText('正在解碼影片畫面...', W / 2, H / 2);
          }
        } else {
          ctx.restore();
        }

        // 裁切過程中的左上角即時時間戳提示框
        if (activeTrim && activeTrim.type === 'clip') {
          ctx.save();
          ctx.fillStyle = 'rgba(255, 59, 127, 0.9)';
          ctx.beginPath();
          ctx.roundRect(10, H - 38, 175, 26, 6);
          ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.font = "700 11px 'Noto Sans TC', sans-serif";
          ctx.textAlign = 'left';
          ctx.textBaseline = 'middle';
          const edgeText = activeTrim.edge === 'left'
            ? `裁切開頭：${(activeClip.trimStart || 0).toFixed(2)}s`
            : `裁切結尾：${((activeClip.trimStart || 0) + activeClip.duration).toFixed(2)}s`;
          ctx.fillText(edgeText, 18, H - 25);
          ctx.restore();
        }

        const timeLeft = activeClip.duration - localT;
        if (!activeTrim && timeLeft <= 0.6 && activeClip.transitionAfter !== 'none' && clipIndex < state.clips.length - 1) {
          const p = 1 - (timeLeft / 0.6);
          if (activeClip.transitionAfter === 'fade') {
            ctx.fillStyle = `rgba(0, 0, 0, ${p})`;
            ctx.fillRect(0, 0, W, H);
          } else if (activeClip.transitionAfter === 'flash') {
            ctx.fillStyle = `rgba(255, 255, 255, ${Math.sin(p * Math.PI) * 0.85})`;
            ctx.fillRect(0, 0, W, H);
          } else if (activeClip.transitionAfter === 'zoom') {
            ctx.strokeStyle = `rgba(255, 59, 127, ${1 - p})`;
            ctx.lineWidth = 12 * (1 - p);
            ctx.strokeRect(p * 30, p * 30, W - p * 60, H - p * 60);
          } else if (activeClip.transitionAfter === 'slide') {
            ctx.fillStyle = '#000';
            ctx.fillRect(W * (1 - p), 0, W * p, H);
          }
        }
      } else if (state.clips.length === 0) {
        ctx.fillStyle = '#181a20';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#9ca3af';
        ctx.font = "600 14px 'Noto Sans TC', sans-serif";
        ctx.textAlign = 'center';
        ctx.fillText('空白專案（無影片）', W / 2, H / 2 - 10);
        ctx.font = "400 12px 'Noto Sans TC', sans-serif";
        ctx.fillText('請點下方「＋ 匯入影片檔」開始剪輯', W / 2, H / 2 + 14);
      }

      // 繪製字幕層
      state.subtitles.forEach(sub => {
        if (state.currentTime >= sub.start && state.currentTime <= sub.start + sub.duration) {
          ctx.save();
          ctx.font = `700 ${sub.size}px ${sub.font}`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          const sx = sub.x * W;
          const sy = sub.y * H;
          const metrics = ctx.measureText(sub.text);
          const padX = 14, padY = 8;
          const boxW = metrics.width + padX * 2;
          const boxH = sub.size + padY * 2;

          if (sub.bg && sub.bg !== 'transparent') {
            ctx.fillStyle = sub.bg;
            ctx.beginPath();
            ctx.roundRect(sx - boxW / 2, sy - boxH / 2, boxW, boxH, 8);
            ctx.fill();
          }

          if (sub.stroke) {
            ctx.lineWidth = 3;
            ctx.strokeStyle = sub.stroke;
            ctx.strokeText(sub.text, sx, sy);
          }

          ctx.fillStyle = sub.color;
          ctx.fillText(sub.text, sx, sy);

          if (sub.id === state.selectedSubId && state.lastSelectedType === 'sub' && !state.isPlaying) {
            ctx.strokeStyle = '#ff3b7f';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([4, 3]);
            ctx.strokeRect(sx - boxW / 2 - 4, sy - boxH / 2 - 4, boxW + 8, boxH + 8);
          }
          ctx.restore();
        }
      });

      document.getElementById('curTimeLabel').textContent = formatTime(state.currentTime);
      document.getElementById('totTimeLabel').textContent = formatTime(getTotalDuration());
    }

    // ====== 雙向即時裁切（Instant Frame-Accurate Trim） ======
    let activeTrim = null;

    function attachTrimEvents(handleEl, type, item, edge, blockEl, labelEl) {
      handleEl.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        e.preventDefault();
        cancelLongPress();
        if (state.isPlaying) togglePlay(false);
        pushUndo();

        handleEl.setPointerCapture(e.pointerId);
        handleEl.classList.add('active');
        activeTrim = {
          type,
          item,
          edge,
          startX: e.clientX,
          origTrimStart: item.trimStart || 0,
          origStart: item.start || 0,
          origDur: item.duration,
          handleEl,
          blockEl,
          labelEl
        };

        // 按下手把當下立刻定位到裁切邊界影格
        if (type === 'clip' && item.videoEl) {
          const target = edge === 'left'
            ? (item.trimStart || 0)
            : Math.max(0.01, (item.trimStart || 0) + item.duration * item.speed - 0.03);
          item.videoEl.currentTime = Math.min(item.videoEl.duration || 999, Math.max(0.01, target));
        }
        renderFrame();
      });

      handleEl.addEventListener('pointermove', (e) => {
        if (!activeTrim || activeTrim.handleEl !== handleEl) return;
        e.stopPropagation();
        const deltaSec = (e.clientX - activeTrim.startX) / PX_PER_SEC;

        if (activeTrim.type === 'clip') {
          const maxTotal = item.maxDuration || 120;
          if (edge === 'left') {
            const minDelta = -activeTrim.origTrimStart;
            const maxDelta = activeTrim.origDur - 0.4;
            const clampedDelta = Math.max(minDelta, Math.min(maxDelta, deltaSec));

            item.trimStart = activeTrim.origTrimStart + clampedDelta;
            item.duration = activeTrim.origDur - clampedDelta;

            if (item.videoEl) {
              const seekTarget = Math.max(0.01, Math.min(item.videoEl.duration || 999, item.trimStart));
              item.videoEl.currentTime = seekTarget;
            }
          } else if (edge === 'right') {
            const maxAvailDur = Math.max(0.4, maxTotal - (item.trimStart || 0));
            item.duration = Math.max(0.4, Math.min(maxAvailDur, activeTrim.origDur + deltaSec));

            if (item.videoEl) {
              const endTarget = Math.max(0.01, Math.min(item.videoEl.duration || 999, (item.trimStart || 0) + item.duration * item.speed - 0.03));
              item.videoEl.currentTime = endTarget;
            }
          }

          if (blockEl) blockEl.style.width = (item.duration * PX_PER_SEC) + 'px';
          if (labelEl) {
            const idx = state.clips.indexOf(item);
            const trimTag = (item.trimStart || 0) > 0.05 ? ` [裁 ${(item.trimStart).toFixed(1)}s~]` : '';
            labelEl.textContent = `#${idx + 1} ${item.name}${trimTag} (${item.duration.toFixed(1)}s)`;
          }
          renderFrame();
        } else if (activeTrim.type === 'sub') {
          if (edge === 'right') {
            item.duration = Math.max(0.4, activeTrim.origDur + deltaSec);
          } else if (edge === 'left') {
            const maxShift = activeTrim.origDur - 0.4;
            const shift = Math.max(-activeTrim.origStart, Math.min(maxShift, deltaSec));
            item.start = activeTrim.origStart + shift;
            item.duration = activeTrim.origDur - shift;
          }
          if (blockEl) {
            blockEl.style.left = (item.start * PX_PER_SEC) + 'px';
            blockEl.style.width = (item.duration * PX_PER_SEC) + 'px';
          }
          if (labelEl) labelEl.textContent = `T ${item.text} (${item.duration.toFixed(1)}s)`;
          renderFrame();
        }
      });

      const finishTrim = (e) => {
        if (!activeTrim || activeTrim.handleEl !== handleEl) return;
        e.stopPropagation();
        handleEl.classList.remove('active');
        const wasClip = activeTrim.type === 'clip';
        const wasLeft = edge === 'left';
        activeTrim = null;

        if (wasClip && wasLeft) {
          showToast(`已裁切開頭至 ${(item.trimStart || 0).toFixed(1)}s（片段長 ${item.duration.toFixed(1)}s）`);
        } else {
          showToast(`已調整長度：${item.duration.toFixed(1)} 秒`);
        }
        renderTimeline();
        renderDrawer();
        syncVideoElements(true);
        renderFrame();
      };

      handleEl.addEventListener('pointerup', finishTrim);
      handleEl.addEventListener('pointercancel', finishTrim);
    }

    // ====== 長按影片片段拖曳調換前後順序（Pointer Capture 抗瀏覽器劫持版） ======
    let longPressTimer = null;
    let reorderState = null;

    function cancelLongPress() {
      if (longPressTimer) {
        clearTimeout(longPressTimer);
        longPressTimer = null;
      }
    }

    function startClipLongPress(e, clip, clipEl) {
      if (state.clips.length <= 1) return;
      if (e.target.closest('.trim-handle') || activeTrim) return;

      cancelLongPress();
      const pointerId = e.pointerId;
      const startX = e.clientX;

      longPressTimer = setTimeout(() => {
        // 停止時間軸捲動狀態，鎖定指標給排序使用
        isDraggingTimeline = false;
        timelineScroll.classList.remove('grabbing');
        try { clipEl.setPointerCapture(pointerId); } catch (_) {}

        pushUndo();
        reorderState = {
          clipId: clip.id,
          pointerId,
          startX
        };
        state.selectedClipId = clip.id;
        state.lastSelectedType = 'clip';
        updateDeleteButtonLabel();

        if (navigator.vibrate) navigator.vibrate(25);
        showToast('已啟動排序：左右拖曳調換前後順序 ↔️');
        renderTimeline();
      }, 220);
    }

    window.addEventListener('pointermove', (e) => {
      if (longPressTimer && !reorderState) {
        if (Math.abs(e.clientX - dragStartX) > 10) {
          cancelLongPress();
        }
      }

      if (!reorderState) return;
      e.preventDefault();

      const curIdx = state.clips.findIndex(c => c.id === reorderState.clipId);
      if (curIdx === -1) return;

      const clipEls = document.querySelectorAll('#videoTrack .clip-block');
      if (!clipEls[curIdx]) return;

      // 往左拖過前一段中心線 -> 往前互換
      if (curIdx > 0) {
        const prevRect = clipEls[curIdx - 1].getBoundingClientRect();
        const prevMid = prevRect.left + prevRect.width / 2;
        if (e.clientX < prevMid) {
          const temp = state.clips[curIdx - 1];
          state.clips[curIdx - 1] = state.clips[curIdx];
          state.clips[curIdx] = temp;
          if (navigator.vibrate) navigator.vibrate(15);
          renderTimeline();
          syncVideoElements(true);
          renderFrame();
          return;
        }
      }

      // 往右拖過後一段中心線 -> 往後互換
      if (curIdx < state.clips.length - 1) {
        const nextRect = clipEls[curIdx + 1].getBoundingClientRect();
        const nextMid = nextRect.left + nextRect.width / 2;
        if (e.clientX > nextMid) {
          const temp = state.clips[curIdx + 1];
          state.clips[curIdx + 1] = state.clips[curIdx];
          state.clips[curIdx] = temp;
          if (navigator.vibrate) navigator.vibrate(15);
          renderTimeline();
          syncVideoElements(true);
          renderFrame();
          return;
        }
      }
    }, { passive: false });

    const endReorder = () => {
      cancelLongPress();
      if (reorderState) {
        reorderState = null;
        showToast('已完成片段順序調整 ✅');
        renderTimeline();
        renderDrawer();
        syncVideoElements(true);
        renderFrame();
      }
    };

    window.addEventListener('pointerup', endReorder);
    window.addEventListener('pointercancel', endReorder);

    // ====== 渲染時間軸 ======
    function renderTimeline() {
      const total = getTotalDuration();
      const displaySec = Math.max(total + 5, 15);
      const totalPx = displaySec * PX_PER_SEC;
      const ruler = document.getElementById('ruler');
      ruler.style.width = totalPx + 'px';
      ruler.innerHTML = '';
      for (let s = 0; s <= Math.ceil(displaySec); s++) {
        const mark = document.createElement('div');
        mark.style.position = 'absolute';
        mark.style.left = (s * PX_PER_SEC) + 'px';
        mark.textContent = `${s}s`;
        ruler.appendChild(mark);
      }

      // 1. 影片軌道
      const vTrack = document.getElementById('videoTrack');
      vTrack.innerHTML = '';
      if (state.clips.length === 0) {
        const emptyBtn = document.createElement('div');
        emptyBtn.className = 'empty-track-hint';
        emptyBtn.textContent = '＋ 點此匯入影片檔（目前無影片）';
        emptyBtn.onclick = () => { if (!timelineWasDragged) document.getElementById('videoFileInput').click(); };
        vTrack.appendChild(emptyBtn);
      } else {
        state.clips.forEach((clip, idx) => {
          const isSel = clip.id === state.selectedClipId && state.lastSelectedType === 'clip';
          const isReordering = reorderState && reorderState.clipId === clip.id;
          const el = document.createElement('div');
          el.className = 'clip-block' + (isSel ? ' selected' : '') + (isReordering ? ' reordering' : '');
          el.style.width = (clip.duration * PX_PER_SEC) + 'px';

          const leftHandle = document.createElement('div');
          leftHandle.className = 'trim-handle left';
          leftHandle.title = '往右拉即時裁切開頭 · 往左拉還原';

          const labelSpan = document.createElement('span');
          labelSpan.className = 'clip-label';
          const trimTag = (clip.trimStart || 0) > 0.05 ? ` [裁 ${(clip.trimStart).toFixed(1)}s~]` : '';
          labelSpan.textContent = `#${idx + 1} ${clip.name}${trimTag} (${clip.duration.toFixed(1)}s)`;

          const rightHandle = document.createElement('div');
          rightHandle.className = 'trim-handle right';
          rightHandle.title = '左右拖拉即時裁切結尾';

          attachTrimEvents(leftHandle, 'clip', clip, 'left', el, labelSpan);
          attachTrimEvents(rightHandle, 'clip', clip, 'right', el, labelSpan);

          el.appendChild(leftHandle);
          el.appendChild(labelSpan);
          el.appendChild(rightHandle);

          el.addEventListener('pointerdown', (e) => {
            startClipLongPress(e, clip, el);
          });

          el.onclick = () => {
            if (timelineWasDragged || reorderState) return;
            state.selectedClipId = clip.id;
            state.lastSelectedType = 'clip';
            updateDeleteButtonLabel();
            renderTimeline();
            renderDrawer();
            renderFrame();
          };

          clip.keyframes.forEach(kf => {
            const d = document.createElement('div');
            d.className = 'kf-diamond';
            d.style.left = (kf.t * PX_PER_SEC) + 'px';
            el.appendChild(d);
          });

          vTrack.appendChild(el);

          if (idx < state.clips.length - 1) {
            const trBtn = document.createElement('div');
            trBtn.className = 'trans-node';
            const trObj = TRANSITIONS.find(t => t.id === clip.transitionAfter) || TRANSITIONS[0];
            trBtn.textContent = trObj.icon;
            trBtn.title = '切換轉場特效';
            trBtn.onclick = (e) => {
              e.stopPropagation();
              if (timelineWasDragged || reorderState) return;
              pushUndo();
              const curIdx = TRANSITIONS.findIndex(t => t.id === clip.transitionAfter);
              const next = TRANSITIONS[(curIdx + 1) % TRANSITIONS.length];
              clip.transitionAfter = next.id;
              showToast(`已切換轉場：${next.name}`);
              renderTimeline();
              renderFrame();
            };
            vTrack.appendChild(trBtn);
          }
        });
      }

      // 2. 字幕軌道
      const sTrack = document.getElementById('subTrack');
      sTrack.innerHTML = '';
      if (state.subtitles.length === 0) {
        const emptySub = document.createElement('div');
        emptySub.className = 'empty-track-hint';
        emptySub.textContent = '＋ 點此新增字幕（目前無字幕）';
        emptySub.onclick = () => { if (!timelineWasDragged) addNewSubtitle(); };
        sTrack.appendChild(emptySub);
      } else {
        state.subtitles.forEach(sub => {
          const isSel = sub.id === state.selectedSubId && state.lastSelectedType === 'sub';
          const el = document.createElement('div');
          el.className = 'sub-block' + (isSel ? ' selected' : '');
          el.style.left = (sub.start * PX_PER_SEC) + 'px';
          el.style.width = (sub.duration * PX_PER_SEC) + 'px';

          const leftHandle = document.createElement('div');
          leftHandle.className = 'trim-handle left';

          const labelSpan = document.createElement('span');
          labelSpan.className = 'clip-label';
          labelSpan.textContent = `T ${sub.text} (${sub.duration.toFixed(1)}s)`;

          const rightHandle = document.createElement('div');
          rightHandle.className = 'trim-handle right';

          attachTrimEvents(leftHandle, 'sub', sub, 'left', el, labelSpan);
          attachTrimEvents(rightHandle, 'sub', sub, 'right', el, labelSpan);

          el.appendChild(leftHandle);
          el.appendChild(labelSpan);
          el.appendChild(rightHandle);

          el.onclick = () => {
            if (timelineWasDragged) return;
            state.selectedSubId = sub.id;
            state.lastSelectedType = 'sub';
            state.activeTab = 'text';
            updateTabsUI();
            updateDeleteButtonLabel();
            renderTimeline();
            renderDrawer();
            renderFrame();
          };
          sTrack.appendChild(el);
        });
      }

      // 3. 音訊軌道
      const aTrack = document.getElementById('audioTrack');
      aTrack.innerHTML = '';
      if (!state.audio) {
        const emptyAudio = document.createElement('div');
        emptyAudio.className = 'empty-track-hint';
        emptyAudio.textContent = '＋ 點此插入音樂 / 伴奏（目前無音訊）';
        emptyAudio.onclick = () => { if (!timelineWasDragged) document.getElementById('audioFileInput').click(); };
        aTrack.appendChild(emptyAudio);
      } else {
        const isSel = state.lastSelectedType === 'audio';
        const aEl = document.createElement('div');
        aEl.className = 'audio-block' + (isSel ? ' selected' : '');
        aEl.style.left = '0px';
        aEl.style.width = Math.max(140, total * PX_PER_SEC) + 'px';
        aEl.textContent = `🎵 ${state.audio.name}`;
        aEl.onclick = () => {
          if (timelineWasDragged) return;
          state.lastSelectedType = 'audio';
          state.activeTab = 'audio';
          updateTabsUI();
          updateDeleteButtonLabel();
          renderTimeline();
          renderDrawer();
        };
        aTrack.appendChild(aEl);
      }
    }

    // ====== 按住時間軸軌道直接左右拖曳（Pointer Drag Scrubbing） ======
    let isDraggingTimeline = false;
    let timelineWasDragged = false;
    let dragStartX = 0;
    let dragStartScrollLeft = 0;

    timelineScroll.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.trim-handle') || activeTrim || reorderState) return;
      if (state.isPlaying) togglePlay(false);

      isDraggingTimeline = true;
      timelineWasDragged = false;
      dragStartX = e.clientX;
      dragStartScrollLeft = timelineScroll.scrollLeft;
      timelineScroll.classList.add('grabbing');
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDraggingTimeline || activeTrim || reorderState) return;
      const dx = e.clientX - dragStartX;
      if (Math.abs(dx) > 5) {
        timelineWasDragged = true;
      }
      const nextScroll = Math.max(0, dragStartScrollLeft - dx);
      timelineScroll.scrollLeft = nextScroll;

      const t = Math.max(0, Math.min(getTotalDuration(), nextScroll / PX_PER_SEC));
      state.currentTime = t;
      document.getElementById('curTimeLabel').textContent = formatTime(t);
      syncVideoElements(true);
      renderFrame();
    });

    window.addEventListener('pointerup', () => {
      if (!isDraggingTimeline) return;
      isDraggingTimeline = false;
      timelineScroll.classList.remove('grabbing');
      setTimeout(() => { timelineWasDragged = false; }, 30);
    });

    document.getElementById('ruler').addEventListener('click', (e) => {
      if (timelineWasDragged || reorderState) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      seekTo(clickX / PX_PER_SEC);
    });

    timelineScroll.addEventListener('wheel', (e) => {
      if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
        e.preventDefault();
        timelineScroll.scrollLeft += e.deltaY;
      }
    }, { passive: false });

    let scrubRafPending = false;
    timelineScroll.addEventListener('scroll', () => {
      if (state.isPlaying || isDraggingTimeline || reorderState) return;
      const t = Math.max(0, Math.min(getTotalDuration(), timelineScroll.scrollLeft / PX_PER_SEC));
      state.currentTime = t;
      document.getElementById('curTimeLabel').textContent = formatTime(t);

      if (!scrubRafPending) {
        scrubRafPending = true;
        requestAnimationFrame(() => {
          scrubRafPending = false;
          syncVideoElements(true);
          renderFrame();
        });
      }
    }, { passive: true });

    // 即時同步影片畫面
    function syncVideoElements(immediate = false) {
      if (activeTrim && activeTrim.type === 'clip') return; // 裁切時由裁切邏輯直接控制影像幀
      let acc = 0;
      state.clips.forEach(c => {
        if (c.videoEl) {
          if (state.currentTime >= acc && state.currentTime <= acc + c.duration) {
            const offset = c.trimStart || 0;
            const targetT = Math.max(0.01, offset + (state.currentTime - acc) * c.speed);
            const clampedT = Math.min(c.videoEl.duration || 999, targetT);
            const diff = Math.abs(c.videoEl.currentTime - clampedT);

            if (immediate ? diff > 0.01 : diff > 0.12) {
              c.videoEl.currentTime = clampedT;
            }
          } else {
            if (!c.videoEl.paused) c.videoEl.pause();
          }
        }
        acc += c.duration;
      });
    }

    // ====== 刪除目前選取項目 ======
    function deleteCurrentSelected() {
      if (state.lastSelectedType === 'sub' && state.selectedSubId) {
        const target = state.subtitles.find(s => s.id === state.selectedSubId);
        if (target) {
          pushUndo();
          state.subtitles = state.subtitles.filter(s => s.id !== target.id);
          state.selectedSubId = state.subtitles[0]?.id || null;
          state.lastSelectedType = state.selectedSubId ? 'sub' : 'clip';
          updateDeleteButtonLabel();
          showToast('已刪除選取字幕 🗑️');
          renderTimeline(); renderDrawer(); renderFrame();
          return;
        }
      }

      if (state.lastSelectedType === 'audio' && state.audio) {
        pushUndo();
        if (state.audio.el) state.audio.el.pause();
        state.audio = null;
        state.lastSelectedType = 'clip';
        updateDeleteButtonLabel();
        showToast('已移除音訊軌道 🗑️');
        renderTimeline(); renderDrawer();
        return;
      }

      if (state.clips.length > 0 && state.selectedClipId) {
        pushUndo();
        state.clips = state.clips.filter(c => c.id !== state.selectedClipId);
        state.selectedClipId = state.clips[0]?.id || null;
        updateDeleteButtonLabel();
        showToast('已刪除影片片段 🗑️');
        renderTimeline(); renderDrawer(); renderFrame();
        return;
      }

      showToast('請先點選要刪除的片段、字幕或音訊');
    }

    document.getElementById('deleteSelectedBtn').onclick = deleteCurrentSelected;

    // 清空全部軌道
    document.getElementById('clearAllBtn').onclick = () => {
      pushUndo();
      if (state.audio?.el) state.audio.el.pause();
      state.clips = [];
      state.subtitles = [];
      state.audio = null;
      state.selectedClipId = null;
      state.selectedSubId = null;
      state.lastSelectedType = 'clip';
      state.currentTime = 0;
      timelineScroll.scrollLeft = 0;
      updateDeleteButtonLabel();
      renderTimeline();
      renderDrawer();
      renderFrame();
      showToast('已清空所有軌道 🧹');
    };

    // ====== 電腦鍵盤快捷鍵監聽 ======
    window.addEventListener('keydown', (e) => {
      const tag = document.activeElement?.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

      if (e.code === 'Space') {
        e.preventDefault();
        togglePlay();
      }
      else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
        e.preventDefault();
        undoLastAction();
      }
      else if (((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'b') || e.key.toLowerCase() === 's') {
        e.preventDefault();
        splitAtPlayhead();
      }
      else if (e.key === 'Delete' || e.key === 'Backspace') {
        e.preventDefault();
        deleteCurrentSelected();
      }
      else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        seekTo(state.currentTime - (e.shiftKey ? 1.0 : 0.1));
      }
      else if (e.key === 'ArrowRight') {
        e.preventDefault();
        seekTo(state.currentTime + (e.shiftKey ? 1.0 : 0.1));
      }
    });

    function addNewSubtitle() {
      pushUndo();
      const id = 'sub-' + Date.now();
      state.subtitles.push({
        id,
        text: '新字幕點此編輯',
        start: state.currentTime,
        duration: 3.0,
        x: 0.5,
        y: 0.75,
        size: 24,
        font: "'Noto Sans TC', sans-serif",
        color: '#ffffff',
        stroke: '#000000',
        bg: 'rgba(0,0,0,0.45)'
      });
      state.selectedSubId = id;
      state.lastSelectedType = 'sub';
      state.activeTab = 'text';
      updateTabsUI();
      updateDeleteButtonLabel();
      renderTimeline(); renderDrawer(); renderFrame();
    }

    // ====== 底部抽屜工具面板 ======
    function renderDrawer() {
      const container = document.getElementById('drawerContent');
      const clip = state.clips.find(c => c.id === state.selectedClipId) || state.clips[0];
      const sub = state.subtitles.find(s => s.id === state.selectedSubId) || state.subtitles[0];

      if (state.activeTab === 'media') {
        container.innerHTML = `
          <div class="action-grid" style="margin-bottom:12px;">
            <button class="box-btn primary" onclick="document.getElementById('videoFileInput').click()">＋ 匯入影片檔</button>
            <button class="box-btn" id="drawerSplitBtn">✂️ 在此分割</button>
            <button class="box-btn danger" id="delClipBtn">🗑️ 刪除此片段</button>
          </div>
          ${clip ? `
            <div class="control-row">
              <label>開頭裁切</label>
              <input type="range" min="0" max="${Math.max(0, (clip.maxDuration || 60) - 0.4)}" step="0.1" value="${clip.trimStart || 0}" id="clipTrimStartRange">
              <span>${(clip.trimStart || 0).toFixed(1)}s</span>
            </div>
            <div class="control-row">
              <label>片段時長</label>
              <input type="range" min="0.4" max="${Math.max(0.4, (clip.maxDuration || 60) - (clip.trimStart || 0))}" step="0.1" value="${clip.duration}" id="clipDurRange">
              <span>${clip.duration.toFixed(1)}s</span>
            </div>
            <div class="control-row">
              <label>變速倍率</label>
              <input type="range" min="0.5" max="2.0" step="0.25" value="${clip.speed}" id="clipSpeedRange">
              <span>${clip.speed}x</span>
            </div>
          ` : `
            <div style="text-align:center; padding:16px 0; color:var(--text-muted);">
              目前為空白專案，請點擊上方「＋ 匯入影片檔」載入你的舞蹈或 Vlog 影片。
            </div>
          `}
        `;
        document.getElementById('drawerSplitBtn').onclick = splitAtPlayhead;
        document.getElementById('delClipBtn').onclick = () => {
          state.lastSelectedType = 'clip';
          deleteCurrentSelected();
        };
        if (clip) {
          document.getElementById('clipTrimStartRange').oninput = (e) => {
            const newStart = parseFloat(e.target.value);
            const oldEnd = (clip.trimStart || 0) + clip.duration;
            clip.trimStart = newStart;
            clip.duration = Math.max(0.4, oldEnd - newStart);
            if (clip.videoEl) clip.videoEl.currentTime = Math.max(0.01, newStart);
            renderTimeline(); renderDrawer(); renderFrame();
          };
          document.getElementById('clipDurRange').oninput = (e) => {
            clip.duration = parseFloat(e.target.value);
            if (clip.videoEl) {
              clip.videoEl.currentTime = Math.max(0.01, (clip.trimStart || 0) + clip.duration * clip.speed - 0.03);
            }
            renderTimeline(); renderDrawer(); renderFrame();
          };
          document.getElementById('clipSpeedRange').oninput = (e) => {
            clip.speed = parseFloat(e.target.value);
            renderDrawer();
          };
        }
      }

      else if (state.activeTab === 'keyframe') {
        if (!clip) {
          container.innerHTML = `<p style="color:var(--text-muted); text-align:center; margin-top:20px;">請先匯入一段影片，再設定關鍵幀運鏡 ◆</p>`;
          return;
        }
        let acc = 0, localT = 0;
        for (const c of state.clips) {
          if (c.id === clip.id) {
            localT = Math.max(0, Math.min(c.duration, state.currentTime - acc));
            break;
          }
          acc += c.duration;
        }
        const curTr = getInterpolatedTransform(clip, localT);

        container.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <span style="color:#ffcc33; font-weight:700;">◆ 關鍵幀運鏡（局部放大 / 跟拍）</span>
            <div style="display:flex; gap:6px;">
              <button class="chip-btn" style="border-color:#ffcc33; color:#ffcc33;" id="addKfBtn">＋ 打關鍵幀</button>
              <button class="chip-btn danger" id="clearKfBtn">清空關鍵幀</button>
            </div>
          </div>
          <div class="control-row">
            <label>畫面縮放</label>
            <input type="range" min="0.6" max="2.5" step="0.05" value="${curTr.scale}" id="kfScale">
            <span>${curTr.scale.toFixed(2)}x</span>
          </div>
          <div class="control-row">
            <label>水平位移</label>
            <input type="range" min="-150" max="150" step="2" value="${curTr.x}" id="kfX">
            <span>${Math.round(curTr.x)}</span>
          </div>
          <div class="control-row">
            <label>垂直位移</label>
            <input type="range" min="-200" max="200" step="2" value="${curTr.y}" id="kfY">
            <span>${Math.round(curTr.y)}</span>
          </div>
        `;

        const upsertKf = (patch) => {
          let existing = clip.keyframes.find(k => Math.abs(k.t - localT) < 0.25);
          if (!existing) {
            existing = { t: localT, ...curTr };
            clip.keyframes.push(existing);
          }
          Object.assign(existing, patch);
          renderTimeline();
          renderFrame();
        };

        document.getElementById('addKfBtn').onclick = () => {
          pushUndo();
          upsertKf({});
          showToast(`已在 ${localT.toFixed(1)}s 加入關鍵幀 ◆`);
        };
        document.getElementById('clearKfBtn').onclick = () => {
          pushUndo();
          clip.keyframes = [{ t: 0, scale: 1.0, x: 0, y: 0, rot: 0 }];
          renderTimeline(); renderDrawer(); renderFrame();
          showToast('已重置關鍵幀');
        };
        document.getElementById('kfScale').oninput = (e) => upsertKf({ scale: parseFloat(e.target.value) });
        document.getElementById('kfX').oninput = (e) => upsertKf({ x: parseFloat(e.target.value) });
        document.getElementById('kfY').oninput = (e) => upsertKf({ y: parseFloat(e.target.value) });
      }

      else if (state.activeTab === 'text') {
        const cats = ['全部', '現代', '手寫', '圓體', '古典', '特色'];
        const filteredFonts = state.fontFilter === '全部'
          ? FREE_FONTS
          : FREE_FONTS.filter(f => f.cat === state.fontFilter);

        container.innerHTML = `
          <div class="control-row">
            <button class="chip-btn" style="background:var(--accent); border:none; color:#fff;" id="newSubBtn">＋ 新增字幕</button>
            <input type="text" id="subTextInput" value="${sub ? sub.text : ''}" placeholder="${sub ? '輸入字幕內容...' : '請先點左側＋新增字幕'}" ${sub ? '' : 'disabled'}>
            ${sub ? `<button class="chip-btn danger" id="delSubBtn">🗑️ 刪除此字幕</button>` : ''}
          </div>
          ${sub ? `
            <div class="control-row">
              <label>字級/顏色</label>
              <input type="range" min="14" max="48" value="${sub.size}" id="subSizeRange">
              <input type="color" value="${sub.color}" id="subColorPick" style="width:32px; height:26px; border:none; background:none;">
            </div>
          ` : ''}
          <div class="pill-group">
            ${cats.map(c => `<button class="pill ${state.fontFilter === c ? 'active' : ''}" data-cat="${c}">${c}</button>`).join('')}
            <button class="pill" onclick="document.getElementById('fontFileInput').click()">＋ 本機字體</button>
          </div>
          <div class="font-grid">
            ${filteredFonts.map(f => `
              <button class="font-card ${sub && sub.font === f.family ? 'active' : ''}" data-family="${f.family.replace(/"/g, '&quot;')}">
                <span class="sample" style="font-family:${f.family};">${f.name}</span>
                <span class="meta">${f.desc}</span>
              </button>
            `).join('')}
          </div>
        `;

        document.getElementById('newSubBtn').onclick = addNewSubtitle;

        if (document.getElementById('delSubBtn')) {
          document.getElementById('delSubBtn').onclick = () => {
            state.lastSelectedType = 'sub';
            deleteCurrentSelected();
          };
        }

        if (sub) {
          document.getElementById('subTextInput').oninput = (e) => {
            sub.text = e.target.value;
            renderTimeline(); renderFrame();
          };
          document.getElementById('subSizeRange').oninput = (e) => {
            sub.size = parseInt(e.target.value, 10);
            renderFrame();
          };
          document.getElementById('subColorPick').oninput = (e) => {
            sub.color = e.target.value;
            renderFrame();
          };
        }

        container.querySelectorAll('.pill[data-cat]').forEach(btn => {
          btn.onclick = () => {
            state.fontFilter = btn.dataset.cat;
            renderDrawer();
          };
        });

        container.querySelectorAll('.font-card').forEach(card => {
          card.onclick = () => {
            if (!sub) return showToast('請先點上方「＋ 新增字幕」');
            sub.font = card.dataset.family;
            renderDrawer();
            renderFrame();
            setTimeout(renderFrame, 600);
          };
        });
      }

      else if (state.activeTab === 'color') {
        if (!clip) {
          container.innerHTML = `<p style="color:var(--text-muted); text-align:center; margin-top:20px;">請先匯入一段影片，再調整濾鏡調色 🎨</p>`;
          return;
        }
        const col = clip.color;
        container.innerHTML = `
          <div class="pill-group">
            ${FILTER_PRESETS.map(p => `<button class="pill" data-preset="${p.id}">${p.name}</button>`).join('')}
          </div>
          <div class="control-row">
            <label>亮度</label>
            <input type="range" min="60" max="150" value="${col.b}" id="colB">
            <span>${col.b}%</span>
          </div>
          <div class="control-row">
            <label>對比度</label>
            <input type="range" min="60" max="160" value="${col.c}" id="colC">
            <span>${col.c}%</span>
          </div>
          <div class="control-row">
            <label>飽和度</label>
            <input type="range" min="0" max="180" value="${col.s}" id="colS">
            <span>${col.s}%</span>
          </div>
          <div class="control-row">
            <label>色溫冷暖</label>
            <input type="range" min="-40" max="40" value="${col.warm}" id="colW">
            <span>${col.warm}</span>
          </div>
        `;

        container.querySelectorAll('[data-preset]').forEach(btn => {
          btn.onclick = () => {
            pushUndo();
            const p = FILTER_PRESETS.find(x => x.id === btn.dataset.preset);
            clip.color = { b: p.b, c: p.c, s: p.s, warm: p.warm };
            showToast(`已套用濾鏡：${p.name}`);
            renderDrawer(); renderFrame();
          };
        });

        ['colB', 'colC', 'colS', 'colW'].forEach(id => {
          document.getElementById(id).oninput = (e) => {
            const val = parseInt(e.target.value, 10);
            if (id === 'colB') col.b = val;
            if (id === 'colC') col.c = val;
            if (id === 'colS') col.s = val;
            if (id === 'colW') col.warm = val;
            renderFrame();
          };
        });
      }

      else if (state.activeTab === 'audio') {
        container.innerHTML = `
          <div class="control-row">
            <button class="box-btn primary" style="flex:1;" onclick="document.getElementById('audioFileInput').click()">🎵 插入音樂 / 伴奏檔</button>
            ${state.audio ? `<button class="box-btn danger" id="removeAudioBtn">🗑️ 移除音訊</button>` : ''}
          </div>
          ${state.audio ? `
            <div class="control-row">
              <label>音樂音量</label>
              <input type="range" min="0" max="1" step="0.05" value="${state.audio.volume}" id="audioVolRange">
              <span>${Math.round(state.audio.volume * 100)}%</span>
            </div>
            <p style="color:var(--text-muted); font-size:11px; margin:6px 0 0;">
              目前音軌：${state.audio.name}
            </p>
          ` : `
            <p style="color:var(--text-muted); font-size:11px; text-align:center; margin-top:16px;">
              目前沒有音訊，點擊上方按鈕可匯入手機或電腦的 MP3 / M4A 音樂檔。
            </p>
          `}
        `;
        if (document.getElementById('removeAudioBtn')) {
          document.getElementById('removeAudioBtn').onclick = () => {
            state.lastSelectedType = 'audio';
            deleteCurrentSelected();
          };
        }
        if (document.getElementById('audioVolRange')) {
          document.getElementById('audioVolRange').oninput = (e) => {
            state.audio.volume = parseFloat(e.target.value);
            if (state.audio.el) state.audio.el.volume = state.audio.volume;
            renderDrawer();
          };
        }
      }
    }

    function updateTabsUI() {
      document.querySelectorAll('.nav-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.tab === state.activeTab);
      });
    }

    document.querySelectorAll('.nav-tab').forEach(tab => {
      tab.onclick = () => {
        state.activeTab = tab.dataset.tab;
        updateTabsUI();
        renderDrawer();
      };
    });

    // ====== 畫面比例切換 ======
    document.querySelectorAll('.ratio-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.ratio-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.ratio = btn.dataset.ratio;
        if (state.ratio === '9:16') { canvas.width = 360; canvas.height = 640; }
        if (state.ratio === '16:9') { canvas.width = 640; canvas.height = 360; }
        if (state.ratio === '1:1')  { canvas.width = 480; canvas.height = 480; }
        renderFrame();
      };
    });

    // ====== 分割片段 ======
    function splitAtPlayhead() {
      let acc = 0;
      for (let i = 0; i < state.clips.length; i++) {
        const c = state.clips[i];
        if (state.currentTime > acc + 0.3 && state.currentTime < acc + c.duration - 0.3) {
          pushUndo();
          const leftDur = state.currentTime - acc;
          const rightDur = c.duration - leftDur;
          const origTrimStart = c.trimStart || 0;
          c.duration = leftDur;

          const clone = {
            ...JSON.parse(JSON.stringify(c)),
            id: 'clip-' + Date.now(),
            name: c.name + ' (切段)',
            trimStart: origTrimStart + leftDur * c.speed,
            duration: rightDur,
            maxDuration: c.maxDuration || 120,
            videoEl: c.videoEl
          };
          state.clips.splice(i + 1, 0, clone);
          state.selectedClipId = clone.id;
          state.lastSelectedType = 'clip';
          updateDeleteButtonLabel();
          showToast('已從播放頭位置分割片段 ✂️');
          renderTimeline(); renderDrawer(); syncVideoElements(true); renderFrame();
          return;
        }
        acc += c.duration;
      }
      showToast('請將播放頭移至片段中間再分割');
    }

    document.getElementById('splitBtn').onclick = splitAtPlayhead;

    // ====== 檔案匯入 ======
    document.getElementById('videoFileInput').onchange = (e) => {
      const files = Array.from(e.target.files);
      if (files.length > 0) pushUndo();
      files.forEach(file => {
        const url = URL.createObjectURL(file);
        const vid = document.createElement('video');
        vid.src = url;
        vid.preload = 'auto';
        vid.muted = true;
        vid.playsInline = true;
        vid.setAttribute('playsinline', '');
        vid.setAttribute('webkit-playsinline', '');

        const finalizeImport = () => {
          if (vid._imported) return;
          vid._imported = true;
          const id = 'clip-' + Date.now() + Math.random();
          const realDur = (vid.duration && isFinite(vid.duration)) ? vid.duration : 10;
          state.clips.push({
            id,
            name: file.name.slice(0, 14),
            trimStart: 0,
            duration: realDur,
            maxDuration: realDur,
            speed: 1.0,
            transitionAfter: 'fade',
            color: { b: 100, c: 100, s: 100, warm: 0 },
            videoEl: vid,
            keyframes: [{ t: 0, scale: 1.0, x: 0, y: 0, rot: 0 }]
          });
          state.selectedClipId = id;
          state.lastSelectedType = 'clip';
          updateDeleteButtonLabel();
          renderTimeline(); renderDrawer(); renderFrame();
          showToast(`已匯入影片：${file.name}`);
        };

        vid.onloadeddata = () => {
          vid.currentTime = 0.01;
          finalizeImport();
        };

        vid.onseeked = () => {
          renderFrame();
        };

        vid.onerror = () => {
          finalizeImport();
          showToast('此影片編碼格式可能不支援瀏覽器預覽');
        };

        vid.load();
      });
      e.target.value = '';
    };

    document.getElementById('audioFileInput').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      pushUndo();
      const url = URL.createObjectURL(file);
      const audioEl = new Audio(url);
      audioEl.volume = state.audio ? state.audio.volume : 0.8;
      state.audio = { name: file.name, volume: audioEl.volume, url, el: audioEl };
      state.lastSelectedType = 'audio';
      updateDeleteButtonLabel();
      renderTimeline(); renderDrawer();
      showToast(`已插入音訊：${file.name}`);
      e.target.value = '';
    };

    document.getElementById('fontFileInput').onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const fontName = 'CustomFont_' + Date.now();
      const buf = await file.arrayBuffer();
      const face = new FontFace(fontName, buf);
      await face.load();
      document.fonts.add(face);
      FREE_FONTS.unshift({
        name: file.name.replace(/\.[^/.]+$/, ''),
        family: `'${fontName}', sans-serif`,
        cat: '特色',
        desc: '本機匯入自訂字體'
      });
      const sub = state.subtitles.find(s => s.id === state.selectedSubId);
      if (sub) sub.font = `'${fontName}', sans-serif`;
      renderDrawer(); renderFrame();
      showToast('自訂字體載入成功！');
      e.target.value = '';
    };

    // ====== 拖曳畫布字幕 ======
    let draggingSub = false;
    canvas.addEventListener('pointerdown', (e) => {
      const sub = state.subtitles.find(s => s.id === state.selectedSubId);
      if (!sub) return;
      draggingSub = true;
      state.lastSelectedType = 'sub';
      updateDeleteButtonLabel();
      updateSubPos(e, sub);
    });
    canvas.addEventListener('pointermove', (e) => {
      if (!draggingSub) return;
      const sub = state.subtitles.find(s => s.id === state.selectedSubId);
      if (sub) updateSubPos(e, sub);
    });
    window.addEventListener('pointerup', () => draggingSub = false);

    function updateSubPos(e, sub) {
      const rect = canvas.getBoundingClientRect();
      sub.x = Math.max(0.05, Math.min(0.95, (e.clientX - rect.left) / rect.width));
      sub.y = Math.max(0.05, Math.min(0.95, (e.clientY - rect.top) / rect.height));
      renderFrame();
    }

    // ====== 播放迴圈 ======
    let lastTs = 0;
    function tick(ts) {
      if (!state.isPlaying) return;
      if (!lastTs) lastTs = ts;
      const dt = (ts - lastTs) / 1000;
      lastTs = ts;

      state.currentTime += dt;
      if (state.currentTime >= getTotalDuration()) {
        state.currentTime = 0;
        togglePlay(false);
      } else {
        timelineScroll.scrollLeft = state.currentTime * PX_PER_SEC;
        syncVideoElements(false);
        renderFrame();
        requestAnimationFrame(tick);
      }
    }

    function togglePlay(force) {
      if (state.clips.length === 0 && state.subtitles.length === 0) {
        return showToast('請先匯入影片或新增字幕再播放');
      }
      state.isPlaying = typeof force === 'boolean' ? force : !state.isPlaying;
      document.getElementById('playBtn').textContent = state.isPlaying ? '⏸' : '▶';
      if (state.isPlaying) {
        lastTs = 0;
        syncVideoElements(true);
        if (state.audio && state.audio.el) {
          state.audio.el.currentTime = state.currentTime;
          state.audio.el.play().catch(() => {});
        }
        state.clips.forEach(c => { if (c.videoEl) c.videoEl.play().catch(() => {}); });
        requestAnimationFrame(tick);
      } else {
        if (state.audio && state.audio.el) state.audio.el.pause();
        state.clips.forEach(c => { if (c.videoEl) c.videoEl.pause(); });
        renderFrame();
      }
    }

    document.getElementById('playBtn').onclick = () => togglePlay();

    // ====== 匯出錄製成影片檔 ======
    document.getElementById('exportBtn').onclick = () => {
      if (state.clips.length === 0) return showToast('請先匯入影片再匯出');
      if (typeof MediaRecorder === 'undefined') {
        return showToast('目前瀏覽器不支援直接錄製匯出，請改用 Chrome 或 Safari 最新版');
      }
      showToast('正在高速渲染並匯出影片，請稍候...');
      const stream = canvas.captureStream(30);
      const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
      const chunks = [];
      recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `CutVideo_${Date.now()}.webm`;
        a.click();
        showToast('影片匯出完成！已開始下載 🎬');
      };

      state.currentTime = 0;
      recorder.start();
      togglePlay(true);

      const checkStop = setInterval(() => {
        if (!state.isPlaying) {
          clearInterval(checkStop);
          if (recorder.state !== 'inactive') recorder.stop();
        }
      }, 200);
    };

    // 初始化啟動
    updateDeleteButtonLabel();
    renderTimeline();
    renderDrawer();
    renderFrame();
  </script>
</body>
</html>
